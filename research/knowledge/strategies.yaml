# Strategy statistics for the knowledge pack (research/knowledge/build_pack.py).
# One card per strategy the app runs or the research tested in depth: what it does, the verdict, and its key numbers,
# each with the period, the costs counted and the source doc + section it was copied from.
# build_pack.py checks that every number in every `text` appears in the cited source file; a card that fails is an error.
# Sources are repo-relative. Keep the words plain; amounts are per lot unless the text says otherwise.

- id: liquidity-15-5
  name: Liquidity 15+5 (BANKNIFTY)
  instruments: [BANKNIFTY]
  tags: [liquidity, option-buying]
  what: >-
    On BANKNIFTY it waits for the price to close through a liquidity level from the 15- and 5-minute charts, buys one
    lot of the option in the break's direction and exits at the next liquidity, on a failed break or on its time stop.
  verdict: weak
  facts:
    - text: "Liquidity 15+5 BANKNIFTY made about Rs 65/day after all costs before the locked year and Rs 167/day in the locked year (1 lot)."
      period: "2021-10-01 .. 2026-10-06; locked year 1 Oct 2025 - 6 Oct 2026"
      costs: "app fills and charges plus the measured real spread (h24)"
      src: research/HUNT_FINAL.md
      sec: Verdict
    - text: "Liquidity 15+5 is Rs 1,400-3,500 a month on average, with 40-50% of months losing and drawdowns of Rs 32-40k; a Rs 5,000 day comes about once in 30-45 sessions."
      period: "2021-10-01 .. 2026-10-06"
      costs: "all costs"
      src: research/HUNT_FINAL.md
      sec: Verdict
    - text: "Liquidity 15+5 with the 15% premium stop stayed positive in both years: +Rs 55.6k / +21.6k per lot (vs +58.4k / +31.7k with no premium stop)."
      period: "Feb 2024 - Feb 2026 (two BANKNIFTY years)"
      costs: "Rs 40 a trip, no slippage on stops (optimistic)"
      src: research/FINDINGS.md
      sec: Green candles
    - text: "A 30-point index stop beyond the broken level plus a time stop lifted Liquidity 15+5 from +55.6k / +21.6k to +103.0k / +30.3k and cut the worst trade from -15.7k to -9.6k (best of 11 variants)."
      period: "Feb 2024 - Feb 2026"
      costs: "Rs 40 a trip"
      src: research/FINDINGS.md
      sec: Green candles
    - text: "Point targets hurt Liquidity badly (h34): they cut the rare big runners that pay for everything; do not switch to +20/-15 style targets."
      period: "2021-2026"
      costs: "all costs"
      src: research/HUNT_FINAL.md
      sec: What to do
    - text: "R15: none of 5 pre-open daily filters helped Liquidity BANKNIFTY (best BH q 0.50); low-VIX days were good for the arm (skipping them -Rs 73/day)."
      period: "design Feb 2024 - Sep 2025; holdout part Oct 2025 - Feb 2026"
      costs: "app exits, ATM, real spread and charges, 1 lot"
      src: research/FINDINGS.md
      sec: Daily filters on Liquidity BANKNIFTY
    - text: "Why no profit lock on Liquidity: R19 tested 6 locks on BANKNIFTY 15m and 5m and 0 of 12 passed; on the holdout 11 of 12 lost against the plain rules, because Liquidity's profit comes from a few trades that run to the next level and a lock sells them early. MIDCPNIFTY could not be tested (no data)."
      period: "design 2024-02-13 .. 2024-07-31 and 2025-02-17 .. 2026-02-23; holdout 1 Aug 2024 - 14 Feb 2025"
      costs: "app fills plus modelled spread, app charges, 1 lot"
      src: research/FINDINGS.md
      sec: Profit lock for Liquidity 15+5

- id: orb
  name: ORB (opening range breakout)
  instruments: [BANKNIFTY]
  tags: [orb, option-buying]
  what: >-
    Buys an ATM option when BANKNIFTY breaks out of the opening range; the app's version re-entered while the price
    stayed beyond the range until R14 capped it at one entry a side a day.
  verdict: negative
  facts:
    - text: "ORB over one year: 1109 trades, 45% winners, net -193,592, t -4.94, 0 of 13 green months."
      period: "17 Feb 2025 .. 23 Feb 2026"
      costs: "Rs 40 a trip, 1 lot of 30 (optimistic vs live)"
      src: research/FINDINGS.md
      sec: Every arm, one year
    - text: "ORB re-entries made about Rs 0 before charges (Rs 75-110 a trade); capping at 1 entry a side a day cut ORB's loss from -Rs 6.50 lakh to -0.97 lakh (design) and -1.89 to -0.18 lakh (holdout)."
      period: "design to 30 Sep 2025; holdout 1 Oct 2025 - 5 Oct 2026"
      costs: "app charges"
      src: research/FINDINGS.md
      sec: ORB re-entry churn
    - text: "All four ORB arms lost in every 1-, 3- and 6-month window to 5 Oct 2026; ORB had 3 winning months out of 63, and its losses are mostly charges from over-trading."
      period: "to 5 Oct 2026"
      costs: "app charges"
      src: android/app/src/main/assets/study/pages.txt
      sec: The ORB family
    - text: "Rebuilt exactly as the app has them (matches R14 / R12 within a few percent), BANKNIFTY + NIFTY over 5 years: ORB -Rs 2,23,040 (2,489 trades); 0 of 6 years in profit; 16 pre-registered versions all lose (R3)."
      period: "Aug 2021 .. 12 Oct 2026 (Dhan lake)"
      costs: "app charges, liq fills, 1 lot"
      src: research/FINDINGS.md
      sec: The ORB family on the full lake
    - text: "On the Nov-2024+ market only, ORB lost -Rs 88,644 in design (1,595 trades, 5 indices) and -Rs 9,813 in the final test (636 trades, Apr - Oct 2026); 0 of 336 R49 tests pass."
      period: "21 Nov 2024 .. 13 Oct 2026 (design to 31 Mar 2026, final test from 1 Apr 2026)"
      costs: "charges in force on the date, liq fills, 1 lot of the day's contract"
      src: research/HUNT_R49_ORB_RECENT.md
      sec: Verdict for Boss

