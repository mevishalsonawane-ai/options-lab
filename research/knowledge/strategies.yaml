- id: big-candle-pullback
  name: Big-candle pullback (Solo)
  instruments: [BANKNIFTY, NIFTY]
  tags: [candles, option-buying, trend]
  what: >-
    After a big 15-minute candle, waits for a 40% pullback that does not break it, then trades its direction with the
    stop at the level and a 2R target (Jarvis's Solo arm).
  verdict: weak
  facts:
    - text: "Big-candle pullback on the BANKNIFTY index: +0.20 R a trade, t = 2.35, 285 trades, 9/13 months positive; as ATM options it nets only +Rs 7.5k a year (t 0.27)."
      period: "Feb 2025 - Feb 2026"
      costs: "Rs 40 a trip"
      src: research/FINDINGS.md
      sec: Green candles
    - text: "Out of sample (Feb 2024 - Feb 2025) the big-candle pullback was weaker: +0.09 R (t 1.11, 299 trades); the GEX split did not replicate."
      period: "Feb 2024 - Feb 2025"
      costs: "Rs 40 a trip"
      src: research/FINDINGS.md
      sec: Green candles
    - text: "Solo's chosen variant made +Rs 52,151 on NIFTY 2024-25 (217 trades, t 0.92) and lost Rs 42,968 on NIFTY 2025-26 (219 trades, t -1.72): no edge you can rely on."
      period: "NIFTY 2024-25 and 2025-26"
      costs: "1 lot"
      src: android/app/src/main/assets/study/pages.txt
