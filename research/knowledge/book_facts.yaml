- id: book.heitkoetter-day-trading.12
  book: heitkoetter-day-trading
  title: Weekly goal, then stop
  chapter: Is It Really Possible to Make a Living; Tenets
  text: Never set daily goals; set a low weekly goal per contract (start near $100, later $250-300) and stop trading for the
    week once it is reached. With a $300 target and $200 stop, a 50% win rate still reaches it.
  tags:
  - sizing
  - profit-lock
- id: book.heitkoetter-day-trading.13
  book: heitkoetter-day-trading
  title: Skip thin and pre-news days
  chapter: Is It Really Possible to Make a Living
  text: Days around holidays and days before major releases such as a rate decision or the jobs report are thin or erratic
    and are best left alone; in the first 2 to 3 months trade only twice a day, once in the morning and once in the afternoon.
  tags:
  - news
  - day-of-week
  - filter
- id: book.heitkoetter-day-trading.14
  book: heitkoetter-day-trading
  title: Back-test size and validity
  chapter: Step 6 and Power Principles 9-10
  text: A performance report needs at least 40 trades and 200 is optimal; a profit factor of 1.5 or more is wanted but above
    3.0 suggests over-fitting; only the last 3-4 years of a market are a valid back-test, and plan for twice the worst drawdown.
  tags:
  - costs
  - sizing
- id: book.heitkoetter-day-trading.15
  book: heitkoetter-day-trading
  title: No martingale
  chapter: Power Principle 6
  text: Doubling after each loss would need 512 contracts by the tenth trade and $102,300 of losses; start with one contract
    and add size only as the account grows.
  tags:
  - sizing
- id: book.swing-practical-guide.1
  book: swing-practical-guide
  title: 'Master Plan: buy the pullback only when it turns'
  chapter: Ch. 6, The Master Plan
  text: 'Swing trades last a few days to a few weeks on daily bars: find a pullback in an uptrend after the close, then buy
    next morning with a buy-stop just above the previous day''s high, so a trade only fills if price first moves your way.
    Shorts are the mirror image.'
  tags:
  - swing
  - trend
  - reversal
- id: book.swing-practical-guide.2
  book: swing-practical-guide
  title: The 3-day pullback scan
  chapter: Ch. 5.1 and 10.1.1, FORCESWING scan
  text: A long candidate closes above its 10- and 20-day simple averages and has made two lower highs in a row (a 3-day decline);
    a short candidate is below both averages with two higher lows. The scan also needs ADX above 30 and a Force Index filter.
  tags:
  - swing
  - moving-average
  - trend
  verdict: negative
  tested_src: research/SWING_DEEP.md
  tested_text: 'Our SWING_DEEP tested a 3-down-closes pullback above the 200-day average on index futures 2016-2026: NIFTY
    lost Rs 283,401 on 109 trades with a fixed 10-day exit.'
- id: book.swing-practical-guide.3
  book: swing-practical-guide
  title: Elder's Force Index, 3- and 13-day
  chapter: Ch. 8.8, Force Index
  text: Force Index is volume times the change in close. A buy setup is a 13-day average at or above zero (bulls own the bigger
    battle) with the 3-day average at or below zero (bears won the last few days), inside an uptrend; the sell setup is the
    mirror.
  tags:
  - volume
  - swing
  - momentum
- id: book.swing-practical-guide.4
  book: swing-practical-guide
  title: ADX above 30 means a real trend
  chapter: Ch. 8.9, DMI
  text: A trend is confirmed when ADX is above 30 (the higher the better) and +DI is above -DI for an uptrend, -DI above +DI
    for a downtrend. The book says markets trend only about 30% of the time.
  tags:
  - trend
  - filter
- id: book.swing-practical-guide.5
  book: swing-practical-guide
  title: 'Gap rule: wait before entering'
  chapter: Ch. 6.3-6.4, When and how to enter
  text: If the stock gaps in the trade's direction, wait 30 minutes; if it gaps against it, wait 5 minutes; then re-base the
    buy-stop on the new day's high instead of yesterday's. Without a gap, the order goes in a few minutes after the open.
  tags:
  - gap
  - time-of-day
  - swing
- id: book.swing-practical-guide.6
  book: swing-practical-guide
  title: 'Stop: the higher of -4% or the signal day''s low'
  chapter: Ch. 6.5, After the trade is executed
  text: 'The first stop sits at whichever is higher: 4% under the entry or just under the low of the day used for the entry,
    so the loss is capped at 4%. Stop and target go in together as one-cancels-other orders resting at the broker.'
  tags:
  - stop
  - swing
- id: book.swing-practical-guide.7
  book: swing-practical-guide
  title: Half off at +7%, trail the rest daily
  chapter: Ch. 6.6-6.8, Trailing stop
  text: Half the position is sold with a limit order at +7%; every morning the stop is raised to just under the previous day's
    low (never lowered), and that trailing stop closes the second half. The book expects average wins above 7% and losses
    under 4%.
  tags:
  - target
  - profit-lock
  - stop
  - swing
- id: book.swing-practical-guide.8
  book: swing-practical-guide
  title: An entry order lives up to 5 days
  chapter: Ch. 6.7, If the trade is not executed
  text: If the buy-stop does not trigger, the same process is repeated each morning for up to 5 trading days; if the stock
    keeps pulling back, there is simply no trade.
  tags:
  - swing
  - filter
- id: book.swing-practical-guide.9
  book: swing-practical-guide
  title: Capital split into 15 slices
  chapter: Introduction and Ch. 9
  text: Divide the account by 15 (up to 20 if you can handle it) and put one slice in each trade. Pick about 25 candidates
    a day, place stop orders on all, and let the first ones that trigger fill the free slots.
  tags:
  - sizing
  - swing
- id: book.swing-practical-guide.10
  book: swing-practical-guide
  title: Volume says reversal or continuation
  chapter: Ch. 8.5-8.6, Volume and Equivolume
  text: Above-average volume with little price movement, or after a huge run, hints at a reversal; above-average volume with
    a strong move or a breakout hints at continuation. A 'power box' (range and volume both unusually large) confirms a breakout.
  tags:
  - volume
  - reversal
  - trend
- id: book.swing-practical-guide.11
  book: swing-practical-guide
  title: Daily swing direction for option holds
  chapter: Ch. 4, Introduction to swing trading
  text: Swing trading works, the book says, because you trade with the trend, wait for a pullback, and enter only when price
    shows it is resuming the trend; holds run from a few days to a few weeks.
