- id: book.fm-intro-quant-finance.5
  book: fm-intro-quant-finance
  title: Implied volatility by bisection; no bracket means a bad quote
  chapter: Ch. 4.3, 5.5 and 9.8.3, Interval bisection
  text: Halving an interval whose ends price above and below the market always finds the implied value when price is monotone
    and continuous in it, each step halving the error; an option quote that cannot be bracketed lies outside the no-arbitrage
    bounds and should be treated as stale.
  tags:
  - iv
  - filter
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-intro-quant-finance.6
  book: fm-intro-quant-finance
  title: Size a bet by edge over risk aversion times second moment
  chapter: Ch. 9.8.9, Optimal risky asset allocation
  text: With one risky position and cash, the best amount at risk is the expected excess return divided by risk aversion times
    the expected squared excess return; among several bets the highest Sharpe ratio wins, and a risk-seeker's choice is maximum
    leverage. The edge estimate is the weak input.
  tags:
  - sizing
- id: book.fm-intro-quant-finance.7
  book: fm-intro-quant-finance
  title: The deepest dip of a no-edge P&L path
  chapter: Ch. 8.4, Kolmogorov's inequality
  text: For independent zero-mean daily results, the chance that the running total ever falls past a level has the same Chebyshev
    bound as the final total alone, so an arm with no edge can sit as deep mid-month as it may finish.
  tags:
  - sizing
  - stop
- id: book.fm-intro-quant-finance.8
  book: fm-intro-quant-finance
  title: 'Cheapest rebalance: minimise total lots traded'
  chapter: Ch. 3.3, Trading cost as an l1 norm
  text: With a cost per unit traded, the best way to reach a target exposure (a delta or beta) is the set of trades with the
    smallest sum of absolute sizes, under position caps, then rounded to lot sizes; every extra leg adjustment is a charged
    order.
  tags:
  - costs
- id: book.fm-lyuu-fin-engineering.1
  book: fm-lyuu-fin-engineering
  title: Drift is hard to estimate, volatility is easy
  chapter: Ch. 20.1, Introduction (maximum-likelihood estimation)
  text: How precisely a series' drift can be estimated depends only on the total time span, not on how often it is sampled,
    while volatility gets more precise with every observation; in the book's simulation (true drift 0.105) 5,999 frequent
    observations gave 0.118348, but fewer observations over a longer span gave 0.108039.
  tags:
  - direction
  - vix
  verdict: positive
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found the range of the next 30-60 minutes predictable (q 0.003) but direction not (holdout AUC 0.509-0.536).
- id: book.fm-lyuu-fin-engineering.2
  book: fm-lyuu-fin-engineering
  title: Theta is the price of gamma
  chapter: Ch. 15.2.1, Merton's derivation (Eq. 15.3)
  text: 'For a delta-neutral option position the Black-Scholes equation reduces to theta plus half sigma squared S squared
    gamma equals r times the value: time decay is what the holder pays to own movement (gamma) and what the seller is paid
    to carry it.'
  tags:
