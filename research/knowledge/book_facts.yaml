- id: book.fm-kabanov-stochastic-calculus.5
  book: fm-kabanov-stochastic-calculus
  title: Volatility jumps with shocks, then decays; tails are power-law
  chapter: Paper 21, Kluppelberg, Lindner and Maller, COGARCH vs OU
  text: In continuous-time GARCH a big price move instantly lifts volatility, which then decays exponentially towards a floor;
    returns stay uncorrelated while squared returns cluster, and returns get Pareto-type heavy tails, so a short-option book's
    worst day is far worse than normal limits suggest.
  tags:
  - vix
  - option-selling
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-kabanov-stochastic-calculus.6
  book: fm-kabanov-stochastic-calculus
  title: Kelly fraction is drift over variance; a wrong edge costs its square
  chapter: Papers 10 and 13, Di Masi-Stettner and Gasbarra-Valkeila-Vostrikova
  text: The log-optimal (Kelly) fraction is drift divided by variance and may depend on the current market state; a slightly
    more cautious criterion barely changes it, and growth lost to a mis-estimated edge rises with the square of the error,
    which argues for a fraction of Kelly when the edge is uncertain.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: 'Our H15 found the Kelly fraction unstable: on other windows f* for BN is 0.48 and 0.14, against 1.29 in the
    sample used.'
- id: book.fm-kabanov-stochastic-calculus.7
  book: fm-kabanov-stochastic-calculus
  title: Drawdown stops cannot add expectancy on a driftless price
  chapter: Paper 25, Obloj and Yor, local martingale and its supremum
  text: Functions of a price and its running high, including the drawdown from the high, form martingales (Azema-Yor), so
    on a driftless price an exit at a set distance below the running high only reshapes outcomes and cannot raise the expected
    result (our reading of the construction).
  tags:
  - profit-lock
  - stop
  verdict: negative
  tested_src: research/FINDINGS.md
  tested_text: 'Our R19b tested a Rs 500 give-back trail on Liquidity: holdout +Rs 4,584 vs +Rs 14,633 on plain rules (27
    trades).'
- id: book.fm-kabanov-stochastic-calculus.8
  book: fm-kabanov-stochastic-calculus
  title: Asymmetric skew means the market prices asymmetric jumps
  chapter: Paper 12, Fajardo and Mordecki, section 4
  text: In a jump market a call equals a put in a mirrored dual market; puts and calls are mirror images only if the jump
    distribution satisfies a symmetry condition, so persistently dearer OTM puts mean the market prices crash jumps more than
    rallies.
  tags:
  - iv
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-brandimarte-numerical.1
  book: fm-brandimarte-numerical
  title: A stop-loss hedge does not converge
  chapter: Ch. 8.1.2, Simulating hedging strategies
  text: In a 10,000-path simulation, hedging a written call by holding the stock only while it is above the strike cost 4.8268
    with 10 checks and 4.8286 with 100, against a fair value of 4.7328; delta hedging cost 4.7352-4.7370. Crossings are detected
    late, so the hedger buys above the level and sells below it, and checking more often does not fix it.
  tags:
  - stop
  - option-selling
- id: book.fm-brandimarte-numerical.2
  book: fm-brandimarte-numerical
  title: VaR can punish diversification; CVaR does not
  chapter: Ch. 2.4.5, Value at Risk
  text: 'Value at Risk is only a loss quantile: it cannot see how fat the tail beyond it is, and two bonds that each default
    with 4% probability each show a 95% VaR of 0 but 100 when held together. Conditional VaR, the average loss beyond VaR,
    is the coherent alternative.'
  tags:
  - sizing
  - option-selling
- id: book.fm-brandimarte-numerical.3
  book: fm-brandimarte-numerical
  title: The 'optimal' risky fraction swings with sampling noise
  chapter: Ch. 10.3, Example 10.4
  text: With log utility, the optimal share in a stock estimated from 10,000 random scenarios ranged from 0.2694 to 0.3763
    across seven runs; 5,000,000 scenarios or a 3-5 node Gauss-Hermite rule settled at about 0.3064.
  tags:
  - sizing
  verdict: positive
  tested_src: research/HUNT_H15.md
  tested_text: 'Our h15 found the Kelly fraction unstable: BN f* was 0.48 (Jun 2023 to Nov 2024) and 0.14 (2020 to May 2023)
    against 1.29 in the window used.'
- id: book.fm-brandimarte-numerical.4
  book: fm-brandimarte-numerical
  title: Deciding on noisy estimates biases results
  chapter: Ch. 4.5.4, Conditioning; Ch. 10.4
  text: 'A chooser option priced by nested Monte Carlo, where the mid-life choice used sampled estimates, came out at 8.698
    and still 8.930 with ten times the samples, against about 9.26-9.30: noisy estimates cause wrong choices and more samples
    do not remove the bias. Fit a decision rule on one sample and score it on an independent one.'
  tags:
  - filter
- id: book.fm-brandimarte-numerical.5
  book: fm-brandimarte-numerical
  title: Monte Carlo error falls only with the square root of runs
  chapter: Ch. 4.4, Setting the number of replications
  text: A call worth 1.1718 was estimated at 1.1953 from 50,000 replications with a confidence interval 4.2% wide; 1,000,000
    replications narrowed it to 0.94%. Run about 30 pilot replications to size the run, fix the seed, and report the interval;
    intervals assume independent samples.
  tags:
  - costs
- id: book.fm-brandimarte-numerical.6
  book: fm-brandimarte-numerical
  title: Compare variants on the same random numbers
  chapter: Ch. 4.5.2-4.5.3, Common random numbers and control variates
  text: To estimate a difference between two variants, drive both with the same random stream so the noise cancels; a known-price
    control (the stock for a call) cut a confidence interval from 1.49% to 0.66%. Antithetic pairs need a monotone payoff
    and made a butterfly spread worse (2.56% to 3.55%).
  tags:
  - straddle
- id: book.fm-brandimarte-numerical.7
  book: fm-brandimarte-numerical
  title: Sample the rare event on purpose
  chapter: Ch. 4.5.6 and 8.3.3, Importance sampling
  text: When only 249 of 200,000 paths touched a barrier, shifting the drift toward it and reweighting each path by the likelihood
    ratio raised the touches to 8,469 of 10,000 and shrank the error band by two orders of magnitude; the same trick cut a
    deep out-of-the-money call's error from 3.06% to 1.155%.
  tags:
  - option-selling
  - stop
- id: book.fm-brandimarte-numerical.8
  book: fm-brandimarte-numerical
  title: 'Implied vol depends on strike: Black-Scholes as interpolation'
  chapter: Ch. 2.6.5, Remarks on the Black-Scholes formula
  text: Real markets are incomplete (costs, jumps, changing volatility), so Black-Scholes is used to back out an implied volatility
    from market prices, and that implied volatility varies with strike and maturity (a volatility surface).
  tags:
  - iv
  inst:
  - NIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found NIFTY puts five strikes out dearer than calls five strikes out on 91% of days (n 1,222), with
    expiry-day ATM IV 7.7 points above India VIX.
- id: book.fm-brandimarte-numerical.9
  book: fm-brandimarte-numerical
  title: Daily-checked barriers are touched less often
  chapter: Ch. 2.7.1, Barrier options
  text: A barrier checked once a day is crossed less often than a continuous one; shifting the barrier by exp(-0.5826 x vol
    x square root of the check interval) corrects the price (0.5424 became 0.6380 with daily checks).
  tags:
  - stop
- id: book.fm-fries-math-finance.1
  book: fm-fries-math-finance
  title: Option prices across strikes hold the market's expiry distribution
  chapter: Ch. 5 and 9.2, Density of the underlying; digital caplet
  text: The strike-slope of call prices gives the market's (risk-neutral) probability of finishing above a strike, a tight
    call spread approximates it, and the curvature gives the density; these probabilities include the risk premium, so they
    are not forecasts.
  tags:
  - iv
  - expiry
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-fries-math-finance.2
  book: fm-fries-math-finance
  title: No-arbitrage checks on a strike strip
  chapter: Ch. 6, Interpolation of European option prices
  text: Call prices must fall as the strike rises, by no more than the discount factor per unit of strike, and must be convex
    (no butterfly can cost less than zero); spline or implied-vol interpolation can break this and imply negative probabilities,
    and an implied vol cannot fall or rise arbitrarily fast across strikes.
  tags:
  - iv
  - filter
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/HUNT_LAKE_STALE_PRINTS.md
  tested_text: 'Our lake filter drops stale option prices that break the strike-order bound against the neighbouring strikes:
    9,646 one-minute prices flagged out of 35.4 million, none on NIFTY; smaller stale errors are still missed.'
- id: book.fm-fries-math-finance.3
  book: fm-fries-math-finance
  title: 'Discrete hedging: the bill is gamma times realised minus implied'
  chapter: Ch. 7.4, Delta and delta-gamma hedging
  text: Hedging only at intervals leaves an error each step of about half the gamma times the gap between the squared move
    and the variance the option priced; hedging with a volatility of 0.4 when the true one is 0.5 leaves the hedge under-funded
    and noisier, and adding a second option to match gamma tightens it.
  tags:
  - option-selling
  - theta
  - iv
- id: book.fm-fries-math-finance.4
  book: fm-fries-math-finance
  title: Minimum-variance hedge ratio, not textbook delta
  chapter: Ch. 7.5, Bouchaud-Sornette method
  text: When you can only rebalance at intervals, choose the hedge ratio that minimises the variance of the hedge error under
    real-world probabilities (covariance of option and underlying changes over their variance); it can differ from the Black-Scholes
    delta.
  tags:
  - option-selling
  - sizing
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-fries-math-finance.5
  book: fm-fries-math-finance
  title: 'Foresight bias: fitting and judging on the same sample'
  chapter: Ch. 15.6-15.9, Perfect foresight and foresight bias
  text: A decision that uses later information looks better than possible, and even an honest rule estimated and then valued
    on the same sample keeps a bias equal to an option on its own estimation noise; the cure is to estimate on one sample
    and value on an independent one.
  tags:
  - ml
  - filter
- id: book.fm-fries-math-finance.6
  book: fm-fries-math-finance
  title: Tuning one threshold is noisy and the rule shape matters
  chapter: Ch. 15.11, Optimization methods
  text: Choosing a threshold that maximises a simulated value gives a jumpy objective with spurious peaks of about 1/n size,
    and if the true region is an interval a one-threshold rule finds only 'always' or 'never', both worth less than the truth.
  tags:
  - stop
  - target
  - ml
- id: book.fm-fries-math-finance.7
  book: fm-fries-math-finance
  title: Exit timing by regressing the value of holding
  chapter: Ch. 15.10, Least-squares Monte Carlo
  text: At each decision time compare the value of exiting now with a regression estimate of the value of holding, fitted
    on a few state variables over many paths; use the estimate only for the decision, never as the payoff, and fit it on separate
    data.
  tags:
  - stop
  - target
  - profit-lock
- id: book.fm-fries-math-finance.8
  book: fm-fries-math-finance
  title: Calibrate to today's prices, but do not fit every quote
  chapter: Ch. 19.1.4, Calibration and overfitting
  text: A pricing model must reproduce current traded prices, since the hedge is bought at today's prices; fitting every quote
    exactly also fits bad or stale quotes, so a few-parameter family trades a perfect fit for robustness, and differencing
    coarse quantities amplifies their noise.
  tags:
  - iv
  - filter
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-fries-math-finance.9
  book: fm-fries-math-finance
  title: Skew changes the probability of a tail; expiry prices do not fix the path
  chapter: Ch. 25.2, Markov functional calibration
  text: The market price of finishing beyond a strike includes a term for the slope of the smile, so with dearer puts the
    downside tail is larger than a flat-volatility N(-d2) suggests; option prices at an expiry fix only the distribution on
    that date, not how often the path crosses a level before it.
  tags:
  - iv
  - stop
  - expiry
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-fries-math-finance.10
  book: fm-fries-math-finance
  title: Correlation at the horizon, not minute by minute
  chapter: Ch. 20, Instantaneous and terminal correlation
  text: Two rates can move together step by step yet end a horizon uncorrelated if they receive their volatility at different
    times; in the example, caplets all priced 0.26% while the matching swaption ranged from 0.27% to 0.51%, because a spread
    or sum depends on the covariance at the horizon.
  tags:
  - breadth
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-bjork-arbitrage.1
  book: fm-bjork-arbitrage
  title: Option price depends on volatility, not expected return
  chapter: Ch. 7.3-7.4, The Black-Scholes equation and risk neutral valuation
  text: 'An option''s no-arbitrage price depends on the underlying''s volatility, not on its expected return: two stocks with
    the same volatility give the same option price whether they are expected to rise or fall, because the option can be replicated
    by hedging with the stock and cash.'
  tags:
  - iv
  - direction
- id: book.fm-bjork-arbitrage.2
  book: fm-bjork-arbitrage
  title: Implied volatility and the smile
  chapter: Ch. 7.7.2, Implied volatility
  text: Implied volatility is the volatility that makes Black-Scholes match a traded option; if the model were right it would
    be flat across strikes, but far-from-the-money options trade at higher implied volatility (the smile), so the model is
    a quoting tool rather than the truth.
  tags:
  - iv
- id: book.fm-bjork-arbitrage.3
  book: fm-bjork-arbitrage
  title: 'Delta hedging: hedge quality against costs'
  chapter: Ch. 9.3, Delta and gamma hedging
  text: A seller hedges by holding delta units of the underlying and rebalancing at intervals; rebalancing often gives a better
    hedge but higher transaction costs, and high gamma makes the hedge go stale quickly, so it needs more rebalancing.
  tags:
  - costs
  - option-selling
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: VOL 130 trades, win 27%, net -Rs 288,787 in
    design. It did not pass the gates.'
- id: book.fm-bjork-arbitrage.4
  book: fm-bjork-arbitrage
  title: Theta is the price of gamma
  chapter: Ch. 9, Exercises 9.8-9.9
  text: 'For a book hedged to zero delta and zero gamma, the time decay exactly offsets the gamma term and the book earns
    only the risk-free rate: the theta an option seller collects is payment for being short gamma, not free income.'
  tags:
  - theta
  - option-selling
  verdict: weak
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: VOL 895 trades, win 59%, net Rs 147,050 in design.
    It did not pass the gates.'
- id: book.fm-bjork-arbitrage.5
  book: fm-bjork-arbitrage
  title: Implied prices carry a risk premium
  chapter: Ch. 15.6 and 22.2, Who chooses the martingale measure?
  text: When risks cannot be hedged perfectly, no-arbitrage does not fix a unique price; the market's risk aversion, supply
    and demand pick it, so implied numbers such as implied volatility or forward rates are prices that include a premium,
    not unbiased forecasts.
  tags:
  - iv
  - vix
  inst:
  - INDIAVIX
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found India VIX over-states NIFTY's next 21 days on 81% of days (median ratio 1.28, n 4,507) but under-states
    BANKNIFTY's on 60%.
- id: book.fm-bjork-arbitrage.6
  book: fm-bjork-arbitrage
  title: 'Merton: bet a constant fraction'
  chapter: Ch. 19.6, Optimal consumption and investment
  text: 'With constant expected return and volatility, the optimal share of wealth in the risky asset is constant: the expected
    excess return divided by the variance and by a risk-aversion term; with log utility this becomes the growth-optimal (Kelly-type)
    fraction.'
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: Our h15 found half-Kelly sizing on Liquidity 15+5 grew fastest but had P(drawdown ≥ 30%) of 63%, and the Kelly
    fraction was unstable (0.48 and 0.14 on other windows against 1.29).
- id: book.fm-bjork-arbitrage.7
  book: fm-bjork-arbitrage
  title: Touch odds for a stop and a target
  chapter: Ch. 18.1 and Appendix C, Exercise C.8
  text: 'With no drift, the chance the price reaches a level a above before a level b below is b / (a + b): a target twice
    as far away as the stop is reached first only about one time in three, and touching a level before expiry is about twice
    as likely as finishing beyond it.'
  tags:
  - stop
  - target
- id: book.fm-bjork-arbitrage.8
  book: fm-bjork-arbitrage
  title: Exits and sizing cannot create an edge
  chapter: Appendix C, Discrete stochastic integrals and stopping times
  text: 'A fair game stays fair under any betting scheme decided from past information and under any stopping rule: if price
    has no drift, stops, targets, locks or changing size reshape the win rate against the size of wins but cannot make the
    expected profit positive.'
  tags:
  - stop
  - target
  - profit-lock
  verdict: negative
  tested_src: research/HUNT_R19_LIQUIDITY_LOCK.md
  tested_text: 'Our R19 tried profit locks on Liquidity 15+5 and none added value: 0 of 12 tests passed, because a lock sells
    the runners early.'
- id: book.fm-bjork-arbitrage.9
  book: fm-bjork-arbitrage
  title: Drift is hard to estimate, volatility is not
  chapter: Ch. 11.6, Maximum likelihood estimation
  text: 'The maximum-likelihood estimate of a diffusion''s drift is simply the total move divided by the elapsed time, so
    it uses only the first and last price, while volatility is estimated from every increment: direction needs far longer
    samples than size.'
  tags:
  - direction
  verdict: positive
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found only the size of the next 30-60 minutes predictable (range error 18-20% smaller than the time-of-day
    average); direction failed in the locked holdout.
- id: book.fm-bjork-arbitrage.10
  book: fm-bjork-arbitrage
  title: Put-call parity and static replication
  chapter: Ch. 9.1, Parity relations
  text: Pricing is linear, so a call minus a put at the same strike and expiry equals the underlying minus the discounted
    strike, and any piecewise-linear payoff (straddle, spread, butterfly) can be built once from cash, the underlying and
    calls with no rebalancing.
  tags:
  - option-selling
  - straddle
- id: book.fm-comp-finance-numerical.1
  book: fm-comp-finance-numerical
  title: Implied volatility forecasts best
  chapter: Ch. 14, Introduction (Granger survey)
  text: In a survey of about 40 studies, implied volatility beat historical volatility in 12 of 13 comparisons and beat GARCH
    in 13 of 14; GARCH won 5 and lost 5 against historical, and implied wins because option prices carry more information
    than past returns.
  tags:
  - iv
  - vix
  inst:
  - NIFTY
  - BANKNIFTY
  - INDIAVIX
  verdict: weak
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found VIX already holds the next-day range information, but for the next 30 or 60 minutes a realised-range
    model beat the VIX-implied forecast in the holdout (skill 10.4% to 15.0%).
- id: book.fm-comp-finance-numerical.2
  book: fm-comp-finance-numerical
  title: Volatility clusters and drifts back to its average
  chapter: Ch. 15.2.2 and 22, GARCH forecasting and mean reversion
  text: 'Volatility clusters: a GARCH forecast starts from today''s variance and decays toward the long-run level at a rate
    set by the sum of its two weights, which real data put close to 1 (a currency fit gave 0.128 plus 0.852), so volatility
    shocks fade slowly.'
  tags:
  - vix
  - sizing
  verdict: positive
  tested_src: research/HUNT_R88_WHAT_MOVES_THE_CANDLE.md
  tested_text: Our R88 found the next candle 1.4x bigger after a volatile last hour on the indices; 225 of 305 size findings
    held out of sample, and 0 of 8 direction findings.
- id: book.fm-comp-finance-numerical.3
  book: fm-comp-finance-numerical
  title: Bad news raises volatility more than good news
  chapter: Ch. 16 and 22.5, Nonlinear GARCH and the S&P 500 fit
  text: Equity and index volatility rises more after a fall than after an equal rise (the leverage effect); on 3,000 S&P 500
    daily returns the GJR asymmetry term was strongly significant (t 7.60). Commodities show the effect in either direction
    and currencies not at all.
  tags:
  - vix
  - mcx
- id: book.fm-comp-finance-numerical.4
  book: fm-comp-finance-numerical
  title: Returns have fat tails even after GARCH
  chapter: Ch. 14, 17 and 22.5, Conditional distributions
  text: Returns have fatter tails than the normal even after a GARCH model removes volatility clustering; Student-t shocks
    with 8.116 degrees of freedom fitted the S&P 500 best, and below about 5 degrees of freedom the tails are very thick.
  tags:
  - sizing
  - stop
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 measured daily-return kurtosis of 14.1 for NIFTY and 8.5 for BANKNIFTY over 5,087 days.
- id: book.fm-comp-finance-numerical.5
  book: fm-comp-finance-numerical
  title: Stale prices manufacture results
  chapter: Ch. 14.2, Nonsynchronous trading
  text: A price that does not trade every period keeps its average return but gains extra variance, negative autocorrelation
    and false lead-lag with actively traded series; with a 0.75 chance of no trade per period, untraded runs average 3 periods.
  tags:
  - costs
  - option-selling
  verdict: positive
  tested_src: research/HUNT_R103_OPTIONS_SELLING.md
  tested_text: Our R103's six design passes came from far wings marked at prints often 30+ minutes old; repriced with Black-Scholes,
    every one lost (-Rs 2.87 to -Rs 3.31 lakh in design).
- id: book.fm-comp-finance-numerical.6
  book: fm-comp-finance-numerical
  title: Effective spread from prices alone
  chapter: Ch. 14.3, Bid-ask spread (Roll model)
  text: When trades bounce between bid and ask, price changes get a lag-1 autocorrelation of minus one half and look more
    volatile than the true price; the effective spread is about two times the square root of minus the lag-1 covariance of
    price changes, and it can differ from the quoted spread.
  tags:
  - costs
- id: book.fm-comp-finance-numerical.7
  book: fm-comp-finance-numerical
  title: Do not trust implied volatility when vega is tiny
  chapter: Ch. 9.3.4, Implied volatility
  text: Implied volatility is found by Newton steps that divide by vega; check the price against its intrinsic floor first,
    bound the search and cap it at 50 iterations, because the method breaks down when vega is near zero (far strikes, the
    last minutes before expiry).
  tags:
  - iv
  - expiry
- id: book.fm-comp-finance-numerical.8
  book: fm-comp-finance-numerical
  title: Monte Carlo needs many paths; quasi-random numbers help
  chapter: Ch. 11 and 12.3, Monte Carlo simulation
  text: Monte Carlo error shrinks only with the square root of the number of paths, so each extra decimal costs 100 times
    the work; at 3,000 paths Sobol quasi-random numbers were off by 0.007 on a basket call where pseudo-random draws were
    off by 0.133.
  tags:
  - sizing
- id: book.fm-comp-finance-numerical.9
  book: fm-comp-finance-numerical
  title: A GARCH fit needs about 1,000 observations
  chapter: Ch. 21, Testing GARCH software
  text: In 200 simulated series of 300 observations the software reported a standard error of 0.068 for a parameter whose
    estimates actually spread by 0.42; at 1,000 observations the reported and actual errors agreed, so short samples give
    overconfident volatility models.
  tags:
  - ml
  - sizing
- id: book.fm-elliott-fin-markets.1
  book: fm-elliott-fin-markets
  title: Option prices ignore the expected return
  chapter: Ch. 2.7 and 7.5, From CRR to Black-Scholes; An equivalent martingale measure
  text: In the binomial and Black-Scholes models an option's price depends on spot, strike, time, rate and volatility but
    not on the stock's expected return, because it is priced with risk-neutral probabilities; a view on direction is not paid
    for in the premium.
  tags:
  - iv
  - direction
  - option-buying
- id: book.fm-elliott-fin-markets.2
  book: fm-elliott-fin-markets
  title: Exits cannot create an edge on a fair-game price
  chapter: Ch. 5.2-5.3 and 6.2, Optional stopping
  text: If a price has no predictable drift, stopping it by any rule that uses only past information (stop-loss, target, trailing
    stop, time stop) leaves the expected result unchanged; exits only trade win rate against the size of wins, and costs then
    lower the mean.
  tags:
  - stop
  - target
  - profit-lock
  verdict: positive
  tested_src: research/HUNT_R18_EXITS.md
  tested_text: 'Our R18 added five early-exit overlays to every arm''s own exits: 0 of 60 passed, consistent with the theorem
    that exits alone add no edge.'
- id: book.fm-elliott-fin-markets.3
  book: fm-elliott-fin-markets
  title: Touching a level is about twice as likely as closing beyond it
  chapter: Ch. 7.8, Barrier options (reflection principle); Ch. 7.2, Hitting times
  text: For a driftless price, the chance of touching a level before a deadline is about twice the chance of finishing beyond
    it; with drift away from the level the chance of ever reaching it falls off exponentially with distance. Stops, targets
    and short strikes get touched more often than closing prices suggest.
  tags:
  - stop
  - target
  - option-selling
- id: book.fm-elliott-fin-markets.4
  book: fm-elliott-fin-markets
  title: Realised variance is the sum of squared returns
  chapter: Ch. 6.4, The Ito calculus (quadratic variation)
  text: Adding up squared log returns over finer and finer steps converges to the variance the price actually delivered over
    the period; this is the quantity implied volatility tries to forecast, and the same holds for covariance between two prices.
  tags:
  - iv
  - vix
- id: book.fm-elliott-fin-markets.5
  book: fm-elliott-fin-markets
  title: 'Greeks: gamma sets hedging cost, call theta is always negative'
  chapter: Ch. 7.10, The Greeks
  text: Call delta is N(d1) and put delta is that minus one; gamma and vega are the same for a call and a put, largest near
    the money, and vega shrinks to zero at expiry; a European call's theta is always negative. Gamma decides how often and
    how much a delta hedge must be adjusted, so low gamma keeps hedging costs down.
  tags:
  - theta
  - iv
  - costs
- id: book.fm-elliott-fin-markets.6
  book: fm-elliott-fin-markets
  title: An option is a levered underlying
  chapter: Ch. 1.4 Risk and return; Ch. 7.10 The Greeks
  text: A call's return volatility and its excess return are both its elasticity (spot times delta divided by the option price,
    at least 1) times the stock's, so an option multiplies whatever edge the underlying signal has - including none - while
    its risk-neutral expected return is only the riskless rate.
  tags:
  - option-buying
  - sizing
- id: book.fm-elliott-fin-markets.7
  book: fm-elliott-fin-markets
  title: 'Kelly / Merton size: edge divided by variance'
  chapter: Ch. 10.4, Maximisation of terminal utility (log utility)
  text: With log utility (maximising long-run growth) the best holding is a constant fraction of wealth equal to the expected
    excess return divided by the variance, rebalanced continuously; with no expected excess return the best size is zero.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: 'Our H15 sized Liquidity books at half-Kelly: P(drawdown 30% or more) was 63%, and BANKNIFTY''s Kelly fraction
    was 1.29 in sample but 0.14 on 2020 to May 2023.'
- id: book.fm-elliott-fin-markets.8
  book: fm-elliott-fin-markets
  title: VaR can stay flat while the tail explodes; use expected shortfall
  chapter: Ch. 11.1-11.3, Value at Risk; Coherent risk measures; CVaR
  text: 'VaR is one quantile: it is not subadditive (two independent half-size loans can show more VaR than one big loan)
    and ignores how big losses beyond it are. In a 150-loan example, making defaults cluster moved VaR only from 5 to 6 defaults
    while the average loss beyond it went from 6.287 to 14.5. Expected shortfall, the average of the worst cases, is coherent.'
  tags:
  - sizing
  - option-selling
- id: book.fm-elliott-fin-markets.9
  book: fm-elliott-fin-markets
  title: In real markets an option price is a band, not a point
  chapter: 'Ch. 4.5, Incomplete models: the arbitrage interval; Ch. 2.4, Superhedging'
  text: When a claim cannot be hedged exactly, no-arbitrage only places its price in an open interval; the seller's price
    (cost of always covering the payoff) sits at or above the risk-neutral value and the buyer's at or below, so a model price
    is one point inside the band.
