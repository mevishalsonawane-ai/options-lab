- id: book.bennett-trading-volatility.9
  book: bennett-trading-volatility
  title: Buy when implied is cheap, sell when dear; expiry around events
  chapter: Ch. 1.2, Figure 1
  text: 'Choose the option from two views: if implied vol looks cheap, buy (a call if bullish, a put if bearish); if it looks
    dear, sell (a put if bullish, a call if bearish). A long-volatility trade should expire just after a key date and a short
    one just before it.'
  tags:
  - iv
  - option-buying
  - option-selling
  - news
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/HUNT_H29.md
  tested_text: 'Our h29 tested buying index options only when IV was cheap against a HAR realised-vol forecast: all 16 variants
    lost after costs.'
- id: book.bennett-trading-volatility.10
  book: bennett-trading-volatility
  title: Skew is usually overpriced; long skew pays only in panics
  chapter: Ch. 7.5, Skew trading
  text: A long-skew position (long OTM put, short OTM call, delta hedged) pays a skew theta and only profits in a jumpy, panicked
    market where implied vol jumps by more than the skew implies as spot falls; in calm or trending markets selling skew wins,
    so skew is usually overpriced.
  tags:
  - iv
  - option-selling
- id: book.bennett-trading-volatility.11
  book: bennett-trading-volatility
  title: Skew is not a fear gauge
  chapter: Ch. 7.1 and 7.4, Measuring skew
  text: 'Skew is not a reliable risk indicator: it often rises when at-the-money implied falls, because low-strike implieds
    are sticky. Measure it as a fixed-strike difference such as 90%-100% and do not divide it by ATM volatility.'
  tags:
  - iv
  - filter
- id: book.bennett-trading-volatility.12
  book: bennett-trading-volatility
  title: Term structure and the square-root-of-time rule
  chapter: Ch. 7.1-7.3, Skew and term structure
  text: Term structure is normally upward sloping and inverts when markets fall; realised vol takes about 8 months to mean
    revert after a spike. Implied vol moves roughly with one over the square root of time, so a 3-month implied moves about
    twice as much as a 1-year one, and calendars can be traded when moves break that rule.
  tags:
  - iv
  - vix
- id: book.bennett-trading-volatility.13
  book: bennett-trading-volatility
  title: Trading the implied jump of a known event
  chapter: Ch. 6.4, Trading earnings announcements / jumps
  text: The extra volatility priced for a known event can be backed out of the expiries just before and just after it, because
    variance adds up over time; to trade only the event, buy the expiry after and sell the expiry before, or the reverse to
    sell an overpriced jump.
  tags:
  - news
  - expiry
  - iv
- id: book.bennett-trading-volatility.14
  book: bennett-trading-volatility
  title: Hedgers can pin a stock, rarely an index
  chapter: Ch. 2.1, Hedging can pin a stock approaching expiry
  text: A long-gamma hedger who sells rallies and buys dips can pin an underlying to a strike into expiry, but only where
    the hedge is large against traded volume and markets are calm; a major index is hard to pin.
  tags:
  - expiry
  - gex
  - oi
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/EXPIRY_PLAYBOOK.md
  tested_text: Our expiry playbook found the close landed within half a strike step of the 09:20 largest-OI strike on only
    11% of NIFTY expiries (53).
- id: book.bennett-trading-volatility.15
  book: bennett-trading-volatility
  title: How a VIX-style index differs from variance
  chapter: Ch. 4.2-4.3, Volatility indices and their futures
  text: A variance-based volatility index sits about 0.2-0.7 points below a variance swap of the same maturity because illiquid
    wings are chopped, jumps by about 2 points when it rolls expiries without interpolation, and its futures react only partly
    to spot moves because volatility mean reverts.
  tags:
  - vix
  - iv
  inst:
  - INDIAVIX
- id: book.sadowski-9-strategies.1
  book: sadowski-9-strategies
  title: Stochastic reversal at S/R with a COT bias
  chapter: Strategy 1, Momentum reversal
  text: Set the trend bias from fundamentals and the Commitments of Traders report. Look for a daily reversal zone where weekly
    and daily stochastic are above 70 (or oversold) and price is at a major support or resistance zone. Then take an intraday
    reversal pattern only in the bias direction, getting 1-5 signals a month.
  tags:
  - reversal
  - filter
  - swing
- id: book.sadowski-9-strategies.2
  book: sadowski-9-strategies
  title: 20/60/100 moving-average crossover
  chapter: Strategy 2, MA crossover
  text: Buy when the 20-period MA crosses above the 60-period MA and sell on the opposite cross. Stay in until the next cross,
    and let the trade run while bars hold on one side of the 100-period MA. The author admits it is right only about half
    the time and fails in ranges.
  tags:
  - moving-average
  - trend
  - direction
  verdict: negative
  tested_src: research/OBUY_FINAL.md
  tested_text: 'Our OBUY_FINAL tested EMA crosses (TI-03) as option-buying triggers: 96 variants lost -369,856 walk-forward,
    positive in 1 of 5 years.'
- id: book.sadowski-9-strategies.3
  book: sadowski-9-strategies
  title: Heikin-Ashi two-candle reversal
  chapter: Strategy 3, Heikin-Ashi
  text: Two completed daily Heikin-Ashi candles of the new colour after a run of the other colour signal a reversal. Confirm
    with a stochastic (14,7,3) and optionally the Accelerator Oscillator, then enter on a stop order beyond the second candle.
    Use a 100 pips stop and move to breakeven after +50 pips.
  tags:
  - reversal
  - candles
  - stop
  - profit-lock
  verdict: negative
  tested_src: research/HUNT_R71_CHART_PATTERNS.md
  tested_text: Our R71 Heikin-Ashi flip on the index, buying the option, lost Rs 79,173 on 357 trades in the final period.
- id: book.sadowski-9-strategies.4
  book: sadowski-9-strategies
  title: Swing entry out of an overlapping correction
  chapter: Strategy 4, Swing trading
  text: In a trend, a correction shows as many overlapping bars in a contracting range. Enter when price breaks out of that
    range back in the trend direction, with the stop at the last minor swing or the low of the correction. The example risked
    about 30 points to gain about 600.
  tags:
  - trend
  - swing
  - stop
- id: book.sadowski-9-strategies.5
  book: sadowski-9-strategies
  title: Engulfing, long shadow and hammer candles
  chapter: Strategy 5, Candlestick patterns
  text: Wait for an engulfing, long-shadow (wick at least twice the body) or hammer candle to close. Enter at the next open,
    with the stop at the pattern candle's extreme, trailed with the trend. The more candles an engulfing body covers, the
    stronger it is claimed to be.
  tags:
  - candles
  - reversal
  - pattern
  verdict: negative
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: 'Our R87 found a candle''s shape alone does not predict direction: for 92% of the 234 shape cells the index
    went up between 45% and 55% of the time.'
- id: book.sadowski-9-strategies.6
  book: sadowski-9-strategies
  title: 'Role reversal: broken resistance becomes support'
  chapter: Strategy 6, Role reversal
  text: In an uptrend, buy the pullback to a broken resistance, treated as a zone, not an exact price; mirror this for downtrends.
    Scale in with 1/3 at the 20 MA, 1/3 at the broken level and 1/3 at the 50% Fibonacci retracement.
  tags:
  - reversal
  - trend
  - sizing
  - gann-fib
  verdict: negative
  tested_src: research/HUNT_R20C_SR_BREAK.md
  tested_text: Our R20c found that after a two-close level break, price was further in the break's direction at 15:29 in 51%
    of 7,548 breaks, and random levels did almost as well.
- id: book.sadowski-9-strategies.7
  book: sadowski-9-strategies
  title: Bollinger squeeze, trade the middle-line close
  chapter: Strategy 7, Bollinger squeeze
  text: Use Bollinger(20, 2) and watch the band width. When the bands squeeze (width near 0.0100 on EURUSD), buy the first
    full candle closing above the middle line or sell one closing below. The stop is the prior candle's extreme or a 3% capital
    loss, whichever is smaller.
  tags:
  - filter
  - momentum
  - stop
