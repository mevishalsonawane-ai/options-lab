- id: book.douglas-trading-in-the-zone.4
  book: douglas-trading-in-the-zone
  title: Pre-define the risk of every trade
  chapter: Ch. 6 and Ch. 11, Stop-Loss Exit
  text: Decide before entry exactly where the trade is shown not to work, set by market structure rather than a money amount
    you feel like risking, and exit there without hesitation; losses are the cost of doing business.
  tags:
  - stop
- id: book.douglas-trading-in-the-zone.5
  book: douglas-trading-in-the-zone
  title: A stop placed is not a risk accepted
  chapter: Ch. 7, Trading in the Moment
  text: A fund manager put in a stop but bailed out at his entry when the market came back, and then missed a 500-point run
    his way; exiting early to avoid being wrong is a sign the risk was never accepted.
  tags:
  - stop
  - target
- id: book.douglas-trading-in-the-zone.6
  book: douglas-trading-in-the-zone
  title: Take every signal of your edge
  chapter: Ch. 7 and Ch. 8, truth 4
  text: Do not pick and choose which signals to take or gather other evidence for or against a trade; that adds random variables
    and makes it impossible to learn whether the edge works.
  tags:
  - filter
- id: book.douglas-trading-in-the-zone.7
  book: douglas-trading-in-the-zone
  title: Judge an edge on 20 trades or more
  chapter: Ch. 11, Trading in Sample Sizes
  text: 'Never judge an edge on the last trade; trade it for a sample of at least 20 trades without changing its variables.
    The book says 20 is enough for a fair test yet small enough to spot a fading edge (our arithmetic: with no edge, 12 or
    more wins in 20 still happens 25.17% of the time).'
