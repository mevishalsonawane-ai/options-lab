- id: book.fm-lyuu-fin-engineering.9
  book: fm-lyuu-fin-engineering
  title: Never take Greeks by bumping a tree price
  chapter: Ch. 10.2, Numerical techniques
  text: A binomial option price is piecewise linear in spot, so gamma from bumping the spot and repricing is zero most of
    the time and huge near a kink, and smaller bumps make it worse; take delta and gamma from the tree's own nodes or use
    closed-form Greeks.
  tags:
  - iv
- id: book.fm-lyuu-fin-engineering.10
  book: fm-lyuu-fin-engineering
  title: Calibration cannot fix a wrong model
  chapter: Ch. 25.4, Model calibration; Ch. 26.2.4
  text: A misspecified model fitted to today's prices still misprices and mis-hedges, and re-fitting its parameters every
    day ('a new model is born every day') hides the failure; such a model is at best an interpolator for claims like those
    it was fitted to.
  tags:
  - filter
- id: book.fm-kabanov-stochastic-calculus.1
  book: fm-kabanov-stochastic-calculus
  title: Bipower variation splits a day's volatility into smooth part and jumps
  chapter: Paper 3, Barndorff-Nielsen et al., realised power and bipower variation
  text: Summing products of neighbouring absolute intraday returns (bipower variation) estimates a session's continuous variance
    even when the price jumps, so realised variance minus bipower variation measures the jump part; the estimation error shrinks
    with more bars and has known confidence bands.
  tags:
