- id: book.fm-fabozzi-modelling.3
  book: fm-fabozzi-modelling
  title: The option writer carries the jump
  chapter: Ch. 23, Market completeness and risk
  text: With jumps or stochastic volatility an option cannot be replicated, so the seller bears the large moves; the premium
    over realised volatility is pay for that. Short straddles need a stop or wing, a scenario check and crash days in the
    back-test.
  tags:
