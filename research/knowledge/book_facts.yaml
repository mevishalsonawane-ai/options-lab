- id: book.fm-wilmott-howison-dewynne.5
  book: fm-wilmott-howison-dewynne
  title: Costs lower a long option's value and raise a short one's
  chapter: Ch. 16, Options with transaction costs (Leland)
  text: With costs on each rehedge, a long option is worth Black-Scholes at a lower volatility and a short option at a higher
    one, so the price depends on the hedger's costs. Cost divided by (vol times the square root of the rehedge interval) far
    above 1 means rehedging too often; hedge the net book, not each option separately.
  tags:
  - costs
- id: book.fm-wilmott-howison-dewynne.6
  book: fm-wilmott-howison-dewynne
  title: A stop is a knock-out; in plus out equals vanilla
  chapter: Ch. 12, Barrier options
  text: A knock-in plus the matching knock-out equals the plain option, so a stop on the underlying turns a position into
    a knock-out and gives away the knock-in part (the rebound cases). A random walk that touches a level crosses it again
    and again, so 'touched three times' only means something inside a time window.
  tags:
  - stop
- id: book.fm-wilmott-howison-dewynne.7
  book: fm-wilmott-howison-dewynne
  title: Options on futures use Black-76; hedge with futures
  chapter: Ch. 6.3-6.4, Forward and futures contracts; Options on futures
  text: An option on a future is priced as the discounted (F N(d1) - E N(d2)); the future has the same volatility as spot
    and is usually more liquid and cheaper to trade, so writers hedge with futures. Storage costs, as for gold, act like a
    negative dividend yield in the forward price.
