- id: book.fm-baxter-financial-calculus.4
  book: fm-baxter-financial-calculus
  title: Delta lives between 0 and 1 and snaps near expiry
  chapter: Ch. 3.8, Black-Scholes in action
  text: The hedge for a call is the slope of its price against the underlying, always between 0 and 1 share, with borrowing
    never more than the strike. Near expiry it heads to 1 if the option will finish in the money and to 0 if not, swinging
    hardest when the price sits near the strike.
  tags:
  - expiry
  - theta
- id: book.fm-baxter-financial-calculus.5
  book: fm-baxter-financial-calculus
  title: Leave out dividends and the price is wrong
  chapter: Ch. 4.2, Equities and dividends
  text: A five-year index product priced with the dividend yield in the forward is worth 0.9712; forgetting that the index's
