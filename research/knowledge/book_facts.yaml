- id: book.fm-musiela-martingale.3
  book: fm-musiela-martingale
  title: Implied over historical volatility pays for hedging
  chapter: Ch. 7.1.1-7.1.3, Historical vs implied volatility
  text: Pricing with historical volatility is systematically biased (Black and Scholes' own test overpriced options on high-volatility
    stocks and underpriced low ones), and the gap between implied and historical volatility should reflect the cost of dynamic
    hedging; implied volatility forecasts realised better where trading costs are low (futures options) than on stock-index
    options.
  tags:
  - iv
  - vix
  - costs
  inst:
  - INDIAVIX
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found India VIX over-states NIFTY's next 21 days on 81% of days (median ratio 1.28, n 4,507) but under-states
    BANKNIFTY's on 60%.
- id: book.fm-musiela-martingale.4
  book: fm-musiela-martingale
  title: A hedger who overestimates volatility does not lose
  chapter: Ch. 3.5, Robustness of the Black-Scholes approach
  text: A seller who prices and delta-hedges a call, put or straddle at a volatility at least as high as the true volatility
    ends with a non-negative result, because the hedge earns half of gamma times spot squared times the gap between hedging
    and realised variance; for spreads and flies the worst case uses high volatility where gamma is positive and low where
    it is negative.
  tags:
  - option-selling
  - iv
  verdict: positive
  tested_src: research/MCX_OPTIONS.md
  tested_text: Our MCX options study found realised moves were 0.73-0.93 of what the options priced over 60 minutes, and delta-hedged
    long-option P&L was about zero at best.
- id: book.fm-musiela-martingale.5
  book: fm-musiela-martingale
  title: Put skew means price and volatility move opposite
  chapter: Ch. 7.4, Stochastic volatility models
  text: If volatility moved independently of the price the smile would be symmetric with its bottom at the forward; a skew
    where puts are dearer needs returns and volatility changes to be negatively correlated, which studies of stock returns
    found.
  tags:
  - iv
  - reversal
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-musiela-martingale.6
  book: fm-musiela-martingale
  title: Local-volatility hedges can be worse than plain Black-Scholes
  chapter: Ch. 7.3.4 and 7.4.5, Local volatility drawbacks; SABR
  text: A local-volatility model fits every vanilla price but predicts that the smile shifts the wrong way when spot moves,
    so its hedges may be worse than the naive constant-volatility ones; models with their own volatility driver (SABR) move
    the smile the right way.
  tags:
  - iv
  verdict: weak
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: VOL 879 trades, win 59%, net Rs 116,775 in design.
    It did not pass the gates.'
- id: book.fm-musiela-martingale.7
  book: fm-musiela-martingale
  title: Short expiries need jumps
  chapter: Ch. 7.6.1, Jump-diffusion and Levy processes
  text: Studies cited in the book find that jump-diffusion models, with or without stochastic volatility, fit the observed
    smile better than continuous models, especially for shorter expirations.
  tags:
  - expiry
  - iv
- id: book.fm-musiela-martingale.8
  book: fm-musiela-martingale
  title: Volatility clusters and follows activity
  chapter: Ch. 7.6.1, GARCH models and random time change
  text: Volatility clusters (GARCH), returns are fat-tailed, and measured in business time (the count of trades) returns look
    more normal, so recent volatility and recent activity are the natural inputs for the size of the next move.
  tags:
  - volume
  - time-of-day
  verdict: positive
  tested_src: research/HUNT_R88_WHAT_MOVES_THE_CANDLE.md
  tested_text: Our R88 found a big last candle predicts a 1.5x bigger next candle on the indices (10 of 10 index cells held
    out of sample), and a volatile last hour 1.4x.
- id: book.fm-musiela-martingale.9
  book: fm-musiela-martingale
  title: Perfect hedging under costs costs a whole share
  chapter: Ch. 8.2.4, Market imperfections
  text: 'With proportional transaction costs no non-trivial strategy super-replicates a call: the cheapest perfect hedge is
    simply to buy the stock, so practical hedging must accept some risk and trade rarely.'
  tags:
  - costs
- id: book.fm-musiela-martingale.10
  book: fm-musiela-martingale
  title: Doubling only works with unlimited credit
  chapter: Ch. 3.1.3, Self-financing strategies (suicide strategy)
  text: A doubling strategy that keeps raising the bet after losses can turn near-certain ruin into an apparent sure profit
    only if borrowing is unlimited; realistic strategies must have a known maximum leverage, and then the arbitrage disappears.
  tags:
  - sizing
- id: book.fm-jackel-monte-carlo.1
  book: fm-jackel-monte-carlo
  title: A stop checked at intervals is touched less than a watched one
  chapter: Ch. 1 and Ch. 11, discrete barrier correction
  text: A barrier or stop checked only at fixed times is touched less often than one watched continuously; pricing it as continuous
    with the level shifted by exp(0.5826 x vol x square root of the check interval) works only far from the level. In its
    test with spot 160 the shifted barrier was 157.8, and the formula wrongly gave zero.
  tags:
  - stop
- id: book.fm-jackel-monte-carlo.2
  book: fm-jackel-monte-carlo
  title: Interpolate implied vol in total variance, not in vol
  chapter: Ch. 14.1, Interpolation of the term structure of implied volatility
  text: Linear interpolation of implied volatility between expiries can imply negative forward variance, which no price path
    can produce; interpolate cumulative variance (IV squared times time) monotonically instead, with monotone cubic interpolation
    as the best compromise between smoothness and consistency.
  tags:
  - iv
  - expiry
- id: book.fm-jackel-monte-carlo.3
  book: fm-jackel-monte-carlo
  title: Correlation hides joint crashes; copulas show them
  chapter: Ch. 5, Correlation and co-movement
  text: Linear correlation can be zero for strongly dependent variables and misses joint extremes; a t-copula adds joint large
    moves of the same sign and a Clayton copula makes assets crash together. Because correlation cannot be hedged, the co-dependence
    assumption has to be guessed carefully.
  tags:
  - sizing
  - breadth
- id: book.fm-jackel-monte-carlo.4
  book: fm-jackel-monte-carlo
  title: Correlation matrices from gappy data are often invalid
  chapter: Ch. 6, Salvaging a linear correlation matrix
  text: Correlation matrices estimated from data with asynchronous gaps, or edited by hand for a stress test, often become
    invalid; lowering one entry of a 3x3 index matrix from 0.4 to 0.3 broke it. The fix is to set negative eigenvalues to
    zero and rescale each row to unit length, or to optimise angle coordinates for the best fit.
  tags:
  - sizing
- id: book.fm-jackel-monte-carlo.5
  book: fm-jackel-monte-carlo
  title: Every random number generator fails somewhere
  chapter: Ch. 7, Pseudo-random numbers; Ch. 14.7, Parallel computing
  text: Never trust an undocumented system generator; re-run an important result with a different generator method, not just
    a new seed. For parallel runs, giving each worker a different seed of a simple generator can produce overlapping streams;
    use non-overlapping offsets instead.
  tags:
  - ml
- id: book.fm-jackel-monte-carlo.6
  book: fm-jackel-monte-carlo
  title: Box-Muller normals can lose the tails
  chapter: Ch. 9.3, Normal variates (the Neave effect)
  text: Box-Muller normals built from a simple multiplicative generator never go below about -4.48 over the generator's whole
    cycle, although about 8,157 such draws are expected, and the tails show artefacts; since finance cares most about tails,
    draw normals by inverting the normal distribution instead.
  tags:
  - sizing
- id: book.fm-jackel-monte-carlo.7
  book: fm-jackel-monte-carlo
  title: Fit a decision rule on training paths, score it on fresh ones
  chapter: Ch. 12.8-12.9, Bermudan swaption exercise boundary
  text: A decision rule optimised on a set of simulated paths looks better on those paths than it is, so the rule is fitted
    on a training set and then re-priced on a fresh, independent set about twice as large. Its Bermudan example gave 5.062%
    to 5.069% against a tree benchmark of 5.084%.
  tags:
  - ml
- id: book.fm-jackel-monte-carlo.8
  book: fm-jackel-monte-carlo
  title: Greeks of knock-out or stop-type payoffs need special methods
  chapter: Ch. 11, Greeks
  text: For payoffs with kinks or knock-outs, bump-and-reprice Gamma by simulation is virtually unusable; building only the
    paths that survive and end in the money (importance sampling) or weighting payoffs by a likelihood ratio gives stable
    Delta, Gamma and Vega, and the two can be combined.
  tags:
  - stop
  - iv
- id: book.fm-jackel-monte-carlo.9
  book: fm-jackel-monte-carlo
  title: A simulated number is only statistically right
  chapter: Ch. 2.7 and Ch. 14.4, error estimation and convergence diagrams
  text: 'A Monte Carlo estimate carries a statistical error only: roughly one run in three lands outside one standard error
    of the truth. Return a convergence diagram (the running estimate against the number of samples) and the run time with
    every result, not a single number.'
  tags:
  - ml
- id: book.fm-jackel-monte-carlo.10
  book: fm-jackel-monte-carlo
  title: Build simulated paths end-point first
  chapter: Ch. 10.8, Path construction
  text: 'Building a simulated path end-point first and then filling midpoints (a Brownian bridge) lets the first few random
    numbers fix most of its shape: for a 12-step path the first 4 explain 93.2% of the variability, against 53.9% when built
    step by step, which is what makes Sobol'' numbers converge fast.'
  tags:
  - ml
- id: book.fm-chan-quantitative-trading.1
  book: fm-chan-quantitative-trading
  title: Sharpe rules of thumb
  chapter: Ch. 2, How does it compare with a benchmark
  text: A Sharpe ratio below 1 does not make a stand-alone strategy; one profitable almost every month has a Sharpe above
    2, and one profitable almost every day above 3. Judge a strategy by its Sharpe and its drawdown (depth and duration),
    not by its raw return.
  tags:
  - sizing
- id: book.fm-chan-quantitative-trading.2
  book: fm-chan-quantitative-trading
  title: One tick of cost can erase a reversal edge
  chapter: Ch. 2, How will transaction costs affect the strategy
  text: 'On E-mini S&P 5-minute bars, fading moves beyond 2 moving standard deviations and exiting back inside 1 had a Sharpe
    of about 3 before costs and about -3 after a 1 bp cost per trade: a fine-grained reversal edge can be smaller than the
    cost of trading it.'
  tags:
  - costs
  - reversal
  - scalp
  verdict: negative
  tested_src: research/HUNT_F1_FACTORY.md
  tested_text: Our F1 screen found chart indicators on the indices lean only to a small 15-minute reversal (IC ~ -0.05) that
    is gone by 60 minutes, and 0 of 20 indicator rules pass after costs.
- id: book.fm-chan-quantitative-trading.3
  book: fm-chan-quantitative-trading
  title: Few parameters, enough data, rolling optimisation
  chapter: Ch. 3, Data-snooping bias
  text: Use at most five free parameters and at least 252 observations per parameter (a 3-parameter daily model needs 3 years
    of data). Optimise only in a backward-looking rolling window, and prefer averaging over several nearby parameter sets
    to picking the single best.
  tags:
  - ml
  - filter
- id: book.fm-chan-quantitative-trading.4
  book: fm-chan-quantitative-trading
  title: The truncation test for look-ahead
  chapter: Ch. 3, Look-ahead bias
  text: Rerun the backtest with the last 10-100 days of data removed; if any position before the cut changes, the program
    is using future data. Signals should be computed only from data lagged to the previous bar.
  tags:
  - filter
- id: book.fm-chan-quantitative-trading.5
  book: fm-chan-quantitative-trading
  title: Kelly leverage, and why traders halve it
  chapter: Ch. 6, Optimal capital allocation and leverage
  text: The leverage that maximises long-run growth is the mean excess return divided by its variance, and the best growth
    rate rises with the Sharpe ratio squared. Traders use half of it (half-Kelly) because the estimates are noisy and returns
    have fat tails, and size must be cut after every loss.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: 'Our H15 sized Liquidity 15+5 at half-Kelly from Rs 1 lakh: it grew to Rs 7.41 L in the holdout but with a
    -44% drawdown, and the Kelly fraction was unstable (BN 1.29 vs 0.48 and 0.14 on other windows).'
- id: book.fm-chan-quantitative-trading.6
  book: fm-chan-quantitative-trading
  title: Cap leverage by the worst day in history
  chapter: Ch. 6, Risk management
  text: Cap leverage at the largest one-period loss you can bear divided by the worst historical one-period loss, and use
    the smaller of that and half-Kelly. With the S&P 500's -20.47% day in 1987, even half-Kelly (1.26) was too much for someone
    who can stand a 20% one-day loss.
  tags:
  - sizing
  - gap
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: drawdown -Rs 180,429 vs -Rs 444,695 on the arms.
    It did not pass the gates.'
- id: book.fm-chan-quantitative-trading.7
  book: fm-chan-quantitative-trading
  title: Gold vs gold-miners pair, z-score and half-life
  chapter: Ch. 3 Example 3.6; Ch. 7 Examples 7.2 and 7.5
  text: 'Gold ETF vs gold-miners ETF: hedge ratio from a regression on 252 training days, buy the spread at z <= -2, sell
    it at z >= +2, exit at |z| <= 1. Sharpe 2.3 in training and 1.5 in the test, before costs; the spread''s reversion half-life
    was about 10 days.'
  tags:
  - reversal
  - swing
  inst:
  - GOLD
  - SILVER
  verdict: negative
  tested_src: research/HUNT_R94_MCX_ADVANCED.md
  tested_text: 'Our R94 traded the GOLD/SILVER log-ratio z-score on MCX proxies: it lost in design and holdout, and of 68
    design W60 trades only 14 reverted to z = 0.'
- id: book.fm-chan-quantitative-trading.8
  book: fm-chan-quantitative-trading
  title: Cointegration is not correlation
  chapter: Ch. 7, Stationarity and cointegration
  text: Coca-Cola and Pepsi daily returns correlate at 0.4849, yet their prices are not cointegrated (test t -2.14), while
    the gold and gold-miners ETFs are (t -3.357). Test that a spread is stationary before trading its reversion; correlation
    alone says nothing about prices drifting apart.
  tags:
  - reversal
  - filter
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: MCXD 2 trades, win 0%, net -Rs 16,836 in design.
    It did not pass the gates.'
- id: book.fm-chan-quantitative-trading.9
  book: fm-chan-quantitative-trading
  title: Stops belong to momentum trades
  chapter: Ch. 6 sidebar on stop loss; Ch. 7, What is your exit strategy
  text: 'Stops suit momentum trades, not mean-reversion trades: a reversion signal only strengthens as the loss grows, and
    no stop prevents a gap loss. Moves driven by news tend to trend; sharp moves with no news are usually liquidity events
    that revert.'
  tags:
  - stop
  - reversal
  - momentum
  - news
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: CRY 0 trades, win -, net Rs 0 in design. It
    did not pass the gates.'
- id: book.fm-chan-quantitative-trading.10
  book: fm-chan-quantitative-trading
  title: 'Energy seasonals: natural gas and gasoline in spring'
  chapter: Ch. 7, Seasonal trading strategies
  text: Buying the NYMEX June natural-gas future at the 25 February close and selling on 15 April was profitable 14 years
    running (1995-2008), and a mid-April gasoline trade in every year since 1995 too. The author warns that one trade a year
    invites data snooping and that gas is violent.
  tags:
  - mcx
  - swing
  inst:
  - NATURALGAS
  verdict: negative
  tested_src: research/HUNT_R83_MCX_ENERGY.md
  tested_text: 'Our R83 traded natural-gas month-of-year seasonality on MCX NATGASMINI: 14 trades, -37,413, worse than simply
    staying short (+14,687).'
- id: book.fm-ross-math-finance.1
  book: fm-ross-math-finance
  title: 'Arbitrage theorem: fair odds or a sure win'
  chapter: Ch. 6.1, The Arbitrage Theorem
  text: For any set of bets, either some probabilities make every bet fair or a combination wins in every outcome; it is a
    linear-programming check. Odds of 1, 2 and 3 to 1 against three outcomes give a sum of 1/(1+odds) of 1.083, above 1, so
    betting against all three wins whatever happens.
  tags:
  - filter
- id: book.fm-ross-math-finance.2
  book: fm-ross-math-finance
  title: Put-call parity and forwards by arbitrage
  chapter: Ch. 5.2, Other Examples of Pricing via Arbitrage
  text: Spot plus put minus call must equal the present value of the strike, or a conversion or reversal locks in a profit.
    Commodity futures need not equal spot grown at interest, because of storage, insurance and the inability to deliver short.
  tags:
  - filter
  - mcx
- id: book.fm-ross-math-finance.3
  book: fm-ross-math-finance
  title: Model price is not a sure win
  chapter: Ch. 7.5.1, When the Option Cost Differs from the Black-Scholes Formula
  text: 'Buying options below the Black-Scholes value and selling the underlying (or the reverse) is probably not a sure win:
    continuous re-hedging is impossible, hedging costs can exceed the gap, volatility can change and the model is only approximate.'
  tags:
  - iv
  - costs
- id: book.fm-ross-math-finance.4
  book: fm-ross-math-finance
  title: 'Skew: low strikes carry higher IV'
  chapter: Ch. 7.5.1, implied volatility
  text: Different strikes and expiries give different implied volatilities; in-the-money (low-strike) calls tend to show higher
    IV than out-of-the-money calls. The suggested reason is that the market expects volatility to fall after prices rise.
  tags:
  - iv
- id: book.fm-ross-math-finance.5
  book: fm-ross-math-finance
  title: Log utility gives Kelly sizing
  chapter: Ch. 8.2, Valuing Investments by Expected Utility
  text: 'Log utility means staking 2p - 1 of capital on an even-money bet won with probability p: .6 gives 20%, .7 gives 40%.
    A delayed payoff with a bank rate of .05 cuts the .6 case to about 15.8%.'
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: Our H15 found half-Kelly carried a 63% chance of a 30% drawdown and the Kelly fraction ranged from 1.29 to
    0.14 across windows.
- id: book.fm-ross-math-finance.6
  book: fm-ross-math-finance
  title: Crude oil days depend on the day before
  chapter: Ch. 10.2, Crude Oil Data
  text: In NYMEX crude 1995-97, a daily drop of more than 1% was followed by another such drop 31% of the time, against 15%
    after a small rise; a chi-square test rejected independence at p .00526, so crude did not follow geometric Brownian motion.
  tags:
  - mcx
  - momentum
  - reversal
  inst:
  - CRUDE
- id: book.fm-ross-math-finance.7
  book: fm-ross-math-finance
  title: Crude volatility depends on yesterday's move
  chapter: Ch. 10.2-10.3, Models for the Crude Oil Data
  text: Next-day standard deviation of crude's log change was .0194 after a big drop and .0208 after a big rise, against .0165
    after a small rise; the book prices options with a volatility that depends on the last day's move.
  tags:
  - mcx
  - iv
  inst:
  - CRUDE
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: MCXD 1166 trades, win 44%, net -Rs 161,038 in
    design. It did not pass the gates.'
- id: book.fm-ross-math-finance.8
  book: fm-ross-math-finance
  title: AR(1) mean reversion halves option value
  chapter: Ch. 11.2-11.3, Autoregressive Models and Mean Reversion
  text: An AR(1) fit on crude log prices gave b .9838 and a reversion level of 20.44; a 50-day call struck at 21 was worth
    44.42 cents under AR(1) against 79 cents under Black-Scholes, because mean reversion roughly halves horizon variance.
  tags:
  - mcx
  - reversal
  - iv
  inst:
  - CRUDE
  verdict: weak
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: MCXD 1 trades, win 100%, net Rs 4,554 in design;
    DLY 0 trades, win -, net Rs 0 in design. It did not pass the gates.'
- id: book.fm-ross-math-finance.9
  book: fm-ross-math-finance
  title: Stock plus short calls when your drift view differs
  chapter: Ch. 8.5, Mean Variance Analysis of Risk-Neutral-Priced Call Options
  text: If your drift estimate exceeds the risk-neutral drift, fairly priced stock and calls both have positive expected gain;
    buying 2.93 shares and selling 1.34 calls (about .46 calls per share) minimised risk for a target gain, versus an sd of
    15.56 for stock alone.
  tags:
  - option-selling
  - direction
  - sizing
- id: book.fm-karatzas-shreve.1
  book: fm-karatzas-shreve
  title: Doubling after losses needs unlimited credit
  chapter: Ch. 1.2, Example 2.3 (doubling strategy)
  text: Doubling the bet after every loss wins for sure only for someone who can carry unlimited losses; in continuous time
    it can even be done on a finite horizon, so sound models must allow only strategies whose losses are bounded below.
  tags:
  - sizing
  - stop
- id: book.fm-karatzas-shreve.2
  book: fm-karatzas-shreve
  title: Option value ignores the expected return
  chapter: Ch. 2.4, European options with constant coefficients
  text: The fair price and hedge of a European option depend on the interest rate, dividend yield and volatility, not on the
    underlying's mean return, which the authors call convenient because the mean return is hard to estimate.
  tags:
  - iv
  - direction
- id: book.fm-karatzas-shreve.3
  book: fm-karatzas-shreve
  title: Growth-optimal (Kelly-type) portfolio
  chapter: Ch. 3.10, Maximization of the growth rate of wealth
  text: The log-utility portfolio (fraction = excess mean return over variance for one asset) does not depend on the horizon
    and maximises the realised long-run growth rate almost surely; the authors add the Merton-Samuelson warning that it is
    not the best choice for other goals at a finite horizon.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: Our h15 found half-Kelly sizing on Liquidity 15+5 grew fastest but had P(drawdown ≥ 30%) of 63%, and the Kelly
    fraction was unstable (0.48 and 0.14 on other windows against 1.29).
- id: book.fm-karatzas-shreve.4
  book: fm-karatzas-shreve
  title: Size only the cushion above a floor
  chapter: Ch. 3.7, Examples 7.5 and 7.9 (portfolio insurance)
  text: When wealth must never fall below a floor, the optimal plan keeps the present value of the floor in cash and invests
    only the excess as a growth-optimal investor would, so the risky amount shrinks to zero as wealth nears the floor.
  tags:
  - sizing
  - stop
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: drawdown -Rs 459,933 vs -Rs 444,695 on the arms.
    It did not pass the gates.'
- id: book.fm-karatzas-shreve.5
  book: fm-karatzas-shreve
  title: Constraints clip the Kelly fraction
  chapter: Ch. 6.4 Example 4.2; Ch. 6.8 Example 8.5
  text: Under no-short-selling or borrowing limits the log-optimal fraction is the unconstrained one moved to the nearest
    allowed value; if borrowing costs more than lending, there is a wide band where the best choice is exactly fully invested,
    neither borrowing nor holding cash.
  tags:
  - sizing
- id: book.fm-karatzas-shreve.6
  book: fm-karatzas-shreve
  title: Constrained sellers cannot hedge cheaply
  chapter: Ch. 5.7, Examples 7.3-7.4 (upper hedging price)
  text: With leverage or short-sale limits a short call may be impossible to hedge for sure at any price, or only by holding
    the stock (covered call), and a short put without short selling is surely hedged only by holding the strike in cash; arbitrage
    then gives a price band, not one price.
  tags:
  - option-selling
- id: book.fm-karatzas-shreve.7
  book: fm-karatzas-shreve
  title: Costs wreck continuous hedging
  chapter: Ch. 2.8 and 3.11, Notes (transaction costs)
  text: With proportional costs the cheapest sure hedge of a short call is to buy and hold the share; practical answers are
    discrete hedging with an adjusted volatility (Leland) or a no-trade band around the target, and optimal portfolios are
    very sensitive to costs.
  tags:
  - costs
  - option-selling
- id: book.fm-karatzas-shreve.8
  book: fm-karatzas-shreve
  title: Chasing a target with too little capital
  chapter: Ch. 1.8 and 3.11, Notes (goal problems)
  text: When capital is below what a sure hedge of a target costs, one can at best maximise the probability of reaching it
    by a date; the authors cite this as a separate control problem rather than solving it.
  tags:
  - sizing
