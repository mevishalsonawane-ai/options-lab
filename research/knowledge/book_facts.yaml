- id: book.fm-baxter-financial-calculus.8
  book: fm-baxter-financial-calculus
  title: 'Mean reversion: the distribution settles, the path does not'
  chapter: Ch. 5.4, Vasicek / Ornstein-Uhlenbeck
  text: In a mean-reverting (Ornstein-Uhlenbeck) process the pull toward the long-run level is proportional to the distance
    from it; its distribution settles to a fixed normal, but the path itself never settles, and mean reversion seen in data
