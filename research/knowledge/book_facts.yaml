  book: fm-fabozzi-modelling
  title: Pairs that test cointegrated are often chance
  chapter: Ch. 18, Spurious cointegration
  text: Among independent random walks a few percent of pairs pass a cointegration test; with many pairs, ask whether the
    count beats chance and correct for all pairs tried. Cointegration found in markets is largely unstable.
