  book: ozenbas-liquidity-markets
  title: Illiquid prices lag and jump
  chapter: Ch. 3.5, Information shocks
  text: On 4 Jan 2019 Microsoft traded 2,520 times between 9:30 and 11:15 and moved smoothly with the news, while a small
    bank stock traded 25 times, lagged the index and jumped to catch up. Thin markets give noisier, staler price signals and
    more bid-ask bounce.
