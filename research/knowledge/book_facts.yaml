  - sizing
- id: book.fm-shaw-mathematica.1
  book: fm-shaw-mathematica
  title: Distrust implied vol where vega is near zero
  chapter: Ch. 1, 5 and 8, implied volatility case studies
  text: An implied volatility only means something when the price rises clearly with volatility; where vega is near zero the
    inversion is unstable or has two, three or infinitely many answers, and the number should not be reported.
  tags:
  - iv
- id: book.fm-shaw-mathematica.2
  book: fm-shaw-mathematica
  title: Near-expiry ATM gamma becomes unhedgeable
  chapter: Ch. 6, binary options, the hedge nightmare
  text: As expiry nears, a binary option's delta collapses into a spike at the strike and its gamma into the slope of that
    spike, so hedging near the money near expiry means huge repeated trades that costs make ruinous.
  tags:
  - expiry
  - theta
- id: book.fm-shaw-mathematica.3
  book: fm-shaw-mathematica
  title: A tiny price error can hide a huge Greek error
  chapter: Ch. 13 and 15, finite differences with option payoffs
  text: A Crank-Nicolson grid with large time steps priced a put within 0.00171 everywhere yet got gamma wrong by 12.4% and
    theta by 197% at the strike; numerically computed Greeks must be checked on their own, near the strike and near expiry.
  tags:
