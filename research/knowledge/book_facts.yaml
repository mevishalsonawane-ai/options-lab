- id: book.aziz-advanced-day-trading.15
  book: aziz-advanced-day-trading
  title: Level 2 read backwards
  chapter: Ch. 5, Understanding Nasdaq Level 2 Signals
  text: A big bid near the inside market is read as bearish (a patient buyer expecting lower prices) and a big ask as bullish;
    large orders far from the inside are fake and ignored, and Level 2 is never traded alone.
  tags:
  - order-flow
  - big-players
  - traps
- id: book.douglas-trading-in-the-zone.1
  book: douglas-trading-in-the-zone
  title: Five truths of thinking in probabilities
  chapter: Ch. 7, Eliminating the Emotional Risk
  text: Anything can happen; you do not need to know what happens next to make money; wins and losses are randomly distributed
    for any edge; an edge is only a higher probability; every moment is unique. The book offers no system of its own and assumes
    the reader already has a real edge.
  tags:
  - direction
- id: book.douglas-trading-in-the-zone.2
  book: douglas-trading-in-the-zone
  title: 'Be the casino: judge a series, not a trade'
  chapter: Ch. 7, Probabilities Paradox
  text: A casino cannot predict any hand yet keeps about 4.5 percent of what is wagered over many hands; a trader with an
    edge should likewise accept that each trade is uncertain while a long series is predictable.
  tags:
  - direction
  - sizing
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: drawdown -Rs 364,101 vs -Rs 444,695 on the arms.
