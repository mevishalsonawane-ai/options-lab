  book: fm-lyuu-fin-engineering
  title: A delta-hedged written option is not free money
  chapter: Ch. 16.3, Hedging and options (Exercise 16.3.3)
  text: In a worked weekly delta hedge of written calls the hedge was not self-financing ($171,622 tracking error after the
    first week, $1,757 once gamma was also hedged); a hedged seller buys after rises and sells after falls, so the premium
    is the reserve that pays these hedging losses.
  tags:
