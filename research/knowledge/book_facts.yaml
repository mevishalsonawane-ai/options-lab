- id: book.swing-practical-guide.12
  book: swing-practical-guide
  title: Up / Down / In / Out bars
  chapter: Ch. 8.10, Up/Down/In/Out
  text: 'Each bar is labelled by its high and low against the previous bar: Up (higher high and higher low), Down (lower high
    and lower low), In (inside bar) or Out (outside bar). It is a chart colouring; no trading rule is attached.'
