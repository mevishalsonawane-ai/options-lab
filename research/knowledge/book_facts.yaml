  book: douglas-trading-in-the-zone
  title: Anything can happen at a level
  chapter: Ch. 6, The Market's Most Fundamental Characteristic
  text: 'One large trader can break any support: a chairman sold two million bushels at market and soybeans fell through the
    analyst''s ''low of the day'' at once.'
  tags:
