- id: book.fm-intro-quant-finance.2
  book: fm-intro-quant-finance
  title: Rare-event Monte Carlo needs huge samples
  chapter: Ch. 8.8.1, Tail events
  text: Counting simulated losses beyond a level pins a 10% tail to within its own size only after about 13,830 runs, and
    a 1% tail after about 15.2 million; a cheaper route simulates to a threshold exceeded 10-20% of the time and bounds the
    rest with a one-sided Chebyshev inequality.
  tags:
