- id: book.ozenbas-liquidity-markets.9
  book: ozenbas-liquidity-markets
  title: Intraday patterns exist but keep shifting
  chapter: Ch. 2.11 and 3.7, Market efficiency
  text: 'Intraday data rejects the pure random walk: short-term positive and negative correlations exist, but they shift and
