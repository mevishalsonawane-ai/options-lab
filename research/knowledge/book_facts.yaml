- id: book.sadowski-9-strategies.8
  book: sadowski-9-strategies
  title: NR4 / NR7 narrow-range breakout
  chapter: Strategy 8, Narrow range
  text: Mark the narrowest daily candle of the last 4 or 7 days. Buy a move above its high or sell a move below its low, with
    the stop at the other end of the candle, then trail it. Two or more narrow candles in a row are said to precede a bigger
    break.
