- id: book.douglas-trading-in-the-zone.14
  book: douglas-trading-in-the-zone
  title: Rigid rules, flexible expectations
  chapter: Ch. 7, Managing Expectations
  text: The trader must be rigid in rules and flexible in expectations; the market has no built-in endings, so the structure
    (stops, limits, when to stop) must come from the trader, which is the case for hard locks and a kill switch.
  tags:
  - stop
  - filter
