- id: book.fm-structured-finance.3
  book: fm-structured-finance
  title: High-low volatility estimators assume no gaps
  chapter: Ch. 3.4.3, realized volatility
  text: Range estimators such as Parkinson's high-low measure use more of each bar than close-to-close volatility, but they
    assume a continuous price path; sampling at very high frequency instead adds bid-ask and stale-constituent noise.
