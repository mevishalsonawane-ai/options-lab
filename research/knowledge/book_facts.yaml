- id: book.aziz-advanced-day-trading.9
  book: aziz-advanced-day-trading
  title: Partial profit, then break-even stop
  chapter: Ch. 5, Trade Management
  text: Take 1/4 or 1/2 of the position at each target, move the stop to break-even after the first partial, and never let
    a winner turn into a loss.
