- id: book.fm-baxter-financial-calculus.7
  book: fm-baxter-financial-calculus
  title: A fair game cannot be beaten
  chapter: Ch. 6.6, Harrison and Pliska
  text: A market has no arbitrage exactly when some pricing measure makes every discounted price a martingale, a fair game;
