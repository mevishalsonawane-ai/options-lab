- id: book.heitkoetter-day-trading.10
  book: heitkoetter-day-trading
  title: Reverse a losing system
  chapter: Step 6, Total (Net) Profit
  text: Because trading is a zero-sum game, a system that loses can often be turned into a winner by reversing its entry signals.
