  book: fm-kabanov-stochastic-calculus
  title: Tail dependence can be an artefact of uncleaned data
  chapter: Paper 4, Bingham and Schmidt, section 4.4
  text: The chance of two stocks crashing together (lower tail dependence) was 0.15 on raw returns, 0.1 after time-of-day
