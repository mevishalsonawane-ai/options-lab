- id: book.fm-wilmott-howison-dewynne.9
  book: fm-wilmott-howison-dewynne
  title: Gearing cuts both ways
  chapter: Ch. 1.2 and 1.4, What is an option?
  text: 'In the book''s example a 10p call on a 250p strike made +100% or -100% where the share made +8% or -8%: options expose
    a small stake to a large amount of risk.'
