- id: book.fm-wilmott-howison-dewynne.2
  book: fm-wilmott-howison-dewynne
  title: 'Implied volatility differs by strike: the smile'
  chapter: Ch. 3.10, Implied volatility
  text: 'Implied volatility is not one number: it varies with strike (a smile or lopsided skew on FT-SE index options) and
    with expiry, and calls and puts give slightly different values. The authors offer one trade on it: buy the lowest-IV option
