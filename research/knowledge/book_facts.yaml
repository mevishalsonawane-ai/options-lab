- id: book.fm-fabozzi-modelling.8
  book: fm-fabozzi-modelling
  title: 'Classic technical rules: forecastable but not clearly profitable'
  chapter: Ch. 19, Technical analysis and statistical pattern recognition
  text: Filter rules, moving-average bands around a 200-day average, the advance/decline line and relative strength show some
    forecastability in academic tests, but profitability after costs is unclear. Test them only with real costs and a random-entry
    baseline.
