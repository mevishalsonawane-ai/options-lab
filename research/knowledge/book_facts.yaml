  book: fm-lyuu-fin-engineering
  title: Diversification stops at the average covariance
  chapter: Ch. 31.1, Mean-variance analysis of risk and return
  text: With equal weights and a common correlation z, portfolio variance is z s^2 + (1 - z) s^2 / n, so adding more correlated
    positions cannot push risk below the average covariance; only uncorrelated risks diversify away.
  tags:
  - sizing
  - breadth
- id: book.fm-lyuu-fin-engineering.8
  book: fm-lyuu-fin-engineering
  title: Normal VaR misses fat tails; add stress tests
  chapter: Ch. 31.4, Value at risk
  text: Normal-distribution VaR uses 2.326 standard deviations for 99% and 1.645 for 95%, scaled by the square root of days,
    but returns have fat tails on both sides at daily and monthly horizons, so VaR is not sufficient and stress tests of extreme
    moves are needed.
