  book: fm-wilmott-howison-dewynne
  title: Interest rates barely move short-dated options
  chapter: Ch. 1.7, Interest rates and present value
  text: A rise in rates from 8% to 10% a year lowers a nine-month option's value by only about 2%, which is why a known or
    constant rate is acceptable when pricing short-dated options.
