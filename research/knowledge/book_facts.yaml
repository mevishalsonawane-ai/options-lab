- id: book.fm-wilmott-howison-dewynne.3
  book: fm-wilmott-howison-dewynne
  title: Near expiry, at-the-money hedges flip
  chapter: Ch. 3.8 and 5.5, Black-Scholes formulae; Binary options
  text: As expiry nears, a call's delta becomes a step; with the index near the strike a hedged writer swings between holding
    nothing and holding the full hedge many times, paying costs each time. For a cash-or-nothing binary the delta spikes so
    sharply that the authors doubt the simple formula is usable.
  tags:
  - expiry
  - iv
  - costs
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-wilmott-howison-dewynne.4
  book: fm-wilmott-howison-dewynne
  title: A trailing stop, priced, is worth exactly the asset
  chapter: Ch. 15.6.2, The stop-loss option
  text: A perpetual contract that pays the asset price once it falls to a set fraction of its running maximum (a trailing
    stop as a contract) is worth exactly the asset price when there is no dividend, whatever the fraction. A trail adds no
    value by itself; any gain must come from a real pattern in the path.
