  tags:
  - stop
  - target
- id: book.ozenbas-liquidity-markets.1
  book: ozenbas-liquidity-markets
  title: Market order vs limit order
  chapter: Ch. 2.1, Order types
  text: A market order buys immediacy and pays the bid-ask spread; a limit order saves the spread but may never fill and can
    be picked off when news arrives before it is cancelled. Choosing between them is a strategic decision, not a habit.
  tags:
  - costs
  - liquidity
  verdict: weak
  tested_src: research/HUNT_H14.md
  tested_text: Our h14 found a marketable limit at the entry-bar price + 0.5%, resting 3 minutes and never chasing, was the
    only one of the 9 policies to pass every gate, adding +Rs 288/day against a required +250, but it was not robust at κ
    = 0.04.
- id: book.ozenbas-liquidity-markets.2
  book: ozenbas-liquidity-markets
  title: Three hidden costs of trading
  chapter: Ch. 2.2, Trading costs
  text: 'Besides commissions, fees and taxes, every trade carries implicit costs: the bid-ask spread, the opportunity cost
    of an unfilled order, and market impact. Implementation shortfall measures them as the fill price after charges minus
    the mid-quote at the moment of decision.'
  tags:
  - costs
- id: book.ozenbas-liquidity-markets.3
  book: ozenbas-liquidity-markets
  title: Walking the book
  chapter: Ch. 2.9.1, Continuous order-driven markets
  text: An order bigger than the size at the best price eats into worse prices. In the example, a 5000-share market buy against
    400 shares at the ask paid 2.12 cents a share more on average, an extra $106.
  tags:
  - costs
  - liquidity
- id: book.ozenbas-liquidity-markets.4
  book: ozenbas-liquidity-markets
  title: The pull of certainty keeps spreads wide
  chapter: Ch. 2.9.1
  text: Spreads stay wider than one tick because when one more tick buys a certain fill, traders prefer a market order to
    a limit order inside the spread. Empty price levels deeper in the book are air pockets that show a thin market.
  tags:
  - costs
  - liquidity
- id: book.ozenbas-liquidity-markets.5
  book: ozenbas-liquidity-markets
  title: How a call auction sets the price
  chapter: Ch. 2.8 and 2.9.2, Call auctions
  text: A call auction batches orders and executes them all at one clearing price, the price that maximises the shares traded;
    orders better than that price get price improvement. Batching concentrates liquidity, lowers volatility and cost, and
    is why exchanges open and close with calls, but it gives no immediacy.
  tags:
  - liquidity
  - time-of-day
- id: book.ozenbas-liquidity-markets.6
  book: ozenbas-liquidity-markets
  title: The open is a price-discovery period
  chapter: Ch. 2.6, Intraday price volatility
  text: For S&P 500 stocks in 2019, opening-half-hour variance scaled to a full day was 4.36 times the daily variance and
    the closing half hour 1.82 times, where a frictionless market would give 1. Short-period volatility is accentuated by
    friction, most of all after the overnight close.
  tags:
  - time-of-day
  - liquidity
- id: book.ozenbas-liquidity-markets.7
  book: ozenbas-liquidity-markets
  title: Liquidity shocks revert, news shocks stay
  chapter: Ch. 2.3, What drives trading
  text: A move caused by news shifts the equilibrium value and does not come back; a move caused by one trader's own cash
    needs or algorithm pushes the price away from equilibrium and tends to revert.
