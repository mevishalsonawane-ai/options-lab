- id: book.sadowski-9-strategies.10
  book: sadowski-9-strategies
  title: The 3 / 1000 money rule
  chapter: Closing section
  text: Never risk more than 3% of capital on one trade, and never more than one-thousandth of capital per point of price
    movement. The author blames most failures on untested strategies, poor discipline and missing stops.
  tags:
  - sizing
  - stop
- id: book.sadowski-9-strategies.11
  book: sadowski-9-strategies
  title: Accelerator Oscillator as a confirmation
  chapter: Strategy 3, Heikin-Ashi filters
  text: After a Heikin-Ashi reversal, wait for the Accelerator Oscillator to print a bar of the trade's colour on the right
    side of zero before entering. Also skip bank holidays, NFP, FOMC and central-bank speech days.
  tags:
  - filter
  - news
  - momentum
- id: book.sadowski-9-strategies.12
  book: sadowski-9-strategies
  title: Performance evidence is hand-picked
  chapter: Strategies 2-3
  text: 'The only results given are a few chart examples: the MA cross was right 6/12 or 50% of the time on one EURUSD chart,
    and three 2013 Heikin-Ashi trades made +300, +130 and +170 pips. There is no backtest, no costs and no losing sample.'
  tags:
  - costs
- id: book.heitkoetter-day-trading.1
  book: heitkoetter-day-trading
  title: How to draw an intraday trendline
  chapter: Step 3, Technical Indicators
  text: An uptrend line starts at the day's low and the first bar that fails to make a higher low; it may only become flatter,
    never steeper, must never cut through bars, and the trend counts as broken once the line would have to move far from the
    recent lows. Downtrend lines mirror this above the highs.
  tags:
  - trend
  - pattern
- id: book.heitkoetter-day-trading.2
  book: heitkoetter-day-trading
  title: Pick the tool for the regime
  chapter: Step 3, Popular Trading Approaches
  text: Markets trend about 30% of the time and range the rest, so a trader should call the regime first and use trend-following
    tools (moving averages, MACD, 20-bar breakout) in trends and fading tools (RSI, Williams %R, Bollinger) in ranges.
  tags:
  - trend
  - filter
