# What 13 trading books teach, as short cards for Jarvis (25 Oct 2026; research/books/, one write-up per book).
# Each card is the BOOK's claim in our own words, never a tested result: build_pack.py says so in every card's text.
# A card whose idea our research tested carries that test's result (verdict + tested_src + tested_text).
# Numbers in `text` are checked against the book's write-up, numbers in `tested_text` against the study.
books:
  wyckoff-day-traders-bible:
    author: Wyckoff
    title: The Day Trader's Bible
  woods-price-action:
    author: Galen Woods
    title: How to Trade Price Action
  carli-divergence:
    author: David Carli
    title: The Power of Divergence Trading
  trader-tom-first-manual:
    author: Trader Tom
    title: The First Trading Manual
  ozenbas-liquidity-markets:
    author: Ozenbas, Pagano, Schwartz and Weber
    title: Liquidity, Markets and Trading in Action
  advanced-trading-book:
    author: The Advanced Trading Book
    title: Advanced Trading Book / Simple Trading Book
  bennett-trading-volatility:
    author: Colin Bennett
    title: Trading Volatility
  sadowski-9-strategies:
    author: Roman Sadowski
    title: 9 Advanced and Profitable Trading Strategies
  heitkoetter-day-trading:
    author: Markus Heitkoetter
    title: A Complete Guide to Day Trading
  swing-practical-guide:
    author: Larry Swing
    title: A Practical Guide to Swing Trading
  smith-short-swing:
    author: David Graeme Smith
    title: Short Swing Trading
  advanced-trading-methods:
    author: The Advanced Trading Methods book
    title: The Advanced Trading Methods in the Financial Markets
  porwal-10-strategies:
    author: Nikhil Porwal
    title: 10 Most Profitable Trading Strategies
  aziz-advanced-day-trading:
    author: Andrew Aziz
    title: Advanced Techniques in Day Trading
  douglas-trading-in-the-zone:
    author: Mark Douglas
    title: Trading in the Zone
cards:
- id: book.wyckoff-day-traders-bible.1
  book: wyckoff-day-traders-bible
  title: 'Tape reading: which side the big lots hit'
  chapter: Ch. V, Volumes and Their Significance
  text: 'Tape reading weighs each print: when the large lots trade at the offer and only small lots at the bid, buyers are
    winning and the next move is more likely up; the reverse means sellers are in control.'
  tags:
  - order-flow
  - volume
  - big-players
  - direction
  verdict: weak
  tested_src: research/HUNT_R7_ORDER_FLOW.md
  tested_text: Our R7 found signed option flow does lead the index (IC +0.109 at 1 minute) but its edge is only 0.42x of an
    option trade's cost.
- id: book.wyckoff-day-traders-bible.2
  book: wyckoff-day-traders-bible
  title: Heavy volume in a narrow band warns of a top
  chapter: Ch. IV, V and X
  text: Very heavy volume packed into a narrow price band after a rise warns of distribution and a coming fall; one example
    counted some 80,000 shares within about half a point.
  tags:
  - volume
  - big-players
  - reversal
  verdict: negative
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: 'Our R87 tested heavy-activity narrow-range 5-minute NIFTY bars on an option-activity proxy, not true volume:
    up 51.5% of the time after them vs 51.5% for matched bars, n 2,266.'
- id: book.wyckoff-day-traders-bible.3
  book: wyckoff-day-traders-bible
  title: Volume on advances vs reactions
  chapter: Ch. V, IX and X
  text: In a genuine up move volume swells on the advances and dries up on the reactions; heavy volume on declines followed
    by sluggish, small-lot rallies signals liquidation.
  tags:
  - volume
  - trend
- id: book.wyckoff-day-traders-bible.4
  book: wyckoff-day-traders-bible
  title: The line of least resistance
  chapter: Ch. IV, Trading Rules
  text: 'Prices follow the line of least resistance: trade only with the immediate trend, never against it, and stay out of
    a market that swings within a couple of points without a trend.'
  tags:
  - trend
  - momentum
  - direction
  inst:
  - NIFTY
  verdict: negative
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: 'Our R102 found the next NIFTY 5-minute bar keeps the previous bar''s sign only 48.4% of the time (n 167,082):
    no usable continuation.'
- id: book.wyckoff-day-traders-bible.5
  book: wyckoff-day-traders-bible
  title: Follow a break the whole market joins
  chapter: Ch. V and VIII
  text: When price breaks out of a range it has been held in, go with it, especially if the rest of the market breaks with
    it; the resistance just overcome means little stands in the way.
  tags:
  - breadth
  - trend
  - momentum
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/HUNT_R72_CROSS_INDEX.md
  tested_text: Our R72 Breadth Donchian, a 20-bar break taken only when at least 4 of 5 indices break together, made Rs 1,71,366
    in the final window vs Rs 55,439 for plain Donchian.
- id: book.wyckoff-day-traders-bible.6
  book: wyckoff-day-traders-bible
  title: Trade the leader, not the laggards
  chapter: Ch. III, The Stock Lists and Groups
  text: Trade the leader of the strongest group rather than laggards; when a secondary stock suddenly leads a rally, the main
    leaders are often being sold under its cover.
  tags:
  - breadth
  - trend
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/HUNT_R72_CROSS_INDEX.md
  tested_text: 'Our R72 tested both timing ideas and both lost: following the leading index at 10:15 lost Rs 30,969 on 55
    trades and the laggard catch-up lost Rs 1,00,746 on 613.'
- id: book.wyckoff-day-traders-bible.7
  book: wyckoff-day-traders-bible
  title: The normal rally is half to two-thirds
  chapter: Ch. VI and IX
  text: A normal rally recovers one half to two thirds of the preceding decline; a rally that falls short says the decline
    is not over.
  tags:
  - reversal
  - gann-fib
  inst:
  - NIFTY
  verdict: negative
  tested_src: research/HUNT_R4_GANN_FIB_MAGIC.md
  tested_text: Our R4 found swing retracement levels turn NIFTY 49.0% of the time vs 49.1% for shifted levels over 25,000+
    touches.
- id: book.wyckoff-day-traders-bible.8
  book: wyckoff-day-traders-bible
  title: Stops at the point of resistance
  chapter: Ch. IV, Trading Rules
  text: Place the stop just beyond the last swing turning point, raise it under each new reaction low as the move extends,
    move it to cost once the trade is well ahead, and never widen the original risk.
  tags:
  - stop
  - profit-lock
  inst:
  - BANKNIFTY
  verdict: negative
  tested_src: research/HUNT_R19_LIQUIDITY_LOCK.md
  tested_text: 'Our R19 tested breakeven and give-back locks on the Liquidity BANKNIFTY arm: 0 of 12 passed, because they
    sell the few runners early.'
- id: book.wyckoff-day-traders-bible.9
  book: wyckoff-day-traders-bible
  title: Get out if it does not act right
  chapter: Ch. X, Various Examples
  text: Once in, a trade must act as expected at once; if it does not, close it immediately instead of hoping.
  tags:
  - stop
  - filter
  verdict: weak
  tested_src: research/HUNT_R12_TRADE_MANAGER.md
  tested_text: Our R12 'no progress' exit beat random exits on ORB Fresh (+Rs 14,365 over 474 holdout trades) but the arm
    still lost and it did not help the profitable arms.
- id: book.wyckoff-day-traders-bible.10
  book: wyckoff-day-traders-bible
  title: 'The invisible eighth: costs on every trade'
  chapter: Ch. IV, Trading Rules
  text: Commission plus the bid-ask spread (the invisible eighth) is paid on every trade, so each risk should promise 2 to
    5 points of profit; scalping fractions in a dull market does not pay.
  tags:
  - costs
  - scalp
- id: book.wyckoff-day-traders-bible.11
  book: wyckoff-day-traders-bible
  title: Small steady profits, compounded
  chapter: Ch. XI, Obstacles to be Overcome
  text: The aim is a small, steady average profit; a table turns 1/8 of a point a day and $1,000 of capital into $10,195.50
    net in 250 trading days by adding size as capital grows, an illustration rather than a record.
  tags:
  - sizing
- id: book.wyckoff-day-traders-bible.12
  book: wyckoff-day-traders-bible
  title: Shakeouts during accumulation
  chapter: Ch. VII, Dull Markets
  text: When insiders shake holders out of a stock during accumulation they want the stock themselves, and that is a good
    time to buy.
  tags:
  - traps
  - big-players
  - reversal
  inst:
  - NIFTY
  verdict: weak
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: Our R87 found NIFTY 1-minute pokes below the day's low that close back bounce a little out of sample (n 1,702),
    worth less than an option round trip.
- id: book.wyckoff-day-traders-bible.13
  book: wyckoff-day-traders-bible
  title: Overtrading ruins; cut size after losses
  chapter: Ch. II, IV and XI
  text: Overtrading is behind about 90% of stock market disasters; after a run of losses cut size to a half or a quarter,
    and act only on the choicest setups.
  tags:
  - sizing
- id: book.wyckoff-day-traders-bible.14
  book: wyckoff-day-traders-bible
  title: Dull markets come before big swings
  chapter: Ch. VII, Dull Markets and Their Opportunities
  text: Dull, narrow markets come after a big move has spent its force, and a pronounced swing follows; watch them for the
    breakout instead of ignoring them.
  tags:
  - trend
  - filter
- id: book.wyckoff-day-traders-bible.15
  book: wyckoff-day-traders-bible
  title: Flat at the close
  chapter: Ch. I and IX
  text: A pure tape reader ends each day flat because news can strike while the market is shut; any position carried overnight
    gets a stop.
  tags:
  - overnight
  - stop
- id: book.woods-price-action.1
  book: woods-price-action
  title: Market bias matters more than the pattern
  chapter: Ch. 7.1, Market Bias
  text: The trend or bias gives the edge, not the bar or candle pattern; a pattern only times the entry and gives a nearby
    stop. Its own example, chosen with hindsight, claims almost any pattern works once the bias is right.
  tags:
  - trend
  - direction
  - pattern
- id: book.woods-price-action.2
  book: woods-price-action
  title: 'Pin bar at support: buy above it'
  chapter: Ch. 4.4, Pin Bar
  text: A bar whose long lower tail fills most of its range, rejected from a support level, traps sellers; buy above its high
    with the stop at the tail's tip (mirror at resistance).
  tags:
  - candles
  - reversal
  - traps
  - stop
  verdict: negative
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: Our R87 found a big lower tail has no direction edge on NIFTY 15m (up 51% vs 52% matched, n 949), and its low
    is broken 59% of the time within 10 candles on NIFTY 5m (n 3,314).
- id: book.woods-price-action.3
  book: woods-price-action
  title: Three-bar pullback in a trend
  chapter: Ch. 4.7, Three-Bar Pullback
  text: In a bull trend, wait for three bearish bars in a row, then buy above the next bullish bar; the mirror in a bear trend.
    The idea is that counter-trend pullbacks are hard to sustain.
  tags:
  - trend
  - pattern
  - candles
  - reentry
  verdict: weak
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: Our nearest test (R87B, green-green-red on SENSEX 15m) held out of sample (n 182) but the call-buying rule
    lost Rs 21,127 on 162 trades because the stop under the red candle was too close.
- id: book.woods-price-action.4
  book: woods-price-action
  title: 'Inside bar: bracket, with-trend, or fade'
  chapter: Ch. 4.8, Inside Bar
  text: An inside bar is a pause; trade its breakout with buy and sell stop orders around it (one cancels the other), or take
    only the side that agrees with the trend, or wait for the breakout to fail and trade the other way.
  tags:
  - pattern
  - candles
  - filter
  verdict: negative
  tested_src: research/HUNT_R71_CHART_PATTERNS.md
  tested_text: 'Our R71 traded 15-minute inside-bar breaks on the index with options: -Rs 1,23,667 on 1,075 trades in the
    final period.'
- id: book.woods-price-action.5
  book: woods-price-action
  title: 'NR7: narrowest of 7 bars, break with the trend'
  chapter: Ch. 4.10, NR7
  text: When the last bar has the smallest range of 7, volatility has contracted and a bigger move may follow; buy a break
    of its high in an uptrend, sell a break of its low in a downtrend.
  tags:
  - pattern
  - filter
  - momentum
  verdict: negative
  tested_src: research/HUNT_R71_CHART_PATTERNS.md
  tested_text: 'Our R71 traded 15-minute NR7 breaks on the index with options: -Rs 1,68,820 on 1,341 trades in the final period.'
- id: book.woods-price-action.6
  book: woods-price-action
  title: Three-bar reversal
  chapter: Ch. 4.6, Three-Bar Reversal
  text: A bearish bar, then a bar with a lower high and lower low, then a bullish bar with a higher low closing above the
    second bar's high; buy above the third bar. The book calls it the most conservative reversal pattern.
  tags:
  - reversal
  - pattern
  - candles
  verdict: negative
  tested_src: research/HUNT_R71_CHART_PATTERNS.md
  tested_text: Our R71 three-bar reversal at the day's high or low beat random timing (twin p 0.002) but still lost -Rs 1,67,689
    on 855 trades after option costs in the final period.
- id: book.woods-price-action.7
  book: woods-price-action
  title: 'Hikkake: trade the failed inside-bar break'
  chapter: Ch. 5.10, Hikkake
  text: After an inside bar, if the next bar breaks one side and that break fails within three bars, trade the opposite way,
    because inside-bar breakout traders are trapped.
  tags:
  - traps
  - pattern
  - reversal
- id: book.woods-price-action.8
  book: woods-price-action
  title: Reversal candles need a trend to reverse
  chapter: Ch. 5, Candlestick Patterns
  text: Hammer, shooting star, morning star, doji and three white soldiers are read as reversals only after a real decline
    or rise; with no trend to reverse, a doji means stand aside. Most reversal chart patterns fail, especially in strong trends.
  tags:
  - candles
  - reversal
  - trend
  verdict: negative
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: 'Our R87 found reversal shapes mostly mark continuation: after a NIFTY 15m hammer the index fell a further
    0.47 ATR over 20 candles, and none of 4,049 shape x context cells passed.'
- id: book.woods-price-action.9
  book: woods-price-action
  title: 'Chart pattern targets: project the height'
  chapter: Ch. 6, Chart Patterns
  text: Head and shoulders, double and triple tops, rectangles, wedges and triangles are traded on the breakout (or its retest)
    with a target equal to the pattern's height projected from the break; a flag's target is the pole's height; volume should
    rise on the break.
  tags:
  - pattern
  - target
  - volume
  verdict: negative
  tested_src: research/HUNT_R71_CHART_PATTERNS.md
  tested_text: Our R71 double bottom / top on 5-minute index bars lost -Rs 12,091 on 502 trades in the final period, and the
    flag had only 32 trades.
- id: book.woods-price-action.10
  book: woods-price-action
  title: Stop at the pattern's far end
  chapter: Ch. 7.2-7.3, Setup and Exit
  text: 'The setup''s job is risk control: the stop goes at the lowest point of a bullish pattern (highest of a bearish one);
    targets are the nearest opposing support or resistance, or a measured move of 100% of the prior impulse.'
  tags:
  - stop
  - target
  verdict: negative
  tested_src: research/HUNT_R87_CANDLE_ANATOMY.md
  tested_text: 'In our R87B rule the stop under the signal candle''s low closed 117 of 162 trades: too close for an option
    buyer.'
- id: book.woods-price-action.11
  book: woods-price-action
  title: 'Support and resistance: swings, congestion, round numbers, Fibonacci'
  chapter: Ch. 8, Support and Resistance
  text: Levels come from major swing highs and lows, congestion areas, round numbers and 52-week highs/lows, moving averages
    and Fibonacci retracements (23.6, 38.2, 50, 61.8); broken support flips to resistance. Buy bullish signals at support,
    sell bearish ones at resistance.
  tags:
  - filter
  - gann-fib
  - reversal
  verdict: negative
  tested_src: research/HUNT_R20B_SR_RANGE.md
  tested_text: 'Our R20b found support/resistance levels no better than random lines: in 6 of the 7 variants random levels
    made more on average than the real ones.'
- id: book.woods-price-action.12
  book: woods-price-action
  title: Previous session high/low as day-trade levels
  chapter: Ch. 8.3, Trade Exits
  text: For day traders the previous session's high and low are important support and resistance, and the book uses the prior
    low as a profit target.
  tags:
  - target
  - filter
  verdict: negative
  tested_src: research/HUNT_R89_PDHL_BREAK.md
  tested_text: Our R89 previous-day high / low break rules passed 0 of 180 cells and lost in the holdout on every index.
- id: book.woods-price-action.13
  book: woods-price-action
  title: Higher-timeframe and structure bias filter
  chapter: Ch. 7.1, Market Bias
  text: Use a higher timeframe, higher highs and higher lows, trend lines and volume to decide the bias, and take only patterns
    in its direction.
  tags:
  - trend
  - filter
  - direction
  verdict: negative
  tested_src: research/HUNT_R89_PDHL_BREAK.md
  tested_text: In our R89 the daily + 15-minute trend filter did not cut false breaks (NIFTY 32% -> 39%) and lowered the win
    rate (NIFTY 36% -> 26%).
- id: book.woods-price-action.14
  book: woods-price-action
  title: 'Channels: trend, reversal, range, breakout'
  chapter: Ch. 9, Channels
  text: In a sloping channel buy pullbacks to the trend line and target the far line; fade overshoots only in steep channels
    against the higher-timeframe trend; in flat channels sell the top and buy the bottom; trust breakouts with volume and
    a wide bar. To avoid overtrading, trade only in the larger channel's direction.
  tags:
  - trend
  - momentum
  - reversal
- id: book.woods-price-action.15
  book: woods-price-action
  title: Label trades mechanical or discretionary before the exit
  chapter: Ch. 10, Trading Records
  text: Keep a real-time commentary written before outcomes are known, and tag each trade as following the rules or bending
    them before it closes; later compare the two groups to see whether discretion adds value.
  tags:
  - sizing
- id: book.carli-divergence.1
  book: carli-divergence
  title: Only regular divergence, only on the CCI
  chapter: Ch. 3-4, Commodity Channel Index / The Strategy
  text: 'Teaches one setup: regular divergence between price and the CCI (bullish = price lower low, CCI higher low; bearish
    = price higher high, CCI lower high). It does not teach hidden divergence or divergence on RSI, MACD or stochastic.'
  tags:
  - reversal
  - pattern
  verdict: negative
  tested_src: research/HUNT_R95_CCI_SIGNALS.md
  tested_text: 'Our R95 traded every confirmed CCI divergence on index options once it was known, 5 candles after the pivot:
    691 holdout trades lost Rs 37,156.'
- id: book.carli-divergence.2
  book: carli-divergence
  title: Three rules that qualify a CCI divergence
  chapter: Ch. 4, The Strategy
  text: A divergence counts only if the CCI's second extreme is beyond 150 (below -150 bullish, above +150 bearish), the CCI
    does not cross zero between the two extremes, and the second price extreme is a 1.13 to 1.618 extension of the last pullback;
    beyond 1.618 the setup is void. Small exceptions are allowed but not quantified.
  tags:
  - reversal
  - filter
  - gann-fib
- id: book.carli-divergence.3
  book: carli-divergence
  title: Divergence alone is not an entry
  chapter: Ch. 4, The Strategy
  text: A divergence can run on for days or weeks, so the trade waits for price to break a trendline drawn against the old
    move. Aggressive traders enter on the cross; cautious ones wait for a close beyond the line to dodge fakeouts.
  tags:
  - reversal
  - traps
- id: book.carli-divergence.4
  book: carli-divergence
  title: Stop just beyond the divergence extreme
  chapter: Ch. 4, The Strategy
  text: The stop goes 15-20 pips or ticks below the last low of a bullish divergence, or above the last high of a bearish
    one. On NSE indices that literal distance is about 1 point, so it means a tight stop just past the swing.
  tags:
  - stop
- id: book.carli-divergence.5
  book: carli-divergence
  title: Fibonacci targets with half off and break-even
  chapter: Ch. 4, The Strategy
  text: Half the position is closed at the 127.2% extension and the stop moved to break-even; the rest exits at 161.8%. The
    target is the one part the author says may be changed, as long as reward to risk is at least 1:1.
  tags:
  - target
  - profit-lock
  - gann-fib
  verdict: negative
  tested_src: research/HUNT_H37.md
  tested_text: Our h37 test used 127.2 / 161.8% extensions as targets on Fibonacci-bounce entries and they made those trades
    worse, Rs 182 and Rs 193 a trade net.
- id: book.carli-divergence.6
  book: carli-divergence
  title: CCI length 20 and the 150 zone, not the usual signals
  chapter: Ch. 3 and end of Ch. 4
  text: The author uses CCI length 20 (14 is fine too) and ignores the CCI's ordinary overbought / oversold signals, saying
    standard indicator use does not pay; he uses the +-150 zone only to qualify divergences.
  tags:
  - filter
  - reversal
  verdict: negative
  tested_src: research/HUNT_R95_CCI_SIGNALS.md
  tested_text: 'Our R95 tested the CCI''s own cross-back signals on 9 instruments and 4 timeframes: 0 of 288 fade cells pass,
    agreeing that the usual signals do not pay.'
- id: book.carli-divergence.7
  book: carli-divergence
  title: Daily charts, never below 4-hour
  chapter: Ch. 4 and Ch. 7
  text: The strategy is used mostly on daily charts, rarely on 4-hour, sometimes weekly, never lower; the author says a higher
    timeframe gives bigger and more reliable moves after the divergence.
  tags:
  - swing
  - overnight
- id: book.carli-divergence.8
  book: carli-divergence
  title: Charts flatter divergences
  chapter: Ch. 4 examples; Ch. 7
  text: The only evidence for the claimed high win rate is about 16 hand-picked example charts, nearly all winners, plus one
    stopped-out Amazon trade. No sample, period, costs or backtest is given.
  tags:
  - reversal
  - pattern
  verdict: negative
  tested_src: research/HUNT_R95_CCI_SIGNALS.md
  tested_text: In R95, divergences entered at the label candle showed +Rs 12,01,300 on 1,687 index trades, but entered when
    actually known they lost Rs 3,37,415 on 1,778.
- id: book.carli-divergence.9
  book: carli-divergence
  title: No trade in the direction of a fresh gap
  chapter: Ch. 2, Windows or Gaps
  text: 'Do not open a long right after a gap up or a short right after a gap down: a normal retracement can hit the stop.
    Gaps matter inside an established trend, little inside congestion; exhaustion gaps come with exceptionally high volume.'
  tags:
  - gap
  - filter
- id: book.carli-divergence.10
  book: carli-divergence
  title: Size every trade from the stop
  chapter: Ch. 6, Money Management
  text: Quantity = money at risk / distance from entry to stop, with money at risk a fixed sum or a percent of capital (examples
    0.5% and 0.75%). Oversized positions, not bad signals, cause most trading stress and blown accounts.
  tags:
  - sizing
  - stop
- id: book.carli-divergence.11
  book: carli-divergence
  title: Pullback retest confirms a breakout
  chapter: Ch. 2, Some Technical Analysis
  text: After a level breaks, old resistance becomes support; a pullback that retests it is said to confirm the breakout and
    raise the success rate, while a close back inside the level marks a fakeout.
  tags:
  - traps
  - reversal
- id: book.trader-tom-first-manual.1
  book: trader-tom-first-manual
  title: No gap or opening-range strategy in this book
  chapter: Whole book; engulfing section p. 98-102
  text: The manual teaches no gap-fill or opening-range rule. Gaps appear only inside the daily engulfing pattern, where a
    bar opens above the prior close and then closes below the prior candle's open, read as a reversal.
  tags:
  - gap
  - candles
  - reversal
  verdict: negative
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found a 2%-plus NIFTY gap closes on its own side 94-96% of the time and the pre-registered gap-fade
    rules did not pass.
- id: book.trader-tom-first-manual.2
  book: trader-tom-first-manual
  title: Busy first hours, quiet lunch
  chapter: The 24-Hour Trading Cycle
  text: The first 2-3 hours after the European open are the busy period with the best setups; after 11:00 London the market
    tends to range or drift until the US open, whose first few minutes are whippy.
  tags:
  - time-of-day
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
