- id: book.fm-musiela-martingale.2
  book: fm-musiela-martingale
  title: 'Options are leveraged bets: elasticity'
  chapter: Ch. 3.1.11, Option portfolios and Greeks
  text: 'An option''s elasticity (delta x spot / price) says how many percent it moves per 1% of the underlying: with spot
    31, strike 30, 3 months and 10% volatility the call costs 1.52 with delta 0.82 and moves nearly 17 times the stock''s
