  - profit-lock
  - stop
  verdict: negative
  tested_src: research/HUNT_R19B_LIQUIDITY_TRAIL.md
  tested_text: Our R19b found Boss's give-back trail on Liquidity BANKNIFTY did worse than random early exits in 97% (15m)
