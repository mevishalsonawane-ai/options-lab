  book: fm-capinski-math-finance
  title: Put-call parity and model-free bounds
  chapter: Ch. 7.2-7.5, Put-Call Parity and Bounds on Option Prices
  text: For European options call minus put equals spot minus the discounted strike (use the forward for an index); premiums
    must fall with strike for calls and rise for puts, a call spread is worth less than the discounted strike gap, a butterfly
    can never cost less than zero, and time value is largest at the money. A quote breaking these is either an arbitrage or
    a bad print.
