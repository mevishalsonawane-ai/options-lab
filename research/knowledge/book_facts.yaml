- id: book.douglas-trading-in-the-zone.12
  book: douglas-trading-in-the-zone
  title: Winning streaks breed oversized trades
  chapter: Ch. 3, Winners, Losers, Boomers and Busters
  text: Euphoria after a run of wins (even 15 or 20 in a row) leads traders to put on larger-than-usual positions and give
    it back; the book calls the 40 to 50 percent of traders who cycle like this boom-and-busters (no data given).
  tags:
  - sizing
- id: book.douglas-trading-in-the-zone.13
  book: douglas-trading-in-the-zone
  title: Anything can happen at a level
  chapter: Ch. 6, The Market's Most Fundamental Characteristic
  text: 'One large trader can break any support: a chairman sold two million bushels at market and soybeans fell through the
    analyst''s ''low of the day'' at once.'
  tags:
  - traps
  - big-players
  verdict: positive
  tested_src: research/FINDINGS.md
  tested_text: 'Our R20b agrees that levels are not walls: levels mirrored at random to the other side of the price made more
    on average than the real ones in 6 of 7 variants.'
- id: book.douglas-trading-in-the-zone.14
  book: douglas-trading-in-the-zone
  title: Rigid rules, flexible expectations
  chapter: Ch. 7, Managing Expectations
  text: The trader must be rigid in rules and flexible in expectations; the market has no built-in endings, so the structure
    (stops, limits, when to stop) must come from the trader, which is the case for hard locks and a kill switch.
  tags:
  - stop
  - filter
- id: book.fm-wilmott.1
  book: fm-wilmott
  title: Hedging at implied vol vs at your forecast vol
  chapter: Ch. 12, How to delta hedge
  text: 'Buying or selling an option at one implied vol and delta hedging gives two choices: hedge with your forecast vol''s
    delta and the final profit is locked but the daily marks swing; hedge with the implied vol''s delta and every day''s profit
    is steady but the total depends on the path, biggest if the index stays near the strike. SPX realised vol averaged about
    15% against VIX about 20%.'
  tags:
  - iv
  - vix
  - option-selling
  - straddle
  inst:
  - NIFTY
  - BANKNIFTY
  - INDIAVIX
  verdict: positive
  tested_src: research/FINDINGS.md
  tested_text: Our R102 found India VIX over-states NIFTY's next 21 days on 81% of days (median ratio 1.28, 4,507 days), but
    under-states BANKNIFTY's on 60%.
- id: book.fm-wilmott.2
  book: fm-wilmott
  title: Long gamma loses small on most days
  chapter: Ch. 7 and Ch. 47, Discrete hedging
  text: 'A delta-hedged long option loses a little on quiet days and wins on rare big moves: under Normal returns it loses
    on about 68% of rehedges; on the Dow 1977-96, 78% of days moved less than one SD, so a long-gamma hedger loses on about
    four days in five. Theta is not the expected profit of a fairly priced hedged option.'
  tags:
  - option-buying
  - theta
  - iv
  - mcx
  inst:
  - NIFTY
  - BANKNIFTY
  - CRUDE
  - NATURALGAS
  - GOLD
  - SILVER
  verdict: positive
  tested_src: research/MCX_OPTIONS.md
  tested_text: Our MCX options study found the average option lost money for a buyer in every book, with realised moves 0.73-0.93
    of what the options priced.
- id: book.fm-wilmott.3
  book: fm-wilmott
  title: 'Kelly: half Kelly, never twice'
  chapter: Ch. 17, Blackjack and Kelly; Ch. 44, LTCM
  text: The growth-optimal stake is edge divided by variance; twice Kelly gives zero expected growth, and half Kelly halves
    the volatility while giving up only 25% of the growth, so use half or less when the edge is uncertain. LTCM ran at roughly
    twice Kelly.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: Our sizing study found the BANKNIFTY Kelly fraction unstable (0.48 and 0.14 on other windows against 1.29 here),
    and half-Kelly carried a 14% chance of a 50% drawdown.
- id: book.fm-wilmott.4
  book: fm-wilmott
  title: Hedge a futures position on a delta band, not the clock
  chapter: Ch. 48, Transaction costs
  text: With costs, a long option is worth less (priced at a lower vol) and a short one more; the best rebalancing waits until
    delta leaves a band around the model delta. On about 40 stocks, 1985-96, the delta-tolerance band won about 70% of paths
    against 7% for fixed-interval Leland hedging.
  tags:
  - costs
  - iv
  - mcx
  - crypto
  inst:
  - CRUDE
  - NATURALGAS
  - GOLD
  - SILVER
  - CRYPTO
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: VOL 14 trades, win 57%, net -Rs 47,767 in design.
    It did not pass the gates.'
- id: book.fm-wilmott.5
  book: fm-wilmott
  title: 'Fat tails: the 1987 day the Normal says never happens'
  chapter: Ch. 16 and Ch. 19, Normal accuracy; VaR
  text: The 1987 crash of -20.5% in a day was a once-in-25-years event in the data but essentially impossible under a Normal
    model; an extreme-value fit to earlier annual falls, whose largest was 6.7%, put the 50-year fall at 24%. Delta-VaR understates
    short-option risk because short gamma fattens the loss tail.
  tags:
  - gap
  - option-selling
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_OPTIONS_SELLING.md
  tested_text: Our R102 daily data show NIFTY's worst day -12.98% and kurtosis 14 (a normal distribution has 3).
- id: book.fm-wilmott.6
  book: fm-wilmott
  title: Worst-case crash check and paid-for wings
  chapter: Ch. 43 CrashMetrics; Ch. 58 Crash modelling
  text: Judge a short-gamma book by its worst loss over a bounded gap, with all assets falling together, not by probability;
    buying offsetting positive gamma is worth more than model value. In the example a 15% crash cost 9.3 and buying 3.5 of
    the 90 calls cut that to 5.7.
  tags:
  - option-selling
  - gap
  - overnight
  - sizing
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_OPTIONS_SELLING.md
  tested_text: Our notes found the naked 09:20 BANKNIFTY short straddle had a worst day of -Rs 65,483, beyond the -Rs 40k
    / -Rs 13k stops.
- id: book.fm-wilmott.7
  book: fm-wilmott
  title: Vega hides the risk of iron flies and condors
  chapter: Ch. 52, Ch. 56, Ch. 60, Uncertain volatility
  text: 'When a book''s gamma changes sign (spreads, condors, cliquets) vega can look tiny while the real vol risk is large:
    in the cliquet example constant vols moved the price 0.75% but a vol band moved it 10.5%, 14x what vega showed. Price
    such books with a vol range, low vol where gamma is positive and high where negative.'
  tags:
  - option-selling
  - iv
  - straddle
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-wilmott.8
  book: fm-wilmott
  title: Buy options only with a real drift edge; sell when it is gone
  chapter: Ch. 59, Speculating with options
  text: A speculator values an option by its payoff under his own real drift; without a drift edge that value equals the market
    price, so there is no reason to buy. With changing views, sell as soon as your value falls to the market price.
  tags:
  - option-buying
  - direction
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/FINDINGS.md
  tested_text: Our R16 found 15/30/60-minute direction not predictable (holdout AUC 0.509-0.536), and every option-buying
    version lost Rs 12-142 a trade after costs.
- id: book.fm-wilmott.9
  book: fm-wilmott
  title: Hedgers' gamma can pin or push the index
  chapter: Ch. 61, Feedback effects of hedging
  text: Replicating positive gamma (portfolio insurance) pushes prices further and can make them jump near the strike at expiry;
    when hedgers are net long gamma they damp moves and draw the price toward the strike (pinning).
  tags:
  - gex
  - expiry
  - big-players
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: weak
  tested_src: research/HUNT_R36_GAMMA_EXPOSURE.md
  tested_text: Our R36 found gamma exposure does not give a profitable trade (0 of 4 rules pass); with implied vol held fixed
    its link to the afternoon move was slightly negative, a faint pin.
- id: book.fm-javaheri-vol-arb.1
  book: fm-javaheri-vol-arb
  title: Options price more crash skew than history shows
  chapter: Ch. 3, The Consistency Test
  text: 'On S&P 500 in January 2002, one-year options implied vol-of-vol 0.420 and spot-vol correlation -0.674, while about
    3,000 days of index history gave only 0.096 and -0.133: the option smile is far steeper than the index''s own past moves
    justify, and the literature finds this every time.'
  tags:
  - iv
  - option-selling
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: 'Our R102 found the same shape on NIFTY: puts five strikes out dearer than calls by 2.56 IV points on 91% of
    1,222 days, while daily returns since 2006 have skew of only -0.04.'
- id: book.fm-javaheri-vol-arb.2
  book: fm-javaheri-vol-arb
  title: The skew trade is selling insurance
  chapter: Ch. 3, Trading Strategies
  text: 'Buying an OTM call and selling an OTM put, vega-neutral and delta-hedged, collects the over-priced skew: it makes
    small regular profits and suffers sudden large losses in a crash or a fast fall. The author calls it closer to selling
    insurance than to arbitrage.'
  tags:
  - option-selling
  - iv
  - gap
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: VOL 358 trades, win 51%, net -Rs 29,272 in design.
    It did not pass the gates.'
- id: book.fm-javaheri-vol-arb.3
  book: fm-javaheri-vol-arb
  title: '40 skew trades: loss at bid/ask, profit only at mid'
  chapter: Ch. 3, Multiple Trades
  text: Forty three-month S&P 500 skew trades (10% OTM call bought, 10% OTM put sold, unwound about 20 business days before
    expiry) lost money when filled at bid and ask and made money only at mid prices, so the author found no decisive proof
    that options are mispriced.
  tags:
  - costs
  - option-selling
- id: book.fm-javaheri-vol-arb.4
  book: fm-javaheri-vol-arb
  title: One worked skew trade made almost nothing
  chapter: Ch. 3, An Example of the Skewness Trade
  text: A single SPX skew trade from April to June 2002 sold the 1050 put at 14.20 and bought the 1250 call at 3.20; the index
    fell to 989.14, the put loss was mostly offset by +50.39 of delta-hedge profit, and the trade ended +1.85 points. Jumps
    mid-trade caused most of the hedge losses.
  tags:
  - option-selling
  - gap
- id: book.fm-javaheri-vol-arb.5
  book: fm-javaheri-vol-arb
  title: Vol-of-vol and correlation need decades of daily data
  chapter: Ch. 2, The Performance of the Inference Tools
  text: With 5,000 simulated days and true vol-of-vol 0.03, the best filter still estimated 0.052; it took 50,000 points (200
    years of daily data) to get near the truth. The variance level and its mean reversion are estimated well, the noise parameters
    are not; the fix is high-frequency data.
  tags:
  - iv
  - ml
- id: book.fm-javaheri-vol-arb.6
  book: fm-javaheri-vol-arb
  title: Skew is estimable from history, kurtosis much less
  chapter: Ch. 2 and Ch. 3, Error Size Revisited; Financial Interpretation
  text: The product of vol-of-vol and correlation, which sets the skew of returns, is estimated far better than either alone,
    so a history-based skew is more trustworthy than a history-based kurtosis; that makes the skew trade easier to justify
    than the kurtosis trade.
  tags:
  - iv
- id: book.fm-javaheri-vol-arb.7
  book: fm-javaheri-vol-arb
  title: When a skew trade exists, and when it does not
  chapter: Ch. 3, High Volatility-of-Volatility and High Correlation
  text: A skew opportunity appears when history shows weak vol-of-vol (the S&P 500) or weak spot-vol correlation (a penny
    stock, though its crash risk is real); when history already shows strong negative correlation and high vol-of-vol (Microsoft,
    the NDX index) the option skew is justified and there is no trade. An index is the safest place for it.
  tags:
  - iv
  - option-selling
  - filter
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-javaheri-vol-arb.8
  book: fm-javaheri-vol-arb
  title: 'Peso problem: a calm history can hide a crash process'
  chapter: Ch. 3, The Peso Theory
  text: 'Options may be right to price a crash the history window never showed: fitting a jump to S&P 500 options gave a rare
    (intensity 0.009) but huge (j 0.91) crash, and the volatility smile hardly existed before 1987.'
  tags:
  - iv
  - gap
  - option-selling
- id: book.fm-javaheri-vol-arb.9
  book: fm-javaheri-vol-arb
  title: Particle filters add little on daily data
  chapter: Ch. 2, Particle Filtering
  text: Kalman filters (extended or unscented) and particle filters track the hidden variance of a daily index about equally
    well; particle filters only help with large time steps, jumps or non-Gaussian models, and even then they cannot fix too
    little data.
  tags:
  - ml
  - iv
- id: book.fm-javaheri-vol-arb.10
  book: fm-javaheri-vol-arb
  title: Synchronise prices and average the four IVs
  chapter: Ch. 3, Robustness Issues for the Cross-Sectional Method
  text: A few minutes' mismatch between the spot close and the option close distorts implied vol; call and put IVs differ
    within the bid-ask, so use the average of call bid, call ask, put bid and put ask IVs when fitting a smile.
  tags:
  - iv
  - costs
- id: book.fm-mcnelis-neural-nets.1
  book: fm-mcnelis-neural-nets
  title: Neural nets pay off in volatility, not returns
  chapter: Preface and Ch. 5.8, Conclusion
  text: After testing small networks against linear models, the author concludes the real payoff of neural networks in markets
    is likely volatility forecasting, not return forecasting, and does not claim his forecast edge means trading profit.
  tags:
  - ml
  - vix
  - direction
  verdict: positive
  tested_src: research/HUNT_R41_NEURAL_NETS.md
  tested_text: Our R41 networks forecast the next 60-minute range with holdout R2 0.432 against trees 0.382 (36,320 forecasts),
    while index direction stayed a coin at AUC 0.510-0.517.
- id: book.fm-mcnelis-neural-nets.2
  book: fm-mcnelis-neural-nets
  title: On return-like series the net did not beat linear
  chapter: Ch. 5.3-5.5, Artificial data
  text: On simulated jump-diffusion, Markov regime and volatility-regime returns the network forecast no better than a linear
    model out of sample (RMSE .157 vs .167, 1.122 vs 1.224, 1.37 vs 1.38, none significant); it won only on strongly nonlinear
    or pricing-formula data.
  tags:
  - ml
  - direction
  verdict: negative
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found NIFTY and BANKNIFTY direction over 15/30/60 minutes not predictable (AUC 0.509-0.536) while the
    range of the next 30/60 minutes was.
- id: book.fm-mcnelis-neural-nets.3
  book: fm-mcnelis-neural-nets
  title: 'Keep networks small: one layer, two or three neurons'
  chapter: Ch. 2.4 and 2.9
  text: One hidden layer with two or three neurons is usually enough; extra layers add parameters, local optima and overfitting,
    and the plain logistic multilayer perceptron is as accurate as fancier designs.
  tags:
  - ml
- id: book.fm-mcnelis-neural-nets.4
  book: fm-mcnelis-neural-nets
  title: Average many fitted nets (thick models)
  chapter: Ch. 3.3 and 4.4, Thick models
  text: Because a network never gives the same answer twice, refit it many times and use the trimmed mean of the forecasts,
    with their spread as a forecast band; citing Granger and Jeon, single nets did not beat linear models on most macro series
    but averaged nets did.
  tags:
  - ml
- id: book.fm-mcnelis-neural-nets.5
  book: fm-mcnelis-neural-nets
  title: Judge forecasts in simulated real time
  chapter: Ch. 4.2, Out-of-sample criteria
  text: 'The acid test is out of sample: re-estimate on data up to each date and forecast the next step, compare errors with
    a Diebold-Mariano test, check sign calls with the Pesaran-Timmermann test, and beat the best-specified linear model rather
    than a weak one.'
  tags:
  - ml
- id: book.fm-mcnelis-neural-nets.6
  book: fm-mcnelis-neural-nets
  title: A net can recover implied volatility from option prices
  chapter: Ch. 5.7, Black-Scholes implied volatility
  text: On simulated Black-Scholes option data a small network recovered the implied volatility with out-of-sample RMSE .0173
    against .0602 for a linear model, more than 80% lower; for time series the inputs should be spot/strike and price/strike
    ratios.
  tags:
  - iv
  - ml
- id: book.fm-mcnelis-neural-nets.7
  book: fm-mcnelis-neural-nets
  title: One nonlinear number for the whole IV term structure
  chapter: Ch. 2.6 and 9, Nonlinear principal components
  text: An auto-associative network squeezed swaption implied vols at maturities 2, 3, 4, 5, 7 and 10 years into one component
    and rebuilt them out of sample better than one linear component at most maturities (Hong Kong 2-year RMSE 1.873 vs 4.195),
    as a single market-riskiness gauge.
  tags:
  - iv
  - vix
  - ml
- id: book.fm-mcnelis-neural-nets.8
  book: fm-mcnelis-neural-nets
  title: Test for missed nonlinearity before building a net
  chapter: Ch. 4.1.6, Lee-White-Granger test
  text: Regress a linear model's residuals on randomly weighted logistic neurons of its inputs 1000 times; if more than 5%
    of the regressions are significant there is nonlinearity left to model. In the author's simulation it caught the misspecification
    in 99% of runs against 6.6% for the BDS test.
  tags:
  - ml
- id: book.fm-mcnelis-neural-nets.9
  book: fm-mcnelis-neural-nets
  title: Recent data may beat more data
  chapter: Ch. 4.2.9, Data requirements
  text: Citing Walczak, for daily currency forecasts at most two years of training data gave the best networks, single-hidden-layer
    nets beat two-layer ones and could reach about 60% directional accuracy; the author warns that old data may describe a
    market that no longer exists.
  tags:
  - ml
  - direction
  verdict: negative
  tested_src: research/HUNT_R88_WHAT_MOVES_THE_CANDLE.md
  tested_text: Our R88 model of 22 parameters called the next candle's direction at AUC 0.485-0.535 (0.50 = coin) in the holdout
    on 5 indices and 10 MCX contracts.
- id: book.fm-applied-quant-finance.1
  book: fm-applied-quant-finance
  title: Delta-gamma shortcuts mislead on option books; simulate smartly
  chapter: Ch. 1, Approximating Value at Risk in Conditional Gaussian Models
  text: A delta-gamma (quadratic) approximation can give very large errors in the loss quantile of an option book, and a normal
    model understates joint extremes; when simulating, importance sampling cut the standard error of the VaR estimate by 84.68%
    against plain sampling, about 42 times fewer scenarios.
  tags:
  - option-selling
  - sizing
- id: book.fm-applied-quant-finance.2
  book: fm-applied-quant-finance
  title: Rescale history to today's volatility before reading a worst day
  chapter: Ch. 3, Quantification of Spread Risk by Means of Historical Simulation
  text: Plain historical simulation under-predicted losses (1.57% of days broke a 99% VaR on the benchmark curve); rescaling
    each past move to today's EWMA volatility (decay 0.94) brought the violation rate to 1.14%, close to the 1% target.
  tags:
  - sizing
  - vix
- id: book.fm-applied-quant-finance.3
  book: fm-applied-quant-finance
  title: Correlation hides joint crashes; tail-dependent copulas do not
  chapter: Ch. 2 and Ch. 5, Copulas
  text: A Gaussian (correlation) model has no tail dependence, so it understates the chance that several positions lose together;
    with the same correlation a Student-t copula raised the 99% loss quantile of a portfolio from 22 to 71, more than three
    times.
  tags:
  - sizing
- id: book.fm-applied-quant-finance.4
  book: fm-applied-quant-finance
  title: Implied volatility moves mostly as one level factor
  chapter: Ch. 6, The Analysis of Implied Volatilities
  text: Daily changes of DAX implied volatility across eight maturities were about 70% one near-parallel level shift and about
    13% a front-versus-back twist, about 83% together; the same shift, slope and twist shapes held for every maturity's smile,
    with the front moving most.
  tags:
  - iv
  - vix
- id: book.fm-applied-quant-finance.5
  book: fm-applied-quant-finance
  title: Option prices imply a more crash-prone market than history shows
  chapter: Ch. 9, Trading on Deviations of Implied and Historical Densities
  text: On the DAX the option-implied distribution of the index three months ahead was more negatively skewed than the one
    estimated from the index's own recent path in 29 of 30 monthly periods, and had fatter tails in all but one.
  tags:
  - iv
  - option-selling
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found puts five strikes out dearer than calls five strikes out on 91% of NIFTY days (1,222 days) and
    90% of BANKNIFTY days.
- id: book.fm-applied-quant-finance.6
  book: fm-applied-quant-finance
  title: 'Skew trade: sell OTM puts, buy OTM calls, hold to expiry'
  chapter: Ch. 9.5, Skewness Trades
  text: When implied skew is more negative than historical, sell every OTM put and buy every OTM call and hold to expiry;
    on the DAX this made +9855.50 EUR net of 5% costs over 30 monthly periods, from 28 small gains and 2 large losses, because
    the position is really a long-index bet.
  tags:
  - option-selling
  - iv
  - direction
- id: book.fm-applied-quant-finance.7
  book: fm-applied-quant-finance
  title: Kurtosis trade earns only the premium taken in
  chapter: Ch. 9.6, Kurtosis Trades
  text: When implied tails are fatter than historical, sell ATM and far-OTM options and buy near-OTM ones; on the DAX this
    made +10,915.77 EUR net of 5% costs, yet every position lost at expiry and all profit came from premium collected at entry,
    worst in trending months.
  tags:
  - option-selling
  - straddle
  - theta
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: weak
  tested_src: research/HUNT_R103_OPTIONS_SELLING.md
  tested_text: Our R103 found a naked short straddle made +Rs 64k on NIFTY over 1,272 days (62% win) with a worst day of -28,876
    rupees on one lot, while defined-risk selling passed 0 of 24 tests.
- id: book.fm-applied-quant-finance.8
  book: fm-applied-quant-finance
  title: 'Hurst exponent: single prices wander, a spread can revert'
  chapter: Ch. 14, Long Memory Effects Trading Strategy
  text: Single German shares had a Hurst exponent of 0.50 to 0.57 (random walk) while the spread between each company's voting
    and non-voting shares had 0.33 to 0.41 (reverting); fading new 50-day extremes of the spread made money over 26 years,
    but the weakest pair turned negative at 1% cost per share.
  tags:
  - reversal
  - costs
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: DLY 0 trades, win -, net Rs 0 in design; MCXD
    0 trades, win -, net Rs 0 in design. It did not pass the gates.'
- id: book.fm-applied-quant-finance.9
  book: fm-applied-quant-finance
  title: Control charts tell when a model or arm has broken
  chapter: Ch. 11, Statistical Process Control
  text: An EWMA or CUSUM chart on standardised residuals, designed for a chosen false-alarm spacing (run length 500), flagged
    that a stock's beta model had changed at observation 64 of the monitoring period, after which alarms became frequent;
    fat tails raise false alarms.
  tags:
  - filter
  - sizing
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: drawdown -Rs 178,421 vs -Rs 444,695 on the arms.
    It did not pass the gates.'
- id: book.fm-bayesian-methods.1
  book: fm-bayesian-methods
  title: Shrink small-sample estimates toward a prior
  chapter: Ch. 3, 4 and 6, posterior mean and shrinkage
  text: A Bayesian estimate of a mean is a weighted average of the sample mean and a prior mean, the sample getting weight
    n/(n+T); with few observations the prior dominates, so noisy numbers such as a strategy's average profit should be pulled
    toward zero or a pooled value.
  tags:
  - sizing
- id: book.fm-bayesian-methods.2
  book: fm-bayesian-methods
  title: Errors in expected returns do the most damage
  chapter: Ch. 6, Bayesian framework for portfolio allocation
  text: Errors in estimated means are 10 to 11 times more damaging to allocations than errors in variances; in one example
    raising one input by 10% moved 22 classical weights by more than 30% and none of the Bayesian ones.
  tags:
  - sizing
- id: book.fm-bayesian-methods.3
  book: fm-bayesian-methods
  title: Forecasts must include parameter uncertainty
  chapter: Ch. 3, 5 and 9, predictive distribution; Barberis
  text: Plugging estimates into a forecast as if they were true understates risk; the predictive distribution averages over
    what the data leave unknown and is wider. Ignoring this makes a strategy look better the longer it is held.
  tags:
  - sizing
- id: book.fm-bayesian-methods.4
  book: fm-bayesian-methods
  title: Volatility clusters and is forecastable
  chapter: Ch. 10-11, GARCH models
  text: 'Volatility clusters: today''s variance mixes the long-run level, yesterday''s forecast and yesterday''s shock. A
    Student-t GARCH(1,1) on daily MSCI Canada returns gave persistence 0.965 and degrees of freedom 9.24; normal residuals
    were rejected for over 80% of 382 stocks.'
  tags:
  - vix
  - sizing
  - stop
  verdict: positive
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found the range of the next 30 and 60 minutes predictable on both indices, holdout 15-20% better than
    the time-of-day baseline (q 0.003), while direction was not.
- id: book.fm-bayesian-methods.5
  book: fm-bayesian-methods
  title: 'Volatility regimes: calm lasts, storms are short'
  chapter: Ch. 11, Markov regime-switching GARCH
  text: A three-state switching GARCH found a calm state that persists (stay probability 0.988) and a short-lived high-volatility
    state (stay 0.181) that is explosive while it lasts; a single-regime model over-forecasts in calm periods and under-forecasts
    in storms.
  tags:
  - vix
  - sizing
- id: book.fm-bayesian-methods.6
  book: fm-bayesian-methods
  title: Use CVaR, not VaR, as the tail-risk number
  chapter: Ch. 13 Appendices A-B; Ch. 10 VaR illustration
  text: VaR says nothing about losses beyond its cut-off and can punish diversification; CVaR, the average loss on the worst
    days, is subadditive and can be minimised as a linear programme over scenarios. A Student-t GARCH 95% VaR was breached
    on 3.4% of days instead of 5%.
  tags:
  - sizing
  - stop
- id: book.fm-bayesian-methods.7
  book: fm-bayesian-methods
  title: Smoothed volatility uses the future
  chapter: Ch. 12, Kalman filtering and smoothing
  text: A filtered volatility estimate uses data up to today; a smoothed one also uses later data and is more accurate, and
    filtered estimates react to volatility bumps later than smoothed ones. Only filtered values are available in real time.
  tags:
  - filter
  - ml
- id: book.fm-bayesian-methods.8
  book: fm-bayesian-methods
  title: Jumps in returns vs jumps in volatility
  chapter: Ch. 12, jump extension of the SV model
  text: A return jump is a one-off shock (about three to four a year on the S&P); a jump in volatility persists, and with
    both in a model return jumps become rarer and explain crashes.
  tags:
  - gap
  - option-selling
  verdict: weak
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: MCXD 111 trades, win 57%, net Rs 1,354,524 in
    design. It did not pass the gates.'
- id: book.fm-bayesian-methods.9
  book: fm-bayesian-methods
  title: A p-value is not the chance the idea is wrong
  chapter: Ch. 3 and 4, Bayesian hypothesis comparison
  text: A p-value is not the probability that the null is true and can overstate evidence; Bayes reports the posterior probability
    of an effect instead, but a strong prior can manufacture one (about 50% vs over 95% posterior mass for the same coefficient
    under two priors).
  tags:
  - filter
- id: book.fm-bayesian-methods.10
  book: fm-bayesian-methods
  title: Skill times breadth
  chapter: Ch. 8, active management and Black-Litterman
  text: 'Grinold''s law: the information ratio is about the information coefficient times the square root of the number of
    independent bets, so many small independent edges beat a few large ones; a strategy''s view confidence can be set from
    the variance of its backtest forecast errors.'
  tags:
  - sizing
- id: book.fm-copula-methods.1
  book: fm-copula-methods
  title: Correlation is not the same as dependence
  chapter: Ch. 3.1, Measures of association
  text: 'Linear correlation depends on each market''s own distribution: two perfectly dependent lognormal assets with volatilities
    0.4 and 0.6 can only reach a correlation of 0.57, and zero correlation does not mean independence. Kendall''s tau and
    Spearman''s rho depend only on how the markets move together and reach 1 exactly at perfect co-movement.'
  tags:
  - breadth
- id: book.fm-copula-methods.2
  book: fm-copula-methods
  title: A Gaussian model has no crash dependence
  chapter: Ch. 3.1.5 and 3.2, Tail dependence and copula families
  text: Under a Gaussian copula with any correlation below 1, the chance that both markets have their worst days together
    fades towards zero far in the tail; a Student t copula keeps a positive chance of joint crashes, and a single correlation
    number cannot tell the two apart.
  tags:
  - breadth
  - sizing
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-copula-methods.3
  book: fm-copula-methods
  title: Fat tails and joint crashes are separate risks
  chapter: Ch. 1.8.5 and 2.3.4, Tail dependence; VaR computation
  text: Fat tails in each market and the tendency to crash together are two separate properties to model. In the book's two-asset
    example the 99% VaR of an equal split is -1.792 with fat-tailed returns and -1.622 with normal returns of the same spread,
    while the 95% level barely changes.
  tags:
  - sizing
- id: book.fm-copula-methods.4
  book: fm-copula-methods
  title: Normal VaR under-counted joint losses on index pairs
  chapter: Ch. 2.7.1, VaR bounds
  text: On equal-weight pairs of six stock indices (daily, 1994-2000) the normal 95% VaR was exceeded 56-65 times when 35
    were expected; a worst-case bound that assumes nothing about how the indices move together was exceeded 18-32 times, so
    it was not as over-cautious as feared.
  tags:
  - sizing
- id: book.fm-copula-methods.5
  book: fm-copula-methods
  title: A basket of dependent positions is one position
  chapter: Ch. 1.8.7, Credit-linked products
  text: 'When the members of a basket are strongly dependent the basket behaves like a single position: protection on the
    first of two names to default, with 50% default-time correlation, cost 116,240 euros against 123,200 under perfect dependence,
    and the book calls such a basket undiversified.'
  tags:
  - sizing
  - breadth
  verdict: negative
  tested_src: research/HUNT_R84_BREADTH_RISK.md
  tested_text: 'Our R84 capped how many of one Breadth Donchian signal''s same-direction index positions are held: none of
    the 8 rules passes; every rule cut the worst day by 32% to 77% but none kept the edge.'
- id: book.fm-copula-methods.6
  book: fm-copula-methods
  title: The dependence model drives the tail, not the average
  chapter: Ch. 7.4, EuroStoxx50 CDO
  text: Switching a 50-name basket from a Gaussian to a Student t copula with 8 degrees of freedom raised the senior tranche's
    expected loss from 496,364 to 795,313 euros and its 99% VaR from 20,072,488 to 28,117,222, while a copula with only lower-tail
    dependence showed almost no senior loss.
  tags:
  - sizing
- id: book.fm-copula-methods.7
  book: fm-copula-methods
  title: Fit each market first, then how they move together
  chapter: Ch. 5.3-5.4 and 8.7, IFM and CML estimation; basket option
  text: 'Estimate in two steps: each market''s own distribution (or just its ranks), then the dependence. If the margins are
    wrongly taken as normal, the dependence model absorbs their fat tails: a basket''s t copula needed about 2 degrees of
    freedom with normal margins against about 10 with fat-tailed margins.'
  tags:
  - sizing
- id: book.fm-copula-methods.8
  book: fm-copula-methods
  title: Robust correlation for fat-tailed data
  chapter: Ch. 7.5.4, Variance-covariance robust estimation
  text: The ordinary Pearson correlation estimator performs poorly on fat-tailed or contaminated returns; the book uses a
    matrix built from Kendall's tau, or the Spearman rank matrix, which is positive definite by construction.
  tags:
  - sizing
- id: book.fm-copula-methods.9
  book: fm-copula-methods
  title: Wrong-way counterparty risk
  chapter: Ch. 8.4, Pricing vulnerable options
  text: 'When the option writer is most likely to fail exactly when the option pays, counterparty risk multiplies: for a Baa3
    writer of a one-year at-the-money call it is 0.231% of the option''s value if default is independent of the market and
    2.24963% if they are perfectly dependent.'
  tags:
  - crypto
  inst:
  - CRYPTO
- id: book.fm-fabozzi-modelling.1
  book: fm-fabozzi-modelling
  title: Size of moves is forecastable, direction is not
  chapter: Ch. 11, Stylized facts of financial time series
  text: Returns show almost no autocorrelation at any lag, while volatility clusters and its autocorrelation decays slowly;
    returns from minutes to days have fat tails. Point models at range, straddle pricing and sizing, not at direction.
  tags:
