  - iv
- id: book.fm-shaw-mathematica.4
  book: fm-shaw-mathematica
  title: Low standard error is not accuracy
  chapter: Ch. 22, Monte Carlo on path-dependent options
  text: 'Simulating a lookback with 10 steps per path gave 7.1541 with standard error 0.081 against an exact 8.6084: sampling
    a path at a few points misses its extremes, so more paths shrink the error bar but not the bias.'
  tags:
  - stop
  - profit-lock
- id: book.fm-shaw-mathematica.5
  book: fm-shaw-mathematica
  title: Level-dependent volatility makes a put skew
  chapter: Ch. 28, the CEV model, skews and smiles
  text: 'Pricing with a constant-elasticity model, where volatility rises as the price falls, and reading prices back through
    Black-Scholes gives implied 0.20538 at strike 90, 0.200104 at 100 and 0.195409 at 110 with today''s vol fixed at 20%:
    the leverage effect alone creates a put skew.'
  tags:
  - iv
  - vix
- id: book.fm-shaw-mathematica.6
  book: fm-shaw-mathematica
  title: The bid-offer spread inflates far-strike IV
  chapter: Ch. 28.9-28.10, the effect of spread
  text: Adding a 2.5% markup to model prices raised out-of-the-money implied volatilities sharply and turned the put skew
    into a smile, so implied vols read from offers or stale last trades on far strikes overstate volatility.
  tags:
  - iv
  - costs
- id: book.fm-shaw-mathematica.7
  book: fm-shaw-mathematica
  title: Price options off the future, not spot minus dividends
  chapter: Ch. 24 dividends and Ch. 27 Black-76
  text: With a cash dividend, treating spot minus dividends as lognormal and treating spot as lognormal disagree (1.94853
    against 2.56562 in one example); pricing on the futures price with Black-76 avoids the issue and is the standard model
    for options on futures.
  tags:
  - iv
  - mcx
- id: book.fm-shaw-mathematica.8
  book: fm-shaw-mathematica
  title: A ladder option is a priced step profit lock
  chapter: Ch. 9.8, ladder options
  text: A ladder option locks in gains each time the price reaches a preset rung and can be built from a call, puts and up-and-out
    puts; with three rungs it was worth 5.77933 when the high so far was 55 but 29.3159 once the price had been above 80.
  tags:
  - profit-lock
- id: book.fm-shaw-mathematica.9
  book: fm-shaw-mathematica
  title: Use an accurate normal CDF in the tails
  chapter: Ch. 6.5, computing the cumulative normal
  text: The common 3-term approximation of the normal CDF is off by about 4% in the far left tail and worse when differenced
    for gamma; use continued fractions or a library erfc, and never compute N(-x) as 1 - N(x) for large x.
  tags:
  - iv
- id: book.fm-baxter-financial-calculus.1
  book: fm-baxter-financial-calculus
  title: Price from the hedge, not from your own odds
  chapter: The parable of the bookmaker
  text: A bookmaker who sets odds from the true chances (25% and 75%) breaks even on average but can lose $5,000 on one race;
    one who sets odds from the money wagered on each side breaks even whichever horse wins. Pricing from the hedge gives steady
    income, pricing from a forecast is a gamble.
  tags:
  - option-selling
- id: book.fm-baxter-financial-calculus.2
  book: fm-baxter-financial-calculus
  title: The real chance of going up does not enter the price
  chapter: Ch. 2.2, The binomial tree model
  text: On a three-step tree where the stock really rises with probability 3/4, a call costs 15 because it can be copied with
    stock and borrowing; its average payoff under the real odds would be 33.75, which is the wrong price. Only the size of
    the moves matters, not their probabilities.
  tags:
  - direction
  - iv
- id: book.fm-baxter-financial-calculus.3
  book: fm-baxter-financial-calculus
  title: Changing measure changes drift, never volatility
  chapter: Ch. 3.4, Cameron-Martin-Girsanov theorem
  text: Switching from real-world to pricing probabilities only adds a drift to the price process; the volatility stays the
    same. So an option's fair value needs a volatility estimate and never a return forecast, and the only real debate is implied
    versus realised volatility.
  tags:
  - iv
  - vix
  inst:
  - INDIAVIX
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
