  book: trader-tom-first-manual
  title: Three-bar swing as the trend line in the sand
  chapter: Trend Indicators; Daily Work Routine
  text: Mark the highest high and lowest low of the last 3 daily or weekly bars; a break of either level turns the trend that
    way, and the weekly version sets the bias for the week.
