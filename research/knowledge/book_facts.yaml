  - BANKNIFTY
- id: book.fm-baxter-financial-calculus.6
  book: fm-baxter-financial-calculus
  title: Paying in the wrong currency needs a correlation fix
  chapter: Ch. 4.5, Quantos
  text: 'A contract that pays a foreign price as a number in the home currency (a quanto) has a different fair forward from
