- id: book.fm-fabozzi-modelling.6
  book: fm-fabozzi-modelling
  title: Optimisers and Kelly fractions maximise estimation error
  chapter: Ch. 16, Mean-variance inputs are unstable
  text: 'Optimised weights pile into whatever return is over-estimated, and inputs move between periods: an emerging-market
    return of 16.3% became 0.1% and a correlation of 0.45 became 0.73. Cap and shrink weights estimated on one window.'
