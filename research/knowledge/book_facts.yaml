- id: book.trader-tom-first-manual.12
  book: trader-tom-first-manual
  title: Fixed-fraction sizing, always a stop
  chapter: Managing Your Risk
  text: Never trade without a stop; size the trade as money at risk divided by stop distance, starting at 1% or 2% of the
    account per trade.
  tags:
  - sizing
  - stop
- id: book.trader-tom-first-manual.13
  book: trader-tom-first-manual
  title: Hit rate is not the goal
  chapter: Principles of Price Action & Trend; Trading Psychology
  text: 'How you handle losses matters more than hit rate: a coached trader with an 85% hit rate lost 20 times as much on
