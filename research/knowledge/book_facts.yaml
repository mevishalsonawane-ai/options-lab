- id: book.fm-intro-quant-finance.1
  book: fm-intro-quant-finance
  title: A 5-sigma move is not rare without a normal law
  chapter: Ch. 8.2 and Ch. 8 exercises, Chebyshev's inequality
  text: For any distribution with a variance, the chance of a move of at least 5 sds is at most 4% (one-sided about 3.8%),
    and of 10 sds at most 1%; calling such days unforeseeable only holds under a normal assumption. NIFTY's worst day, -12.98%,
    was about 10 sd.
  tags:
  - filter
  - stop
