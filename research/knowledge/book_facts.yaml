- id: book.douglas-trading-in-the-zone.3
  book: douglas-trading-in-the-zone
  title: A losing streak says nothing about the next trade
  chapter: Ch. 5 and Ch. 7
  text: Each trade is statistically independent, so the last two or three results should not make a trader hesitate (after
    losses) or load up (after wins).
  tags:
  - sizing
  - filter
