  book: fm-structured-finance
  title: Implied volatility carries a risk premium
  chapter: Ch. 3.2 and 3.4, implied versus historical information
  text: Implied volatility is forward-looking but includes the market's risk premium and liquidity effects, while historical
    volatility is model-free but backward-looking and hurt by regime breaks; which predicts better is left open.
