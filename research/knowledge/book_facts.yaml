  book: fm-structured-finance
  title: 'A sold option is short gamma: small gains, large losses'
  chapter: Ch. 1.6 and 5.5, reverse convertible bonds
  text: 'A product that embeds a sold put, such as a reverse convertible, is short gamma and short volatility: it earns little
    when nothing happens and loses a lot on a large move in either direction, even when delta-hedged.'
