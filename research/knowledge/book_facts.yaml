- id: book.fm-fabozzi-modelling.2
  book: fm-fabozzi-modelling
  title: VaR can improve while the tail gets worse
  chapter: Ch. 13 and 23, Expected shortfall versus VaR
  text: In a fat-tailed example, 90% VaR fell from 102.9 to 96.6 bp while 90% expected shortfall rose from 240.3 to 256.2
    bp. VaR is silent on tail size and not subadditive; report expected shortfall and the worst day for option-selling and
    overnight studies.
