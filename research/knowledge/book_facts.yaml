- id: book.fm-lyuu-fin-engineering.4
  book: fm-lyuu-fin-engineering
  title: The option smile means Black-Scholes is not literally true
  chapter: Ch. 9.4.3, Implied volatility
  text: Options on the same underlying imply different volatilities, typically lowest at the money and higher for in- and
    out-of-the-money strikes, most strongly for short-dated options; blending them into one composite volatility is not sound.
