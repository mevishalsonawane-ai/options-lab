  book: trader-tom-first-manual
  title: Engulfing bar on 10-minute index charts
  chapter: Engulfing Patterns for Day-Trading
  text: An engulfing bar on a 10-min or higher chart of the FTSE, DAX, S&P 500 or Dow is the main day-trade entry; move the
