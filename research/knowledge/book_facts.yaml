  book: ozenbas-liquidity-markets
  title: 'News days: fast first move, slow settling'
  chapter: Ch. 3.3-3.5, Macro information shocks
  text: After a surprise from the Fed, prices react within minutes but discovery can run for days as bulls and bears trade
    out their divergent views; the S&P 500 fell 1.8% over about two days after one remark and gained 3.02% on a day with a
