- id: book.fm-nonlinear-optimization.4
  book: fm-nonlinear-optimization
  title: A search finds the optimum nearest its start
  chapter: Ch. 2 and Ch. 23, Global optimization
  text: Local search methods usually stop at the optimum nearest their starting point; on a two-optimum example a quasi-Newton
    method from 10 random starts found the global answer 7 times, so restarts or a global method such as DIRECT are needed,
    and differing answers across restarts are a warning.
  tags:
  - ml
- id: book.fm-nonlinear-optimization.5
  book: fm-nonlinear-optimization
  title: More parameters always fit the past better
  chapter: Ch. 11, Gauss-Newton applied to time series
  text: Fitting a trend line plus an autoregressive term to 10 closing prices, and then fitting all coefficients together,
    cut the in-sample squared error to about a third; the book reports no check of the fitted model on unseen prices.
  tags:
  - ml
  - direction
  verdict: negative
  tested_src: research/FINDINGS.md
  tested_text: 'Our R30 found EMA x everything combinations made +Rs 300-520 a trade on training years and Rs -111 out of
    sample: over-fitting.'
- id: book.fm-nonlinear-optimization.6
  book: fm-nonlinear-optimization
  title: Costs change the best action
  chapter: Ch. 10, 16 and 22, Rebalancing with transaction costs
  text: Small rebalances are not worth their cost; with a 5% cost each way, the best rebalance of an existing portfolio differed
    from the best fresh portfolio on the same data, and the smallest change that restores the target is usually enough.
  tags:
  - costs
  - sizing
- id: book.fm-nonlinear-optimization.7
  book: fm-nonlinear-optimization
  title: Least-width trend channel and its break
  chapter: Ch. 21, Trend channels for time series data
  text: Fit two parallel lines that enclose a 20-day window of closes as tightly as possible and project them forward; a close
    below the support line suggests selling, a close above the resistance line suggests buying, and the severity of a break
    needs judgement.
  tags:
  - pattern
  - trend
  verdict: weak
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: DLY 996 trades, win 39%, net Rs 9,827 in design;
    MCXD 409 trades, win 40%, net -Rs 101,013 in design. It did not pass the gates.'
- id: book.fm-nonlinear-optimization.8
  book: fm-nonlinear-optimization
  title: Downside and worst-case risk give different answers
  chapter: Ch. 22, Downside risk and worst-case analysis
  text: Counting only below-target periods, or only the single worst period, gives quite different optimal weights from plain
    variance even when the risk number barely moves; choosing the setting that is least bad under both a short recent window
    and the full history guards against estimates drifting.
  tags:
  - sizing
  - stop
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: drawdown -Rs 183,381 vs -Rs 444,695 on the arms.
    It did not pass the gates.'
- id: book.fm-financial-mathematics.1
  book: fm-financial-mathematics
  title: The drift never enters an option's price
  chapter: Ch. 13, Arbitrage Argument; App. F.3
  text: Hedging an option with the underlying removes all randomness, so the option's fair price cannot depend on how fast
    the underlying is expected to rise or fall; in the casino example the side-bet costs the same 2.97 whether heads comes
    up with probability 0.8 or 0.3.
  tags:
  - direction
  - option-buying
  - iv
  verdict: negative
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found intraday direction not predictable (AUC 0.509-0.536), so a directional view gives option buyers
    no edge over the price.
- id: book.fm-financial-mathematics.2
  book: fm-financial-mathematics
  title: Same reward per unit of risk for an option and its underlying
  chapter: Ch. 13.1, No-Arbitrage Condition
  text: Anything driven by the same randomness as the underlying must offer the same excess return per unit of volatility,
    so an option's expected excess return is just the underlying's, scaled up by leverage; with no drift in the underlying,
    buying the option has no edge before costs and decay.
  tags:
  - option-buying
  - costs
  - theta
  verdict: negative
  tested_src: research/HUNT_R47_RELAXED_OPTION_BUYING.md
  tested_text: Our R47 searched 387,392 index-option buying variants and none beat random entries after correcting for the
    tries (best q = 0.50).
- id: book.fm-financial-mathematics.3
  book: fm-financial-mathematics
  title: Black-Scholes is written on the forward
  chapter: Ch. 16 and 18, Call and Put Option Prices
  text: The call is the discount factor times forward x N(h+) minus strike x N(h-), with h built from the log of forward over
    strike; plugging the same-expiry future in as the forward gives the Black-76 form for index and commodity options without
    guessing a carry rate. A 6-month 115 call on 100 at 20% volatility and 5% rate is worth 1.76.
  tags:
  - iv
  - mcx
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-financial-mathematics.4
  book: fm-financial-mathematics
  title: N(h-) is the chain's chance of finishing in the money
  chapter: Ch. 17.1, Binary Options
  text: A digital call paying 1 above the strike is worth the discount factor times N(h-), and digital call plus digital put
    equal one discounted unit, so N(h-) is the option market's own (risk-neutral) probability of the price ending above the
    strike.
  tags:
  - iv
  - expiry
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-financial-mathematics.5
  book: fm-financial-mathematics
  title: Put-call parity and its arbitrage
  chapter: Ch. 17.3 and App. F.6
  text: Call minus put at one strike equals spot minus the discounted strike (spot discounted at the dividend yield first);
    if the gap is rich, selling the call, buying the put and buying the underlying locks the difference in, so a large parity
    break in last-price data is far more likely a stale print than free money.
  tags:
  - filter
  - option-selling
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-financial-mathematics.6
  book: fm-financial-mathematics
  title: Delta hedging is never continuous; gamma hedging needs a second option
  chapter: Ch. 17.2, Greeks and Hedging
  text: Continuous rehedging is unrealistic because every trade costs money, so hedged books drift off neutral between rehedges;
    making gamma zero with a second option keeps delta small near the current price and cuts how often one must rehedge, at
    the cost of a third instrument.
  tags:
  - option-selling
  - costs
  verdict: negative
  tested_src: research/HUNT_R103_OPTIONS_SELLING.md
  tested_text: 'Our R103 tested index option selling with wings and stops instead of hedges: 0 of 24 tests are confirmed.'
- id: book.fm-financial-mathematics.7
  book: fm-financial-mathematics
  title: ATM straddle is about 0.8 x sigma x root T
  chapter: App. F.5, KCL 1998 exam
  text: An at-the-money-forward call is worth about 0.4 x sigma x root T of the discounted spot, so the ATM straddle is about
    0.8 x sigma x root T; a deep in-the-money call is worth about the discounted forward minus the discounted strike, behaving
    like a future.
  tags:
  - straddle
  - iv
  - vix
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-financial-mathematics.8
  book: fm-financial-mathematics
  title: '1885: naked option buying is a losing game'
  chapter: App. E, The Economist, 2 May 1885
  text: A reprinted 1885 article says the dabbler who buys a put or call on his view and just holds it plays a losing game,
    with costs and premium stacking the odds against him; options used to protect another position limit loss and still leave
    a fair chance of profit.
  tags:
  - option-buying
  - costs
- id: book.fm-qf-physicists.1
  book: fm-qf-physicists
  title: Returns have fat tails
  chapter: Ch. 3.1-3.3 and 8.2, Distributions and power laws
  text: 'Return distributions have excess kurtosis: big moves are far more common than a normal curve allows. Studies it cites
    find tails falling like a power law with index about 3 for horizons under 4 days (S&P 500) or 16 days (US stocks), drifting
    slowly toward normal at longer horizons.'
  tags:
  - vix
  - option-selling
  - stop
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: 'Our R102 measured NIFTY and BANKNIFTY daily returns 2006-2026 (n 5,087): kurtosis 14.1 and 8.5, against 3
    for a normal curve, so the tails are fat.'
- id: book.fm-qf-physicists.2
  book: fm-qf-physicists
  title: 'Volatility clusters: big moves follow big moves'
  chapter: Ch. 5.3, Conditional heteroskedasticity
  text: Large returns of either sign tend to follow large returns, so squared returns are autocorrelated; GARCH models capture
    this. Outliers can hide the effect by lowering the measured autocorrelation.
  tags:
  - vix
  - filter
  - sizing
  verdict: positive
  tested_src: research/HUNT_R88_WHAT_MOVES_THE_CANDLE.md
  tested_text: Our R88 found the next candle 1.5x bigger after a big one on the indices, held in 10 of 10 index cells out
    of sample; 225 of 305 size findings held.
- id: book.fm-qf-physicists.3
  book: fm-qf-physicists
  title: Return signs have almost no memory
  chapter: Ch. 2.3 and 5.1, Efficient markets and autocorrelation
  text: Under the weak efficient-market view past prices do not forecast returns; Lo and MacKinlay rejected the random walk
    for weekly US returns 1962-1986, but the effect weakened in 1986-1996, plausibly because arbitrage traders used it up.
  tags:
  - direction
  - momentum
  - reversal
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/HUNT_R88_WHAT_MOVES_THE_CANDLE.md
  tested_text: Our R88 found lag-1 autocorrelation of candle returns of -0.04 to +0.06 and 0 of 8 direction findings held
    out of sample.
- id: book.fm-qf-physicists.4
  book: fm-qf-physicists
  title: A power-law tail can come from mixed volatility
  chapter: Ch. 8.3, New developments
  text: LeBaron produced an apparent power-law tail index of 2.98 to 3.33 from plain normal returns whose volatility mixes
    three time scales (years, weeks, a day), so fat tails may be a by-product of changing volatility rather than a deep law.
  tags:
  - vix
  - sizing
- id: book.fm-qf-physicists.5
  book: fm-qf-physicists
  title: GARCH and EWMA volatility forecasts
  chapter: Ch. 5.3, GARCH(1,1), IGARCH, EGARCH
  text: GARCH(1,1) forecasts variance from yesterday's squared shock and yesterday's variance; forecasts decay toward a long-run
    level, and the model is stable only if the two weights sum below 1. With the weights summing to 1 and no constant it is
    the EWMA estimator; EGARCH lets falls raise volatility more than rises.
  tags:
  - vix
  - iv
  - sizing
- id: book.fm-qf-physicists.6
  book: fm-qf-physicists
  title: Prefer expected tail loss to VaR
  chapter: Ch. 11, Market risk measurement
  text: VaR says nothing about losses beyond its threshold and is not sub-additive when P/L is not normal; expected tail loss
    (the average loss beyond VaR) fixes both. With 100 daily P/L values at 95%, VaR is the sixth-worst value and ETL the average
    of the five worst.
  tags:
  - sizing
  - stop
- id: book.fm-qf-physicists.7
  book: fm-qf-physicists
  title: Beware spurious regressions and data snooping
  chapter: Ch. 5.4, Multivariate time series
  text: Regressing one trending series on another invents relationships (butter production in Bangladesh 'predicting' the
    S&P 500), and statistics built on the data they are tested on look significant by chance.
  tags:
  - ml
  - filter
- id: book.fm-qf-physicists.8
  book: fm-qf-physicists
  title: Option leverage cuts both ways
  chapter: Ch. 9.2, General properties of stock options
  text: In the IBM example a call bought at 2.55 returned 96% when the stock rose to 90, against 7.2% for the stock, but loses
    100% of the premium if the stock stays put; a protective put capped the stock loss at 5.45 instead of 8.95.
  tags:
  - option-buying
  - stop
- id: book.fm-qf-physicists.9
  book: fm-qf-physicists
  title: Technical rules can be self-fulfilling in a model
  chapter: Ch. 12.4.3, Why technical trading may be successful
  text: In the author's agent-based model, traders who buy on a turn up after a dip and sell on a turn down after a top amplify
    price swings and pull regular trend-chasers along once they are big enough. It is a simulation, not evidence from a real
    market.
  tags:
  - direction
  - reversal
  - big-players
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
  tested_text: 'R104 tested this rule as written, after charges and slippage: IDX 9207 trades, win 30%, net -Rs 543,959 in
    design. It did not pass the gates.'
- id: book.fm-harrison-waldron.1
  book: fm-harrison-waldron
  title: 'No arbitrage: copies must cost the same'
  chapter: Ch. 4.4.2, The No Arbitrage Principle
  text: In equilibrium nobody can buy a bundle, directly or through a combination of other assets, at one price and sell the
    same bundle dearer; forward rates, the riskless rate and option prices built from synthetic portfolios all follow from
    this, and a mix of assets with zero variance must earn the riskless rate.
  tags:
  - filter
  - option-selling
- id: book.fm-harrison-waldron.2
  book: fm-harrison-waldron
  title: A butterfly prices one outcome
  chapter: Ch. 5.4.1 and 5.4.4, completing markets with options; butterfly spread
  text: Calls at every possible level of an underlying complete the market, and a butterfly of adjacent strikes pays only
    if the underlying ends at the middle strike, so its price is the market's price for that single outcome; summed across
    strikes these prices give the chain's own distribution of the expiry close.
  tags:
  - iv
  - expiry
  - straddle
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-harrison-waldron.3
  book: fm-harrison-waldron
  title: 'Black-Scholes: the drift drops out'
  chapter: Ch. 7.2.2, The Black-Scholes option pricing model
  text: A stock-and-option mix can be made riskless for an instant, so no arbitrage fixes the option's price without using
    the underlying's expected return; delta is N(d1), gamma shrinks as time to expiry grows, and a directional view changes
    what a buyer expects to earn, not what the option is worth.
  tags:
  - iv
  - direction
  - option-buying
  - theta
- id: book.fm-harrison-waldron.4
  book: fm-harrison-waldron
  title: Prices are not unbiased forecasts (Siegel)
  chapter: Ch. 5.6, Jensen's Inequality and Siegel's Paradox
  text: Because the average of a curved function is not the function of the average, a forward price cannot equal the expected
    future spot in every currency at once; the authors extend the doubt to any theory that treats today's price as the expected
    future value.
  tags:
  - direction
  - vix
- id: book.fm-harrison-waldron.5
  book: fm-harrison-waldron
  title: Utility curvature decides which moments matter
  chapter: Ch. 5.3 and 5.8, stochastic Taylor expansion; mean-variance paradigm
  text: Expected utility equals utility at the mean plus terms in variance, skewness and kurtosis weighted by its derivatives,
    so a trader whose risk aversion falls with wealth likes positive skew; judging strategies on mean and variance alone ignores
    the tails.
  tags:
  - option-buying
  - option-selling
  - sizing
- id: book.fm-harrison-waldron.6
  book: fm-harrison-waldron
  title: Fixed rupees vs fixed fraction is a risk-aversion choice
  chapter: Ch. 5.7 and 6.3.2, risk aversion and portfolio composition
  text: A risk-averse trader always takes a small stake in a bet whose expected return beats cash and none in a zero-edge
    bet; with constant relative risk aversion the fraction of capital at risk stays constant as wealth grows, while constant
    absolute risk aversion keeps the rupee stake fixed.
  tags:
  - sizing
- id: book.fm-harrison-waldron.7
  book: fm-harrison-waldron
  title: Kelly maximises long-run growth
  chapter: Ch. 5.9, The Kelly Strategy
  text: The Kelly rule maximises the long-run growth rate of capital and minimises the expected time to reach a large goal;
    the book gives no formula and says nothing about drawdowns or estimation error.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: 'Our H15 sized Liquidity 15+5 by half-Kelly: it led the holdout, but the sizing choice was not statistically
    separable (SPA p = 0.14), the BN Kelly fraction ranged from 0.14 to 1.29 by window, and P(drawdown ≥ 50%) was 14%.'
- id: book.fm-harrison-waldron.8
  book: fm-harrison-waldron
  title: Minimum-variance mix and the diversification floor
  chapter: Ch. 6.4 and 6.5.1, the portfolio frontier
  text: The lowest-variance mix of assets needs only their covariance matrix, which must be strictly positive definite; adding
    more equally weighted components lowers portfolio variance only down to the average covariance between them, never below.
  tags:
  - sizing
- id: book.fm-harrison-waldron.9
  book: fm-harrison-waldron
  title: Uncorrelated is not independent
  chapter: Ch. 5.2 and 6.5.3, beta; frontier holdings
  text: A regression beta makes the leftover part uncorrelated with the driver, but the fitted line is the expected outcome
    given the driver only if the leftover is independent of it, which holds for normal-like returns and not in general.
  tags:
  - filter
  - ml
- id: book.fm-basics-fin-math.1
  book: fm-basics-fin-math
  title: An option's price ignores the underlying's drift
  chapter: S6 Remarks 6.1-6.4 and S20, Black-Scholes formula I
  text: An option is priced by copying its payoff with the underlying and cash, so the real chance of an up move and the expected
    return of the underlying never enter the price; only volatility does. A directional view changes what a buyer expects
    to earn, not what the option is worth.
  tags:
  - iv
  - direction
  - option-buying
  verdict: positive
  tested_src: research/FINDINGS.md
  tested_text: 'Our R89 bought straddles when a big move was forecast: out of sample 2,214 straddles, 0 of 18 versions positive,
    because the options already priced the move.'
- id: book.fm-basics-fin-math.2
  book: fm-basics-fin-math
  title: Exits alone cannot turn a fair game into profit
  chapter: S5, Doob's optional stopping theorem
  text: If the price is a fair game, any exit rule that uses only past information and ends by a fixed time (stop, target,
    trail, time stop) leaves the expected result unchanged; it reshapes the win rate and the size of wins and losses, not
    the mean.
  tags:
  - stop
  - target
  - profit-lock
  verdict: negative
  tested_src: research/HUNT_R18_EXITS.md
  tested_text: Our R18 tried five early-exit overlays on every arm's own exits and 0 of 60 tests passed.
- id: book.fm-basics-fin-math.3
  book: fm-basics-fin-math
  title: Only where the price is, not how it got there
  chapter: S17, Markov properties of Brownian motion
  text: 'In the standard model future moves are independent of the path so far: to predict the future you need only the current
    price, not the history, so patterns in the path carry no information about direction.'
  tags:
  - direction
  - pattern
  - candles
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: positive
  tested_src: research/HUNT_R16_PREDICTABILITY.md
  tested_text: Our R16 found direction over the next 15/30/60 minutes not predictable (holdout AUC 0.509-0.536), though the
    size of the move was.
- id: book.fm-basics-fin-math.4
  book: fm-basics-fin-math
  title: A level is touched about twice as often as it is finished beyond
  chapter: S14, reflection principle and Girsanov
  text: For a driftless random price the chance of touching a level before a deadline is about twice the chance of ending
    beyond it at the deadline; with drift a closed form follows from Girsanov's theorem. A sold strike is therefore touched
    far more often than it expires in the money.
  tags:
  - stop
  - target
  - option-selling
- id: book.fm-basics-fin-math.5
  book: fm-basics-fin-math
  title: Time decay is the price of gamma
  chapter: S13 Ito's formula and S22, Black-Scholes PDE
  text: 'The Black-Scholes equation ties time decay to gamma: a delta-hedged long option pays theta and earns it back only
    through the squared moves, so it profits only if realised volatility beats the implied volatility paid.'
  tags:
  - theta
  - straddle
  - iv
  - option-buying
  inst:
  - NIFTY
  - INDIAVIX
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found India VIX above NIFTY's next 21 days of realised volatility on 81% of days (n 4,507), the condition
    in which bought gamma loses on average.
- id: book.fm-basics-fin-math.6
  book: fm-basics-fin-math
  title: Moves scale with the square root of time
  chapter: S11, Brownian motion
  text: Under a random walk the variance of the move grows in proportion to elapsed time, so the typical move over a horizon
    scales with its square root; expected-move bands and straddle values follow this clock.
  tags:
  - straddle
  - iv
  - time-of-day
- id: book.fm-basics-fin-math.7
  book: fm-basics-fin-math
  title: Geometric Brownian motion called a very good model
  chapter: S16, Continuous time financial models
  text: Stock prices are modelled as geometric Brownian motion (percentage moves with constant volatility, no costs, continuous
    trading); the author calls it a very good model despite discrete prices, with no evidence offered.
  tags:
  - iv
  - vix
  inst:
  - NIFTY
  verdict: negative
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 measured NIFTY daily kurtosis of 14.1 over 5,087 days, far fatter-tailed than the normal returns this
    model assumes.
- id: book.fm-basics-fin-math.8
  book: fm-basics-fin-math
  title: 'Double or nothing: fair on average, ruin in practice'
  chapter: S4, Martingales
  text: 'A bettor who stakes everything on a fair double-or-nothing coin has expected wealth unchanged every round, yet is
    almost surely broke in the end: a fair expected value says nothing about survival under all-in sizing.'
  tags:
  - sizing
- id: book.fm-basics-fin-math.9
  book: fm-basics-fin-math
  title: A decision may use only the past
  chapter: S5 stopping times; S12 and S16 adapted holdings
  text: 'A valid trading rule is a stopping time: it can be decided with information available at that moment (''first time
    price reaches A''), while rules such as ''the last time price was above A'' need the future; trading P&L is only defined
    for holdings set before each price change.'
  tags:
  - ml
  - filter
- id: book.fm-basics-fin-math.10
  book: fm-basics-fin-math
  title: Mean-reverting process with explicit half-life
  chapter: S26, Hull-White and Cox-Ingersoll-Ross models
  text: A series pulled back toward a level at a fixed speed with random shocks has an explicit mean and variance at every
    horizon; the book uses it for interest rates (Hull-White can go negative, Cox-Ingersoll-Ross stays positive) and gives
    no trading rule.
  tags:
  - reversal
  - filter
- id: book.fm-optimal-control.1
  book: fm-optimal-control
  title: A cost per switch makes the best number of switches finite
  chapter: Ch. 2, Sections 2.7-2.8
  text: Without a switching cost, an in/out allocation that tracks a target keeps improving as switches are added, so the
    optimum chatters forever. Charging a fixed cost per switch gives an interior best number of switches, and a higher cost
    means fewer switches.
  tags:
  - costs
  - sizing
- id: book.fm-optimal-control.2
  book: fm-optimal-control
  title: 'Hysteresis: keep the current setting inside a band'
  chapter: Ch. 1, Section 1.6 (Blatt's indifference principle)
  text: With a cost per switch, the control need not flip the moment the other choice becomes better; it may stay put until
    the advantage crosses an indifference curve. In trading terms this is a dead-band around an on/off filter so it does not
    flip back and forth.
  tags:
  - costs
  - filter
- id: book.fm-optimal-control.3
  book: fm-optimal-control
  title: Switch cost too high or too low both fail
  chapter: Ch. 2, Table 2.2
  text: In the toy model, a switch cost of 0.02 made every extra switch worse, 0.0002 was too small to matter, and 0.002 gave
    a clear interior minimum. The authors conclude any investment strategy should count the cost of switching when deciding
    how often to flip.
  tags:
  - costs
- id: book.fm-optimal-control.4
  book: fm-optimal-control
  title: Diminishing returns from more switches
  chapter: Ch. 2 and Appendix B
  text: 'The tracking error fell from 0.0627 with 2 intervals to 0.0291, 0.0184 and 0.0134 with 4, 6 and 8: big gains at first,
    then small ones. Each extra switch buys less.'
  tags:
  - costs
- id: book.fm-optimal-control.5
  book: fm-optimal-control
  title: 'Optimisers get stuck: multi-start and warm start'
  chapter: Ch. 3 and Ch. 5, Table 5.3
  text: The authors' optimiser often stopped at a local minimum (one case gave J = 1.5791, nearly double a smaller case).
    Warm-starting from the smaller problem's answer or nudging the control fixed it; forcing extra switches did not, and an
    infeasible starting guess caused one failure.
  tags:
  - ml
- id: book.fm-optimal-control.6
  book: fm-optimal-control
  title: Starting order changes the answer on coarse grids
  chapter: Ch. 3, Section 3.6
  text: Starting the bang-bang control at -2 or at +2 gave very different results on coarse time grids and similar results
    on fine ones, so every ordering of the control values has to be tried.
  tags:
  - ml
- id: book.fm-optimal-control.7
  book: fm-optimal-control
  title: A flat middle state helps when the target oscillates
  chapter: Ch. 5, Section 5.3
  text: When the target path oscillates, a control limited to two extremes tracks it poorly; adding a do-nothing middle value
    (-1 / 0 / +1) tracks it better. It is the planning analogue of long / flat / short.
  tags:
  - filter
- id: book.fm-comp-finance-no-pain.1
  book: fm-comp-finance-no-pain
  title: Option price is the cost of the hedge
  chapter: Sec. 2.9, The option price
  text: The Black-Scholes price is what it costs a seller to run a self-financing delta hedge, not the option's expected payoff;
    it contains no drift. A buyer who holds without hedging is betting on the drift, which the author calls art, not science.
  tags:
  - option-buying
  - option-selling
  - iv
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: Our R102 found India VIX above NIFTY's forward 21-day realised volatility on 81% of days (median ratio 1.28,
    n 4,507), so the hedge cost usually priced more movement than came.
- id: book.fm-comp-finance-no-pain.2
  book: fm-comp-finance-no-pain
  title: Hedge error shrinks only with the square root of the interval
  chapter: Sec. 8.1, Delta Hedging
  text: In a Monte Carlo study of a short put hedged monthly, weekly and daily, the hedging error is centred near zero and
    its standard deviation is proportional to the square root of the rebalancing interval, so halving the error needs four
    times the rebalances. Costs are given as the reason to hedge rarely but are not simulated.
  tags:
  - option-selling
  - costs
- id: book.fm-comp-finance-no-pain.3
  book: fm-comp-finance-no-pain
  title: 'Unhedged put writing: steady wins, then a blow-up'
  chapter: Sec. 8.1, Delta Hedging
  text: With no hedge the writer usually keeps the whole premium because markets drift up, but the loss tail runs to several
    premiums; funds that write puts unhedged do well for years and then blow up in a sudden drop.
  tags:
  - option-selling
  - gap
  - stop
  inst:
  - NIFTY
  - BANKNIFTY
  verdict: negative
  tested_src: research/HUNT_R103_OPTIONS_SELLING.md
  tested_text: Our R103 confirmed 0 of 24 selling tests, and the naked BANKNIFTY 09:20 straddle's worst day was -29,257 rupees
    on one lot.
- id: book.fm-comp-finance-no-pain.4
  book: fm-comp-finance-no-pain
  title: Gamma hedging tightens the error but adds model risk
  chapter: Sec. 8.2, Gamma Hedging
  text: Adding a second, longer-dated option so the book is delta- and gamma-neutral gives a much narrower hedge-error distribution
    than delta hedging at the same weekly or daily rebalance, at the price of relying on the model's second derivative.
  tags:
  - option-selling
  - expiry
- id: book.fm-comp-finance-no-pain.5
  book: fm-comp-finance-no-pain
  title: Delta-vega hedging at current implied vol
  chapter: Sec. 8.3, Vega Hedging
  text: The industry's simple fix for changing volatility is to recompute delta and vega at today's implied vol on each rebalance
    and hold another option against vega; even when volatility is truly random this constant-vol vega hedge works surprisingly
    well (Hull and White).
  tags:
  - iv
  - vix
  - option-selling
- id: book.fm-comp-finance-no-pain.6
  book: fm-comp-finance-no-pain
  title: Delta hedging cannot remove jump risk
  chapter: Sec. 9, Jump Diffusion
  text: Real returns have taller peaks and fatter tails than the normal; a delta hedge removes the small moves but not the
    jumps, and option prices imply larger and more frequent jumps than history, i.e. a premium for jump risk.
  tags:
  - gap
  - option-selling
  - iv
  verdict: positive
  tested_src: research/DEEP_NIFTY_BANKNIFTY.md
  tested_text: 'Our R102 measured NIFTY daily returns with kurtosis 14.1 over 5,087 days: fat tails, as the notes say.'
- id: book.fm-comp-finance-no-pain.7
  book: fm-comp-finance-no-pain
  title: Monte Carlo needs error bars and a time-step check
  chapter: Sec. 4, Monte Carlo Methods
  text: Simulation error falls only with the square root of the number of paths (ten times the accuracy needs a hundred times
    the paths), and a one-day step adds its own bias that more paths never fix; antithetic pairs can make non-monotone payoffs
    worse.
  tags:
  - ml
- id: book.fm-comp-finance-no-pain.8
  book: fm-comp-finance-no-pain
  title: Estimated expected returns are mostly noise
  chapter: Sec. 11.4, Criticism
  text: Mean-variance weights depend on expected returns that short series cannot pin down; studies find plain equal weights
    (1/N) do about as well once estimation error is counted.
  tags:
  - sizing
  verdict: weak
  tested_src: research/HUNT_H15.md
  tested_text: Our H15 found the Kelly fraction unstable because it was estimated on the same 10 regime months the bootstrap
    resamples.
- id: book.fm-neftci-derivatives.1
  book: fm-neftci-derivatives
  title: Option prices do not forecast direction
  chapter: Ch. 14 sec. 6 and Ch. 15, Which Probabilities?
  text: An option's fair value comes from copying it with the underlying and cash, so the underlying's expected return never
    enters the price; the risk-neutral odds that price options give poor forecasts because under them everything grows at
    the risk-free rate, so forecasts must use real-world odds.
  tags:
  - iv
  - direction
  - option-buying
- id: book.fm-neftci-derivatives.2
  book: fm-neftci-derivatives
  title: Delta hedging covers only small moves
  chapter: Ch. 4 sec. 2.2 and Ch. 12 sec. 3, Accuracy of the Method
  text: Holding an option against delta units of the underlying cancels only small moves; on a large move the option's curvature
    makes the hedge miss, it needs continuous re-hedging with no costs, and because delta keeps changing the hedged book is
    not self-financing, its cash leak averaging out only under risk-neutral odds.
  tags:
  - option-selling
  - theta
  - costs
- id: book.fm-neftci-derivatives.3
  book: fm-neftci-derivatives
  title: Rare events keep their size; ordinary moves shrink
  chapter: Ch. 8, The Wiener Process and Rare Events
  text: Ordinary moves get smaller as the observation window shrinks, but a rare event such as a crash is about the same size
    over ten minutes or a whole day while its chance shrinks; both give variance proportional to time, so variance alone cannot
    tell them apart, and only for jumps do skew and kurtosis still matter over short intervals.
  tags:
  - gap
  - vix
  - stop
- id: book.fm-neftci-derivatives.4
  book: fm-neftci-derivatives
  title: Normal VaR is wrong when jumps are routine
  chapter: Ch. 8 sec. 1.1 and 2.4
  text: Value at Risk can rely on the normal distribution only if sudden jumps are not a regular part of the market; where
    they are, the loss estimate must model the jump process, and commodity futures jump more often than financial ones because
    a single report, such as a crop report, can reprice them.
  tags:
  - stop
  - sizing
  - mcx
  - news
- id: book.fm-neftci-derivatives.5
  book: fm-neftci-derivatives
  title: Moves scale with the square root of time
  chapter: Ch. 7 sec. 4, The Size of Incremental Errors
  text: If risk neither vanishes with finer sampling nor explodes with more frequent trading, and no single instant holds
    all of it, the variance of price news grows in proportion to the window, so the typical move scales with the square root
    of time and the drift is negligible over short windows.
  tags:
  - vix
  - time-of-day
- id: book.fm-neftci-derivatives.6
  book: fm-neftci-derivatives
  title: Black-Scholes assumptions, and why it survives
  chapter: Ch. 13 sec. 3 and Ch. 16 sec. 1
  text: Black-Scholes assumes a constant rate and volatility, no dividends, European exercise and no transaction costs or
    indivisibilities; the author adds that it stays reasonably accurate when volatility or rates are random and suits short-dated
    options, which is why practitioners keep using it.
  tags:
  - iv
  - costs
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-neftci-derivatives.7
  book: fm-neftci-derivatives
  title: Ladder, lookback and knock-out payoffs
  chapter: Ch. 13 sec. 4, Exotic Options
  text: A ladder option locks in its gain each time the underlying crosses a preset level, a lookback pays against the best
    price seen during its life and so costs more than a plain option, and a knock-out dies when a barrier is touched; such
    features change only the boundary conditions of the pricing equation.
  tags:
  - profit-lock
  - stop
- id: book.fm-neftci-derivatives.8
  book: fm-neftci-derivatives
  title: 'Optimal stopping: compare with continuing optimally'
  chapter: Ch. 22 sec. 6, A Simple Example
  text: 'The right time to stop (exercise or exit) is found backward: each state''s value is the larger of stopping now and
    continuing optimally; judging only the next step undervalues continuing (in the example a payoff of 8 against a one-step
    expectation of 3), and the stopping points are where the payoff touches its envelope.'
  tags:
  - target
  - stop
- id: book.fm-neftci-derivatives.9
  book: fm-neftci-derivatives
  title: Maximising expected value can ruin you
  chapter: Ch. 22 Exercises 1-2 and the Solution Manual
  text: In a double-or-nothing game whose expected reward keeps rising with every toss, maximising expected value says never
    stop, yet the player ends with nothing with probability one; expected value suits many repeated plays, not a single bankroll.
  tags:
  - sizing
- id: book.fm-neftci-derivatives.10
  book: fm-neftci-derivatives
  title: Cash-and-carry versus consumption commodities
  chapter: Ch. 1 sec. 3 and Ch. 4 sec. 2.1; Solution Manual Ch. 1
  text: In cash-and-carry markets such as gold and silver the futures price is set by spot, interest, storage and insurance,
    and news moves spot and futures alike; for consumption goods only a band holds because holders will not sell the physical,
    and storing crude oil can be very costly.
  tags:
  - mcx
  inst:
  - GOLD
  - SILVER
  - CRUDE
- id: book.fm-wilmott-howison-dewynne.1
  book: fm-wilmott-howison-dewynne
  title: An option's price carries no view on direction
  chapter: Ch. 3.5 and 5.6, The Black-Scholes analysis; Risk neutrality
  text: The asset's expected growth drops out of the hedged-option equation, so two traders who disagree about direction still
    agree on the option's value. Delta is not the probability of finishing in the money and the real drift is not the interest
    rate; the real probability needs a real drift forecast.
  tags:
  - direction
  - iv
  verdict: negative
  tested_src: research/HUNT_R104_BOOKS.md
