- id: book.sadowski-9-strategies.9
  book: sadowski-9-strategies
  title: RSI(2) momentum with pyramiding
  chapter: Strategy 9, 2-period RSI
  text: Buy when the 2-period RSI rises above 90 and sell when it falls below 10, which is the momentum reading, not the usual
    mean-reversion one. Add on each repeat trigger while trending and close everything on the opposite signal. The author
    warns it whipsaws in ranges and needs a strict stop.
