- id: book.fm-elliott-fin-markets.10
  book: fm-elliott-fin-markets
  title: 'Put-call parity: a gap usually means a stale price'
  chapter: Ch. 1.1 and 1.6, Call-put parity; Bounds on option prices
  text: Call minus put at one strike must equal spot minus the discounted strike, and the chain gives an implied rate or forward
    this way; a gap beyond the spread is an arbitrage that real markets close quickly, so in historical data it usually points
    to a stale quote.
