  - swing
- id: book.trader-tom-first-manual.6
  book: trader-tom-first-manual
  title: Four-bar fractal entry
  chapter: Trade Entry Technique 4 Bar Fractal
  text: Buy when a bar closes above the high of the previous bar and above the high of the bar three back (sell is the mirror);
    it catches some trends but brings many small wins and losses.
  tags:
  - momentum
  - pattern
