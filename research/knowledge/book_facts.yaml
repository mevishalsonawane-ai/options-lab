- id: book.fm-fabozzi-modelling.4
  book: fm-fabozzi-modelling
  title: SPAN-style scenario grid before selling options
  chapter: Ch. 21 and 23, Scenario analysis and SPAN
  text: Price the whole option book under a fixed grid of price and volatility moves; SPAN uses 16 scenarios and takes the
    worst of 14 ordinary ones or 35% of the loss in the 2 extreme ones. Scenarios must include extremes and respect correlations.
    Use it as a risk-lowering pre-trade check.
