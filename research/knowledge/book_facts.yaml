- id: book.aziz-advanced-day-trading.10
  book: aziz-advanced-day-trading
  title: Previous day close and Y / YY highs-lows
  chapter: Ch. 4, Support and Resistance
  text: The previous day close is called the most important level, followed by yesterday's and two days ago's high and low,
    pre-market high/low and daily moving averages; levels are areas, and diagonal trend lines are rejected.
