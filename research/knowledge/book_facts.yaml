- id: book.bennett-trading-volatility.3
  book: bennett-trading-volatility
  title: 'Call overwriting: short expiry, slightly OTM, on the index'
  chapter: Ch. 1.4, Call overwriting
  text: Overwriting an index with the shortest expiry and a slightly out-of-the-money call (about a 103-104% strike for one
    month, or a fixed 25-delta call) has done best; it lags in low-volatility bull markets and its downside is the same as
    a plain long position.
  tags:
  - option-selling
  - theta
- id: book.bennett-trading-volatility.4
  book: bennett-trading-volatility
  title: Put underwriting at a level you would buy
  chapter: Ch. 1.2, Put underwriting
  text: Selling a put at the level where you would happily buy earns premium for analysis that would otherwise be wasted;
    if you only want the premium, choose an out-of-the-money strike at a support level that should hold. It collects both
    the volatility premium and overpriced skew.
  tags:
  - option-selling
  - iv
- id: book.bennett-trading-volatility.5
  book: bennett-trading-volatility
  title: Volatility rules of thumb
  chapter: Ch. 2.1, Option trading rules of thumb
  text: Annual volatility is about 16 times the typical daily percentage move, an at-the-money option is worth about 0.4 x
    volatility x the square root of time, and a delta-hedged option's profit grows with the square of the move while its daily
    carry depends on realised minus implied volatility.
  tags:
  - iv
  - theta
- id: book.bennett-trading-volatility.6
  book: bennett-trading-volatility
  title: 'Gamma scalping: when to re-hedge'
  chapter: Ch. 2.1 and 3.5, Delta hedging
  text: 'A long-gamma trader re-hedges delta to lock in gains: hedge less often in trending markets, more often in choppy
    ones, and just before a known announcement. Hedging four times as often halves the noise of the result, but a cheaply
    bought option can still lose when hedged discretely.'
  tags:
  - scalp
  - iv
  - trend
