- id: book.aziz-advanced-day-trading.12
  book: aziz-advanced-day-trading
  title: The 2% and 6% rules
  chapter: Ch. 7, Position Sizing
  text: Never risk more than 2% of account equity (not buying power) on one trade, with 0.5-1% advised and 1% used by the
    author; stop live trading for the month once losses reach 6%; never average down.
  tags:
  - sizing
  - stop
- id: book.aziz-advanced-day-trading.13
  book: aziz-advanced-day-trading
  title: Risk/reward gate of at least 2:1
  chapter: Ch. 7, Risk/Reward Analysis
  text: Take a trade only if the reward to the next level is at least 2 times the risk to a technical stop such as VWAP; never
    tighten the stop just to fix the ratio, and treat a late entry with a worse ratio as a missed trade.
  tags:
  - filter
  - target
  - stop
- id: book.aziz-advanced-day-trading.14
  book: aziz-advanced-day-trading
  title: Strategies by time of day, and the 30% rule
  chapter: Ch. 6, One Stock in Play, All Strategies
  text: Flags, ORB, ABCD and Fallen Angel belong to the Open, VWAP reversals and false breakouts to the Late-Morning, VWAP
    trends to Mid-day and the Close; never give back more than 30% of the Open's profit later in the day.
  tags:
  - time-of-day
  - profit-lock
- id: book.aziz-advanced-day-trading.15
  book: aziz-advanced-day-trading
  title: Level 2 read backwards
  chapter: Ch. 5, Understanding Nasdaq Level 2 Signals
  text: A big bid near the inside market is read as bearish (a patient buyer expecting lower prices) and a big ask as bullish;
    large orders far from the inside are fake and ignored, and Level 2 is never traded alone.
  tags:
  - order-flow
  - big-players
  - traps
- id: book.douglas-trading-in-the-zone.1
  book: douglas-trading-in-the-zone
  title: Five truths of thinking in probabilities
  chapter: Ch. 7, Eliminating the Emotional Risk
  text: Anything can happen; you do not need to know what happens next to make money; wins and losses are randomly distributed
    for any edge; an edge is only a higher probability; every moment is unique. The book offers no system of its own and assumes
    the reader already has a real edge.
  tags:
  - direction
- id: book.douglas-trading-in-the-zone.2
  book: douglas-trading-in-the-zone
  title: 'Be the casino: judge a series, not a trade'
  chapter: Ch. 7, Probabilities Paradox
  text: A casino cannot predict any hand yet keeps about 4.5 percent of what is wagered over many hands; a trader with an
    edge should likewise accept that each trade is uncertain while a long series is predictable.
  tags:
  - direction
  - sizing
- id: book.douglas-trading-in-the-zone.3
  book: douglas-trading-in-the-zone
  title: A losing streak says nothing about the next trade
  chapter: Ch. 5 and Ch. 7
  text: Each trade is statistically independent, so the last two or three results should not make a trader hesitate (after
    losses) or load up (after wins).
  tags:
  - sizing
  - filter
  verdict: positive
  tested_src: research/HUNT_R75_DONCHIAN_LESS_LOSS.md
  tested_text: 'Our R75 agrees: stopping a Donchian book after 2 losses in a row skipped 1,260 losers (Rs 14.6 lakh) but also
    928 winners (Rs 14.3 lakh) in design, so the streak did not predict the next trade.'
- id: book.douglas-trading-in-the-zone.4
  book: douglas-trading-in-the-zone
  title: Pre-define the risk of every trade
  chapter: Ch. 6 and Ch. 11, Stop-Loss Exit
  text: Decide before entry exactly where the trade is shown not to work, set by market structure rather than a money amount
    you feel like risking, and exit there without hesitation; losses are the cost of doing business.
  tags:
  - stop
- id: book.douglas-trading-in-the-zone.5
  book: douglas-trading-in-the-zone
  title: A stop placed is not a risk accepted
  chapter: Ch. 7, Trading in the Moment
  text: A fund manager put in a stop but bailed out at his entry when the market came back, and then missed a 500-point run
    his way; exiting early to avoid being wrong is a sign the risk was never accepted.
  tags:
  - stop
  - target
- id: book.douglas-trading-in-the-zone.6
  book: douglas-trading-in-the-zone
  title: Take every signal of your edge
  chapter: Ch. 7 and Ch. 8, truth 4
  text: Do not pick and choose which signals to take or gather other evidence for or against a trade; that adds random variables
    and makes it impossible to learn whether the edge works.
  tags:
  - filter
- id: book.douglas-trading-in-the-zone.7
  book: douglas-trading-in-the-zone
  title: Judge an edge on 20 trades or more
  chapter: Ch. 11, Trading in Sample Sizes
  text: 'Never judge an edge on the last trade; trade it for a sample of at least 20 trades without changing its variables.
    The book says 20 is enough for a fair test yet small enough to spot a fading edge (our arithmetic: with no edge, 12 or
    more wins in 20 still happens 25.17% of the time).'
  tags:
  - sizing
- id: book.douglas-trading-in-the-zone.8
  book: douglas-trading-in-the-zone
  title: Size so 20 straight losses are bearable
  chapter: Ch. 11, Accepting the Risk
  text: Multiply the risk per trade by 20 and make sure you can accept that sum; if not, cut the position (for example 3 S&P
    contracts at a 3-point stop is $2,250 a trade and $45,000 for 20), never the stop distance.
  tags:
  - sizing
  - stop
- id: book.douglas-trading-in-the-zone.9
  book: douglas-trading-in-the-zone
  title: Scale out in thirds, stop to entry
  chapter: Ch. 11, Taking Profits
  text: Take a third off at a small first profit, a third at the next longer-timeframe level while moving the stop to entry,
    and the last third just before the next significant high or low; the aim is a trade that can no longer lose.
  tags:
  - target
  - profit-lock
  verdict: negative
