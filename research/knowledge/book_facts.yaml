- id: book.swing-practical-guide.13
  book: swing-practical-guide
  title: Three hand-picked winners
  chapter: Ch. 11, Case studies
  text: 'The three worked trades from spring 2002 all made money: +4.63%, +2.49% and +9.37%. No losers, sample sizes or backtest
