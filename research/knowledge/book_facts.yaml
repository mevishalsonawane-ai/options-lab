- id: book.fm-musiela-martingale.1
  book: fm-musiela-martingale
  title: The option price ignores the real odds
  chapter: Ch. 1.4, One-period spot market
  text: In a one-period example (stock 280 going to 320 or 260, rate 5%, strike 280) the call's only arbitrage-free price
