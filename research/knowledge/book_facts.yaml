- id: book.fm-lyuu-fin-engineering.5
  book: fm-lyuu-fin-engineering
  title: Price options on futures with the Black model
  chapter: Ch. 12.4.2, The Black model
  text: Options on futures are priced by Black-Scholes with the futures price in place of spot and the dividend yield set
    equal to the interest rate, so no dividend forecast is needed; a European futures option equals the option on the cash
    asset when maturities match.
