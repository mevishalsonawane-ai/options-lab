  - gap
  inst:
  - NIFTY
  - BANKNIFTY
- id: book.fm-kabanov-stochastic-calculus.2
  book: fm-kabanov-stochastic-calculus
  title: Intraday volatility follows the clock; normalise by time-of-day
  chapter: Paper 4, Bingham and Schmidt, section 4.1
  text: On 15-minute stock data (n = 36,855 bars) returns were not autocorrelated but squared returns were, with high volatility
