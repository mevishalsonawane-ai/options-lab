- id: book.fm-intro-quant-finance.4
  book: fm-intro-quant-finance
  title: Greeks from any repricer by central differences
  chapter: Ch. 9.7 and 9.8.7, Numerical derivatives and the Greeks
  text: 'Reprice up and down and divide by twice the step to get delta with error shrinking as the step squared; gamma uses
    up, down and centre prices. Check against the closed forms: call delta = N(d1), put delta = N(d1) - 1, gamma the same
    for both.'
  tags:
