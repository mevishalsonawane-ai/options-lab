    better in the other, no consistent value.
- id: book.douglas-trading-in-the-zone.12
  book: douglas-trading-in-the-zone
  title: Winning streaks breed oversized trades
  chapter: Ch. 3, Winners, Losers, Boomers and Busters
  text: Euphoria after a run of wins (even 15 or 20 in a row) leads traders to put on larger-than-usual positions and give
    it back; the book calls the 40 to 50 percent of traders who cycle like this boom-and-busters (no data given).
  tags:
  - sizing
