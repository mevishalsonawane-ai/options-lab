  book: heitkoetter-day-trading
  title: High win rate as a goal
  chapter: Power Principles 3 and 8
  text: A robust system should show 60-80% winners, a profit factor of 1.3-2.5 and a drawdown of 10-20% of the yearly profit;
    beginners should want more than 65% winners.
