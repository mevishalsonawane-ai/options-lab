- id: book.fm-fabozzi-modelling.7
  book: fm-fabozzi-modelling
  title: Breadth beats more direction bets
  chapter: Ch. 19, Fundamental law of active management
  text: Information ratio is roughly skill (IC) times the square root of independent bets a year; a market timer with few
    bets needs a high IC. Seek many independent contracts or days rather than more trades on the same move.
  tags:
