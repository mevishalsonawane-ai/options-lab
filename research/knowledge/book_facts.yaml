  book: fm-lyuu-fin-engineering
  title: Futures fair value and the cost of carry
  chapter: Ch. 12.3.3-12.3.5, Stock index futures; cost of carry
  text: An index future should trade at spot times e to the (r - q)T; gold and silver (held for investment) should sit at
