- id: book.heitkoetter-day-trading.11
  book: heitkoetter-day-trading
  title: Support and resistance swap roles
  chapter: Step 3, Support & Resistance
  text: Buy near support and sell near resistance that is unlikely to break; once broken, old support becomes resistance and
    old resistance becomes support.
  tags:
  - reversal
  - filter
  inst:
