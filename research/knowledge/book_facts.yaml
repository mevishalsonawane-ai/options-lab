- id: book.bennett-trading-volatility.1
  book: bennett-trading-volatility
  title: Implied volatility is usually above realised
  chapter: Ch. 1.4 and 3.1, Implied volatility should be above realised
  text: Implied volatility trades on average 1-2 points above the volatility later realised, more for indices than single
    stocks, because hedgers buy protection, sellers of cheap options demand a margin, short-dated options carry gap risk and
    structured products lift index implieds.
