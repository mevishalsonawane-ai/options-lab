- id: book.fm-intro-quant-finance.3
  book: fm-intro-quant-finance
  title: Realised volatility is a noisy estimate when tails are fat
  chapter: Ch. 7.5.2 and 8.3, Sample moments
  text: The error of a sample variance depends on the fourth moment, so with NIFTY kurtosis 14.1 and BANKNIFTY 8.5 a 20- or
    21-day realised vol is much noisier than the normal formula says; compare it with VIX or IV over many days, not one.
  tags:
