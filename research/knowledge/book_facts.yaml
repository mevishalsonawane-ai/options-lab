  book: bennett-trading-volatility
  title: Selling volatility is partly paid equity risk
  chapter: Ch. 3.1, Short vol has similar risk and return to long equity
  text: Part of the profit from selling volatility is pay for carrying equity risk, because volatility rises when markets
    fall; the trade is crowded, should be less profitable than before, and a back-test of it is not a reliable forecast.
