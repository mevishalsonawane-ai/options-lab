- id: book.fm-capinski-math-finance.1
  book: fm-capinski-math-finance
  title: Direction does not enter an option's price
  chapter: Ch. 1.6 and 8.3, Remarks 1.2, 8.1, 8.2
  text: An option's fair price comes from copying its payoff with the underlying and cash, so neither the real chance of an
    up move nor the expected return of the underlying appears in it (Black-Scholes has no drift term); a directional view
    changes what a buyer expects to earn, not what the option is worth.
