- id: book.aziz-advanced-day-trading.11
  book: aziz-advanced-day-trading
  title: Higher highs/lows and engulfing as exits
  chapter: Ch. 5, Candlestick Patterns
  text: 'Only two candle patterns are trusted on 5-minute charts: two-bar higher highs and higher lows (or the mirror) and
    engulfing; a short is wrong once the chart stops making new lows and turns to higher highs and higher lows.'
