- id: book.fm-structured-finance.4
  book: fm-structured-finance
  title: Filtered historical simulation for risk
  chapter: Ch. 9.4, historical and filtered historical simulation
  text: Plain historical simulation assumes past days are independent, so a calm window understates risk going into a volatile
    one; the fix is to standardise past shocks by a GARCH volatility and rebuild paths from today's volatility before reading
    the loss percentile.
  tags:
  - sizing
- id: book.fm-structured-finance.5
  book: fm-structured-finance
  title: Expected shortfall over VaR for option books
  chapter: Ch. 9.3, value-at-risk and risk measures
  text: For books with options, normal-distribution VaR fails because squared moves are not normal; simulate the profit and
    loss instead, and prefer expected shortfall (the average loss beyond the VaR level), which also works better as a sizing
    constraint.
  tags:
  - sizing
  - option-selling
- id: book.fm-structured-finance.6
  book: fm-structured-finance
  title: Correlations rise in sell-offs
  chapter: Ch. 3.10-3.12, tail dependence and correlation asymmetry
  text: Equity correlations are higher in falling markets than rising ones, and a Gaussian model has no tail dependence, so
    it understates how often markets crash together; Student t or Clayton dependence captures joint crashes.
  tags:
  - sizing
- id: book.fm-structured-finance.7
  book: fm-structured-finance
  title: AND conditions are long correlation, OR conditions short
  chapter: Ch. 3.7 and 6.5, the AND/OR rule
  text: A payoff that needs event A AND event B gains when the two are more correlated; one that pays on A OR B loses value
    as correlation rises. A call on the worst of several assets is long correlation, on the best short.
  tags:
  - filter
  - breadth
- id: book.fm-structured-finance.8
  book: fm-structured-finance
  title: 'Monte Carlo: report the error, reuse the random draws'
  chapter: Ch. 6.6, Monte Carlo method
  text: Monte Carlo error falls with the square root of the number of paths, so four times the paths only halves it; when
    comparing two cases, use the same random draws for both (common random numbers), and use antithetic or control variates
    to cut noise.
  tags:
  - sizing
- id: book.fm-structured-finance.9
  book: fm-structured-finance
  title: Model hedge ratios can break overnight
  chapter: Ch. 8.6.3, delta-hedged equity blues
  text: In May 2005 funds hedging CDO equity tranches with the higher-carry mezzanine hedge lost on both legs after a small
    3 bp index move; hedge ratios from a model are unstable and a hedge chosen for its carry hides basis risk.
  tags:
