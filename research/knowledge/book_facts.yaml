- id: book.ozenbas-liquidity-markets.8
  book: ozenbas-liquidity-markets
  title: Visible depth is only part of liquidity
  chapter: Ch. 2.7, Liquidity
  text: 'Liquidity has depth, breadth and resiliency, and much of it is latent: hidden, conditional or held back by traders
    and algorithms. Posted orders can be measured but latent liquidity cannot, so the screen book understates and misstates
    what is really there.'
