- id: book.douglas-trading-in-the-zone.10
  book: douglas-trading-in-the-zone
  title: Aim for 3:1 reward to risk
  chapter: Ch. 11, Taking Profits
  text: With a 3:1 reward-to-risk ratio a trader can win fewer than half the trades and still make money; the win rate alone
    says little.
  tags:
  - target
  - stop
  - option-buying
  verdict: negative
  tested_src: research/FINDINGS.md
  tested_text: Our test of a fixed 3:1 option rule (target +10%, stop -3.3% of premium) won 19-31% of trades against about
    28% needed after costs, because 73% of trades hit the stop in ordinary noise.
- id: book.douglas-trading-in-the-zone.11
  book: douglas-trading-in-the-zone
  title: Buy dips in the daily trend
  chapter: Ch. 11, Time Frame
  text: 'The example filter: if the daily chart makes higher highs and higher lows, only buy pullbacks to 30-minute support;
    in a daily downtrend only sell rallies to 30-minute resistance.'
  tags:
  - trend
  - filter
  - swing
