id: book-porwal-10
title: 'Bull trap: failed break of the day high reclaimed with a volume spike, go short (Nikhil Porwal, book rule, proposed)'
family: flow-oi
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 5.3) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price and volume (futures volume). Entry:
  After 10:00, a 5-minute bar closes above the running day high (break) on futures volume below its 20-bar average (weak break).
  Within 6 bars, a red bar closes back below the broken day high with volume >= 2x its 20-bar average: short at the next open.
  Stop: Above the highest high since the break. Exit: Target the last 5-minute swing low before the break (previous higher
  low), else 2R; trail by 3-bar highs; square-off 15:15.'
