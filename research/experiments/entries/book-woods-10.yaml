id: book-woods-10
title: Fade the breakout of a doji-like or counter-trend outside bar (Galen Woods, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Galen Woods''s rule from How to Trade Price Action (Ch. 4.9) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Outside bar (higher high and lower low than the
  previous bar) with body <= 30% of range, or closing against the EMA 20 trend; when a later bar breaks its high, sell at
  the first close back inside the outside bar''s range (mirror for a break of its low). Stop: The breakout bar''s extreme.
  Exit: The opposite end of the outside bar; else square-off.'
