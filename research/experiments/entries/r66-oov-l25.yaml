id: r66-oov-l25
title: 'R66 OOV L25 Boss: A4 + stop +5% once +25%'
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R66_LOCK_AT_25.md
hypothesis: 'Boss (16 Oct): once the option is +25%, moving the stop to +5% (on top of the A4 30/60/100 ladder) improves the
  paper arms after real costs, because trades that reach +25% no longer come back to the -15% stop. This variant: L25 Boss:
  A4 + stop +5% once +25%; gates as R51 (BH over 15 tests); recommended only if it also beats B0 and A4 everywhere and random
  early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 / R65 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: index 5-min bar + previous day''s value area (unchanged); only the option exits differ (stops and locks
  on the premium)'
model_or_rule: 'R52 Open outside value (previous day''s value area + first 5-min bar, 1-ITM at 09:20, 5 indices); exits: L25
