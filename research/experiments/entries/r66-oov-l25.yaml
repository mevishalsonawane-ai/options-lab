    293 trades, win 52%, net Rs 48,612 (Rs 166/trade), worst day -Rs 16,554, max DD Rs 47,194, stops 14; entry-twin p 0.01,
    BH q 0.0115, exit-twin p 0.499 (q 0.499). Verdict: PASS. Versus B0: design Rs 13,436 (bootstrap p 0.1965), final -Rs 343
