id: book-douglas-05
title: Skip any arm signal whose first target is less than 3x its stop distance (Mark Douglas, book rule, tested in R104)
family: daily-filters
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Mark Douglas''s rule from Trading in the Zone (Ch. 11 (Taking Profits)) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price (index distance to the arm''s target vs its
  stop). Entry: The arm''s signal, taken only when (index distance to the arm''s target or next level) >= 3 x (index distance
  to its stop). Stop: Unchanged. Exit: Unchanged.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: ARM 2024-11-20 - 2026-03-31
  holdout: ARM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price (index distance to the arm's target vs its stop)
- the arm's own bars
model_or_rule: 'The arm''s signal, taken only when (index distance to the arm''s target or next level) >= 3 x (index distance
  to its stop). | stop: Unchanged. | exit: Unchanged. | filters: The 3:1 ratio at the signal time, on the index.'
settings: 'research/books/TESTABLE_RULES.md, rule book-douglas-05; trade: as the arm'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'ARM (the arm''s index signal (overlay / filter)), variant base: design 171 trades, win 37% (B0 44%), net -Rs 12,408
    vs B0 Rs 257,249 (delta -Rs 269,657), quarters -Rs 94,720, -Rs 16,838, -Rs 14,562, -Rs 129,620; p 1.000, BH q 1.000; final
    delta -Rs 8,616. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: A fixed 3:1 premium rule (target +10%, stop -3.3%) won 19-31%
  vs about 28% needed (MANUAL_METHOD.md). R80: 0 of 10 entry filters on Liquidity passed. An index-level 3:1 filter is not
  tested by us.. Assumptions: The book calls 3:1 ideal, not required; using it as an entry filter is our most literal mechanical
  reading. Only arms with an index target or level (Liquidity, ORB-type) can use it.'
