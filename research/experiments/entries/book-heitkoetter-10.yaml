model_or_rule: 'At 09:30, if the 09:15-09:30 bar closed above its open, long; if below, short. If the long reaches the previous
  day''s high, close and reverse short with the previous day''s low as target (mirror for shorts). | stop: The far end of
  the first 15-minute bar (stands in for the book''s trendline from yesterday''s high) | exit: Target previous-day high (long)
  / low (short); 15:10 square-off | filters: skip if the open is already beyond the previous-day level in the trade''s direction'
