id: book-heitkoetter-10
title: First 15-minute bar direction, previous-day high/low target, then reverse (Markus Heitkoetter, book rule, proposed)
family: orb
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Markus Heitkoetter''s rule from A Complete Guide to Day Trading (Step 5, Stop Losses (technical) and Profit-Taking
  (technical)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying
  price. Entry: At 09:30, if the 09:15-09:30 bar closed above its open, long; if below, short. If the long reaches the previous
  day''s high, close and reverse short with the previous day''s low as target (mirror for shorts). Stop: The far end of the
  first 15-minute bar (stands in for the book''s trendline from yesterday''s high) Exit: Target previous-day high (long) /
  low (short); 15:10 square-off'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
