id: book-aziz-04
title: 'VWAP moving-average trend: below VWAP and riding the 5-minute 20 EMA after the Late-Morning (Andrew Aziz, book rule,
  proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, VWAP Moving Average Trend) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume. Entry:
  From 11:00 to 13:30: the last 6 five-minute closes all below VWAP and the 20 EMA falling; a 5-minute bar''s high touches
  the 9 or 20 EMA and the bar closes below both -> short at that close. Mirror long above VWAP. Stop: a 5-minute close above
  the 20 EMA Exit: Exit on a 5-minute close above the 20 EMA; take a quarter when the close is more than 1 x the 14-bar 5-minute
  ATR beyond the 20 EMA and move the stop to entry; time exit 15:00 (the book: trends end around 3 p.m.).'
