notes: 'R104 (227 tests, BH across all). the book''s wider pattern stop (README pick 3) R104 (227 tests, BH across all). the
  book''s wider pattern stop (README pick 3) Our nearest test: Not tested in this form. R87B: green-green-red on SENSEX 15m
  held out of sample (+0.259 ATR, n 182) but the call rule with a stop under the red candle lost -Rs 21,127 on 162 trades;
