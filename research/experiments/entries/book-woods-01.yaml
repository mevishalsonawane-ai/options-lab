id: book-woods-01
title: Three-bar pullback in a trend, buy above the next bar in the trend's direction (Galen Woods, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Galen Woods''s rule from How to Trade Price Action (Ch. 4.7) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Uptrend: three consecutive bearish bars (close <
  open); the next bullish bar is the signal bar; buy stop 1 tick above its high, valid for the next bar only. Downtrend mirror:
  three bullish bars, then a bearish signal bar, sell stop 1 tick below its low. Stop: Pattern stop: the lowest low of the
  three pullback bars and the signal bar (highest high for shorts), on the underlying. Exit: Book gives no target; use the
  nearest opposing swing high/low (Ch. 7.3) as the target; else the session square-off (15:10, 15:05 on expiry; MCX 10 minutes
  before close).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31; MCXI 2025-10-20 - 2026-07-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once); MCXI 2026-08-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- CRUDE
- GOLD
features:
- underlying price
- 5-minute and 15-minute bars
model_or_rule: 'Uptrend: three consecutive bearish bars (close < open); the next bullish bar is the signal bar; buy stop 1
  tick above its high, valid for the next bar only. Downtrend mirror: three bullish bars, then a bearish signal bar, sell
  stop 1 tick below its low. | stop: Pattern stop: the lowest low of the three pullback bars and the signal bar (highest high
  for shorts), on the underlying. | exit: Book gives no target; use the nearest opposing swing high/low (Ch. 7.3) as the target;
  else the session square-off (15:10, 15:05 on expiry; MCX 10 minutes before close). | filters: Trend up = close above EMA
  20 and EMA 20 rising over the last 5 bars (Ch. 1.5 names the 20-period EMA as the usual price-action trend tool); mirror
  for down. Entries 09:30-14:30.'
settings: 'research/books/TESTABLE_RULES.md, rule book-woods-01; trade: buy 1-ITM CE on a long signal, 1-ITM PE on a short;
  stops/targets on the underlying as the book states; premium safety stop as in our standard engine'
prereg: research/hunt/r104_books/PREREG.md
