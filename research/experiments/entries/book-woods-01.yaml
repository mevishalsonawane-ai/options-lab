notes: 'Our nearest test: Not tested in this form. R87B: green-green-red on SENSEX 15m held out of sample (+0.259 ATR, n 182)
  but the call rule with a stop under the red candle lost -Rs 21,127 on 162 trades; R96 P1 MCX pullback in trend Rs 1.08 lakh
  on 35, twin p 0.164 (lead only).. Assumptions: Book does not define the trend; EMA 20 slope chosen. Book does not state
  a stop for this pattern; Ch. 7 general pattern stop applied to the whole pullback (not just the signal bar, which R87B showed
  is too tight). Target from Ch. 7.3.'
