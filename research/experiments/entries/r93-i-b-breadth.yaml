hypothesis: 'Boss (21 Oct): does Breadth Donchian work on commodities? I-B (complex breadth (5-minute)) earns after real MCX
  costs, beats random entries on the same days and sides (twin p < 0.05, BH q <= 0.10 over 5 variants), in design, walk-forward
  and the locked holdout.'
