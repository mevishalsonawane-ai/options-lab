id: r30-q4-gap
title: 'R30 neural nets: next-morning gap direction from the 15:20 state (Night arm), rule R13'
family: overnight
date: '2026-10-14'
doc: research/HUNT_R30_NEURAL_NETS.md
hypothesis: From the day-end state a neural net predicts the next morning's 09:16 gap direction, and buying the 1-ITM option
  on the predicted side at 15:20 (R27's strike), selling at 09:16, pays after costs.
data_version: Dhan lake on Google Drive (index_1m 5 indices + INDIAVIX, options_rolling_1m weekly ATM+-10, 2021-08 - 2026-04;
  brain cube v2 + point-in-time feature store, built 14 Oct 2026)
period:
  design: 2021-08-01..2022-12-14 and 2024-07-15..2026-04-13; walk-forward folds 2022, 2024H2, 2025, 2026 (retrained each fold)
  holdout: 2023-01-01..2024-06-30 (F1 India's block), read once 14 Oct 2026; embargo 2022-12-15..31 and 2024-07-01..14
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- all brain L4 point-in-time features at the decision minute
- last 60 one-minute index bars (return, range, from-open, VIX change, mask)
- index one-hot, time of day
model_or_rule: MLP 64-32, causal TCN (3x16, dilations 1/2/4) and GRU-32 on the last 60 one-minute bars + tabular features;
  3 seeds each, NN = their average; baselines base rate, logistic/ridge, gradient-boosted trees; R13 buys the 1-ITM CE/PE
  at 15:20 when |p-0.5| is in the top 20% of validation scores, sells at the next 09:16 open; no expiry-day entries
settings: research/hunt/r30/PREREG.md
prereg: research/hunt/r30/PREREG.md
variants_tried: 1
results:
  summary: 'Model not better than the base rate (WF log-loss 0.687 vs 0.692, q 0.54, 2,868 nights; holdout 0.681 vs 0.676,
    1,476 nights). R13 holdout +Rs 24/day (208 trades, p 0.014 vs random-side twins, BH q 0.11: fails); WF +76/day (538 trades)
    but -1,068/day in the 2026 fold. 99.5% of its trades are calls: the same nights always-call made +Rs 22/day (holdout)
    - the net learned the gap-up base rate (55-59% up).'
  costs: Fills('liq') (app bps + volume-aware half-spread) + Costs('app'); stress = 2x spread
holdout_read: true
verdict: rejected
notes: The always-call comparison was added after the design walk-forward and is reported, not gated.
