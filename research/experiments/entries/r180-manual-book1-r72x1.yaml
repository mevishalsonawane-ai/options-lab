id: r180-manual-book1-r72x1
title: 'R180 outside build manual, Book 1 "R72-X1 Breakout": rebuilt exactly as written on real option prices'
family: patterns-indicators
date: '2026-11-15'
doc: research/hunt/r180_dual_book_check/results/report.md
hypothesis: An outside PDF build manual sent to Boss claims Book 1 "R72-X1 Breakout" made 361 trades, 67.9% wins, Rs 78,504
  at 1 lot (design 264 / 68.6% / Rs 53,688; holdout 97 / 66.0% / Rs 24,816) on our real 1-minute option prices. Does it reproduce,
  and does it pass the repo's gates?
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), ending 19 Oct 2026; R51 Amendment A
  clean stores rebuilt for R180 from 1 Nov 2024 (clean_r180)
period:
  design: 2024-11-04..2026-03-31 (the manual's design)
  holdout: 2026-04-01..2026-10-19 (the manual's holdout; read by R51-R176 before, not clean)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the index''s 5-minute / 1-minute bars (underlying); ATM straddle vs 09:20 as an option-chain filter; no
  option-chart signal'
model_or_rule: 5-min Donchian 20 (prior bars) breaks on >= 4 of 5 indices on one bar, initial break of that index only, |C
  - edge| / ATR14 >= 0.5, ATM straddle above its 09:20 value; ATM option at the next minute's close; -30% premium stop, after
  +20% keep 50% of the peak gain, out at 60 min or 15:20; one position at a time
settings: research/hunt/r180_dual_book_check/r180cfg.py; PREREG.md section 2 (every ambiguity and choice)
prereg: research/hunt/r180_dual_book_check/PREREG.md
