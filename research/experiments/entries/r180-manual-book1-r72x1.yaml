results:
  summary: 'Ours: 123 / 51.2% / Rs 23,280 (manual 361 / 67.9% / Rs 78,504); design 93 / 54.8% / Rs 19,655; holdout 30 / 40.0%
    / Rs 3,625; 2x slippage Rs 20,305; avg win Rs 2,195 / loss -Rs 1,917; worst month -Rs 7,463; max DD -Rs 16,657. Repo fill
    (next-minute open): 123 / 52.0% / Rs 40,356. Random-entry twin p 0.896 (twin mean Rs 59,723), BH q 1.00 (m = 4,051). Does
    not reproduce; fails: twin_p, bh_q, hold_n. Post-hoc (not gated): without the undefined initial-breakout lock 350 / 50.9%
    / Rs 59,503 (design 257 / 51.0% / Rs 12,727, holdout 93 / 50.5% / Rs 46,777), twin p 1.00: the count matches the manual''s
    361, the win rate does not.'
  costs: Costs('dated') on both orders, R17 liq fills (stop sales x0.999 - 2x half-spread, gaps at the open), 2x slippage
    = SLIP2; 1 lot by the lot size in force
