id: book-tom-01
title: 4-bar fractal momentum entry (David Paul) (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Trade Entry Technique 4 Bar Fractal, p. 115-118) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Long
  when bar t closes above high[t-1] AND above high[t-3]; short when bar t closes below low[t-1] AND below low[t-3]. Enter
  at the next bar''s open, 09:30-14:30 (MCX: session hours). Stop: Underlying stop at the lowest low of bars t-3..t for a
  long (highest high for a short). Exit: Opposite fractal signal (stop-and-reverse off), else the stop, else square-off 15:10
  (15:05 on expiry).'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- underlying price
- 15-minute and 60-minute bars (5-minute as a variant)
model_or_rule: 'Long when bar t closes above high[t-1] AND above high[t-3]; short when bar t closes below low[t-1] AND below
  low[t-3]. Enter at the next bar''s open, 09:30-14:30 (MCX: session hours). | stop: Underlying stop at the lowest low of
  bars t-3..t for a long (highest high for a short). | exit: Opposite fractal signal (stop-and-reverse off), else the stop,
  else square-off 15:10 (15:05 on expiry). | filters: none (base); variant: only in the direction of the daily 3-bar swing
  trend (rule three-bar-swing-bias)'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-01; trade: buy 1-ITM CE on a long signal, 1-ITM PE on a short;
  MCX: the near future or its 1-ITM option; stop on the underlying'
prereg: null
variants_tried: null
results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: not tested by us; nearest R71 P7 three-bar reversal at the day high/low lost (-Rs 1,67,689, 855
  trades) and R4 G3 Gann 2-bar swing lost Rs 172 a trade net (6,227). Assumptions: The book gives no stop or exit; the four-bar
  extreme as stop and the opposite signal as exit are our most literal choices. ''Bar three back'' read as high[t-3] (the
  book numbers bars 1 = current, 2 = previous, 4 = three back).'
