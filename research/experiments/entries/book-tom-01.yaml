id: book-tom-01
title: 4-bar fractal momentum entry (David Paul) (Trader Tom, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Trade Entry Technique 4 Bar Fractal, p. 115-118) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Long
  when bar t closes above high[t-1] AND above high[t-3]; short when bar t closes below low[t-1] AND below low[t-3]. Enter
  at the next bar''s open, 09:30-14:30 (MCX: session hours). Stop: Underlying stop at the lowest low of bars t-3..t for a
  long (highest high for a short). Exit: Opposite fractal signal (stop-and-reverse off), else the stop, else square-off 15:10
  (15:05 on expiry).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31; MCXI 2025-10-20 - 2026-07-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once); MCXI 2026-08-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- underlying price
- 15-minute and 60-minute bars (5-minute as a variant)
model_or_rule: 'Long when bar t closes above high[t-1] AND above high[t-3]; short when bar t closes below low[t-1] AND below
  low[t-3]. Enter at the next bar''s open, 09:30-14:30 (MCX: session hours). | stop: Underlying stop at the lowest low of
  bars t-3..t for a long (highest high for a short). | exit: Opposite fractal signal (stop-and-reverse off), else the stop,
  else square-off 15:10 (15:05 on expiry). | filters: none (base); variant: only in the direction of the daily 3-bar swing
  trend (rule three-bar-swing-bias)'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-01; trade: buy 1-ITM CE on a long signal, 1-ITM PE on a short;
  MCX: the near future or its 1-ITM option; stop on the underlying'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 2
results:
  summary: 'IDX (index spot, bought option), variant 15m_bias: design 2075 trades, win 35%, net -Rs 421,025, folds -Rs 40,382,
    -Rs 171,160, -Rs 209,482; p 1.000, BH q 1.000; holdout 401 trades, win 31%, net -Rs 187,870. R104 verdict: fail. | MCXI
    (MCX mini future (own bars)), variant 15m_bias: design 373 trades, win 33%, net -Rs 270,906, folds -Rs 138,722, -Rs 132,183;
    p 1.000, BH q 1.000; holdout 340 trades, win 33%, net -Rs 142,668. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests,
  BH across all).  Our nearest test: not tested by us; nearest R71 P7 three-bar reversal at the day high/low lost (-Rs 1,67,689,
  855 trades) and R4 G3 Gann 2-bar swing lost Rs 172 a trade net (6,227). Assumptions: The book gives no stop or exit; the
  four-bar extreme as stop and the opposite signal as exit are our most literal choices. ''Bar three back'' read as high[t-3]
  (the book numbers bars 1 = current, 2 = previous, 4 = three back).'
