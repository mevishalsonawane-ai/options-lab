id: r24-p4
title: 'R24 pattern rule p4: levels within 0.2% = two+ AND days to expiry = expiry day AND option = CE -> exit liq'
family: patterns-indicators
date: '2026-10-13'
doc: research/HUNT_R24_WHATIF_PATTERNS.md
hypothesis: A pre-entry pattern mined from the design period's big winning option buys (net >= +50% at 15:05; winner lift
  1.74, support 9.1%), traded as the first entry of the day with the app's strike and exit family, makes money after costs
  on the locked holdout and beats random entries and random patterns of the same size and frequency.
