id: r68-oov-w
title: R68 OOV W Boss's staircase (-10% at +25%, +5 pts per +5%), no target
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R68_STAIRCASE.md
hypothesis: 'Boss (16 Oct): a staircase stop (-10% at +25%, then +5 points of stop for every +5 points of gain), read on the
  option''s profit, on progress toward the target, or with a target that moves up too, improves the paper arms after real
  costs. This variant: W Boss''s staircase (-10% at +25%, +5 pts per +5%), no target; gates as R51 (BH over 21 tests); recommended
  only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
