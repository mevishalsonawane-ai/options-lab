notes: 'R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  Our nearest test: Daily trend as an intraday filter:
  with-trend better in one year, against-trend in the other, no consistent value (FINDINGS.md, SWING). R20b: support/resistance
