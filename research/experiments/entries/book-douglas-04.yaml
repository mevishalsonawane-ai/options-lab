verdict: proposed
notes: 'Our nearest test: Daily trend as an intraday filter: with-trend better in one year, against-trend in the other, no
  consistent value (FINDINGS.md, SWING). R20b: support/resistance no better than random lines (random levels beat real in
  6 of 7). R73 / R79: trend checks before entries did not help.. Assumptions: The book gives this only as an example and leaves
  ''support'' to the reader''s edge; swing-fractal support, the ATR buffer and the 3:1 skip are ours. Intraday hold, no overnight.'
