id: book-douglas-04
title: 'Daily uptrend: buy a pullback to 30-minute support; daily downtrend: sell a rally to 30-minute resistance (Mark Douglas,
  book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Mark Douglas''s rule from Trading in the Zone (Ch. 11 (Time Frame)) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Daily trend up = the last two completed
  daily swing highs and swing lows are each higher (swing = 3-bar fractal); then on 30-minute bars, buy when price trades
  down to the most recent 30-minute swing low that lies above the daily trend''s last higher low, and a 30-minute bar closes
  back above it. Mirror for the downtrend (sell = buy PE). Stop: On the index, a fixed buffer (0.25 x 30-minute ATR(14)) beyond
  the 30-minute swing low/high used for entry. Exit: Target = the prior 30-minute swing high (low for shorts); skip the trade
  if target distance < 3 x stop distance (the book''s 3:1 ideal). Else square-off at session end (15:10 NSE, 15:05 expiry;
  MCX 10 minutes before close).'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
- CRUDE
- GOLD
features:
