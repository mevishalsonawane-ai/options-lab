id: book-porwal-08
title: ADX 20-50 + DI alignment + EMA(14) pullback with prior-day trend (Nikhil Porwal, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 5.1) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Wilder ADX(14) with DI length
  14: 20 < ADX < 50; +DI > -DI; close above EMA(14); prior-day trend up (as in porwal-turbo). Trigger: a bar whose low comes
  within 0.1% of EMA(14) and closes above it; buy at the next bar''s open. Short mirror. Entries 09:30-14:30. Stop: The lower
  of the last 5-bar swing low and EMA(14) minus 0.25 x ATR14 (book: ''some space'' below the EMA, or beyond the nearest swing).
  Exit: Exit on a 5-minute close below EMA(14); 2R minimum target as a variant; square-off 15:15 (15:05 on expiry).'
