id: r87b-atlas
title: 'R87B candle atlas: 30m / 60m / daily candles, 3-candle sequences and data-driven sequence clusters'
family: patterns-indicators
date: '2026-10-20'
doc: research/HUNT_R87_CANDLE_ANATOMY.md
hypothesis: Some 30m / 60m / daily candle shapes, named 3-candle sequences or k-means sequence clusters move the index over
  the next candles differently from matched candles (BH q < 0.10, same sign in >= 3 of 4 design folds) and keep it in the
  holdout.
data_version: 'Dhan v2 direct: index 1-minute (R87, A2-cleaned) and daily (2015-2026); option snapshot of 19 Oct 2026 23:30
  UTC (real 1-ITM only for SENSEX holdout months; NIFTY ATM 199 design days); hybrid pricing = real where printed, calibrated
  Black-Scholes/VIX model elsewhere'
period:
  design: intraday 4 Aug 2021 - 14 Oct 2025; daily 1 Jan 2015 - 14 Oct 2025
  holdout: 15 Oct 2025 - 16 Oct 2026, read once (R87B cells; the window was read for R87's other cells)
instruments:
- NIFTY
- BANKNIFTY
- SENSEX
features:
- 'signal source: the index candle (spot)'
- body / wick / colour / size tokens and 12-number sequence vectors
model_or_rule: Matched-baseline effect (R87), BH within B1 / B2seq / B2cl
settings: research/hunt/r87_candle_anatomy/batlas.py; PREREG_B.md
prereg: research/hunt/r87_candle_anatomy/PREREG_B.md
variants_tried: 369
results:
  summary: 'Design: B1 200 tested 0 pass; B2seq 25 tested 0 pass (best q 0.31); B2cl 144 tested 1 pass: SENSEX 15m cluster
    13 (green, green, red, ~0.8 ATR each) +0.184 ATR over 5 candles, n 840, q 0.034, 4 of 4 years. Holdout: B1 107 / B2seq
    22 / B2cl 144 tested, 0 pass; the one finding held: +0.259 ATR (+22 pts), up 57% vs 49%, n 182, one-sided p 0.005. Same
    cluster on NIFTY / BANKNIFTY: +0.06 ATR, q 0.86.'
  costs: none (index moves); option cost for comparison 6.41 SENSEX points
holdout_read: true
verdict: inconclusive
notes: 'Knowledge: one SENSEX 15m pullback-in-uptrend cluster holds out of sample; its option rule failed (r87b-r1).'
