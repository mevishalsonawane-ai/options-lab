  holdout: 2025-08-25..2026-02-23 final = last 6 months, read once (results/FINAL_READ)
instruments:
- NIFTY
- BANKNIFTY
features:
- 'signal source: the index spot (15-minute EMA 9/21 crossover; ADX(14), ATR(14) on 15-minute bars; 1-hour bars completed
  by the signal bar; session VWAP weighted by option-chain volume, the index has no volume)'
- ATM option of the nearest expiry (1-ITM variant)
model_or_rule: '9/21 crossover + ADX(14) > 25 only; exits: opposite crossover, the index stop where used, 2R where used, 15:10
