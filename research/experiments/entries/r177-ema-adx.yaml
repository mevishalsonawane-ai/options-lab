id: r177-ema-adx
title: 'R177-EMA: 9/21 crossover + ADX(14) > 25 only (15-minute index bars, NIFTY + BANKNIFTY options, 1-3 lots)'
family: patterns-indicators
date: '2026-11-15'
doc: research/hunt/r177_ema_regime/results/report.md
hypothesis: 'Boss''s PDF: a 9/21 EMA crossover bot fails in chop and three regime filters (ADX(14) > 25; 1-hour trend up +
  price above VWAP; a stop at 2 x ATR(14)) fix it. Boss: ''What if all 3 are together''. This group: 9/21 crossover + ADX(14)
  > 25 only. Does it make money after costs and beat random entries?'
