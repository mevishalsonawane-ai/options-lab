id: r69-oov-x30
title: R69 OOV X30 +5% at +30%, then +1 per +1
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R69_ONE_POINT_TRAIL.md
hypothesis: 'Boss (16 Oct): a +5% stop once the option is +25%, then +1 point of stop for every +1 point of gain (on top of
  the A4 ladder), improves the paper arms after real costs. This variant: {R.VLABEL[v]}; gates as R51 (BH over 15 tests);
  recommended only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 - R68 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: index 5-min bar + previous day''s value area (unchanged); only the option exits differ (stops and locks
  on the premium)'
model_or_rule: 'R52 Open outside value (previous day''s value area + first 5-min bar, 1-ITM at 09:20, 5 indices); exits: X30
  +5% at +30%, then +1 per +1'
settings: research/hunt/r69/r69cfg.py exit_spec / TRIGGER; PREREG.md
