results:
  summary: 'Design: 706 trades, win 55%, net Rs 298,350 (Rs 423/trade), worst day -Rs 25,140, max DD Rs 79,699, stops 74.
    Walk-forward: 529 trades, win 56%, net Rs 240,007 (Rs 454/trade), worst day -Rs 25,140, max DD Rs 50,425, stops 51. Final:
    293 trades, win 50%, net Rs 47,122 (Rs 161/trade), worst day -Rs 16,554, max DD Rs 45,689, stops 14; entry-twin p 0.024,
    BH q 0.0257, exit-twin p 0.5329 (q 0.7006). Verdict: PASS. Versus B0: design Rs 21,212 (bootstrap p 0.052), final -Rs
    1,833 (p 0.6085). Versus A4: design Rs 13,297 (bootstrap p 0.128), final Rs 1,389 (p 0.37). Final: versus A4 the rule
    changed 17 trades; it gave up Rs 6,753 and saved Rs 8,142 (net Rs 1,389).'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
