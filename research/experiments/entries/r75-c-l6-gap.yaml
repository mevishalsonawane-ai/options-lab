hypothesis: 'Boss (16 Oct: "make Donchian more powerful, less loss"): skip an index on a big-gap day (gap > 0.5 x daily ATR)
  lowers the loss / drawdown of Breadth Donchian (C1, 4 of 5 indices) without materially lowering its P&L, in design, in >=
