id: mb1-l1-persistence
title: 'MCX brain L1-B: does the last hour''s move continue over the next hour?'
family: ml
date: '2026-10-20'
doc: research/BRAIN_MCX.md
hypothesis: The sign of the next-60-minute return agrees with the last 60 minutes more or less often than the base rate, predictably
  (AUC >= 0.55, log-loss below the base rate).
data_version: 'Drive lake options_rolling_1m (6 MCX monthly option books, 5 Aug 2025 - 13 Oct 2026: near-future close + ATM
  IV/OI/volume) + fut_1m_live_mcx and fut_daily_continuous fetched from Dhan 19-20 Oct 2026 (to 16 Oct); MCX cube v1, 56 features
  (research/brain/mcx/FEATURES.md); raw data on Drive, not in git'
period:
  design: 5 Aug 2025 - 2026-06-23 (226 sessions; walk-forward tests on blocks 3-6, 21 Nov 2025 - 23 Jun 2026, about 150 sessions)
  holdout: 2026-07-01 - 16 Oct 2026 (77 sessions; embargo 24-30 Jun)
instruments:
- GOLD
- GOLDM
- SILVER
- SILVERM
- CRUDEOIL
- NATURALGAS
features:
- all 56 MCX L4 features
model_or_rule: HistGradientBoosting classifier (primary) and logistic, per symbol
settings: research/brain/mcx/PREREG.md; results/design_metrics.json, holdout_metrics.json
prereg: research/brain/mcx/PREREG.md
variants_tried: 12
results:
  summary: 'Design: 0 of 6 pass. GOLD AUC 0.540 (4363 rows, fail); GOLDM AUC 0.529 (7295 rows, fail); SILVER AUC 0.528 (3812
    rows, fail); SILVERM AUC 0.517 (6569 rows, fail); CRUDEOIL AUC 0.496 (7355 rows, fail); NATURALGAS AUC 0.516 (7281 rows,
    fail). Persistence is about 47-51% everywhere (no momentum, no reversal).'
  costs: none (forecasts, no trades)
holdout_read: false
verdict: rejected
notes: Holdout not read for this test (PREREG section 8).
