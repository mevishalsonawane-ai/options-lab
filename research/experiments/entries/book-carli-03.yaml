notes: 'Our nearest test: R95 confirmed-divergence entries lost (index design 1,778 trades -Rs 3,37,415; holdout 691 trades
  -Rs 37,156); DV variant 0-52 trades a cell. Assumptions: Tests the filters on intraday bars, which the author says he never
  uses; the point is a cheap check on existing R95 code of whether the filters separate good from bad divergences. Unfiltered
  R95 divergences are the control.'
