id: r61-v4
title: 'R61 Solo 3.0 V4: meta-labeller over S1-S4, logistic C 0.1, A2 + option-chain block only; take score >= training 70th
  percentile, 1 a day'
family: ml
date: '2026-10-15'
doc: research/HUNT_R61_SOLO_3.md
hypothesis: 'An expanded, pre-listed feature set that knows OI, PCR, max pain, OI walls, IV / IV rank / skew / term, VIX rank,
  Greeks, GEX / gamma flip, basis, value area, events and FII positioning picks Solo''s paper trades (S1-S4, at most one a
  day, NIFTY / BANKNIFTY / FINNIFTY / MIDCPNIFTY) better out of sample than A2''s 29 features (gates: final net > 0, twin
  p < 0.05, BH q <= 0.10 over 7, 40+ trades, top-5 < net, design WF > 0; replaces Solo 2.0 only if it also beats V1 on net,
  AUC, paired-day bootstrap p < 0.10 and net without MIDCPNIFTY).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m incl. INDIAVIX, options_rolling_1m WEEK files with OI/IV/volume,
  NIFTY MONTH for term structure, NSE participant OI), 20 Nov 2024 onwards; copied 15 Oct 2026 (last session 14 Oct NIFTY
  / BANKNIFTY, 13 Oct FINNIFTY / MIDCPNIFTY)
period:
  design: 21 Nov 2024 - 31 Mar 2026 (purged walk-forward, monthly refits, 1-session embargo, test months Jul 2025 - Mar 2026)
  holdout: '1 Apr 2026 - the lake''s last session, read once (NOT fresh: R57 read it for A2 with the same setups)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: the underlying index (setups S1-S4); option-chain data as context / filters only'
- A2's 29 + CH
model_or_rule: logistic C 0.1, A2 + option-chain block only
settings: research/hunt/r61/PREREG.md section 5; research/hunt/r61/r61cfg.py VARIANTS
prereg: research/hunt/r61/PREREG.md
variants_tried: 1
results:
  summary: 'Design walk-forward (Jul 2025 - Mar 2026): 169 trades, win 54%, net Rs +66,676, max DD Rs 23,324; AUC walk-forward
    0.5137 vs random split 0.56 (leaky). Final test (1 Apr - 14 Oct 2026, read once, not fresh): 127 trades, win 54%, net
    Rs +58,169 (Rs +458/trade), at 2x costs Rs +40,629, max DD Rs 25,891, worst day Rs -6,120, months green 4/7, top-5 share
    0.68, AUC 0.5247; twin p 0.002, BH q 0.0028 (7 variants), selection-twin p 0.008; net without MIDCPNIFTY Rs +21,772. Per
    index: BANKNIFTY 18 / Rs +9,231, FINNIFTY 22 / Rs +12,121, MIDCPNIFTY 75 / Rs +36,398, NIFTY 12 / Rs +420. Gates: PASS.
    Did not replace Solo 2.0: the pre-registered candidate was V3 (best design net); vs V1 on the same final days its net
    and AUC were lower and the paired-day bootstrap p was 0.9717.'
  costs: dated charges (STT 0.15% from 1 Apr 2026), R17 liq fills doubled on stops, next-minute fills, one held contract,
