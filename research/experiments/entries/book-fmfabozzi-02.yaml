id: book-fmfabozzi-02
title: 200-day moving-average band on index daily closes, buy the option (Focardi and Fabozzi, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Focardi and Fabozzi''s rule from The Mathematics of Financial Modeling and Investment Management (Ch. 19, Technical
  analysis (moving-average rule)) makes money after real charges and slippage, walk-forward, with BH across the rules tried.
  Signal source: underlying price. Entry: Long when the close rises above (1 + b) x SMA(200) of daily closes; short when it
  falls below (1 - b) x SMA(200). Band b in {0, 1, 2}% fixed before testing. Enter next session at 09:20. Stop: Opposite band
  cross (book); plus a 50% premium hard stop on the option (our addition). Exit: Opposite band cross, or 5 sessions before
  the monthly expiry (roll if the signal still holds).'
