id: book-wyckoff-07
title: 'A rally that fails to recover half the drop: sell (Wyckoff, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Wyckoff''s rule from The Day Trader''s Bible (Ch. VI, IX, X) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Swing legs by a ZigZag of 1.5 ATR(14). After a down-leg
  of size D, if the next rally tops out below 50% of D (confirmed when price makes a 0.5 ATR reversal from the rally high),
  short on the first close below the rally''s start bar low. Mirror for up-legs. Stop: the rally high + 0.1 ATR Exit: the
  down-leg low minus 0.5 D, or 15:15 (15:05 on expiry)'
