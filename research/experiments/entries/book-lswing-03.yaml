  < 1.8%) -> buy-stop at prev high + 0.2% from 09:20; gap with the trade -> wait to 09:45, gap against -> 09:20, trigger =
  today''s high so far + 0.2%. Order valid 5 sessions. | stop: Higher of entry - 4% or reference low - 0.2% (on the stock);
  daily trail to prev low - 0.2%. | exit: Half at stock +7%; rest on the trail; out by 15:15 three sessions before expiry
  (physical settlement) as in R58; R58''s band exit applies to the option. | filters: none'
settings: 'research/books/TESTABLE_RULES.md, rule book-lswing-03; trade: Long: 2 lots nearest-monthly ATM CE; short: ATM PE;
  stops/targets on the stock. Baseline: the same trades in cash (longs as delivery).'
