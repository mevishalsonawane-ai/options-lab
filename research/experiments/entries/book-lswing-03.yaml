id: book-lswing-03
title: FORCESWING + Master Plan on the R58 stocks, bought monthly options (Larry Swing, book rule, proposed)
family: outside-strategies
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Larry Swing''s rule from A Practical Guide to Swing Trading (Ch. 5.1, 6, 10.1.1) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume (the stock''s daily OHLCV).
  Entry: Scan exactly as the book on each stock (20-day avg volume filter dropped: all are liquid): close > SMA10 and SMA20,
  two lower highs, SMA3(FI) <= 0, SMA13(FI) >= 0, ADX(20) > 30 (short mirror). Trigger: no gap (|open - prev close| < 1.8%)
  -> buy-stop at prev high + 0.2% from 09:20; gap with the trade -> wait to 09:45, gap against -> 09:20, trigger = today''s
  high so far + 0.2%. Order valid 5 sessions. Stop: Higher of entry - 4% or reference low - 0.2% (on the stock); daily trail
  to prev low - 0.2%. Exit: Half at stock +7%; rest on the trail; out by 15:15 three sessions before expiry (physical settlement)
  as in R58; R58''s band exit applies to the option.'
