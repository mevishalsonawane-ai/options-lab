    points with p 0.6797 (needs above 0 with p < 0.05); BH q 1 > 0.1; above 0 in 0 of 3 OLD years < 2; RECENT: difference
    -6.9 points not above 0; OLD: A is -0.3 points above the source''s own share right (needs 2 points)'
  costs: none (index direction only; no trade is priced)
holdout_read: true
verdict: rejected
notes: Research only; nothing in the app changes. A direction condition is not a trading rule.
