period:
  design: '2024-11-21..2026-10-05 (RECENT: where the lead was seen; must agree in sign)'
  holdout: '2022-04-01..2024-11-19 (OLD: the test, read once, results/OLD_READ)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the index only (the arms'' own signals on 1-minute index bars; no option file read)'
model_or_rule: 'H8: A = with the market; B = the rest; right = index move the signal''s way after 15 minutes above 0'
settings: research/hunt/r206_direction/r206cfg.py; PREREG.md sections 2 - 6
prereg: research/hunt/r206_direction/PREREG.md
variants_tried: 1
results:
  summary: 'OLD: A right 50.7% of 1320 signals, B 52.5% of 278; difference -1.8 points, day-block bootstrap p 0.6797, BH q
