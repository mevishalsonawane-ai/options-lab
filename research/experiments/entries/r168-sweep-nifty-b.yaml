hypothesis: 'Boss (13 Nov): "Try ORB with 10-15 points only." The app''s own ORB Sweep entries (09:15-10:00 opening range,
  its window, caps and cool-down) on NIFTY with only the exits replaced: target 10 / 12 / 15 points on the index, stop 1:1
  or 1:1.5, time stop 15 or 30 minutes, 15:15 square-off (15:05 expiry). Gates: net > 0 in P1, P2 and P3; random-exit twin
  BH q <= 0.10 with m = 3058; >= 40 final trades; above the arm''s own exits in P2 and P3.'
