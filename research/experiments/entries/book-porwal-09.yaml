id: book-porwal-09
title: 'Quasimodo: higher high after a downtrend, buy the higher low (Nikhil Porwal, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 5.2) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: 3-bar fractal swings. Setup:
  swing highs H1 > H2 and swing lows L1 > L2 (downtrend), then a close above H2 (higher high, HH). Long when a later swing
  low L3 forms above L2 (higher low) and the next bar closes above L3''s bar high. Bearish mirror. Variant B (book''s second
  wording): buy the first close above HH. Stop: Below L2 (the head / QM zone) minus 1 tick. Exit: Target H1 (top of the first
  zig-zag) or 2R, whichever is nearer; 3R variant; trail by swing lows; square-off 15:15 for NSE, MCX by 23:15.'
