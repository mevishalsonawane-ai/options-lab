  OI store; R156 examples (733,260)
period:
  design: training from Aug 2021, expanding; scored 2023 - Mar 2025 (O1) and Apr 2025 - Mar 2026 (P2), each by models trained
    on earlier sessions only
  holdout: 2026-04-01..2026-10-13 read once by R156 (third look for scalps after R154 / R155); post 14-19 Oct reported
