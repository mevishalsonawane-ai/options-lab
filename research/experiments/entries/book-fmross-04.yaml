id: book-fmross-04
title: Sell defined-risk premium when AR(1) horizon variance is well below the GBM variance in ATM IV (Sheldon Ross, book
  rule, proposed)
family: option-structure
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Sheldon Ross''s rule from An Introduction to Mathematical Finance: Options and Other Topics (Ch. 11.2) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options
  structure (AR(1) fit on the underlying vs ATM IV). Entry: Fit AR(1) on the trailing 250 daily log closes. Compute the AR(1)
  variance of the log price at expiry (closed form) and the GBM variance from ATM IV (IV^2 x T). If the ratio AR/GBM is below
  0.6 and b < 1 passes an ADF test at 5%, sell an ATM iron butterfly with wings 2 strikes out at the next open. Stop: Close
  if the structure''s mark-to-market loss reaches 1.0 x the credit received (assumption). Exit: Hold to 1 session before expiry,
  then close.'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- CRUDE
- NATURALGAS
- GOLD
- SILVER
