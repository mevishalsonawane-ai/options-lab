- BANKNIFTY
features:
- volatility / options structure (AR(1) fit on the underlying vs ATM IV)
- daily; options with 10-30 sessions to expiry
model_or_rule: 'Fit AR(1) on the trailing 250 daily log closes. Compute the AR(1) variance of the log price at expiry (closed
  form) and the GBM variance from ATM IV (IV^2 x T). If the ratio AR/GBM is below 0.6 and b < 1 passes an ADF test at 5%,
  sell an ATM iron butterfly with wings 2 strikes out at the next open. | stop: Close if the structure''s mark-to-market loss
  reaches 1.0 x the credit received (assumption). | exit: Hold to 1 session before expiry, then close. | filters: Skip if
  an exchange holiday or a scheduled event (EIA, RBI, budget) falls inside the window; reprice wings from live quotes (R103
  stale-leg rule).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmross-04; trade: sell ATM CE + PE, buy wings 2 strikes out (defined
  risk)'
