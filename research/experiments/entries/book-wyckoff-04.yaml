id: book-wyckoff-04
title: Break of a quiet range on a burst of volume (Wyckoff, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Wyckoff''s rule from The Day Trader''s Bible (Ch. VII, X) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price (range on the index future), underlying volume (filter).
  Entry: Quiet range = the last 12 bars'' high-low <= 1.0x ATR(14, 5m) of the prior 50 bars. Buy on a 5m close above the range
  high (sell below the range low) when that bar''s volume is >= 3x the average of the 12 range bars and >= 1.5x the slot''s
  20-day median. Stop: the opposite side of the range Exit: a close back inside the range, or 2x the range height in favour,
  or 15:15 (15:05 on expiry)'
