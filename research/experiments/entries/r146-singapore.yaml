verdict: rejected
results:
  summary: Singapore's overnight gap lines up with India's 09:15 gap (r 0.61 NIFTY, 0.57 BANKNIFTY, 2,583 days; holdout 0.50
    / 0.49, 251 days), but no link to the first hour or the rest of the day (design r -0.06..+0.11, all q >= 0.16); no trade
    test. The gap is already in the 09:15 price.
  costs: none (no trade test was triggered)
