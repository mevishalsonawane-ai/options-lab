model_or_rule: 'Bullish: two confirmed swing lows L1 < ... with price low(L2) < low(L1) and CCI(L2) > CCI(L1); CCI(L2) <=
  -150; max CCI between L1 and L2 <= 0; with A = low(L1), B = the highest high between L1 and L2, the extension (B - low(L2))
  / (B - A) is in [1.13, 1.618]. Then draw the resistance trendline through the two most recent confirmed swing highs at or
  before L2 (the first being B or the high before it) and extend it; go long when a daily CLOSE is above the line (conservative
  version; the aggressive version enters intraday on the first cross). Bearish mirrored (swing highs, CCI >= +150, min CCI
  between the highs >= 0, support line through swing lows). | stop: 15-20 ticks beyond the divergence extreme, read on the
  underlying: low(L2) minus 0.1% of price for longs (high(L2) plus 0.1% for shorts). | exit: Target 1 at the 127.2% extension,
  Target 2 at the 161.8% extension of the leg from the second extreme L2 to the first opposite swing after it (projected from
  L2 in the trade direction); close half at T1 and move the stop to the entry price; close the rest at T2. Skip the trade
  if reward to T1 is less than 1:1 of the stop distance. | filters: CCI length 20 on hlc3; no trade if the trendline breaks
  more than 20 bars after L2 (setup stale); skip a long on a gap-up day and a short on a gap-down day (Ch. 2).'
