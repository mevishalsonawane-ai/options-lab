id: book-carli-01
title: CCI(20) regular divergence, three qualifying rules, trendline-break entry, Fibonacci targets (daily bars) (David Carli,
  book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'David Carli''s rule from The Power of Divergence Trading (Ch. 4) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Bullish: two confirmed swing lows
  L1 < ... with price low(L2) < low(L1) and CCI(L2) > CCI(L1); CCI(L2) <= -150; max CCI between L1 and L2 <= 0; with A = low(L1),
  B = the highest high between L1 and L2, the extension (B - low(L2)) / (B - A) is in [1.13, 1.618]. Then draw the resistance
  trendline through the two most recent confirmed swing highs at or before L2 (the first being B or the high before it) and
  extend it; go long when a daily CLOSE is above the line (conservative version; the aggressive version enters intraday on
  the first cross). Bearish mirrored (swing highs, CCI >= +150, min CCI between the highs >= 0, support line through swing
  lows). Stop: 15-20 ticks beyond the divergence extreme, read on the underlying: low(L2) minus 0.1% of price for longs (high(L2)
  plus 0.1% for shorts). Exit: Target 1 at the 127.2% extension, Target 2 at the 161.8% extension of the leg from the second
  extreme L2 to the first opposite swing after it (projected from L2 in the trade direction); close half at T1 and move the
  stop to the entry price; close the rest at T2. Skip the trade if reward to T1 is less than 1:1 of the stop distance.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
