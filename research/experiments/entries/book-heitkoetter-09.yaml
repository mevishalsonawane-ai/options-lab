hypothesis: 'Markus Heitkoetter''s rule from A Complete Guide to Day Trading (Step 3, Trendlines & Trend Channels) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: With
  a live downtrend line (hk-trendline-break-trend), draw the channel line parallel through the lowest low since anchor 1;
