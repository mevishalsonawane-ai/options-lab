- daily at 09:20
model_or_rule: 'Compute s = BANKNIFTY ATM IV / NIFTY ATM IV at matched time to expiry (convert each to 30-day forward vol
  with additive variance, or use only days when both have 5-7 days to expiry). If s is above its rolling 120-day 90th percentile,
  sell BANKNIFTY vol and buy NIFTY vol; below the 10th, the reverse. Legs theta-weighted (Bennett: same-type securities).
  | stop: Spread move of 2 rolling standard deviations against, or basket loss of 2% of combined notional. | exit: s back
  to its median, or 10 sessions. | filters: Defined risk on the short leg (iron fly).'
