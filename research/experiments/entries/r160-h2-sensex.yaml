id: r160-h2-sensex
title: 'R160 H2: is the move from the late level to the next open predictable: SENSEX'
family: market-facts
date: '2026-11-11'
doc: research/hunt/r160_cas_gap/results/report.md
hypothesis: An option bought at 15:2x-15:3x is priced off the late level, so a buyer gains only if R = ln(open / late level)
  has the sign of D (slope != 0).
data_version: 'Drive lake gdrive:IraAlgo-data-lake (built 13-20 Oct 2026, to 19 Oct 2026): index_1m NIFTY/BANKNIFTY/SENSEX
