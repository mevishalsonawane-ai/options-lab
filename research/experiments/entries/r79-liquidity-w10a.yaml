hypothesis: 'Boss (18 Oct): ''should we use Supertrend or wait for 10 candles for getting accurate direction? Or like Breadth
  Donchian, check all the other indices at once?'' This variant: wait 10 one-minute candles; enter only if the 10th closes
  beyond the signal close on the trade''s side. PASS only if it beats B0 in walk-forward AND final, BH q < 0.10 and random-skip
  p < 0.10.'
