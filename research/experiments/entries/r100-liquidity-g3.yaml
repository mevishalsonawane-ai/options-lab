id: r100-liquidity-g3
title: 'R100 Liquidity give-back: step lock: +15% breakeven, +30% keep 40% of the best gain, +50% keep 60%'
family: trade-management
date: '2026-10-22'
doc: research/HUNT_R100_LIQUIDITY_GIVEBACK.md
hypothesis: 'Boss (22 Oct): a Liquidity trade went to about +Rs 4,500 and closed about -Rs 1,000. This rule (step lock: +15% breakeven,
  +30% keep 40% of the best gain, +50% keep 60%) added to Liquidity''s own exits keeps open profit without cutting the runners:
  net at least B0''s in design, walk-forward and final, BH q <= 0.10 against random early exits in design and final, not carried
  by its 5 best trades, at least 30 changed design trades.'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m), copied 22 Oct; R51 Amendment A clean stores,
  20 Nov 2024 - 13 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward Apr 2025 - Mar 2026)
  holdout: 1 Apr - 13 Oct 2026, read once; already read by R51 / R63 / R70 / R76 / R81 (weak)
instruments:
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal: index bars (liquidity levels); lock: option premium'
model_or_rule: 'Liquidity 15+5 (index level breaks on 15/5-min bars BANKNIFTY and MIDCPNIFTY, 30/5 FINNIFTY; 1-ITM); exits: own
  exits + step lock: +15% breakeven, +30% keep 40% of the best gain, +50% keep 60%'
settings: research/hunt/r100_liquidity_giveback/r100study.py; r100engine.py
prereg: research/hunt/r100_liquidity_giveback/PREREG.md
variants_tried: 7
results:
  summary: 'Design: 881 trades, net Rs 226,824 against B0 Rs 257,249; walk-forward Rs 185,182 against Rs 238,064; final: 357 trades,
    net -Rs 18,091 against Rs 11,155. Changed 47 design / 20 final trades (design: Rs 45,944 saved on 24, Rs 76,369 given up on
    23). Random early-exit twin p 0.996 design / 1.0 final (BH q 1.0 / 1.0 over 7). Design gain without its 5 best trades -Rs 54,064.
    Give-back trades (+20% then a loss; 9 design, B0 -Rs 15,030): Rs 25,168 kept. Failed gates: never_less, twins_bh, not_top5.'
  costs: dated charges, R17 liquidity fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
