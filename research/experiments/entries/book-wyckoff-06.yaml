id: book-wyckoff-06
title: Close an index trade when the other indices turn against it (Wyckoff, book rule, proposed)
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Wyckoff''s rule from The Day Trader''s Bible (Ch. III, IV, VI) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price (the other four index spots). Entry: Any open long on one
  index from an existing arm (Breadth Donchian, Liquidity 15+5) Stop: the arm''s own stop Exit: Exit early when >= 3 of the
  other 4 indices make a new 20-bar low on the same 5m bar while the trade is open (mirror for shorts)'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price (the other four index spots)
- 5-minute bars
model_or_rule: 'Any open long on one index from an existing arm (Breadth Donchian, Liquidity 15+5) | stop: the arm''s own
  stop | exit: Exit early when >= 3 of the other 4 indices make a new 20-bar low on the same 5m bar while the trade is open
  (mirror for shorts) | filters: only after the trade has been open >= 2 bars'
settings: 'research/books/TESTABLE_RULES.md, rule book-wyckoff-06; trade: close the option bought by the arm'
prereg: null
variants_tried: null
results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: not tested by us as an exit; early exits made the profitable arms worse (R12, R18); R72 C6 SMT divergence
  failed. Assumptions: The book''s cue from ''other stocks failing'' made a breadth count against the position; 3 of 4 and
  20 bars are ours. Exit-only, so risk-lowering.'
