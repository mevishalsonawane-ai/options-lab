id: book-aziz-02
title: 'VWAP false breakout: sold off below VWAP, reclaimed, lost again in the Late-Morning -> short (Andrew Aziz, book rule,
  proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, VWAP False Breakout) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume (index futures
  VWAP or R10 proxy). Entry: Day state: at least one 5-minute close below VWAP after 09:15, later at least one 5-minute close
  above VWAP. Between 10:15 and 11:45 (MCX: the second and third hours of the day session), the first 5-minute close back
  below VWAP -> short at that close. Mirror for longs (above VWAP, lost, regained). Stop: a 5-minute close above VWAP Exit:
  Half at the low of the day so far (stop to entry); rest at the next level below (previous day close, yesterday''s low, 5-minute
  200 SMA) or a new 5-minute high; time exit 15:15 (MCX 23:00).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MCXI 2025-10-20 - 2026-07-31; IDX 2021-08-02 - 2026-03-31
  holdout: MCXI 2026-08-01 - 2026-10-19 (read once); IDX 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- CRUDE
- GOLD
- SILVER
features:
- underlying price/volume (index futures VWAP or R10 proxy)
- 5-minute bars
model_or_rule: 'Day state: at least one 5-minute close below VWAP after 09:15, later at least one 5-minute close above VWAP.
  Between 10:15 and 11:45 (MCX: the second and third hours of the day session), the first 5-minute close back below VWAP ->
  short at that close. Mirror for longs (above VWAP, lost, regained). | stop: a 5-minute close above VWAP | exit: Half at
  the low of the day so far (stop to entry); rest at the next level below (previous day close, yesterday''s low, 5-minute
  200 SMA) or a new 5-minute high; time exit 15:15 (MCX 23:00). | filters: One trade a day; skip if the distance to the low
  of the day is under 2 x the distance to VWAP.'
settings: 'research/books/TESTABLE_RULES.md, rule book-aziz-02; trade: buy ATM PE on the short signal (ATM CE on the mirror);
  stops and targets on the underlying'
prereg: research/hunt/r104_books/PREREG.md
