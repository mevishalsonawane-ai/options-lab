id: book-aziz-02
title: 'VWAP false breakout: sold off below VWAP, reclaimed, lost again in the Late-Morning -> short (Andrew Aziz, book rule,
  proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, VWAP False Breakout) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume (index futures
  VWAP or R10 proxy). Entry: Day state: at least one 5-minute close below VWAP after 09:15, later at least one 5-minute close
  above VWAP. Between 10:15 and 11:45 (MCX: the second and third hours of the day session), the first 5-minute close back
  below VWAP -> short at that close. Mirror for longs (above VWAP, lost, regained). Stop: a 5-minute close above VWAP Exit:
  Half at the low of the day so far (stop to entry); rest at the next level below (previous day close, yesterday''s low, 5-minute
  200 SMA) or a new 5-minute high; time exit 15:15 (MCX 23:00).'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
