model_or_rule: 'Day state: at least one 5-minute close below VWAP after 09:15, later at least one 5-minute close above VWAP.
  Between 10:15 and 11:45 (MCX: the second and third hours of the day session), the first 5-minute close back below VWAP ->
  short at that close. Mirror for longs (above VWAP, lost, regained). | stop: a 5-minute close above VWAP | exit: Half at
  the low of the day so far (stop to entry); rest at the next level below (previous day close, yesterday''s low, 5-minute
  200 SMA) or a new 5-minute high; time exit 15:15 (MCX 23:00). | filters: One trade a day; skip if the distance to the low
  of the day is under 2 x the distance to VWAP.'
settings: 'research/books/TESTABLE_RULES.md, rule book-aziz-02; trade: buy ATM PE on the short signal (ATM CE on the mirror);
  stops and targets on the underlying'
