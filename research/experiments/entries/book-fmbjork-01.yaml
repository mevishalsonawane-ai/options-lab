results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: R103: defined-risk selling 0 of 24 confirmed; the naked 09:20 short straddle held to 15:10 made
  +Rs 64k on NIFTY (1,272 days) with worst day -Rs 28,876. R102: VIX over-states NIFTY''s next 21 days on 81% of days (n 4,507).
  A futures-hedged straddle was not tested by us.. Assumptions: Bjork gives the hedge procedure, not a trade. The lot count
  (5), the delta band (1 futures lot), the 15-minute clock and the stops are ours. Deltas use Black-76 on the future with
  each option''s own implied volatility. Because the NIFTY futures lot equals the option lot, fewer than about 5 option lots
  cannot be hedged at a useful granularity (DEEP_OPTIONS_SELLING.md).'
