id: book-bennett-02
title: 'NIFTY buy-write: long future, short weekly ~25-delta call (Colin Bennett, book rule, tested in R104)'
family: option-structure
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Colin Bennett''s rule from Trading Volatility (Ch. 1.4, Call overwriting) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options structure (overwriting); the
  long future is a passive holding. Entry: Each Wednesday 09:20 (day after the Tuesday expiry): hold 1 lot NIFTY future (rolled
  monthly) and sell 1 lot of the nearest weekly call whose delta is closest to 0.25 (Bennett: one-month 103-104% strike or
  a fixed 25-delta). Stop: None in the book; research variant adds a stop on the future at -3% from entry to stay inside the
  account stop. Exit: Call held to expiry (cash settled); re-sell next Wednesday.'
