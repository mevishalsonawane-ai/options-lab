id: book-tom-07
title: Fake-out / fake-down of the previous swing, fade back into the range (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (The Fake Moves, p. 103-104) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Fake-down: a bar trades
  below the most recent confirmed swing low (2-bar fractal) and the same or next bar closes back above it; buy at that close.
  Fake-out mirror for shorts. Stop: 1 tick beyond the fake extreme (the lowest low of the break) Exit: target the most recent
  confirmed swing high on the other side of the range; else 15:10 (15:05 expiry)'
