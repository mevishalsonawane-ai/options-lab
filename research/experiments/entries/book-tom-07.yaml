- 15-minute bars (5-minute variant)
model_or_rule: 'Fake-down: a bar trades below the most recent confirmed swing low (2-bar fractal) and the same or next bar
  closes back above it; buy at that close. Fake-out mirror for shorts. | stop: 1 tick beyond the fake extreme (the lowest
  low of the break) | exit: target the most recent confirmed swing high on the other side of the range; else 15:10 (15:05
  expiry) | filters: range must be at least 1.0 x ATR14 wide; 09:30-14:30'
