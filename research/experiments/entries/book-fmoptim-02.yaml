id: book-fmoptim-02
title: Allocate lots across the live-record arms by trailing minimum-variance weights (Bartholomew-Biggs, book rule, proposed)
family: sizing-execution
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Bartholomew-Biggs''s rule from Nonlinear Optimization with Financial Applications (Ch. 1, 3, 9, 10 and 16) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: none (sizing only; each
  arm keeps its own underlying signal). Entry: Each arm''s own entries unchanged (Liquidity 15+5, R72 Breadth Donchian, R51
  Donchian, R52 OOV). Stop: each arm''s own Exit: each arm''s own'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
features:
- none (sizing only; each arm keeps its own underlying signal)
- daily P&L of each arm, trailing 60 sessions, re-estimated monthly
model_or_rule: 'Each arm''s own entries unchanged (Liquidity 15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV). | stop: each
  arm''s own | exit: each arm''s own | filters: Weights: least-variance weights of the arms'' daily P&L over the trailing
  60 sessions, no negative weights, each arm between 0% and 50%; rebalance only when a weight changes by more than 10 percentage
  points (the book''s ''only big changes are worth the cost'').'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmoptim-02; trade: lots per arm = round(total lot budget x weight),
  at least 0; compare against equal lots and against random weight vectors of the same budget'
prereg: null
variants_tried: null
results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: R84 cutting correlated Breadth positions lowered the worst day 32-77% but beat no random subset
  (best p 0.13); R101 sizing by breadth earned what any extra lot earns (p 0.475); R72 Breadth Donchian vs Donchian daily
  correlation 0.80; H15 Kelly fractions unstable across windows.. Assumptions: The book optimises share weights from returns;
  mapping ''assets'' to our arms'' daily P&L is our adaptation. Window 60, monthly refit, 50% cap and 10-point threshold are
  our choices (the book shows 50-80 day windows, a 25% cap example and no numeric threshold). Downside-risk and worst-day
  variants (Ch. 22) are pre-registered alongside.'
