id: book-fmoptim-02
title: Allocate lots across the live-record arms by trailing minimum-variance weights (Bartholomew-Biggs, book rule, tested
  in R104)
family: sizing-execution
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Bartholomew-Biggs''s rule from Nonlinear Optimization with Financial Applications (Ch. 1, 3, 9, 10 and 16) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: none (sizing only; each
  arm keeps its own underlying signal). Entry: Each arm''s own entries unchanged (Liquidity 15+5, R72 Breadth Donchian, R51
  Donchian, R52 OOV). Stop: each arm''s own Exit: each arm''s own'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MM 2024-11-20 - 2026-03-31
  holdout: MM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- none (sizing only; each arm keeps its own underlying signal)
- daily P&L of each arm, trailing 60 sessions, re-estimated monthly
model_or_rule: 'Each arm''s own entries unchanged (Liquidity 15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV). | stop: each
  arm''s own | exit: each arm''s own | filters: Weights: least-variance weights of the arms'' daily P&L over the trailing
  60 sessions, no negative weights, each arm between 0% and 50%; rebalance only when a weight changes by more than 10 percentage
  points (the book''s ''only big changes are worth the cost'').'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmoptim-02; trade: lots per arm = round(total lot budget x weight),
  at least 0; compare against equal lots and against random weight vectors of the same budget'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'MM (the arms'' trades (sizing)), variant base: design net Rs 1,046,849 vs Rs 774,750, max drawdown -Rs 183,381
    vs -Rs 444,695 (cut 59%, net cut -35%) - adds risk; p 1.000, BH q 1.000; final DD cut 5%, net cut 49%. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: R84 cutting correlated Breadth positions lowered the worst day
  32-77% but beat no random subset (best p 0.13); R101 sizing by breadth earned what any extra lot earns (p 0.475); R72 Breadth
  Donchian vs Donchian daily correlation 0.80; H15 Kelly fractions unstable across windows.. Assumptions: The book optimises
  share weights from returns; mapping ''assets'' to our arms'' daily P&L is our adaptation. Window 60, monthly refit, 50%
  cap and 10-point threshold are our choices (the book shows 50-80 day windows, a 25% cap example and no numeric threshold).
  Downside-risk and worst-day variants (Ch. 22) are pre-registered alongside.'
