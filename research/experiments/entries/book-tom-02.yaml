id: book-tom-02
title: Stochastic hidden divergence in the trend, timed by a 4-bar fractal (Trader Tom, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Divergence Strategies, p. 119-126) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Trend down (close below
  its 89-period SMA): price makes a lower confirmed swing high (2-bar fractal pivot) while slow stochastic %K(14,3) at that
  pivot is higher than at the previous swing high; then the first 4-bar fractal sell within 10 bars enters short. Mirror for
  longs in an uptrend (higher low in price, lower low in %K). Stop: Above the divergence swing high (below the swing low for
  longs). Exit: Opposite 4-bar fractal, else stop, else square-off 15:10 (15:05 expiry) for intraday; 60-minute version may
  hold to 15:10 only.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31; MCXI 2025-10-20 - 2026-07-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once); MCXI 2026-08-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- CRUDE
features:
- underlying price
- 60-minute bars (book uses 4-hour FX and 5-minute Dow); 15-minute variant
model_or_rule: 'Trend down (close below its 89-period SMA): price makes a lower confirmed swing high (2-bar fractal pivot)
  while slow stochastic %K(14,3) at that pivot is higher than at the previous swing high; then the first 4-bar fractal sell
  within 10 bars enters short. Mirror for longs in an uptrend (higher low in price, lower low in %K). | stop: Above the divergence
  swing high (below the swing low for longs). | exit: Opposite 4-bar fractal, else stop, else square-off 15:10 (15:05 expiry)
  for intraday; 60-minute version may hold to 15:10 only. | filters: trend by the 89-period SMA on the trading timeframe'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-02; trade: buy 1-ITM PE on the short signal, 1-ITM CE on the long;
  stop on the underlying'
prereg: research/hunt/r104_books/PREREG.md
