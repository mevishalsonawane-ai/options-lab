id: book-tom-02
title: Stochastic hidden divergence in the trend, timed by a 4-bar fractal (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Divergence Strategies, p. 119-126) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Trend down (close below
  its 89-period SMA): price makes a lower confirmed swing high (2-bar fractal pivot) while slow stochastic %K(14,3) at that
  pivot is higher than at the previous swing high; then the first 4-bar fractal sell within 10 bars enters short. Mirror for
  longs in an uptrend (higher low in price, lower low in %K). Stop: Above the divergence swing high (below the swing low for
  longs). Exit: Opposite 4-bar fractal, else stop, else square-off 15:10 (15:05 expiry) for intraday; 60-minute version may
  hold to 15:10 only.'
