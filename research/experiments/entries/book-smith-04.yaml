hypothesis: 'David Graeme Smith''s rule from Short Swing Trading (Ch. 7-9) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: As sst-six-rules-index-daily on the future''s daily
  bars (SMA 50 side, DMI 8 cross or touch, break of last non-inside day). Stop: Reference day''s far end minus 0.5% of price
  (book) and minus 0.25 x ATR(14) (variant). Exit: Significant-day trail; midpoint lock on a >= 5% day in the trade''s favour
  (book''s number is usable on SILVER, NATURALGAS); no target; exit before the option''s or future''s last 3 sessions.'
