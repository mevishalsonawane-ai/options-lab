id: book-sadowski-07
title: Bollinger 20,2 squeeze, enter on a close across the middle SMA (Roman Sadowski, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 7) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Squeeze = Bollinger
  band width (upper-lower)/middle is in its lowest 10% of the last 120 bars. While squeezed, or within 3 bars of it, buy when
  a full candle lies above SMA20 (open and close both above the middle line); sell when both are below. Stop: The prior candle''s
  low (long) / high (short), or the level that loses 3% of capital, whichever is nearer. Exit: Not stated; we use the opposite
  band touch as the target and a 15:15 square-off intraday (5 sessions on 60-min).'
