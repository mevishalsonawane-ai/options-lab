verdict: proposed
notes: 'Our nearest test: R72: C2 laggard catch-up lost (-Rs 1,00,746 final period) and C6 SMT divergence failed; R102 correlation
  0.877, beta 1.157 over 5,086 days, so the spread is mostly BANKNIFTY''s extra beta. The book warns cointegration is unstable
  and often spurious.. Assumptions: The book gives the method (pairs beyond a threshold back to the mean, formalised by cointegration)
  but no thresholds, windows or instruments; all numbers are ours. Long options on both legs pay two thetas; the futures mirror
  isolates the signal. Correct across every variant (BH).'
