id: r102-b3-calendar
title: 'R102 B3: weekday, expiry day and the session after FOMC / US CPI as next-day sign rules on NIFTY and BANKNIFTY'
family: calendar-events
date: '2026-10-22'
doc: research/DEEP_NIFTY_BANKNIFTY.md
hypothesis: 'Pre-registered (PREREG.md B3): some weekday, the expiry day, or the NSE session after a FOMC decision or US CPI print has a mean close-to-close return whose sign passes BH q <= 0.10 across the 70 R102 tests against random day sets, holds in >= 70% of years, and repeats on the holdout.'
data_version: Drive lake index_daily 2006 ->, bhavcopy expiry calendar 2021 ->, research/hunt/r98/events.csv; copied 22 Oct 2026
period:
  design: 2006 - 14 Jul 2026 (weekdays), 2021 - 14 Jul 2026 (expiry, events)
  holdout: '15 Jul - 19 Oct 2026, read once (too few days per cell, 3 to 14)'
instruments:
- NIFTY
- BANKNIFTY
features:
- weekday; expiry day from the bhavcopy; R98 event sessions (FOMC, USCPI)
model_or_rule: 'day-set mean with 1,000 random day-set twins; BH over 70'
settings: research/hunt/r102_deep/r102pred.py (b3); results/pred_design.json
prereg: research/hunt/r102_deep/PREREG.md
variants_tried: 14
results:
  summary: '0 of 14 pass design. Best: NIFTY Wednesday +9.5 bps (1,019 days, twin p 0.12, q 0.43); BANKNIFTY expiry day -7.9 bps (222 days, q 0.80); US event session +4.8 / +1.3 bps (96 sessions, q 1.00). Descriptively RBI days were up (+0.36% / +0.50%, 30 days) and Budget days doubled the range (2.13% / 2.62%, 6 days); neither was a pre-registered rule.'
  costs: none traded
holdout_read: true
verdict: rejected
notes: 'h42 found the same (0 of 60 weekday questions survive BH).'
