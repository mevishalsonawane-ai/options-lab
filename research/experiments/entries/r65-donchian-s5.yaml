results:
  summary: 'Design: 4572 trades, win 52%, net -Rs 133,615 (-Rs 29/trade), worst day -Rs 49,464, max DD Rs 216,253, stops 713.
    Walk-forward: 3311 trades, win 52%, net Rs 7,113 (Rs 2/trade), worst day -Rs 30,701, max DD Rs 127,284, stops 459. Final:
    1805 trades, win 49%, net Rs 2,349 (Rs 1/trade), worst day -Rs 21,264, max DD Rs 99,325, stops 232; entry-twin p 0.014,
    BH q 0.0162, exit-twin p 0.9541 (q 1.0). Verdict: FAIL: top-5 >= net; design net <= 0. Versus B0: design -Rs 141,896 (bootstrap
    p 0.9695), final -Rs 53,090 (p 0.9755). Versus A4: design -Rs 141,089 (bootstrap p 0.9395), final -Rs 76,428 (p 0.987).
    Final: the lock closed 398 trades; versus the plain rules it gave up Rs 195,973 and saved Rs 147,766 (net -Rs 48,207);
    200 of them went on to +30% after the exit.'
