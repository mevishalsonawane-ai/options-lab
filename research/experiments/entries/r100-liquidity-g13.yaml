  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward Apr 2025 - Mar 2026)
  holdout: 1 Apr - 13 Oct 2026, read once for this amendment; already read by R100 G1-G12 and R51 / R63 / R70 / R76 / R81 (weak)
instruments:
- BANKNIFTY
