id: r100-liquidity-g13
title: 'R100 Liquidity give-back (amendment A5): two lots per trade: one sold at a +15% limit, the other on Liquidity''s own exits; reported per lot (Boss: "keep the profit and make it not lose money")'
family: trade-management
date: '2026-10-22'
doc: research/HUNT_R100_LIQUIDITY_GIVEBACK.md
hypothesis: 'Boss (22 Oct: "Think out of the box, and find a way to keep the profit and make it does not loss money"): two lots per trade: one sold at a +15% limit, the other on Liquidity''s own exits; reported per lot,
  added to Liquidity''s own exits, keeps open profit without cutting the runners; same gates as G1-G12 (net at least B0''s in
  design, walk-forward and final; BH q <= 0.10 against random early exits in design and final; not carried by its 5 best
  trades; at least 30 changed design trades).'
