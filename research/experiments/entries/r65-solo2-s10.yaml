id: r65-solo2-s10
title: R65 Solo2 S10 breakeven at +10%, trail 10 pts, target kept
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R65_STEP_TRAIL.md
hypothesis: 'Boss (16 Oct): once the premium is +10%, put the stop at +5%, then +10% at +15%, and so on (a 5-point step trail),
  and a -5% stop moved up the same way, improve the new paper arms after real costs. This variant: S10 breakeven at +10%,
  trail 10 pts, target kept; gates as R51 (final net > 0, twin p < 0.05, BH q <= 0.10 over 30 tests, 40+ trades, top-5 < net,
  design and walk-forward > 0); recommended only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: index (setups S1-S4); model inputs as R57 (unchanged); only the option exits differ (stops and trail on
  the premium)'
model_or_rule: 'Solo 2.0 (R57 A2 logistic meta-labeller picks of setups S1-S4, one a day, 4 indices); exits: S10 breakeven
  at +10%, trail 10 pts, target kept'
settings: research/hunt/r65/r65cfg.py exit_spec / trail_steps; PREREG.md sections 2-3
prereg: research/hunt/r65/PREREG.md
variants_tried: 30
results:
  summary: 'Design: 166 trades, win 54%, net Rs 30,070 (Rs 181/trade), worst day -Rs 10,370, max DD Rs 23,819, stops 9. Walk-forward:
    166 trades, win 54%, net Rs 30,070 (Rs 181/trade), worst day -Rs 10,370, max DD Rs 23,819, stops 9. Final: 128 trades,
    win 60%, net Rs 99,833 (Rs 780/trade), worst day -Rs 5,646, max DD Rs 17,125, stops 3; entry-twin p 0.002, BH q 0.0046,
    exit-twin p 0.2455 (q 1.0). Verdict: PASS. Versus B0: design -Rs 25,839 (bootstrap p 0.9495), final Rs 662 (p 0.465).
    Versus A4: design -Rs 28,570 (bootstrap p 0.9705), final Rs 2,281 (p 0.4325). Final: the lock closed 39 trades; versus
    the plain rules it gave up Rs 37,125 and saved Rs 37,787 (net Rs 662); 23 of them went on to +30% after the exit.'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates, but not recommended (PREREG section 6): it does not beat both B0 and A4 in design, walk-forward
  and final, and its exit-twin q is 1.0 (> 0.10: no better than the same number of random early exits). Boss may still choose
  it. Signal on the underlying; research only, nothing changes paper or live.'
