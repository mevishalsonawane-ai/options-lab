id: book-heitkoetter-04
title: Turtle 20-bar breakout on 15-minute bars with the book's exits (Markus Heitkoetter, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Markus Heitkoetter''s rule from A Complete Guide to Day Trading (Step 3, Turtle Trading; Step 5 exits) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry:
  Long the first time price trades above the highest high of the previous 20 completed 15-minute bars; short below the lowest
  low of the previous 20 bars. Stop: 0.27% of the underlying (index or MCX future) Exit: 0.41% target or a 45-minute time
  stop, whichever first; 15:10 square-off on NSE, MCX session close on MCX'
