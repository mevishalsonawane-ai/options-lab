id: book-tom-06
title: Reverse after a failed engulfing trade (5-minute scalp) (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (A Special Note on Scalping, p. 114) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: When an engulfing-bar
  trade (as in engulfing-10min-trend but on 5-minute bars, normal entry at the bar''s close) hits its stop within 3 bars,
  enter the opposite side at the stop price. Stop: the extreme of the failed engulfing trade''s adverse move plus 0.25 x 5-minute
  ATR14 Exit: target 1.5 x initial risk on the underlying, else 30 minutes, else 15:10'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price
- 5-minute bars
model_or_rule: 'When an engulfing-bar trade (as in engulfing-10min-trend but on 5-minute bars, normal entry at the bar''s
  close) hits its stop within 3 bars, enter the opposite side at the stop price. | stop: the extreme of the failed engulfing
  trade''s adverse move plus 0.25 x 5-minute ATR14 | exit: target 1.5 x initial risk on the underlying, else 30 minutes, else
  15:10 | filters: 09:30-14:30; one reversal per day per index'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-06; trade: buy 1-ITM option in the reversal direction'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
