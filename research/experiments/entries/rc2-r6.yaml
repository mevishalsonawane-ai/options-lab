id: rc2-r6
title: 'RC2 crypto options R6_hero: Expiry-day hero: cheap OTM after a 2x-implied 15-min move, 09:00-11:00 UTC'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: 'Buying a Delta India BTC/ETH option on ''Expiry-day hero: cheap OTM after a 2x-implied 15-min move, 09:00-11:00
  UTC'', with a stop-loss and a profit lock, makes money after real costs and beats random same-clock entries.'
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,912 BTC/ETH daily expiries (956 per coin) (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain
  polls 13 Oct 2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad,
  not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (184 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- CRYPTO
features:
- 15-min index move
- DVOL
- option premium band 0.02-0.10% of spot
model_or_rule: 'Expiry-day hero: cheap OTM after a 2x-implied 15-min move, 09:00-11:00 UTC; strike cheap; expiry >= 0.166667
  h left; max hold 3 h; exits: stop -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s70_step (best design mean). Design: 211 trades, 34% win, +7.9% a trade net (gross +44.2%), Rs +33,095 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.000 (BH q 0.001), direction twin p 0.122; walk-forward Rs -36,871; stress
    Rs -9,954. Holdout: 56 trades, -18.7% a trade, Rs -20,916 (after VDA tax Rs -33,228). Gates passed on design: not all.
    All exits: s50_step: design n 211 net +6.0%/trade Rs +25,176, holdout n 56 -16.3% Rs -18,252; s50_trail: design n 211
    net -1.2%/trade Rs -5,244, holdout n 56 -16.7% Rs -18,723; s70_step: design n 211 net +7.9%/trade Rs +33,095, holdout
    n 56 -18.7% Rs -20,916; s70_trail: design n 211 net +1.2%/trade Rs +4,805, holdout n 56 -18.5% Rs -20,682.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
    on entry and exit; exits less 1 tick + 1%; stress spread x1.5 and fee 0.03%
holdout_read: true
verdict: rejected
notes: One of 8 RC2 rules (32 variants, one BH family). Every trade had a stop and a profit lock (Boss's crypto rule). Design
  was re-run once after a data fix (listing-glitch marks, PREREG amendment 4).
