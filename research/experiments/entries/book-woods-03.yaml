period:
  design: IDX 2021-08-02 - 2026-03-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price
- 5-minute and 15-minute bars
model_or_rule: 'Uptrend: a bar whose low is below the previous bar''s low and whose close is above the previous bar''s close;
  buy stop 1 tick above its high, next bar only. Downtrend mirror. | stop: The reversal bar''s low (high for shorts). | exit:
  Nearest opposing swing; else square-off. | filters: Trend by EMA 20 slope as in three-bar-pullback-trend.'
settings: 'research/books/TESTABLE_RULES.md, rule book-woods-03; trade: buy 1-ITM CE / PE'
