id: book-woods-03
title: Reversal bar in the trend's direction (Galen Woods, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Galen Woods''s rule from How to Trade Price Action (Ch. 4.1) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Uptrend: a bar whose low is below the previous bar''s
  low and whose close is above the previous bar''s close; buy stop 1 tick above its high, next bar only. Downtrend mirror.
  Stop: The reversal bar''s low (high for shorts). Exit: Nearest opposing swing; else square-off.'
