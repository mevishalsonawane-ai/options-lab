verdict: proposed
notes: 'Our nearest test: not tested by us; R103 showed apparent profits in the chain came from stale wing prices (six BANKNIFTY
  passes became -Rs 2.9 to -Rs 3.3 lakh when repriced), so most violations in last-price data are likely stale prints. Assumptions:
  The book''s arbitrage uses the underlying share plus a loan; for an index we use the same-expiry future as the forward,
  so the rate term nearly cancels. Window, threshold and filters are ours. Same rule as written up from fm-capinski-math-finance
  (same slug).'
