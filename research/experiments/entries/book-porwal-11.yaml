id: book-porwal-11
title: 'Bear trap: failed break of the day low / previous-day low, reclaimed on volume, buy above the reversal bar (Nikhil
  Porwal, book rule, proposed)'
family: flow-oi
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 5.3) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price and volume (futures volume). Entry:
  Level = the running day low (variant: the previous day''s low). A bar trades below the level and, within 3 bars, a green
  bar closes back above it with futures volume >= 2x its 20-bar average. Buy when price trades above that green bar''s high
  (book: above the high of the bullish reversal candle). Stop: Below the lowest low of the poke (the swing low). Exit: Book
  target: the previous day''s high or the day high, partial at 1R and the rest trailed by 3-bar lows; variant 2R; square-off
  15:15.'
