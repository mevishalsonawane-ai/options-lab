id: book-tom-14
title: Hanging man / hammer confirmed by a close beyond support within 3 bars (Trader Tom, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Pattern Number 4, Umbrella, p. 91-93) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Umbrella = small
  body, upper wick <= 10% of range, lower wick >= 2 x body. After an uptrend (two prior strong green bars), a hanging man;
  short if any of the next 3 bars closes below the hanging man''s low (the support). Hammer after a downtrend: long if a close
  above its high within 3 bars. Stop: the umbrella''s high (hanging man) / low (hammer) Exit: 2R or square-off 15:10 (daily
  variant: 5 sessions on the future)'
