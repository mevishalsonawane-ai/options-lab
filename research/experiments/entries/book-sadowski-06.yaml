id: book-sadowski-06
title: Buy the retest of broken resistance, scaled in three parts (Roman Sadowski, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 6) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Uptrend = the
  last two 15-min swing highs and lows (3 bars each side) both rising. When a close breaks above the last swing high, place
  three equal limit orders for the pullback: 1/3 at EMA20, 1/3 at the broken swing high, 1/3 at the 50% retracement of the
  leg from the last swing low to the new high. Orders live until 14:30 or a new high is made. Mirror for downtrends. Stop:
  Not stated; we use the last swing low below the 50% level. Exit: Target = the new high plus 1 x the leg length, or square-off
  at 15:15.'
