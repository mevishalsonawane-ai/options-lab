id: r67-solo2-m15
title: R67 Solo2 M15 A4 + stop -10% once +15%
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R67_STOP_TO_10.md
hypothesis: 'Boss (16 Oct): once the option is +25%, moving the stop from -15% to -10% (on top of the A4 30/60/100 ladder)
  improves the paper arms after real costs, because trades that reach +25% and turn back lose less. This variant: M15 A4 +
  stop -10% once +15%; gates as R51 (BH over 15 tests); recommended only if it also beats B0 and A4 everywhere and random
  early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 - R66 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: index (setups S1-S4); model inputs as R57 (unchanged); only the option exits differ (stops and locks on
  the premium)'
model_or_rule: 'Solo 2.0 (R57 A2 logistic meta-labeller picks of setups S1-S4, one a day, 4 indices); exits: M15 A4 + stop
  -10% once +15%'
settings: research/hunt/r67/r67cfg.py exit_spec / TRIGGER; PREREG.md
prereg: research/hunt/r67/PREREG.md
variants_tried: 15
results:
  summary: 'Design: 166 trades, win 55%, net Rs 57,122 (Rs 344/trade), worst day -Rs 10,370, max DD Rs 23,884, stops 9. Walk-forward:
    166 trades, win 55%, net Rs 57,122 (Rs 344/trade), worst day -Rs 10,370, max DD Rs 23,884, stops 9. Final: 128 trades,
    win 59%, net Rs 96,736 (Rs 756/trade), worst day -Rs 6,120, max DD Rs 19,918, stops 5; entry-twin p 0.002, BH q 0.006,
    exit-twin p 0.503 (q 0.7505). Verdict: PASS. Versus B0: design Rs 1,213 (bootstrap p 0.3765), final -Rs 2,436 (p 0.928).
    Versus A4: design -Rs 1,518 (bootstrap p 0.623), final -Rs 817 (p 1.0). Final: versus A4 the -10% step changed 2 trades;
    it gave up Rs 817 and saved Rs 0 (net -Rs 817).'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates but not recommended (PREREG section 3): it must also beat both B0 and A4 in design, walk-forward
  and final and beat random early exits; exit-twin q 0.7505. Boss may still choose it. Signal on the underlying; research
  only, nothing changes paper or live.'
