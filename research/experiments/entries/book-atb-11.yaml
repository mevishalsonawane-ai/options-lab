id: book-atb-11
title: 'Sideways box after a move: break, retest, confirming candle (Strategy 6) (The Advanced Trading Book, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 3, Strategy 6 (p31))
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Prior move >= 2 ATR within 10 bars; then >= 6 bars whose highs and lows all lie inside a band <= 1.2 ATR tall (box
  top = highest high, bottom = lowest low). A 15m close above the top = break. Within 12 five-minute bars price returns to
  within 0.1 ATR of the top and a 5m bar closes green above it: buy at the next open. Mirror below the bottom. Stop: Below
  the box midpoint (variant: below the retest bar''s low). Exit: Measured move = box height from the break, else square-off.'
