id: book-atb-06
title: Falling trendline (neckline) break, retest and bullish candle (Strategy 1) (The Advanced Trading Book, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 3, Strategy 1 (p26))
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Line through the last 3 or more falling swing highs (each touch within 0.1 ATR of the line, no close above it between
  touches). A 15m close above the line = break (no entry). Within 12 bars after the break, a 5m bar trades back within 0.1
  ATR of the line (retest) and closes green above the line: buy at the next 5m open. Long only (the book takes only the bullish
  side). Stop: Below the retest bar''s low. Exit: 3R or square-off.'
