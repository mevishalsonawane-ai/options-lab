id: book-bennett-03
title: Put underwriting as a defined-risk bull put spread at 25 delta (Colin Bennett, book rule, tested in R104)
family: option-structure
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Colin Bennett''s rule from Trading Volatility (Ch. 1.2, Put underwriting benefits from selling expensive implied)
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options
  structure (sell the vol premium and skew); no direction signal. Entry: Day after expiry 09:20: sell the nearest-expiry put
  with delta closest to -0.25 and buy the put 3 strikes lower. Stop: Close if the spread''s value reaches 2x the credit. Exit:
  Hold to 15:05 on expiry day (app square-off) or the stop.'
