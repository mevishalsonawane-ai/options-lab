  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Downtrend; at least 2 falling swing highs and 2 swing lows within 0.3 ATR of each other (flat base); the first close
  below the base: sell at the next open (no retest). Mirror (ascending triangle in an uptrend) for longs. Stop: Above the
  LAST swing high inside the triangle (the book''s ''level 2'', the tighter of two). Exit: Measured move (triangle height)
  or square-off.'
