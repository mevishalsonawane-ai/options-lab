id: r108-risk
title: 'R108 RISK on the paper book (R72, R51, R52, Liquidity 15+5): open stop-risk a way at most Rs 6,500 (instead of a count)'
family: sizing-execution
date: '2026-10-26'
doc: research/HUNT_R108_SAME_DIRECTION_CAP.md
hypothesis: 'Boss''s same-direction cap (at most 2 open a way across all arms) refuses the arms'' winning trades (R107 lead). This rule: open stop-risk a way at most Rs 6,500 (instead of a count). Gates: net above the app''s cap in design, walk-forward and final; Boss''s account rule (months <= -Rs 13,000, Rs 40,000 drawdown breaches, days <= -Rs 13,000) at least as often as the cap in each period; final random-refusal twin BH q <= 0.10 over 5,784 tests; >= 30 final trades changed.'
