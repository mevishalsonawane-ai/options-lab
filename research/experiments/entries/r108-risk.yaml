period:
  design: 2024-11-20..2026-03-31 (walk-forward window Apr 2025 - Mar 2026)
  holdout: 2026-04-01..2026-10-13 read once (already read by R51-R107)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the four arms'' own index signals (unchanged); only which entries the account takes changes'
model_or_rule: 'the paper book (R72, R51, R52, Liquidity 15+5 at 1 lot, the app order, would-be accounting) with open stop-risk a way at most Rs 6,500 (instead of a count)'
settings: research/hunt/r108_same_direction_cap/r108cfg.py TESTS; r108book.make_rule; PREREG.md section 4
prereg: research/hunt/r108_same_direction_cap/PREREG.md
