results:
  summary: 'Design: 3,705 trades, net -Rs 63,400 (CAP2 -Rs 1,28,786, 3,456 trades; no cap Rs 2,30,649), max DD Rs 1,28,618 (CAP2 Rs 2,09,037), worst day -Rs 20,059, months <= -Rs 13k 7 (CAP2 6), Rs 40k breaches 1 (CAP2 1), twin p 0.6282. Walk-forward: 2,720 trades, net Rs 48,513 (CAP2 Rs 25,383, 2,536 trades; no cap Rs 4,37,733), max DD Rs 1,19,121 (CAP2 Rs 1,24,652), worst day -Rs 19,911, months <= -Rs 13k 4 (CAP2 3), Rs 40k breaches 1 (CAP2 1), twin p 0.6971. Final: 1,451 trades, net Rs 69,927 (CAP2 Rs 15,955, 1,384 trades; no cap Rs 1,38,560), max DD Rs 63,461 (CAP2 Rs 74,624), worst day -Rs 15,309, months <= -Rs 13k 1 (CAP2 2), Rs 40k breaches 1 (CAP2 1), twin p 0.3279. BH q 1.0 over 5,784 tests (R108 alone 0.5914). Fails 4 checks, first: design: more months at or below -Rs 13,000 than CAP2 (7 vs 6); wf: more months at or below -Rs 13,000 than CAP2 (4 vs 3); final: more days at or below -Rs 13,000 than CAP2 (4 vs 2).'
