id: r61-v7
title: 'R61 Solo 3.0 V7: meta-labeller over S1-S4, L1 logistic C 0.05 (sparse), all 59 features; take score >= training 70th
  percentile, 1 a day'
family: ml
date: '2026-10-15'
doc: research/HUNT_R61_SOLO_3.md
hypothesis: 'An expanded, pre-listed feature set that knows OI, PCR, max pain, OI walls, IV / IV rank / skew / term, VIX rank,
  Greeks, GEX / gamma flip, basis, value area, events and FII positioning picks Solo''s paper trades (S1-S4, at most one a
  day, NIFTY / BANKNIFTY / FINNIFTY / MIDCPNIFTY) better out of sample than A2''s 29 features (gates: final net > 0, twin
