- 5-minute bars (index spot)
model_or_rule: 'Any entry from an existing arm (Breadth Donchian, R51 Donchian, Liquidity 15+5) | stop: initial: 0.1 ATR beyond
  the last confirmed swing low (3-bar fractal) before entry; after each new high in favour, raise to 0.1 ATR below the latest
  confirmed reaction low; never lower it | exit: the trailed stop, or the arm''s own exit, whichever first; 15:15 (15:05 on
  expiry) | filters: none'
