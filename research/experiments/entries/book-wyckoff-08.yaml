id: book-wyckoff-08
title: Stop beyond the last point of resistance, raised under each new reaction low (Wyckoff, book rule, proposed)
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Wyckoff''s rule from The Day Trader''s Bible (Ch. IV) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Any entry from an existing arm (Breadth Donchian,
  R51 Donchian, Liquidity 15+5) Stop: initial: 0.1 ATR beyond the last confirmed swing low (3-bar fractal) before entry; after
  each new high in favour, raise to 0.1 ATR below the latest confirmed reaction low; never lower it Exit: the trailed stop,
  or the arm''s own exit, whichever first; 15:15 (15:05 on expiry)'
