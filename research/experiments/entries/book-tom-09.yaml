id: book-tom-09
title: Trend change on the break of the lower low (and continuation buy above the old high) (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Principles of Price Action & Trend, p. 56-62) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: With confirmed
  2-bar fractal pivots: after an uptrend (last two swing highs and lows rising), a lower swing high then a lower swing low;
  short when price trades below that lower low. If instead price trades above the last swing high first, buy (continuation).
  Stop: the lower high (short) / the last swing low (continuation long) Exit: 2R target or square-off 15:10 (15:05 expiry)'
