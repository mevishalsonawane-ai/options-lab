id: book-carli-04
title: Skip a trade in the direction of today's opening gap (David Carli, book rule, tested in R104)
family: daily-filters
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'David Carli''s rule from The Power of Divergence Trading (Ch. 2) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: no new entry of its own; on a rising-window
  day (open > yesterday''s high) skip long signals, on a falling-window day (open < yesterday''s low) skip short signals Stop:
  unchanged (filter only) Exit: unchanged (filter only)'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
