id: r131-gap-t
title: 'R131 overnight direction from 14:55 (GAP_T): will the index open above its 14:55 price? 99 tests'
family: overnight
date: '2026-10-28'
doc: research/HUNT_R131_DIRECTION.md
data_version: Drive lake copied 28 Oct 2026 (index_1m, R123 decision rows, equity_1m, options_rolling_1m WEEK, index_daily, participants/, fut_daily_continuous, equity_daily, stock_fut_daily_continuous); lakeclean 1-3
period:
  design: 2021-08-03..2026-03-15 (walk-forward folds 2023, 2024, 2025, Jan-15 Mar 2026)
  holdout: 2026-04-01..2026-10-19 (read before by R123-R130; read once here)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the index (underlying) at 14:55 and its previous days, VIX; optional context sets: 59-stock breadth, participants OI + FPI, futures basis/OI, end-of-day and live chain, rupee/G-sec/MCX, calendar'
model_or_rule: research/hunt/r131_direction/run.py (LR, GBM, MLP x 8 input sets x 4 coverages + 3 baselines)
prereg: research/hunt/r131_direction/PREREG.md
holdout_read: true
verdict: inconclusive
hypothesis: The direction of the 14:55 -> next open move can be called >= 60% on the most confident days, beating the up-drift base rate
settings: PREREG.md sections 4-7 and Amendment 1 (written after the walk-forward, before the holdout)
variants_tried: 99
results:
  summary: '14 of 99 tests pass every gate (n >= 100, >= 60%, BH q <= 0.10 over 891 tests, 3 of 4 folds, holdout). Best: IDX+CHAIN LR at 10% coverage 77.5% right (463 calls; base 61.9%), holdout 67.3% (49; base 51.0%). About 70% of calls are MIDCPNIFTY; median move 0.33-0.37%. ATM call 14:55 -> 09:15: walk-forward Rs +793 to +991 a trade (207-296 trades), holdout Rs +216 to +742 (15-32 trades), but more than half the calls cannot be priced (roll or no print), selling at 09:19 turns 4 of 6 holdout results negative (Rs -315 to -603), Jan-Mar 2026 lost (Rs -1,116 to -1,734, 17-22 trades). Direction call real but thin; not a robust option trade; nothing to paper.'
  costs: Costs('dated') + Fills('liq'), 1 lot, today's lots; trades skipped when a minute has no traded print or the weekly contract rolls overnight
