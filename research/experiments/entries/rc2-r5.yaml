id: rc2-r5
title: 'RC2 crypto options R5_dvol_jump: DVOL up >= 3% in an hour with a >= 1x implied 1-h move'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: Buying a Delta India BTC/ETH option on 'DVOL up >= 3% in an hour with a >= 1x implied 1-h move', with a stop-loss
  and a profit lock, makes money after real costs and beats random same-clock entries.
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,912 BTC/ETH daily expiries (956 per coin) (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain
  polls 13 Oct 2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad,
  not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (184 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- CRYPTO
features:
- DVOL hour-on-hour change
- 1-h index move
model_or_rule: 'DVOL up >= 3% in an hour with a >= 1x implied 1-h move; strike atm; expiry >= 3 h left; max hold 3 h; exits:
  stop -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s25_trail (best design mean). Design: 164 trades, 32% win, -3.2% a trade net (gross +3.6%), Rs -10,172 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.016 (BH q 0.022), direction twin p 0.413; walk-forward Rs -11,805; stress
    Rs -26,251. Holdout: 36 trades, -12.2% a trade, Rs -8,645 (after VDA tax Rs -9,987). Gates passed on design: not all.
    All exits: s40_step: design n 164 net -5.6%/trade Rs -17,946, holdout n 36 -15.7% Rs -11,148; s40_trail: design n 164
    net -4.3%/trade Rs -13,828, holdout n 36 -14.0% Rs -9,971; s25_step: design n 164 net -4.2%/trade Rs -13,314, holdout
    n 36 -13.1% Rs -9,311; s25_trail: design n 164 net -3.2%/trade Rs -10,172, holdout n 36 -12.2% Rs -8,645.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
    on entry and exit; exits less 1 tick + 1%; stress spread x1.5 and fee 0.03%
holdout_read: true
verdict: rejected
notes: One of 8 RC2 rules (32 variants, one BH family). Every trade had a stop and a profit lock (Boss's crypto rule). Design
  was re-run once after a data fix (listing-glitch marks, PREREG amendment 4).
