  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: Not tested by us as a sizing rule. R75: every Donchian book breaks the account stop at 1 lot on
  all five indices; its conclusion was that size, not filters, is the lever. R101: 2 lots on 5-of-5 breadth earned what any
  extra lot earns (Rs 161 vs random 160, p 0.475).. Assumptions: The book sizes so that 20 losses are acceptable but gives
  no formula; dividing CLAUDE.md''s account stop by 20 is ours. The rupee loss of 1 lot at the stop is estimated from the
  option''s delta at entry times the index stop distance plus charges (about Rs 70 NIFTY / Rs 76 BANKNIFTY a round trip).'
