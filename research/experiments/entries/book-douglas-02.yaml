id: book-douglas-02
title: Fixed rupee risk per trade so that 20 straight losses fit the account stop (Mark Douglas, book rule, proposed)
family: sizing-execution
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Mark Douglas''s rule from Trading in the Zone (Ch. 11 (Accepting the Risk)) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: none (sizing); stop distance from the arm''s index-level
  stop. Entry: Unchanged: the arm''s own signals. Stop: Unchanged: the arm''s index-level stop (never moved to change size).
  Exit: Unchanged.'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
