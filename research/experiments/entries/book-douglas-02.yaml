features:
- none (sizing); stop distance from the arm's index-level stop
- per trade
model_or_rule: 'Unchanged: the arm''s own signals. | stop: Unchanged: the arm''s index-level stop (never moved to change size).
  | exit: Unchanged. | filters: Lots = floor(R / rupee loss of 1 lot if the stop is hit), minimum 0 (skip the trade if even
  1 lot risks more than R). R = Rs 2,000 (Rs 40,000 drawdown stop / 20) or Rs 650 (Rs 13,000 monthly stop / 20); with k arms
  live at once, divide R by k.'
settings: 'research/books/TESTABLE_RULES.md, rule book-douglas-02; trade: the arm''s option, sized by the rule above instead
  of a fixed 1 lot'
