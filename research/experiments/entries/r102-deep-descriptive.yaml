results:
  summary: 'NIFTY daily sd 1.316% over 5,087 days (0.744% in 2025); BANKNIFTY 1.734% (0.789%); daily corr 0.877, beta 1.157. Median day range 0.907% / 1.131% (2,288 / 1,185 days), 61% / 65% of it made by 10:30; the 09:15 minute spans 0.213% / 0.295%. Gaps >= 0.5% on 20% / 34% of days; a 0.5-1% gap fills 42% / 53%. 09:20 ATM straddle 0.96% / 1.49% of spot, beaten by the close on 7.1% / 6.5% of non-expiry and 40.5% / 37.8% of expiry days; expiry straddle 40% of its 09:20 value at 14:30, 13% at 15:15. Put skew +2.56 / +2.11 IV points; PCR 0.86; expiry close a median 0.60% / 0.68% from max pain. FIIs net short index futures 61-72% of their book in 2025-26, clients net long 30-46%.'
  costs: none (no trades); charges on one lot verified publicly (Rs 70.32 NIFTY, Rs 75.65 BANKNIFTY round trip)
holdout_read: null
