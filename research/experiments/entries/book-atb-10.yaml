  Ch. 4 flags (p58)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source:
  underlying price. Entry: Pole: a move of >= 2 ATR within 5 bars. Flag: 4-15 bars drifting against the pole inside two parallel
