id: book-aziz-13
title: Per-trade risk 1% (max 2%) of equity; stop for the month at a 6% loss (Andrew Aziz, book rule, proposed)
family: sizing-execution
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 7, Position Sizing (2% and 6% rules)) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: none (account rule).
  Entry: Lots = floor(1% of equity / (option stop distance x lot size)), at least 0 (skip the trade when one lot risks more
  than 2%). Stop: Monthly: when realised losses plus open risk reach 6% of equity at the month''s start, no new entries until
  the next month. Exit: unchanged'
