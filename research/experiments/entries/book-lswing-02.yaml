hypothesis: 'Larry Swing''s rule from A Practical Guide to Swing Trading (Ch. 5.1, 6, 8.8, 8.9, 10.1.1) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume (MCX continuous
  near-month future, daily, exchange volume). Entry: Same scan and trigger as forceswing-master-plan-index, on the MCX future;
  ''open'' = the MCX 09:00 open; gap waits 30 / 5 minutes as in the book. Stop: Same as forceswing-master-plan-index (higher
  of -1.3 ATR14 or reference low - 0.07 ATR14; daily trail under the prior low). Exit: Half at +2.3 ATR14, rest on the trail;
  20-session backstop; exit before the contract''s last 3 sessions (roll gap not modelled - assumption).'
