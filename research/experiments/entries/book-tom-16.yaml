hypothesis: 'Trader Tom''s rule from The First Trading Manual (Case Story: David the Swing Trader, p. 156-158) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: In
  a 60-minute uptrend, measure the last completed pullback (swing high to swing low, 2-bar fractals); after a new swing high,
  place a limit buy at new high minus that pullback size; fill on touch. Mirror in downtrends. Stop: 1.0 x the pullback size
  beyond the fill Exit: the new swing high, or square-off 15:10; futures variant may hold 3 sessions'
