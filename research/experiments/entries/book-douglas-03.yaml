notes: 'Our nearest test: R81 X5 (half at +15% = 1R, runner to breakeven) failed: design Rs 1,78,523 vs Rs 2,57,249 (881 trades),
  final -Rs 23,896 vs Rs 11,155 (357). R100 half off at +15% failed; R18 breakeven after +15% changed nothing. Expect worse,
  since the first third is taken earlier than 1R.. Assumptions: Book gives tick numbers for T-bonds and points for S&P only;
  translated as fractions of the stop distance. ''Most likely place for the market to stop'' read as the next 60-minute swing.'
