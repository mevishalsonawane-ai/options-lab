id: book-douglas-03
title: 'Three lots: one off at a small first profit, one at the next level with stop to entry, last before the next swing
  (Mark Douglas, book rule, proposed)'
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Mark Douglas''s rule from Trading in the Zone (Ch. 11 (Taking Profits)) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price (levels on the index); first-third profit
  on the premium. Entry: The arm''s signal, 3 lots. Stop: The arm''s index stop on all lots until the second third is sold,
  then the remaining lot''s stop moves to the entry price (premium). Exit: Lot 1 when the index has moved two-thirds of the
  stop distance in favour (the book''s 4 ticks against a 6-tick stop). Lot 2 at the next index swing high/low or prior-day
  high/low beyond entry (the arm''s target if it has one). Lot 3 just before the next significant higher-timeframe high/low
  (60-minute swing), else session square-off (15:05 expiry / 15:10 NSE, MCX 10 minutes before close).'
