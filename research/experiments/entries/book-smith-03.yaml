notes: 'Our nearest test: SWING_EXITS: the app''s stop/target/ladder cut drawdowns but no row beat coin-flip entries with
  the same exits; LV-05 trailed the opposite N/2-day channel and lost. This trail itself is not tested by us.. Assumptions:
  The book uses it on its own entry only; testing it on our existing entries isolates the exit. Compare with coin-flip entries
  carrying the same exit (SWING_EXITS method).'
