id: book-smith-03
title: Significant-day trailing stop as an exit module on existing multi-day holds (David Graeme Smith, book rule, proposed)
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'David Graeme Smith''s rule from Short Swing Trading (Ch. 8.3, 9.1) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Unchanged: the entries of SWING_DEEP''s
  swing rules, the LV-05 multi-day Donchian, and R96''s crude NR7 lead (same signals and dates as their studies). Stop: Initial
  stop as each study already defines it. Exit: Replace the study''s trail/time exit with: after each close, if the day made
  a new extreme in the trade''s favour and is not an inside day, move the stop to that day''s far end (low for longs) minus
  buffer; buffer 0.5% of price (book) and 0.25 x ATR(14) (variant); midpoint lock on a day >= 2.5 x ATR(14) in the trade''s
  favour; inside days never move the stop; keep the study''s max-hold cap.'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
- NATURALGAS
features:
- underlying price
- daily bars for the trail, 1-minute bars for the stop check
model_or_rule: 'Unchanged: the entries of SWING_DEEP''s swing rules, the LV-05 multi-day Donchian, and R96''s crude NR7 lead
  (same signals and dates as their studies). | stop: Initial stop as each study already defines it. | exit: Replace the study''s
  trail/time exit with: after each close, if the day made a new extreme in the trade''s favour and is not an inside day, move
  the stop to that day''s far end (low for longs) minus buffer; buffer 0.5% of price (book) and 0.25 x ATR(14) (variant);
  midpoint lock on a day >= 2.5 x ATR(14) in the trade''s favour; inside days never move the stop; keep the study''s max-hold
  cap. | filters: none beyond each host study''s.'
settings: 'research/books/TESTABLE_RULES.md, rule book-smith-03; trade: the host study''s instrument (1-ITM monthly option
  or futures mirror; MCX 1-ITM option on the near future); stops on the underlying'
prereg: null
