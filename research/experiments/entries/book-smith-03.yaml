  trail/time exit with: after each close, if the day made a new extreme in the trade''s favour and is not an inside day, move
  the stop to that day''s far end (low for longs) minus buffer; buffer 0.5% of price (book) and 0.25 x ATR(14) (variant);
  midpoint lock on a day >= 2.5 x ATR(14) in the trade''s favour; inside days never move the stop; keep the study''s max-hold
  cap. | filters: none beyond each host study''s.'
settings: 'research/books/TESTABLE_RULES.md, rule book-smith-03; trade: the host study''s instrument (1-ITM monthly option
