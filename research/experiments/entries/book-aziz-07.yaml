id: book-aziz-07
title: 'Fallen Angel analogue: gap-up open spike, flush below VWAP, base, volume breakout (Andrew Aziz, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, Strategy 1: Fallen Angel) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume. Entry:
  Day filter: gap up of at least 0.5%. The index makes a new high in the first 15 minutes, then trades below VWAP; a base
  of at least 15 one-minute bars with a range under 0.3 x daily ATR14 forms at or above the previous day''s close or the 5-minute
  50 SMA. Long on the first 1-minute close above the base high with volume at least 2 x the base''s average 1-minute volume.
  Stop: below the base low Exit: Part at VWAP, part at the day''s high (stop to entry after the first), rest at yesterday''s
  high or a new 5-minute low; time exit 11:45.'
