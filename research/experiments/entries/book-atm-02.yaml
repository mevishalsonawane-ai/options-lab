id: book-atm-02
title: NIFTY/BANKNIFTY futures-spot basis snap-back (literal statistical arbitrage) (The Advanced Trading Methods book, book
  rule, proposed)
family: flow-oi
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Methods book''s rule from The Advanced Trading Methods in the Financial Markets (Sec. 3.1.3,
  Statistical arbitrage) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal
  source: underlying price (index futures vs index spot). Entry: at the close of a 1-minute bar where (futures - spot) minus
  its 60-minute rolling mean exceeds 2.5 rolling standard deviations: if the futures is rich, expect the spot to catch up
  (buy ATM CE); if cheap, buy ATM PE, at the next bar open Stop: index spot moves 0.15% against the trade Exit: basis back
  within 0.5 standard deviations of its mean, or 10 minutes, whichever first; square off by 15:05 on expiry day and 15:20
  otherwise'
