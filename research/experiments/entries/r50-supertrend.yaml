id: r50-supertrend
title: 'Cancelled hero rules on the Nov 2024+ market: volume / supertrend'
family: patterns-indicators
date: '2026-10-15'
doc: research/HUNT_R50_HERO_RECENT.md
hypothesis: A cancelled volume / supertrend hero rule (R21-R43), or a small pre-registered re-tune of it, makes money on the
  market since NSE's weekly-expiry change (20 Nov 2024) after real costs, on one held contract, and beats random entry times.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: opt_<UND>_WEEK_2024-2026 (rolling ATM+-10 1-minute, rebuilt per held strike),
  index_1m 2024-2026, equity_1m 2024-2026 (R35 heavyweights); lake to 13 Oct 2026'
period:
  design: expiry days 20 Nov 2024 - 31 Mar 2026 (walk-forward blocks B0-B4)
  holdout: 'final test: expiry days 1 Apr - 13 Oct 2026, read once (not pristine: R43-R45 saw 2025-26)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: OPTION''S OWN CHART (non-default)'
- 'signal source: index (+ option volume, heavyweight stocks)'
model_or_rule: O-S3 = R35 S3; O-S5 = R35 S5; T-ST (tr25) = R35 S5
settings: research/hunt/r50/r50rules.py (rules), research/hunt/r50/r50cfg.py (dates, lots)
prereg: research/hunt/r50/PREREG.md
variants_tried: 5
results:
  summary: '2 original rules and a re-tune grid of 3 cells (one cell chosen on design by walk-forward), on 193 design and
    73 final-test index-expiry-days (20 Nov 2024 - 13 Oct 2026; NIFTY and SENSEX weekly, BANKNIFTY / FINNIFTY / MIDCPNIFTY
    monthly). 0 pass. O-S3: design 79 trades net Rs -76,698 (walk-forward Rs -58,008); final 26 trades, win 34.6%, peaks 5x/10x
    0/0, net Rs -5,904, without top 5 Rs -15,389 (top-5 share n/a (net <= 0)), p 0.998, q 1.000: fail, too few trades to judge;
    O-S5: design 26 trades net Rs -31,898 (walk-forward Rs -25,957); final 14 trades, win 35.7%, peaks 5x/10x 0/0, net Rs
    -4,264, without top 5 Rs -10,757 (top-5 share n/a (net <= 0)), p 0.996, q 1.000: fail, too few trades to judge; T-ST (tr25):
    design 26 trades net Rs -15,195 (walk-forward Rs -12,870); final 14 trades, win 0.0%, peaks 5x/10x 0/0, net Rs -7,340,
    without top 5 Rs -5,617 (top-5 share n/a (net <= 0)), p 1.000, q 1.000: fail, too few trades to judge.'
  costs: charges in force on the trade date (obuy Costs('dated'), BSE rates for SENSEX); next-minute fills + 5 bps + 1/2/4-tick
    half-spread by 5-minute volume; entry limit ref x 1.2 + 0.10 for 3 minutes; gap fills at the worse open; 2x spread stress
    reported
holdout_read: true
verdict: rejected
notes: 'BH over all 28 R50 final-test tests (20 originals + 8 chosen re-tunes). Random-entry twins: 500 per rule, same day,
  side, strike rule, budget and exit at a random minute of the rule''s window. Signal-source labels: ''OPTION''S OWN CHART''
  rules are not the default kind.'
