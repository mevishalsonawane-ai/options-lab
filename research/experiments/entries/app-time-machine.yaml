id: app-time-machine
title: 'Time machine on every arm ticket: bootstrap odds of each entry from the underlying (record only)'
family: diagnosis
date: '2026-10-22'
doc: android/app/src/main/java/com/optionslab/app/data/TimeMachineHost.kt
hypothesis: 'A bootstrap replay of an arm entry (2,000 draws from the underlying''s own last 60 sessions at the same time-of-day
  slot ±2 bars, the arm''s stop and target in underlying points, the stop checked before the target inside a bar) gives a
  verdict (edge / coin flip / against, vs the break-even win rate 1/(1+R)) that tells winning entries from losing ones.
  Borrowed from Jake Schincariol''s day-trader skill (MIT, Oct 2026). Not yet tested - logged before any test.'
data_version: the phone's own harvested index bars (Store, 1-minute, never pruned) and the history keeper's recent days
period:
  design: none yet; forward log from 22 Oct 2026 on paper and live (30 signal days before it is judged)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- the underlying's intraday bars at the entry's time-of-day slot
- the arm's stop and target (premium stops converted at the at-the-money delta 0.5, said so)
model_or_rule: 'engine risk/TimeMachine.kt: bootstrap odds and the ORB rule re-run on the same sessions; app TimeMachineHost
  runs it in the background after each entry and keeps a forward log (date, arm, ref, verdict, odds, outcome) in the
  encrypted store'
settings: shadow only on every arm, paper and live, hidden arms too; it never skips, resizes or delays a trade
prereg: null
variants_tried: null
results:
  summary: 'R120 (28 Oct 2026, research/HUNT_R120_TIME_MACHINE_GATE.md): the verdict worked out BEFORE each entry from the
    60 sessions before the entry day, on 14 arms'' historical trades (16,810 trades, design + final), did not pass as a
    filter: 0 of 28 arm x rule cells passed (skip ''against''; take only ''edge''). Its odds do not tell winners from losers:
    pooled correlation of the predicted win rate with the real win 0.04 (n 16,810), Brier 0.258 vs 0.245 for a constant
    guess, worse than the constant in all 14 arms'' finals. Nearest miss: R51 skip ''against'' up in all three windows (final
    Rs 134,743 -> 157,203, 1,670 trades, 73 skipped, twin p 0.039) but BH q 1.0. ''Edge only'' lost money on every profitable
    arm. R121 (28 Oct, research/HUNT_R121_TIME_MACHINE_SETUP.md): replaying the arm''s OWN past entries with its real exits
    tracks each trade well (same sign 90% for R51/R72/Solo) but still does not predict the next trade (correlation -0.003,
    n 16,552); 0 of 28 passed. Since 28 Oct the app says every verdict is not a proven signal and hides the Hero Rs 1,000
    ticket''s verdict (display only). Stays shadow; the forward-log test (TODO R21) still stands.'
  costs: each arm's own study costs (R120)
holdout_read: null
verdict: not-a-test
notes: A reality check in words, not an edge claim. Verdicts need at least 10 past sessions and 100 decided draws; fewer
  are said as unknown with their sample size.
