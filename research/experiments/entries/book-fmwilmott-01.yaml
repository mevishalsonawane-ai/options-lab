id: book-fmwilmott-01
title: Sell the NIFTY monthly ATM straddle when implied vol is above forecast realised vol, delta-hedge with futures on a
  band (Paul Wilmott, book rule, tested in R104)
family: option-structure
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Paul Wilmott''s rule from Paul Wilmott on Quantitative Finance (Ch. 12, How to delta hedge (hedging with implied
  vol); Ch. 48, Transaction costs (delta-tolerance band); Ch. 43/58 (worst-case gap check)) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options structure (chain ATM IV
  vs a realised-vol forecast from the underlying); the hedge is on the underlying future. Entry: On the first trading day
  after a monthly expiry, at 15:20, compute the next monthly ATM straddle''s implied vol (average of call and put IV) and
  a realised-vol forecast for the same days to expiry (EWMA lambda 0.94 on daily close-to-close NIFTY returns, as Ch. 42).
  Sell 1 ATM call + 1 ATM put if implied vol / forecast >= 1.15. Otherwise no trade this cycle. Stop: None in the book (the
  hedge is the risk control). Research variants: B closes everything if the position (options + futures) loses Rs 13,000;
  C pre-checks the worst case of a 3% overnight gap with IV +5 points and skips entry if it exceeds Rs 40,000. Exit: Hold
  to 15:05 on expiry day (square-off) or close early on a variant-B stop.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: VOL 2021-08-02 - 2026-03-31
  holdout: VOL 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
features:
- volatility / options structure (chain ATM IV vs a realised-vol forecast from the underlying); the hedge is on the underlying
  future
- daily decision at 15:20; hedge checked on 5-minute bars; one position per monthly expiry
model_or_rule: 'On the first trading day after a monthly expiry, at 15:20, compute the next monthly ATM straddle''s implied
  vol (average of call and put IV) and a realised-vol forecast for the same days to expiry (EWMA lambda 0.94 on daily close-to-close
  NIFTY returns, as Ch. 42). Sell 1 ATM call + 1 ATM put if implied vol / forecast >= 1.15. Otherwise no trade this cycle.
  | stop: None in the book (the hedge is the risk control). Research variants: B closes everything if the position (options
  + futures) loses Rs 13,000; C pre-checks the worst case of a 3% overnight gap with IV +5 points and skips entry if it exceeds
  Rs 40,000. | exit: Hold to 15:05 on expiry day (square-off) or close early on a variant-B stop. | filters: Skip entry if
  a pre-listed event (Budget, RBI policy, general-election result) falls inside the life of the trade, since implied vol then
  carries an event premium (Ch. 50).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmwilmott-01; trade: Short 1 lot ATM CE + 1 lot ATM PE; hedge with
  NIFTY futures using the Black-Scholes delta at the ENTRY implied vol (Ch. 12''s ''hedge with implied'' choice); rebalance
  on 5-minute closes only when the net option delta differs from the futures held by more than 0.5 lot (Ch. 48 band); report
  a fractional-hedge (theoretical) version alongside.'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 3
results:
  summary: 'VOL (option structure (chain as context)), variant C: design 14 trades, win 57%, net -Rs 47,767, folds -Rs 14,650,
    Rs 63,184, -Rs 96,300; p 1.000, BH q 1.000; holdout 0 trades, win -, net Rs 0. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all). NIFTY monthly series; hedge on the spot as a futures proxy Our nearest test: not
  tested by us as a hedged trade. R102: VIX over-states NIFTY''s next 21 days on 81% of days (median 1.28, 4,507 days). DEEP_OPTIONS_SELLING.md:
  naked 09:20 BANKNIFTY short straddle worst day -Rs 65,483; R103 defined-risk selling 0 of 24 confirmed.. Assumptions: The
  book states the P&L mechanics, not a threshold; 1.15 is our literal choice near R102''s median VIX / forward-realised ratio
  of 1.28 and must be pre-registered with alternatives (1.0, 1.3) under Benjamini-Hochberg. One futures lot equals one option
  lot, so at 1 lot the hedge is coarse (DEEP_OPTIONS_SELLING.md); the band avoids churning. Naked short margin is about Rs
  1.5 lakh, so this is research only; R103 rejected naked selling for this account.'
