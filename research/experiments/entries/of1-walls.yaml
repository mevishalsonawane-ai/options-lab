id: of1-walls
title: 'Heaviest-OI strikes as walls (call/put) or magnets (pin) at 1 and 3 sessions before expiry, vs random twins'
family: flow-oi
date: '2026-10-14'
doc: research/HUNT_OF1_ORDERFLOW_INDIA.md
hypothesis: The max-OI call (put) strike above (below) spot is breached less often than distance alone predicts, and the
  max total-OI strike ends closer to settlement than a same-distance twin.
data_version: 'NSE public archives (nsearchives.nseindia.com) fetched 13 Oct 2026: participant OI/volume 3,644 days 2 Jan 2012 - 13 Oct 2026 (3,632 usable), F&O bhavcopy index rows 3,644 days, all-index closes (Dhan lake index_daily for gaps), NSDL FPI 3,560 reporting days; copies on gdrive:IraAlgo-data-lake/participants'
period:
  design: expiries 2012 .. 2025-10-12 (NIFTY 433, BANKNIFTY 506 at k = 1)
  holdout: expiries 2025-10-13 .. 2026-10-13 (NIFTY 53, BANKNIFTY 12)
instruments:
- NIFTY
- BANKNIFTY
features:
- nearest-expiry OI by strike at k = 1, 3 sessions before expiry; index close; final settlement
model_or_rule: Poisson-binomial breach test vs leave-one-out distance baseline; sign-flip test vs mirror strike; 1,000
  random same-distance strikes
settings: research/hunt/of1/PREREG.md section 6
prereg: research/hunt/of1/PREREG.md
variants_tried: 12
results:
  summary: 'Design: 0 of 12 survive (best BH q 0.83). NIFTY k=1 call wall 47 breaches vs 49.9 expected (p 0.35), put wall
    56 vs 51.3 (p 0.80); BANKNIFTY put wall 51 vs 57.8 (p 0.17); max-OI strike closer than a random same-distance strike
    41.8% (NIFTY, 392) / 43.2% (BANKNIFTY, 481), about the no-magnet level (~44%: ties with K* count as not closer). Holdout computed for the record only (no survivor): best q 0.34.'
  costs: n/a
holdout_read: true
verdict: rejected
notes: Holdout figures were computed in the same one-time run although nothing could pass.
