id: r100-liquidity-g14
title: 'R100 Liquidity give-back (amendment A5): once the option is +20%, sell 1 lot of the same-side option 2 strikes further out of the money (a debit spread; paper only) (Boss: "keep the profit and make it not lose money")'
family: trade-management
date: '2026-10-22'
doc: research/HUNT_R100_LIQUIDITY_GIVEBACK.md
hypothesis: 'Boss (22 Oct: "Think out of the box, and find a way to keep the profit and make it does not loss money"): once the option is +20%, sell 1 lot of the same-side option 2 strikes further out of the money (a debit spread; paper only),
  added to Liquidity''s own exits, keeps open profit without cutting the runners; same gates as G1-G12 (net at least B0''s in
