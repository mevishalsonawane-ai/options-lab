hypothesis: 'Ernest Chan''s rule from Quantitative Trading (Ch. 6, Optimal capital allocation and leverage; Risk management)
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: the arm''s own
  realised trade P&L (sizing; the arm''s signals stay on the underlying). Entry: Unchanged: each arm''s own signal (Liquidity
  15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV). Stop: Unchanged (the arm''s own). Exit: Unchanged (the arm''s own).'
