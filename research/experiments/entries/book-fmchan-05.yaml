id: book-fmchan-05
title: Trailing half-Kelly throttle that can only cut an arm's size (Ernest Chan, book rule, tested in R104)
family: sizing-execution
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Ernest Chan''s rule from Quantitative Trading (Ch. 6, Optimal capital allocation and leverage; Risk management)
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: the arm''s own
  realised trade P&L (sizing; the arm''s signals stay on the underlying). Entry: Unchanged: each arm''s own signal (Liquidity
  15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV). Stop: Unchanged (the arm''s own). Exit: Unchanged (the arm''s own).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MM 2024-11-20 - 2026-03-31
  holdout: MM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- the arm's own realised trade P&L (sizing; the arm's signals stay on the underlying)
- re-estimated each evening; applied to the next day's signals
model_or_rule: 'Unchanged: each arm''s own signal (Liquidity 15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV). | stop: Unchanged
  (the arm''s own). | exit: Unchanged (the arm''s own). | filters: Size multiplier = clip( f_trail / f_design , 0, 1 ), where
  f = mean / variance of the arm''s daily net P&L per lot, f_trail on the trailing 126 sessions and f_design on the arm''s
  design period; lots = floor(base lots x multiplier), 0 = skip. Never above base lots.'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmchan-05; trade: As the arm trades (1-ITM / ATM option per its strike
  rule).'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'MM (the arms'' trades (sizing)), variant base: design net Rs 564,802 vs Rs 774,750, max drawdown -Rs 180,429 vs
    -Rs 444,695 (cut 59%, net cut 27%); p 0.074, BH q 1.000; final DD cut 19%, net cut 64%. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: H15: half-Kelly from Rs 1 lakh -> Rs 7.41 L holdout with a -44%
  drawdown; Kelly fraction unstable (BN 1.29 vs 0.48 / 0.14). R101: 2 lots on 5-of-5 breadth earned what any lot earns (p
  0.475). R74: volatility-targeted sizing not tried for the index arms. A cut-only throttle: not tested by us.. Assumptions:
  Chan: six-month lookback for day-long holds, half-Kelly, and gradual de-leveraging instead of shutdown. Because the multiplier
  is capped at 1, it only lowers risk (CLAUDE.md LIVE rule: shadow first). Compare on the holdout: net, worst month, max drawdown
  and the account-stop breaches (-Rs 40k / -Rs 13k a month) vs the unthrottled arm and vs a random throttle with the same
  average size.'
