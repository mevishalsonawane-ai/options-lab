notes: 'Our nearest test: H15: half-Kelly from Rs 1 lakh -> Rs 7.41 L holdout with a -44% drawdown; Kelly fraction unstable
  (BN 1.29 vs 0.48 / 0.14). R101: 2 lots on 5-of-5 breadth earned what any lot earns (p 0.475). R74: volatility-targeted sizing
  not tried for the index arms. A cut-only throttle: not tested by us.. Assumptions: Chan: six-month lookback for day-long
  holds, half-Kelly, and gradual de-leveraging instead of shutdown. Because the multiplier is capped at 1, it only lowers
  risk (CLAUDE.md LIVE rule: shadow first). Compare on the holdout: net, worst month, max drawdown and the account-stop breaches
  (-Rs 40k / -Rs 13k a month) vs the unthrottled arm and vs a random throttle with the same average size.'
