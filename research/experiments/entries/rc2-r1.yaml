id: rc2-r1
title: 'RC2 crypto options R1_asia_orb: Asian opening range (00:00-01:00 UTC) breakout, 01:00-07:00'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: Buying a Delta India BTC/ETH option on 'Asian opening range (00:00-01:00 UTC) breakout, 01:00-07:00', with a stop-loss
  and a profit lock, makes money after real costs and beats random same-clock entries.
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,912 BTC/ETH daily expiries (956 per coin) (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain
  polls 13 Oct 2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad,
  not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (184 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- BTC options (Delta India)
- ETH options (Delta India)
features:
- 00:00-01:00 UTC range
- 5-min close
model_or_rule: 'Asian opening range (00:00-01:00 UTC) breakout, 01:00-07:00; strike atm; expiry >= 3 h left; max hold 11 h;
  exits: stop -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s25_step (best design mean). Design: 1419 trades, 23% win, -4.7% a trade net (gross +5.4%), Rs -133,941 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.002 (BH q 0.004), direction twin p 0.279; walk-forward Rs -154,035; stress
    Rs -272,167. Holdout: 354 trades, -7.4% a trade, Rs -51,893 (after VDA tax Rs -84,972). Gates passed on design: not all.
    All exits: s40_step: design n 1419 net -5.6%/trade Rs -156,951, holdout n 354 -8.2% Rs -57,459; s40_trail: design n 1419
    net -6.3%/trade Rs -179,035, holdout n 354 -11.1% Rs -77,897; s25_step: design n 1419 net -4.7%/trade Rs -133,941, holdout
    n 354 -7.4% Rs -51,893; s25_trail: design n 1419 net -4.9%/trade Rs -138,001, holdout n 354 -11.3% Rs -79,884.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
    on entry and exit; exits less 1 tick + 1%; stress spread x1.5 and fee 0.03%
holdout_read: true
verdict: rejected
notes: One of 8 RC2 rules (32 variants, one BH family). Every trade had a stop and a profit lock (Boss's crypto rule). Design
