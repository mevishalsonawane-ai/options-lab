id: rc1-f
title: 'Crypto funding carry: spot long + INR perp short while funding > 10%/yr, 1x and 3x'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC1_CRYPTO_SMALL_ACCOUNT.md
hypothesis: Delta-neutral funding carry earns a steady income after Indian tax.
data_version: 'Binance public archive (data.binance.vision): spot BTCUSDT/ETHUSDT 1d+1h 2017-08-17..2026-10-12, USD-M perps
  1d+1h 2020-01-01..2026-10-12, funding 2020-01..2026-09-30; USD/INR ECB (frankfurter.dev); parquet cache outside git'
period:
  design: walk-forward 2020-01-01..2025-10-12 (71 months)
  holdout: 2025-10-13..2026-09-30 (funding archive ends 30 Sep 2026), read once
instruments:
- CRYPTO
features:
- BTC / ETH prices in INR
- funding (perp ideas)
- realised volatility (d)
model_or_rule: enter when the 9-print mean funding annualised > 10%, exit < 0; no margin top-ups
settings: research/hunt/rc1/config.py
prereg: research/hunt/rc1/PREREG.md
variants_tried: 4
results:
  summary: 'Walk-forward 50/50 Rs 1L: gross +4.2%/yr, after tax -10.9% (A) / -9.1% (B), max DD -51%, 36 entries, 6 short liquidations
    at 1x (14 at 3x) when coins doubled. Post-hoc monthly-reset variant (not gated) -20.4%. Twin p 0.714, BH q 0.816. Holdout
    -1.1%. Impractical in India: two exchanges, split capital, each leg taxed separately. FAILED.'
  costs: Indian spot taker 0.25% + 18% GST + 0.15% half-spread per side (low 0.168% / high 0.890%); INR perps 0.05% + GST
    + 0.02% (0.079%); real funding; 31.2% VDA tax per profitable sale, no loss set-off; 1% TDS locked 365 d; perps tax readings
    A (VDA) and B (business)
holdout_read: true
verdict: rejected
notes: 'RC1 (Boss 13 Oct 2026, small Indian account). BH across 8 active tests (b x2, c, c-perp, d, f, g, g-perp). Tax figures
  are modelling assumptions; confirm with a CA. Research only: nothing in the app trades crypto.'
