  monthly expiry, 1-minute, rebuilt per held contract), equity_1m 2024-2026, nse_bhavcopy weekly UDiFF files (expiries, lots);
  options to 14 Oct 2026, equity to 12 Oct 2026'
period:
  design: 20 Nov 2024 - 31 Mar 2026
  holdout: 'final test: 1 Apr - 12 Oct 2026, read once (not pristine: other studies saw it)'
instruments:
- F&O stocks (stock options)
features:
- 'signal source: the STOCK (equity_1m 15-minute closes; default-compatible)'
- ATM option of the side bought; stops and locks on the option premium
model_or_rule: at a 15-minute bar close (bars 2-24), the stock closes at or under its lower band (buy the ATM CE) or at or
  over its upper band (buy the ATM PE), band over its last 20 bars; buy at the next 1-minute open (within 5 min); exit 60
  min later or 15:25 on the same contract; 25% premium stop on 1-minute rows (gap fills at the open); no overlap per stock
  and side; no trade on the expiry session or the 2 sessions before it, or within 5 sessions of a corporate action
