id: book-sadowski-03
title: Break out of an overlapping correction in the trend direction (Roman Sadowski, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 4) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Trend down:
  close below EMA50 and EMA50 falling over 10 bars. Correction: the last 8 bars all sit inside a box no taller than 1.5 x
  ATR14 and each overlaps the previous bar by at least 50% of its range. Short on the first close below the box low; long
  is the mirror (close above the box high in an uptrend). Book long variant: wait for 2 closes above the box high and buy
  the next open. Stop: The most recent 2-bar swing high (short) or the box low (long). Exit: Not stated by the book; we use
  a 3R target or a trailing stop at the last 2-bar swing, plus a time exit at 15:15 for intraday options or 5 sessions on
  60-min bars.'
