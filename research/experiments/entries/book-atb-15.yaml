  wedge (p35, p37, p40, p42, p53-p55)) makes money after real charges and slippage, walk-forward, with BH across the rules
  tried. Signal source: underlying price. Entry: Falling wedge: >= 2 falling swing highs and >= 2 falling swing lows, the
