id: r65-solo2-s5
title: 'R65 Solo2 S5 Boss: +5% at +10%, trail 5 pts, target kept'
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R65_STEP_TRAIL.md
hypothesis: 'Boss (16 Oct): once the premium is +10%, put the stop at +5%, then +10% at +15%, and so on (a 5-point step trail),
  and a -5% stop moved up the same way, improve the new paper arms after real costs. This variant: S5 Boss: +5% at +10%, trail
  5 pts, target kept; gates as R51 (final net > 0, twin p < 0.05, BH q <= 0.10 over 30 tests, 40+ trades, top-5 < net, design
  and walk-forward > 0); recommended only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: index (setups S1-S4); model inputs as R57 (unchanged); only the option exits differ (stops and trail on
  the premium)'
model_or_rule: 'Solo 2.0 (R57 A2 logistic meta-labeller picks of setups S1-S4, one a day, 4 indices); exits: S5 Boss: +5%
  at +10%, trail 5 pts, target kept'
settings: research/hunt/r65/r65cfg.py exit_spec / trail_steps; PREREG.md sections 2-3
prereg: research/hunt/r65/PREREG.md
variants_tried: 30
results:
  summary: 'Design: 166 trades, win 62%, net Rs 34,840 (Rs 210/trade), worst day -Rs 10,370, max DD Rs 18,885, stops 9. Walk-forward:
    166 trades, win 62%, net Rs 34,840 (Rs 210/trade), worst day -Rs 10,370, max DD Rs 18,885, stops 9. Final: 128 trades,
    win 70%, net Rs 81,413 (Rs 636/trade), worst day -Rs 5,646, max DD Rs 15,766, stops 3; entry-twin p 0.002, BH q 0.0046,
    exit-twin p 0.7066 (q 1.0). Verdict: PASS. Versus B0: design -Rs 21,069 (bootstrap p 0.8655), final -Rs 17,759 (p 0.7675).
    Versus A4: design -Rs 23,801 (bootstrap p 0.894), final -Rs 16,139 (p 0.7435). Final: the lock closed 57 trades; versus
    the plain rules it gave up Rs 71,040 and saved Rs 53,281 (net -Rs 17,759); 31 of them went on to +30% after the exit.'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates, but not recommended (PREREG section 6): it does not beat both B0 and A4 in design, walk-forward
  and final, and its exit-twin q is 1.0 (> 0.10: no better than the same number of random early exits). Boss may still choose
  it. Signal on the underlying; research only, nothing changes paper or live.'
