id: r100-liquidity-g5
title: 'R100 Liquidity give-back: index breakeven: once a 1-minute index bar has gone 2 index stops past the entry index price,
  sell when the index trades back to it'
family: trade-management
date: '2026-10-22'
doc: research/HUNT_R100_LIQUIDITY_GIVEBACK.md
hypothesis: 'Boss (22 Oct): a Liquidity trade went to about +Rs 4,500 and closed about -Rs 1,000. This rule (index breakeven: once
  a 1-minute index bar has gone 2 index stops past the entry index price, sell when the index trades back to it) added to Liquidity''s
  own exits keeps open profit without cutting the runners: net at least B0''s in design, walk-forward and final, BH q <= 0.10 against
  random early exits in design and final, not carried by its 5 best trades, at least 30 changed design trades.'
