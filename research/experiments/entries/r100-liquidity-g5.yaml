  holdout: 1 Apr - 13 Oct 2026, read once; already read by R51 / R63 / R70 / R76 / R81 (weak)
instruments:
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal: index bars (liquidity levels); exit: index (breakeven at the entry index price)'
model_or_rule: 'Liquidity 15+5 (index level breaks on 15/5-min bars BANKNIFTY and MIDCPNIFTY, 30/5 FINNIFTY; 1-ITM); exits: own
  exits + index breakeven: once a 1-minute index bar has gone 2 index stops past the entry index price, sell when the index trades
