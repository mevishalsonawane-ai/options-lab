id: book-atb-08
title: 'Rising wedge in a downtrend: lower-line break, previous-low break, retest, sell (Strategy 3) (The Advanced Trading
  Book, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 3, Strategy 3 (p28))
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Downtrend before the wedge; a wedge of at least 2 rising swing highs and 2 rising swing lows with the lower line
  rising faster (converging). Step 1: close below the lower line (no entry). Step 2: close below the last swing low inside
  the wedge. Step 3: within 8 bars price trades back up to within 0.1 ATR of that broken low and a bar closes red below it:
  sell at the next open. Mirror (falling wedge in an uptrend) for longs. Stop: Above the last swing high inside the wedge
  (the book: ''above the previous high''). Exit: Measured move (wedge height at its start) or square-off.'
