id: r69-oov-x20
title: R69 OOV X20 +5% at +20%, then +1 per +1
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R69_ONE_POINT_TRAIL.md
hypothesis: 'Boss (16 Oct): a +5% stop once the option is +25%, then +1 point of stop for every +1 point of gain (on top of
  the A4 ladder), improves the paper arms after real costs. This variant: {R.VLABEL[v]}; gates as R51 (BH over 15 tests);
  recommended only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
