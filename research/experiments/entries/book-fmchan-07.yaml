id: book-fmchan-07
title: 'Turning point: a 1% day against a fresh 10-day extreme (Chan''s GS rule, simplest form) (Ernest Chan, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Ernest Chan''s rule from Quantitative Trading (Ch. 7, Regime switching, Example 7.1) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (index daily bars). Entry: Long
  if today''s close-to-close change >= +1% AND today''s low (or yesterday''s) was the lowest low of the last 10 sessions;
  short if change <= -1% AND today''s or yesterday''s high was the highest high of the last 10 sessions. Enter at the next
  session''s 09:20 price. Stop: None in the book. Research variant: 1.5 x ATR14 on the index (close-based). Exit: After 10
  sessions (Chan''s best single rule); variants 5 and 20; an opposite signal also exits (Chan''s ''latest entry signal'' exit).'
