id: book-fmchan-07
title: 'Turning point: a 1% day against a fresh 10-day extreme (Chan''s GS rule, simplest form) (Ernest Chan, book rule, tested
  in R104)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Ernest Chan''s rule from Quantitative Trading (Ch. 7, Regime switching, Example 7.1) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (index daily bars). Entry: Long
  if today''s close-to-close change >= +1% AND today''s low (or yesterday''s) was the lowest low of the last 10 sessions;
  short if change <= -1% AND today''s or yesterday''s high was the highest high of the last 10 sessions. Enter at the next
  session''s 09:20 price. Stop: None in the book. Research variant: 1.5 x ATR14 on the index (close-based). Exit: After 10
  sessions (Chan''s best single rule); variants 5 and 20; an opposite signal also exits (Chan''s ''latest entry signal'' exit).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: DLY 2006-01-01 - 2021-12-31
  holdout: DLY 2022-01-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price (index daily bars)
- daily; enter at the next open, hold a fixed number of sessions
model_or_rule: 'Long if today''s close-to-close change >= +1% AND today''s low (or yesterday''s) was the lowest low of the
  last 10 sessions; short if change <= -1% AND today''s or yesterday''s high was the highest high of the last 10 sessions.
  Enter at the next session''s 09:20 price. | stop: None in the book. Research variant: 1.5 x ATR14 on the index (close-based).
  | exit: After 10 sessions (Chan''s best single rule); variants 5 and 20; an opposite signal also exits (Chan''s ''latest
  entry signal'' exit). | filters: None. The perceptron re-weighting over 1/5/10/20/40/60-day holds is not reproduced (settings
  not given).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmchan-07; trade: Primary: near-month future. Secondary (labelled):
