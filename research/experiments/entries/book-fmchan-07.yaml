notes: 'Our nearest test: R102: index direction at 1 day follows the previous sign 53.2% (NIFTY, n 5,086) and no sign rule
  confirmed (1 of 70, an artefact). R87 candle shapes and R71 chart patterns gave no direction. R78 (gold daily high/low reversal)
  is the nearest MCX cousin. This exact rule: not tested by us.. Assumptions: The OCR of the rule box reads ''>= -1'' for
