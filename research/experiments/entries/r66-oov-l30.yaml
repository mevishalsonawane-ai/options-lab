id: r66-oov-l30
title: R66 OOV L30 A4 + stop +5% once +30%
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R66_LOCK_AT_25.md
hypothesis: 'Boss (16 Oct): once the option is +25%, moving the stop to +5% (on top of the A4 30/60/100 ladder) improves the
  paper arms after real costs, because trades that reach +25% no longer come back to the -15% stop. This variant: L30 A4 +
  stop +5% once +30%; gates as R51 (BH over 15 tests); recommended only if it also beats B0 and A4 everywhere and random early
  exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 / R65 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: index 5-min bar + previous day''s value area (unchanged); only the option exits differ (stops and locks
  on the premium)'
model_or_rule: 'R52 Open outside value (previous day''s value area + first 5-min bar, 1-ITM at 09:20, 5 indices); exits: L30
  A4 + stop +5% once +30%'
settings: research/hunt/r66/r66cfg.py exit_spec / TRIGGER; PREREG.md
prereg: research/hunt/r66/PREREG.md
variants_tried: 15
results:
  summary: 'Design: 706 trades, win 55%, net Rs 291,683 (Rs 413/trade), worst day -Rs 25,140, max DD Rs 83,249, stops 74.
    Walk-forward: 529 trades, win 56%, net Rs 239,692 (Rs 453/trade), worst day -Rs 25,140, max DD Rs 50,690, stops 51. Final:
    293 trades, win 50%, net Rs 47,422 (Rs 162/trade), worst day -Rs 16,554, max DD Rs 45,689, stops 14; entry-twin p 0.012,
    BH q 0.0129, exit-twin p 0.4431 (q 0.499). Verdict: PASS. Versus B0: design Rs 14,546 (bootstrap p 0.0355), final -Rs
    1,533 (p 0.6645). Versus A4: design Rs 6,630 (bootstrap p 0.0435), final Rs 1,689 (p 0.0915). Final: the +5% step closed
    10 trades; versus A4 it gave up Rs 350 and saved Rs 2,038 (net Rs 1,689).'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates but not recommended (PREREG section 3): it must also beat both B0 and A4 in design, walk-forward
  and final and beat random early exits; exit-twin q 0.499. Boss may still choose it. Signal on the underlying; research only,
  nothing changes paper or live.'
