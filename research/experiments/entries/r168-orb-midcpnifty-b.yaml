hypothesis: 'Boss (13 Nov): "Try ORB with 10-15 points only." The app''s own ORB entries (09:15-10:00 opening range, its window,
  caps and cool-down) on MIDCPNIFTY with only the exits replaced: target 10 / 12 / 15 points on the index, stop 1:1 or 1:1.5,
