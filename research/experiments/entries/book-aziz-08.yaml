notes: 'Our nearest test: R18: five early-exit overlays failed (0 of 60); R87B: candle exits against the trade mostly hurt;
  R81 / R100: exits that cut runners lose on Liquidity. Assumptions: The book''s ''fails to make a new low and turns to higher
  highs and higher lows'' fixed as two bars; overlay on paper arms only.'
