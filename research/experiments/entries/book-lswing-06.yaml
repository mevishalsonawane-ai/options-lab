id: book-lswing-06
title: Gap delay on a daily breakout trigger (wait 30 min with the gap, 5 min against, re-base on today's high) (Larry Swing,
  book rule, proposed)
family: overnight
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Larry Swing''s rule from A Practical Guide to Swing Trading (Ch. 6.3-6.4) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (index spot daily setup, 1-minute
  trigger). Entry: Take the setups of forceswing-master-plan-index (or pullback-2lh-sma-plain-index). Compare two pre-registered
  entry modes on the SAME setups: (A) the book''s gap rule (|gap| >= 0.6 x ATR14 -> wait to 09:45 with / 09:20 against, trigger
  = today''s high so far + 0.07 ATR); (B) no gap rule (buy-stop at previous high + 0.07 ATR from 09:16 every day). Stop: As
  forceswing-master-plan-index. Exit: As forceswing-master-plan-index.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
