hypothesis: 'Larry Swing''s rule from A Practical Guide to Swing Trading (Ch. 6.3-6.4) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (index spot daily setup, 1-minute
  trigger). Entry: Take the setups of forceswing-master-plan-index (or pullback-2lh-sma-plain-index). Compare two pre-registered
  entry modes on the SAME setups: (A) the book''s gap rule (|gap| >= 0.6 x ATR14 -> wait to 09:45 with / 09:20 against, trigger
