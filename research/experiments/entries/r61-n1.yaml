id: r61-n1
title: 'R61-N N1: Solo meta-labeller (S1-S4) with pre-signal news tone, logistic C 0.1, A2''s 29 + news_tone + news_count'
family: ml
date: '2026-10-15'
doc: research/HUNT_R61_SOLO_3.md
hypothesis: The tone of business headlines published between the previous close and Solo's signal minute (the phone's own
  word-list reader) helps pick Solo's paper trades among S1-S4 candidates, beyond A2's 29 inputs (gates as R47-R60; helps
  only if it also beats V1 on net, AUC, paired-day bootstrap p < 0.10 and net without MIDCPNIFTY).
data_version: Drive lake (index_1m, options_rolling_1m WEEK, cleaned as R57) + Moneycontrol monthly post sitemaps Oct 2024
  - Oct 2026 (116,570 /news/business/ headlines, slug text, lastmod IST), fetched 15 Oct 2026
period:
  design: 21 Nov 2024 - 31 Mar 2026 (purged walk-forward, monthly refits, 1-session embargo, test months Jul 2025 - Mar 2026)
  holdout: '1 Apr - 14 Oct 2026, read once for R61-N (third use of this window after R57 and R61: not fresh)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: the underlying index (setups S1-S4); news tone is context only'
- A2's 29 + news_tone + news_count
model_or_rule: logistic C 0.1, A2's 29 + news_tone + news_count; take score >= training 70th percentile, 1 a day
settings: research/hunt/r61/NEWS_PREREG.md; research/hunt/r61/r61news.py
prereg: research/hunt/r61/NEWS_PREREG.md
variants_tried: 1
results:
  summary: 'Design walk-forward: 164 trades, net Rs +65,756 (V1 +55,910); AUC walk-forward 0.5226 (V1 0.5246), random split
    0.558. Final: 126 trades, win 56%, net Rs +78,317 (V1 +99,172), at 2x costs Rs +60,357, max DD Rs 24,148, months green
    5/7, top-5 share 0.505, AUC 0.542 (V1 0.5382), twin p 0.002, BH q 0.002 (2 variants), net without MIDCPNIFTY Rs +17,011
    (V1 +27,586). Gates: PASS. Against V1: net lower, AUC higher, paired-day bootstrap p 0.9385, without MIDCPNIFTY lower:
    does not help Solo. Descriptive: pre-open tone vs open-to-close return, correlation -0.161 (NIFTY, 337 design days).'
  costs: dated charges (STT 0.15% from 1 Apr 2026), R17 liq fills doubled on stops, next-minute fills, one held contract,
    1 lot in force
holdout_read: true
verdict: rejected
notes: 'Passed the gates but did not beat Solo 2.0 (V1) out of sample (NEWS_PREREG section 6). Signal source: the underlying
  index; news is context only.'
