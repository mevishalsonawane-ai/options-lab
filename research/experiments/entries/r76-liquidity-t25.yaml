id: r76-liquidity-t25
title: 'R76 Liquidity: own exits + stop to +5% once the index has covered 25% of the way to its target (Boss)'
family: trade-management
date: '2026-10-18'
doc: research/HUNT_R76_LIQUIDITY_LOCK_35.md
hypothesis: 'Boss (18 Oct): ''What about 35-5 for liquidity'', then ''25% -35% of target'': once the index has covered 25-35%
  of the way to Liquidity''s own index target, the option''s stop rises to +5% over the fill. This variant: own exits + stop
  to +5% once the index has covered 25% of the way to its target (Boss); recommended only if its net is at least B0''s in
  design, walk-forward and final and it beats random early exits (BH q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores, 20 Nov
  2024 - 13 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026)
  holdout: 1 Apr - 13 Oct 2026, read once; already read by R51 / R63 / R70 (weak)
instruments:
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal: index bars (liquidity levels); trigger: the index''s progress to its target; stop: option premium'
model_or_rule: 'Liquidity 15+5 (index level breaks on 15/5-min bars BANKNIFTY and MIDCPNIFTY, 30/5 FINNIFTY; 1-ITM); exits:
  own exits + stop to +5% once the index has covered 25% of the way to its target (Boss)'
settings: research/hunt/r76/r76study.py; PREREG.md
prereg: research/hunt/r76/PREREG.md
variants_tried: 5
results:
  summary: 'Design: 881 trades, win 51%, net Rs 208,114 (Rs 236/trade), worst day -Rs 6,283, max DD Rs 40,300, stops 22. Walk-forward:
    657 trades, win 52%, net Rs 217,292 (Rs 331/trade), worst day -Rs 6,283, max DD Rs 14,899, stops 16. Final: 357 trades,
    win 41%, net Rs 9,156 (Rs 26/trade), worst day -Rs 9,643, max DD Rs 51,801, stops 11. Changed 395 design / 140 final trades
    (design: Rs 206,044 saved on 197, Rs 255,180 given up on 198); versus B0: design -Rs 49,136 (bootstrap p 0.93), final
    -Rs 1,999 (p 0.5535); exit-twin p 0.9281 (BH q 0.9361 over 5 tests). Of the design changes, 331 were sold under +5% because
    the index reached the trigger while the option was still below +5% (the stop sat above the price). Not at least B0''s
    net in every period, so not recommended and not ''harmless''.'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot
holdout_read: true
verdict: rejected
notes: Signal on the underlying; research only, nothing changes paper or live. Liquidity BANKNIFTY's plain-rules record for
  the 26 Oct decision is untouched.
