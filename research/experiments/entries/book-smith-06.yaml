hypothesis: 'David Graeme Smith''s rule from Short Swing Trading (Ch. 7-9) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: As sst-six-rules-index-daily on BTC/ETH daily bars
  (SMA50 side, DMI 8 cross or touch, break of last non-inside day). Stop: Mandatory: reference day''s far end minus 0.5% of
  price, and a variant at 0.25 x ATR(14). Exit: Mandatory profit lock: the significant-day step trail (each new non-inside
  favourable day moves the stop to its far end minus buffer) plus the midpoint lock on a >= 5% favourable day; no target;
  max hold 20 days.'
