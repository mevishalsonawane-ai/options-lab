id: book-bennett-09
title: After a sharp fall, near-zero-cost 1x2 call spread made defined-risk (broken-wing butterfly) (Colin Bennett, book rule,
  tested in R104)
family: option-structure
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Colin Bennett''s rule from Trading Volatility (Ch. 1.4, 1x2 call spreads are useful when a bounce-back is expected)
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price
  (the fall), then options structure. Entry: If the index fell 4% or more over the last 3 sessions, at 09:20 buy 1 ATM call,
  sell 2 calls at the strike nearest half the fall above spot, buy 1 call 2 strikes above that. Stop: None beyond the structure''s
  defined max loss. Exit: Expiry (15:05 on expiry day) or when spot reaches the short strike.'
