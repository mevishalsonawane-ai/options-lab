- BANKNIFTY
features:
- underlying price (the fall), then options structure
- daily bars for the signal; option chain at 09:20 next day
model_or_rule: 'If the index fell 4% or more over the last 3 sessions, at 09:20 buy 1 ATM call, sell 2 calls at the strike
  nearest half the fall above spot, buy 1 call 2 strikes above that. | stop: None beyond the structure''s defined max loss.
  | exit: Expiry (15:05 on expiry day) or when spot reaches the short strike. | filters: None stated.'
settings: 'research/books/TESTABLE_RULES.md, rule book-bennett-09; trade: 1-2-1 broken-wing call butterfly, 1 lot.'
