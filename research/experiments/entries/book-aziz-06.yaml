id: book-aziz-06
title: 'Bull flag: break of the first or second consolidation with a joint 1- and 5-minute new high (Andrew Aziz, book rule,
  tested in R104)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, Strategy 3: Bull Flag) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume. Entry:
  Pole: the move to a new high of the day of at least 1 x the 14-bar 5-minute ATR within 3 five-minute bars. Flag: 3-12 one-minute
  bars that stay below the pole high and retrace at most half the pole. Long when a 1-minute bar breaks the flag high in the
  same minute that the current 5-minute bar exceeds the previous 5-minute bar''s high, with 1-minute volume above the average
  of the flag bars. Only the first or second flag of the day. Stop: below the flag''s low Exit: Half at a new high of the
  day (stop to entry); rest on a new 1-minute low (low below the prior 1-minute bar''s low) or 15:15.'
