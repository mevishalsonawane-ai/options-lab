- 1-minute and 5-minute bars
model_or_rule: 'Pole: the move to a new high of the day of at least 1 x the 14-bar 5-minute ATR within 3 five-minute bars.
  Flag: 3-12 one-minute bars that stay below the pole high and retrace at most half the pole. Long when a 1-minute bar breaks
