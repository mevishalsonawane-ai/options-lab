id: book-aziz-10
title: Target the next pre-marked level instead of a fixed premium target (Andrew Aziz, book rule, proposed)
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 4 and Ch. 6 (profit targets)) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: None (overlay).
  Stop: the arm''s own stop Exit: Exit when the index touches the nearest level beyond the entry in the trade''s direction
  among: previous day close, yesterday''s high/low, two-days-ago high/low, daily 50 and 200 SMA, round 100-point (NIFTY) /
  500-point (BANKNIFTY) numbers; otherwise the arm''s own exit.'
