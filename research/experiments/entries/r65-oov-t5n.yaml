id: r65-oov-t5n
title: R65 OOV T5n -5% stop moved up, no target
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R65_STEP_TRAIL.md
hypothesis: 'Boss (16 Oct): once the premium is +10%, put the stop at +5%, then +10% at +15%, and so on (a 5-point step trail),
  and a -5% stop moved up the same way, improve the new paper arms after real costs. This variant: T5n -5% stop moved up,
  no target; gates as R51 (final net > 0, twin p < 0.05, BH q <= 0.10 over 30 tests, 40+ trades, top-5 < net, design and walk-forward
  > 0); recommended only if it also beats B0 and A4 everywhere and random early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: index 5-min bar + previous day''s value area (unchanged); only the option exits differ (stops and trail
  on the premium)'
model_or_rule: 'R52 Open outside value (previous day''s value area + first 5-min bar, 1-ITM at 09:20, 5 indices); exits: T5n
  -5% stop moved up, no target'
settings: research/hunt/r65/r65cfg.py exit_spec / trail_steps; PREREG.md sections 2-3
prereg: research/hunt/r65/PREREG.md
variants_tried: 30
results:
  summary: 'Design: 706 trades, win 30%, net Rs 16,188 (Rs 23/trade), worst day -Rs 16,401, max DD Rs 66,664, stops 323. Walk-forward:
    529 trades, win 32%, net Rs 14,136 (Rs 27/trade), worst day -Rs 16,401, max DD Rs 46,320, stops 233. Final: 293 trades,
    win 31%, net -Rs 4,700 (-Rs 16/trade), worst day -Rs 10,261, max DD Rs 37,799, stops 133; entry-twin p 0.0699, BH q 0.0699,
    exit-twin p 1.0 (q 1.0). Verdict: FAIL: final net <= 0; p >= 0.05; top-5 >= net. Versus B0: design -Rs 260,950 (bootstrap
    p 0.987), final -Rs 53,655 (p 0.8135). Versus A4: design -Rs 268,865 (bootstrap p 0.9895), final -Rs 50,433 (p 0.803).
    Final: the lock closed 136 trades; versus the plain rules it gave up Rs 127,688 and saved Rs 115,872 (net -Rs 11,815);
    60 of them went on to +30% after the exit.'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: rejected
notes: Failed the gates. Signal on the underlying; research only, nothing changes paper or live.
