hypothesis: 'Boss (16 Oct: "add trend find for Donchian, or wait for 5 candles [1 min] before buying any options ... it could
  help us with less loss"): taking Donchian 20''s index breakouts only when wait 2 one-minute candles; all close beyond the
  broken channel edge (wait of 1-minute index candles after the signal bar) loses less than Donchian and beats skipping the
  same number of its trades at random. Gates as R51 (BH over R73''s 36 tests), plus random-skip twins.'
