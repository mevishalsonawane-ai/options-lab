id: book-tom-10
title: Buy the 60-minute pullback in a daily uptrend (fade the short-term trend) (Trader Tom, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Price Behaviour Principle 2, p. 43-48) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Daily trend
  UP by the 3-bar swing (rule three-bar-swing-bias); the 60-minute chart has made a lower high and lower low since the last
  daily high; enter long on the first 15-minute 4-bar fractal buy. Mirror for daily DOWN. Stop: the lowest low of the 60-minute
  pullback Exit: the pullback''s starting high (prior 60-minute swing high) or square-off 15:10; futures variant may hold
  up to 3 sessions'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31; MCXI 2025-10-20 - 2026-07-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once); MCXI 2026-08-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- CRUDE
features:
- underlying price
- daily trend, 60-minute pullback, 15-minute trigger
model_or_rule: 'Daily trend UP by the 3-bar swing (rule three-bar-swing-bias); the 60-minute chart has made a lower high and
  lower low since the last daily high; enter long on the first 15-minute 4-bar fractal buy. Mirror for daily DOWN. | stop:
  the lowest low of the 60-minute pullback | exit: the pullback''s starting high (prior 60-minute swing high) or square-off
  15:10; futures variant may hold up to 3 sessions | filters: none beyond the daily trend'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-10; trade: buy 1-ITM CE in a daily uptrend, 1-ITM PE in a daily
  downtrend'
prereg: research/hunt/r104_books/PREREG.md
