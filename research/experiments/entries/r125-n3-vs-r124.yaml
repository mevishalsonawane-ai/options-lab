id: r125-n3-vs-r124
title: R125 do support/resistance, liquidity, order flow, volume profile, candle patterns, VWAP/EMAs, RSI and Supertrend help
  the network see the next 30-point move's direction?
date: '2026-10-28'
doc: research/HUNT_R125_LEVELS_FLOW.md
family: ml
data_version: Drive lake copied 28 Oct 2026 (index_1m, options_rolling_1m WEEK, NSE participant OI); lakeclean steps 1-3;
  every level, move and indicator on candle highs/lows (wicks)
period:
  design: 2024-10-20..2026-03-15 (quarterly folds Apr 2025 - Mar 2026)
  holdout: '2026-04-01..2026-10-19 read once (third read today: R123 and R124 read it first)'
