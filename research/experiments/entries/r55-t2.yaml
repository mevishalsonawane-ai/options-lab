  costs: 'R54''s pricing: charges in force on the trade date (obuy Costs(''dated''), BSE rates for SENSEX); next-minute fills
    + 5 bps + 1/2/4-tick half-spread by 5-minute volume (R17 liq), x2.25 from 15:00 and x2.75 from 15:10; entry limit ref
    x 1.2 + 0.10 for 3 minutes; gap fills at the worse open; R47 stray-print guard and foreign-rows filter; 2x spread stress
    reported. Settlement: no spread; STT on exercise 0.125% of the settlement value to 31 Mar 2026 and 0.15% from 1 Apr 2026,
    plus brokerage Rs 20, exchange, SEBI and GST; OTM pays no sell charges'
