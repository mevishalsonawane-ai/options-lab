id: book-fmchan-03
title: GOLD/SILVER spread trade only when cointegrated, exit on the OU half-life (Ernest Chan, book rule, tested in R104)
family: mcx-crypto
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Ernest Chan''s rule from Quantitative Trading (Ch. 3 Example 3.6; Ch. 7 Examples 7.2 and 7.5) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (MCX GOLD and SILVER
  roll-adjusted futures; the hedged spread). Entry: Daily on the trailing 252 sessions: OLS of log GOLD on log SILVER -> h;
  spread = log GOLD - h x log SILVER; CADF t-stat; OU half-life. Trade only if CADF t < 5% critical value AND half-life between
  5 and 40 sessions. z = (spread - 252-day mean) / sd. z >= +2: short GOLD, long SILVER (notional ratio h); z <= -2: the reverse.
  Stop: |z| >= 3.5 at a close (R94''s stop), and a hard loss cap of 2% of the pair''s gross notional. Exit: z reaches 0, or
  2 x half-life sessions (instead of R94''s fixed 20), whichever first.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MCXD 2012-01-01 - 2021-12-31
  holdout: MCXD 2022-01-01 - 2026-10-16 (read once)
instruments:
- GOLD
- SILVER
features:
- underlying price (MCX GOLD and SILVER roll-adjusted futures; the hedged spread)
- daily closes, held over days
model_or_rule: 'Daily on the trailing 252 sessions: OLS of log GOLD on log SILVER -> h; spread = log GOLD - h x log SILVER;
  CADF t-stat; OU half-life. Trade only if CADF t < 5% critical value AND half-life between 5 and 40 sessions. z = (spread
  - 252-day mean) / sd. z >= +2: short GOLD, long SILVER (notional ratio h); z <= -2: the reverse. | stop: |z| >= 3.5 at a
  close (R94''s stop), and a hard loss cap of 2% of the pair''s gross notional. | exit: z reaches 0, or 2 x half-life sessions
  (instead of R94''s fixed 20), whichever first. | filters: Liquid contracts only (GOLDM / SILVERM minis, Boss''s liquidity
  rule).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmchan-03; trade: Futures both legs (GOLDM + SILVERM minis, sized to
  h); no options (no MCX option history, R82).'
