    98 nights hit 0.551 vs base rate 0.622 p 0.092 q 0.150; holdout 173 hit 0.555 vs 0.566 p 0.093 | R_r3p: design 79 nights
    hit 0.620 vs base rate 0.620 p 0.017 q 0.034; holdout 149 hit 0.570 vs 0.557 p 0.054 | R_asia: design 136 nights hit 0.529
    vs base rate 0.588 p 0.312 q 0.375; holdout 226 hit 0.504 vs 0.580 p 0.578 | LR: design 146 nights hit 0.555 vs base rate
    0.596 AUC 0.561 p 0.111 q 0.166; holdout 238 hit 0.567 vs 0.580 AUC 0.595 p 0.006 | GB: design 146 nights hit 0.514 vs
    base rate 0.596 AUC 0.512 p 0.419 q 0.448; holdout 238 hit 0.555 vs 0.580 AUC 0.562 p 0.048. Gate: hit above the base
    rate on the same nights, p <= 0.05, BH q (36) <= 0.10, >= 100 nights. None passed design.'
