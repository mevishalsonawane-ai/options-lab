id: r146-m-nifty
title: 'R146 next-open gap direction from 15:19: NIFTY'
family: overnight
date: '2026-11-05'
doc: research/HUNT_R146_GAP_BTST.md
hypothesis: Information known by 15:20 IST predicts the sign of the next 09:15 open vs the decision price better than the
  gap-up base rate.
data_version: 'research-data release (gh api): nifty_prev/year, banknifty_prev_year_wide/year_wide (index + nearest-expiry
  option minutes), finnifty_index, sensex_index, extra_series (INDIAVIX); Yahoo daily N225/HSI/KS11/GSPC; r98 events.csv'
period:
  design: M walk-forward test months Aug 2024 - Feb 2025 (monthly retrain)
  holdout: 1 Mar 2025 - 20 Feb 2026 (M) / 1 Mar 2025 - 3 Nov 2026 (D), read once 5 Nov 2026
instruments:
- NIFTY
features:
- 'signal source: the index (day move, close location, last 30/60 min, gap, cross-index breadth), India VIX, option-chain
  OI build-up / PCR / straddle as context, expiry calendar, weekday, scheduled events, Asian closes, previous S&P session'
model_or_rule: 'R_mom: sign of the day''s move; R_loc: close location >= 0.6 up / <= 0.4 down; R_l30: sign of the last 30
  minutes; R_r17: Night''s strong close (location + move + cross-index breadth); R_r3p: Night (R3) proxy: strong close + OI
  build-up z agrees; R_asia: sign of the Hang Seng''s day; LR: L2 logistic on all features; GB: gradient trees (depth 2) on
  all features'
settings: research/hunt/r146_gap_btst/cfg.py (frozen in PREREG)
prereg: research/hunt/r146_gap_btst/PREREG.md
variants_tried: 8
results:
