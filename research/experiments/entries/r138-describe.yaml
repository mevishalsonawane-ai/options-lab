results:
  summary: 'M primary, design: 1361 events; 60 min later down 51% (control 49%), mean -0.006% (control -0.004%); neckline
    first 21%, back above the fake high first 61% (control 21% / 62%); p 0.88 / 0.91, q 1.0. Holdout 156 events: neckline
    first 26%, fake high first 53%, no difference from control (p 0.44). W mirror: neckline first 20% vs control 24% (n 1262,
    q 0.01): after a fake breakdown the index continues down a little more than normal (as R135); not seen in the holdout
    (p 0.06, the other way). No configuration of the M differs from the control (q >= 0.26).'
  costs: none (index points)
