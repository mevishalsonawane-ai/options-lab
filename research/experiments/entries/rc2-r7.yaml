id: rc2-r7
title: 'RC2 crypto options R7_funding_rev: Funding extreme (60-day 2.5/97.5 pct) reversal with 1-h confirmation'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: Buying a Delta India BTC/ETH option on 'Funding extreme (60-day 2.5/97.5 pct) reversal with 1-h confirmation',
  with a stop-loss and a profit lock, makes money after real costs and beats random same-clock entries.
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,544 BTC/ETH daily expiries (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain polls 13 Oct
  2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad, not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (183 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- BTC options (Delta India)
- ETH options (Delta India)
features:
- Deribit funding 8h rate vs its 60-day 2.5/97.5 percentiles
- 1-h index move
model_or_rule: 'Funding extreme (60-day 2.5/97.5 pct) reversal with 1-h confirmation; strike atm; expiry >= 6 h left; max
  hold 6 h; exits: stop -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s25_step (best design mean). Design: 334 trades, 16% win, -13.3% a trade net (gross -6.2%), Rs -87,652 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.990 (BH q 0.995), direction twin p 0.992; walk-forward Rs -83,318; stress
    Rs -117,481. Holdout: 71 trades, -12.7% a trade, Rs -17,846 (after VDA tax Rs -20,576). Gates passed on design: not all.
    All exits: s40_step: design n 334 net -15.1%/trade Rs -99,700, holdout n 71 -7.9% Rs -11,117; s40_trail: design n 334
    net -15.2%/trade Rs -100,506, holdout n 71 -4.2% Rs -5,805; s25_step: design n 334 net -13.3%/trade Rs -87,652, holdout
    n 71 -12.7% Rs -17,846; s25_trail: design n 334 net -13.5%/trade Rs -89,214, holdout n 71 -10.0% Rs -14,002.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
