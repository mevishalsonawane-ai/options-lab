id: book-atb-01
title: Hammer at a prior swing low, bought only after an up candle confirms (The Advanced Trading Book, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 2, Hammer (p11)) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry:
  Hammer bar H: lower wick >= 2x body, upper wick <= 0.25x range, range >= 0.8 ATR; downtrend into H; H''s low within 0.25
  ATR of a swing low from the last 5 sessions. Confirmation: the next bar closes above H''s high. Enter at the open of the
  bar after the confirmation bar. Mirror (shooting star / hanging man at a swing high, confirmation close below H''s low)
  for shorts. Stop: Underlying 1 tick beyond H''s low (high for shorts). Exit: Target 3R on the underlying (the book''s 1:3
  ratio); else square-off.'
data_version: not run (proposed 25 Oct 2026)
