id: r100-liquidity-g1
title: 'R100 Liquidity give-back: breakeven (fill + round-trip charges) once the option is +20%'
family: trade-management
date: '2026-10-22'
doc: research/HUNT_R100_LIQUIDITY_GIVEBACK.md
hypothesis: 'Boss (22 Oct): a Liquidity trade went to about +Rs 4,500 and closed about -Rs 1,000. This rule (breakeven (fill +
  round-trip charges) once the option is +20%) added to Liquidity''s own exits keeps open profit without cutting the runners: net
  at least B0''s in design, walk-forward and final, BH q <= 0.10 against random early exits in design and final, not carried by
  its 5 best trades, at least 30 changed design trades.'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m), copied 22 Oct; R51 Amendment A clean stores,
  20 Nov 2024 - 13 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward Apr 2025 - Mar 2026)
  holdout: 1 Apr - 13 Oct 2026, read once; already read by R51 / R63 / R70 / R76 / R81 (weak)
instruments:
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal: index bars (liquidity levels); lock: option premium'
model_or_rule: 'Liquidity 15+5 (index level breaks on 15/5-min bars BANKNIFTY and MIDCPNIFTY, 30/5 FINNIFTY; 1-ITM); exits: own
  exits + breakeven (fill + round-trip charges) once the option is +20%'
settings: research/hunt/r100_liquidity_giveback/r100study.py; r100engine.py
prereg: research/hunt/r100_liquidity_giveback/PREREG.md
variants_tried: 7
results:
  summary: 'Design: 881 trades, net Rs 260,537 against B0 Rs 257,249; walk-forward Rs 235,423 against Rs 238,064; final: 357 trades,
    net Rs 12,496 against Rs 11,155. Changed 16 design / 8 final trades (design: Rs 14,800 saved on 9, Rs 11,512 given up on 7).
    Random early-exit twin p 0.4052 design / 0.513 final (BH q 1.0 / 1.0 over 7). Design gain without its 5 best trades -Rs 8,114.
    Give-back trades (+20% then a loss; 9 design, B0 -Rs 15,030): Rs 14,800 kept. Failed gates: never_less, twins_bh, not_top5,
    sample.'
  costs: dated charges, R17 liquidity fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, breakeven = real entry + round-trip charges, one held contract, 1 lot
holdout_read: true
verdict: rejected
notes: 'Closest of the 7: about neutral, not proven; offered to Boss as an opt-in paper switch, not built. Signal on the underlying;
  nothing changes paper or live. Liquidity BANKNIFTY''s plain-rules record for the 26 Oct decision is untouched.'
