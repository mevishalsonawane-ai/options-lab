id: book-tom-15
title: Red marubozu after a failed push up in a downtrend (Trader Tom, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Pattern Number 7, Marabozu, p. 95-96) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Downtrend (close
  below 89-SMA); a rally of at least 2 green bars; then a red marubozu (wicks each <= 5% of range, body >= 1.0 x ATR14); sell
  at its close. Mirror for uptrends. Stop: the rally''s high Exit: 2R or 30 minutes or 15:10'
