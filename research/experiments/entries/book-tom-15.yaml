  holdout: IDX 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price
- 5-minute and 15-minute bars
model_or_rule: 'Downtrend (close below 89-SMA); a rally of at least 2 green bars; then a red marubozu (wicks each <= 5% of
  range, body >= 1.0 x ATR14); sell at its close. Mirror for uptrends. | stop: the rally''s high | exit: 2R or 30 minutes
