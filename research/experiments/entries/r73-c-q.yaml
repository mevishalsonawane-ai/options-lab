doc: research/HUNT_R73_DONCHIAN_TREND_WAIT.md
hypothesis: 'Boss (16 Oct: "add trend find for Donchian, or wait for 5 candles [1 min] before buying any options ... it could
  help us with less loss"): taking Donchian 20''s index breakouts only when best trend filter + best wait (chosen on design)
  (best trend filter + best wait chosen on design (T2 + W2H; walk-forward quarters re-chosen on the days before each)) loses
  less than Donchian and beats skipping the same number of its trades at random. Gates as R51 (BH over R73''s 36 tests), plus
  random-skip twins.'
