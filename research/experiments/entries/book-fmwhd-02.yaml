id: book-fmwhd-02
title: Buy the ATM straddle before a scheduled policy event, sell after it (Wilmott, Howison and Dewynne, book rule, proposed)
family: calendar-events
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Wilmott, Howison and Dewynne''s rule from The Mathematics of Financial Derivatives (Ch. 3, exercise 1 (option
  portfolio for an election expected to move the share about 10% either way)) makes money after real charges and slippage,
  walk-forward, with BH across the rules tried. Signal source: volatility / options structure (a calendar event; no price
  signal); maps to NSE index options. Entry: At 15:15 on the session before an RBI policy announcement or the Union Budget,
  buy 1 lot ATM call and 1 lot ATM put of the nearest expiry that is at least 2 sessions away. Stop: None (risk is the premium
  paid); the book gives none. Exit: Sell both legs at 15:15 on the event day.'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- BANKNIFTY
- NIFTY
features:
- volatility / options structure (a calendar event; no price signal); maps to NSE index options
- 'daily: entry 15:15 the session before, exit 15:15 on the event day'
model_or_rule: 'At 15:15 on the session before an RBI policy announcement or the Union Budget, buy 1 lot ATM call and 1 lot
  ATM put of the nearest expiry that is at least 2 sessions away. | stop: None (risk is the premium paid); the book gives
  none. | exit: Sell both legs at 15:15 on the event day. | filters: Event calendar from EVENT_SHIELD.md (RBI policy, Budget);
  skip if the straddle costs more than the median event-day range of the previous events (the move is already priced).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmwhd-02; trade: long ATM straddle, 1 lot each leg'
prereg: null
variants_tried: null
results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: EVENT_SHIELD.md: BANKNIFTY day range 1.48x normal on RBI/Budget days (15 sessions, confirmed on
  7 holdout sessions), NIFTY 1.28x not significant; R89: straddles bought when a big candle was forecast lost (0 of 18 profitable,
  gross about zero, costs decide). Event-day straddles themselves: not tested by us.. Assumptions: The exercise only asks
  for a portfolio that profits from a large move either way and lists straddles and strangles; we fix the event set, the timing,
  the ATM strikes and the ''already priced'' filter.'
