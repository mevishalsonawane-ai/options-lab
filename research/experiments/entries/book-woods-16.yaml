hypothesis: 'Galen Woods''s rule from How to Trade Price Action (Ch. 6.1) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Bullish (inverse): three fractal swing lows (3 bars
