verdict: rejected
features:
- profit lock on the option premium (earlier minutes' highs arm it; a later minute's low fills it); signal on the index (W1
  + factors)
hypothesis: Adding a profit lock (+Rs 1,000 or +Rs 500 trigger, keep 60% of the best open profit) improves the setup
results:
  summary: 'The lock lowers money in every comparison while raising the win rate. Mean over 32 versions each: no lock Rs 97/trade
    (win 54%), +Rs 1,000 lock Rs -108 (59%), +Rs 500 lock Rs -96 (65%). Best version (201 trades): none +Rs 216 (57%), +1,000
    +Rs 29 (62%), +500 -Rs 16 (67%, meets the 65% rule yet loses).'
  costs: Costs('dated') + Fills('liq') (also 2x slippage), 1 lot
