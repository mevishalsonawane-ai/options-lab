hypothesis: 'Trader Tom''s rule from The First Trading Manual (Case Story: Stanley the Intraday Trader, p. 159-160) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry:
  Long: at least 3 descending 1-minute swing highs (2-bar fractals) lie within 0.05% of one straight line through the first
  and last; price then trades below the prior swing low, turns, and a 1-minute close crosses above the line; buy next minute.
  Short mirror. Stop: below the low made by the fake-down Exit: not stated; ours: 2R target or 30 minutes, square-off 15:10'
