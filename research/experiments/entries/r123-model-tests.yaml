features:
- index minutes, VIX, breadth, calendar, option-chain context; heads (a) +X before -Y per cell-side, (b) next 30/60-min range,
  (c) direction
hypothesis: A network over all the data forecasts 'this ATM option gains +X before it loses Y' better than the base rate and
  gradient-boosted trees
model_or_rule: research/hunt/r123_neural_70/r123net.py
settings: PREREG.md section 5, amendment 1
variants_tried: 40
verdict: rejected
