  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: Not tested by us on daily index or MCX bars. Intraday EMA crosses lost (OBUY_FINAL TI-03 EMA cross,
  -Rs 369,856 over 2022-2026, 96 variants; R29 ribbons 0 pass). Crypto daily SMA/Donchian trend (RC1) made +24.4% a year after
  tax vs +58.8% buy and hold.. Assumptions: Simple (not exponential) average; signal on the close, fill at next open; 2 x
  ATR stop and the option roll are ours. The book gives the crossover only as an example of technical analysis and neither
  supports nor denies it.'
