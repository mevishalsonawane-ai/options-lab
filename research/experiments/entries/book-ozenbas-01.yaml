id: book-ozenbas-01
title: Daily close crosses its 65-day moving average (Ozenbas, Pagano, Schwartz and Weber, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Ozenbas, Pagano, Schwartz and Weber''s rule from Liquidity, Markets and Trading in Action (Ch. 3.7 (footnote
  7)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying
  price. Entry: Long when the daily close crosses from below to above its 65-day simple moving average; short (or flat, for
  a long-only test) when it crosses from above to below. Act at the next session''s open. Stop: Not stated by the book. Assumption:
  initial stop 2 x ATR(14) daily from the entry price on the underlying. Exit: The opposite cross (literal reading of the
  book''s buy/sell pair), or the stop.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: DLY 2006-01-01 - 2021-12-31; MCXD 2012-01-01 - 2021-12-31
  holdout: DLY 2022-01-01 - 2026-10-19 (read once); MCXD 2022-01-01 - 2026-10-16 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- underlying price
- daily bars
model_or_rule: 'Long when the daily close crosses from below to above its 65-day simple moving average; short (or flat, for
  a long-only test) when it crosses from above to below. Act at the next session''s open. | stop: Not stated by the book.
  Assumption: initial stop 2 x ATR(14) daily from the entry price on the underlying. | exit: The opposite cross (literal reading
  of the book''s buy/sell pair), or the stop. | filters: The book puts a top-down macro view and a fundamental value check
  first; neither is mechanical, so none is applied.'
settings: 'research/books/TESTABLE_RULES.md, rule book-ozenbas-01; trade: Trade the near-month future, or buy the nearest-monthly
  ATM CE on a long signal / ATM PE on a short, rolled 5 sessions before expiry; stops on the underlying.'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 4
results:
  summary: 'DLY (index daily, futures proxy), variant ls: design 259 trades, win 25%, net Rs 750,943, folds -Rs 151,077, Rs
    249,146, Rs 652,875; p 0.099, BH q 1.000; holdout 146 trades, win 27%, net -Rs 239,991. R104 verdict: fail. | MCXD (MCX
    future daily), variant long: design 346 trades, win 22%, net -Rs 258,066, folds -Rs 147,290, -Rs 110,775; p 1.000, BH
    q 1.000; holdout 114 trades, win 26%, net Rs 1,100,931. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: Not tested by us on daily index or MCX bars. Intraday EMA crosses
  lost (OBUY_FINAL TI-03 EMA cross, -Rs 369,856 over 2022-2026, 96 variants; R29 ribbons 0 pass). Crypto daily SMA/Donchian
  trend (RC1) made +24.4% a year after tax vs +58.8% buy and hold.. Assumptions: Simple (not exponential) average; signal
  on the close, fill at next open; 2 x ATR stop and the option roll are ours. The book gives the crossover only as an example
  of technical analysis and neither supports nor denies it.'
