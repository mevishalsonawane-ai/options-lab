id: book-bennett-07
title: 'Sell an overpriced event jump: short the expiry after the event, long the expiry before (Colin Bennett, book rule,
  proposed)'
family: calendar-events
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Colin Bennett''s rule from Trading Volatility (Ch. 6.4, Trading earnings announcements / jumps) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options structure around
  a calendar event. Entry: For each Budget, RBI policy and general-election result day bracketed by two NIFTY expiries: implied
  jump vol = sqrt(IV_after^2 x T_after - IV_before^2 x (T_after - 1 day)) using the before-expiry IV as diffusive vol; convert
  to an expected one-day move. If it exceeds 1.3x the median absolute move of past events of the same type, sell the after-event
  ATM straddle and buy the before-event ATM straddle (vega-matched). Stop: Close if the basket loses 1x the jump premium collected.
  Exit: Close at 15:10 on the event day (or next session if the event is after hours).'
data_version: 'not run (proposed 25 Oct 2026); needs data we lack: lack: needs two expiries'' chains on event days (rolling
  lake keeps the nearest expiry only); events.csv exists (R98d)'
