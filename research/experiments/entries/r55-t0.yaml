id: r55-t0
title: Rs 1,000 hero ticket, trail from the fill (R50 tr25, = R54), out at 15:05 / 15:15 / expiry settlement
family: calendar-events
date: '2026-10-15'
doc: research/HUNT_R55_HERO_TRAIL.md
hypothesis: On NIFTY / SENSEX own expiry days, the Rs 1,000 CE + PE hero ticket with the trail from the fill (R50 tr25, =
  R54) makes money after real costs, beats random afternoon entry minutes, beats the trail from the fill (T0), and holding
  to expiry settlement beats the 15:05 square-off.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: opt_NIFTY_WEEK / opt_SENSEX_WEEK 2024-2026 (rolling ATM+-10 1-minute,
  rebuilt per held strike), index_1m 2024-2026 (settlement = mean of the 15:00-15:29 closes); lake to 13 Oct 2026'
period:
  design: expiry days 20 Nov 2024 - 31 Mar 2026
  holdout: 'final test: expiry days 1 Apr - 13 Oct 2026, read once (not pristine: R43-R54 saw it; R54 read these tickets with
    T0 and H)'
instruments:
- NIFTY
- SENSEX
features:
- 'signal source: none (time only, both sides)'
- option-chain prices for the strike rule
- stops and trail on the option premium
model_or_rule: 'at the bar closing 12:30 (or 14:30): nearest-the-money eligible OTM CE and PE priced Rs 5 - min(30, 1000 /
  lot); 1 lot each, skipped if fill x lot > Rs 1,000; exit: 25% trail on minute closes from the fill (also a 25% stop); the
  rest sells at the open of the 15:05 / 15:15 bar, or is cash-settled at the index''s last-30-minute mean (ITM pays intrinsic
  less STT on exercise and charges; OTM worthless)'
