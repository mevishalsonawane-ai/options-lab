id: r59-literal
title: S2 Mean Reversion Dip Buy (outside AI) reproduced on the rolling stock-option series
family: outside-strategies
date: '2026-10-15'
doc: research/HUNT_R59_STOCK_DIP_AUDIT.md
hypothesis: Their +Rs 1,695 a trade (6,945 trades, 73.4% win) reproduces on the lake's rolling 15-minute ATM series, and most
  of it comes from the series switching strike or expiry, not from held options.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: stock_options_rolling_1m stkopt_<SYM>_MONTH (rolling ATM-1..ATM+1, nearest
  monthly expiry, 1-minute, rebuilt per held contract), equity_1m 2024-2026, nse_bhavcopy weekly UDiFF files (expiries, lots);
  options to 14 Oct 2026, equity to 12 Oct 2026'
period:
  design: 4 Nov 2024 - 14 Oct 2026 (their span; an audit, no split)
instruments:
- RELIANCE
- HDFCBANK
- ICICIBANK
- INFY
- TCS
- SBIN
- AXISBANK
- KOTAKBANK
- ITC
- TMPV
features:
- 'signal source: the OPTION''s own price chart (NON-DEFAULT, labelled)'
- rolling ATM 15-minute closes (offset 0, last close in the bin)
model_or_rule: 'their code: pct_change of the rolling 15-minute ATM close <= -20% and close >= 5, CE and PE separately; entry
  close[t], exit close[t+4]; Rs 10,000 notional, fractional contracts, Rs 95'
settings: research/hunt/r59/r59lit.py, research/hunt/r59/r59cfg.py
prereg: research/hunt/r59/PREREG.md
variants_tried: null
results:
  summary: 'Reproduced: 6,689 trades, 73.5% win, Rs +1,836 a trade, total Rs +12,282,484 (claim 6,945, 73.4%, +1,695, +1.177
