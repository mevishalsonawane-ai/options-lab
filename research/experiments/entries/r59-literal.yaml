    roll; the 701 one-contract trades average Rs -18. 42 exits on the next expiry made Rs +3,296,381. Their trades valued
    on the contract actually held: 6,509 trades, Rs -3 a trade (still with their Rs 95, no spread).'
  costs: 'theirs: Rs 95 a trade flat, no spread, fractional Rs 10,000 notional'
holdout_read: null
verdict: not-a-test
notes: An audit of another AI's claim (shared by Boss on 15 Oct 2026). Nothing in the app changes.
