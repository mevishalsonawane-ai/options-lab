family: market-facts
date: '2026-10-13'
doc: research/HUNT_R21_HERO.md
hypothesis: Describe when cheap expiry options run 5x/10x/20x and what precedes it; choose k for variant (a).
data_version: 'research-data release: expiry-day chains from expiry_days.parquet (NIFTY 53 weeklies 2025-04-09..2026-04-13,
  BANKNIFTY 11 monthlies 2025-02-27..2026-01-27), index from nifty_prev/nifty_year and banknifty_*_wide, VIX from extra_series;
  the Dhan lake is not published yet'
period:
  design: NIFTY expiries < 2025-10-13 (27), BANKNIFTY < 2025-08-25 (6)
instruments:
- NIFTY
- BANKNIFTY
features:
- best multiple of any Rs 1-10 option
- trend
- gap
- max pain
- OI walls
- VIX
- ATM call vs put change
- cheap-strike volume surge
model_or_rule: descriptive
settings: research/hunt/r21/anatomy.py
prereg: null
variants_tried: null
results:
  summary: 'Design 33 expiry days (27 NIFTY + 6 BANKNIFTY): some Rs 1-10 option (13:00-14:30) reached 5x before 15:05 on 24,
    10x on 11, 20x on 7 (hindsight); 11 of the 24 were back under 2x by 15:05 (median give-back 68%). The straddle condition
    held on 32 of 33 days; 15-minute 0.25% momentum on only 9. Nothing at 13:00 separated big days.'
  costs: none (descriptive); the k-scan uses app charges and liq fills
