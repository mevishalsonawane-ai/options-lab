  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: R89 straddles on a forecast big candle: 0 of 18 profitable (FINDINGS.md); R16 found the size of
  the next move predictable. Assumptions: The book uses state sds to price options by Monte Carlo, not to trade; the 2-point
  threshold, 500-session window and 30% stop are ours. Six-state version (+/-1%, +/-2%) as a pre-registered variant.'
