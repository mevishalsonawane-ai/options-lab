id: r86-p4
title: 'R86 P4: Client net index-option writing as a NIFTY next-5-day range input'
family: flow-oi
date: '2026-10-19'
doc: research/HUNT_R86_BIG_PLAYERS.md
hypothesis: 'Pre-registered (research/hunt/r86/PREREG.md): Client net index-option writing as a NIFTY next-5-day range input
  beats random twins in walk-forward design (net > 0 and > twins, twin p < 0.10, BH q < 0.10 over R86''s 23 tests, not carried
  by the top 5), then in the final window read once.'
data_version: Drive lake gdrive:IraAlgo-data-lake (participants/, index_daily, index_1m, equity_1m, derived/r28_gex, fut_daily_continuous;
  files of 13-15 Oct 2026); CFTC Disaggregated Futures-Only history files downloaded 19 Oct 2026
period:
  design: 2012 - 2022 (walk-forward years 2015-2022)
  holdout: 'final window NOT read: no R86 test passed design (PREREG section 2)'
instruments:
- NIFTY
- INDIAVIX
features:
- 'signal source: the underlying (index / MCX future) or positioning data about it; no option chart'
- 'NSE participant OI: Client (calls + puts written - bought) / sum, percentile over 250 days'
- 'baseline: log VIX, log 5-day and 1-day range'
model_or_rule: OLS log range forecast, walk-forward by year, Diebold-Mariano vs the VIX + recent-range baseline
settings: research/hunt/r86/r86study.py, r86lib.py; PREREG.md
prereg: research/hunt/r86/PREREG.md
variants_tried: 1
results:
