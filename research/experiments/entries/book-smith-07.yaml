id: book-smith-07
title: Skip swing entries whose trigger is hit by a gap (David Graeme Smith, book rule, proposed)
family: daily-filters
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'David Graeme Smith''s rule from Short Swing Trading (Ch. 13.1) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Applied to any daily-level stop-entry rule (SST,
  NR7/inside-day breakout, Donchian next-day): if the 09:15 open is already beyond the trigger, do not trade; otherwise trade
  as usual. Stop: host rule''s Exit: host rule''s'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: DLY 2006-01-01 - 2021-12-31
  holdout: DLY 2022-01-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price
- daily trigger levels, first minute of the session
model_or_rule: 'Applied to any daily-level stop-entry rule (SST, NR7/inside-day breakout, Donchian next-day): if the 09:15
  open is already beyond the trigger, do not trade; otherwise trade as usual. | stop: host rule''s | exit: host rule''s |
  filters: variant: skip only if the gap beyond the trigger is >= 0.25% of price.'
settings: 'research/books/TESTABLE_RULES.md, rule book-smith-07; trade: host rule''s option (1-ITM monthly)'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'DLY (index daily, futures proxy), variant skip25: design 400 trades, win 41%, net Rs 588,417, folds -Rs 11,351,
    -Rs 171,558, Rs 771,327, vs host Rs 301,312 (delta Rs 287,104); p 0.151, BH q 1.000; holdout 147 trades, win 43%, net
    Rs 329,391. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all). gap-skip filter on the daily stop-entry hosts R104 (227 tests, BH across all). gap-skip
  filter on the daily stop-entry hosts Our nearest test: R102: a 0.5-1% NIFTY gap fills by the close less than half the time
  (NIFTY 42%); SWING_DEEP and LV-05 found swing profit is made overnight, which this filter discards. Not tested by us as
  a filter.. Assumptions: Book''s ''gaps through the trigger'' read as the open being beyond the trigger level.'
