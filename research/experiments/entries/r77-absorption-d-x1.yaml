id: r77-absorption-d-x1
title: 'R77 absorption-bubble proxy D-X1: volume >= 90th pct, range <= 25th pct; exits X1'
family: flow-oi
date: '2026-10-18'
doc: research/HUNT_R77_ABSORPTION_PROXY.md
hypothesis: 'Boss (18 Oct): a 1-minute index bar with high volume (nearest-expiry option volume, a proxy) and a small range
  at a new 20-bar extreme, confirmed by the next bar, marks absorption; buying the 1-ITM option for the reversal makes money
  after costs (net > 0 in design, walk-forward and final, >= 100 design trades, beats same-time-of-day random-entry twins
  with BH q <= 0.10 over 8 tests).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK; fut_1m_live_index for the proxy check
  only), R51 Amendment A clean stores, 20 Nov 2024 - 13 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (events from about 19 Dec 2024 after the 20-session warm-up; walk-forward quarters Apr
