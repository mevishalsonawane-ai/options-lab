  holdout: 1 Apr - 13 Oct 2026, read once; already read by R51 / R63 / R70 / R71 / R76 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal: index 1-minute bars (range, 20-bar swing, confirmation bar); volume condition: the index''s nearest-expiry option
