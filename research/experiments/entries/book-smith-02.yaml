notes: 'R104 (227 tests, BH across all). intraday variant (15:15 out) bought options R104 (227 tests, BH across all). intraday
  variant (15:15 out) bought options Our nearest test: OBUY_GB TI-09 (ADX/DMI + set-up candle break, 5/15-minute): walk-forward
  Rs -345,311, 0/5 years, 48 variants; R73 ADX filters failed; R89 previous-day high/low break 0 of 180.. Assumptions: The
