hypothesis: 'Their claim: EMA8/21 cross + ADX>15 with an ensemble filter > 0.65 (target: call premium up after 60 min) wins 85.7%
  of 35 trades, +$132/trade, AUC 0.78. Tested: AUC with a random vs a time-ordered split, rolling vs held contract, and trading
