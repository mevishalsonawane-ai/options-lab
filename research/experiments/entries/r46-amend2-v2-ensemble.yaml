results:
  summary: 'AUC (Nov 2024+ design): rolling ATM series, random split 0.786, time-ordered walk-forward 0.782, final 0.796 - but
    judged against the HELD contract''s own move the same model scores 0.510 / 0.502. Held-contract features: random 0.575 vs
    walk-forward 0.538 (leakage gap 0.04), final 0.543. The rolling strike or expiry changes inside 97.9% of 60-min label windows;
    98% of rolling "up" labels coincide with a switch; rolling and held labels agree only 57%. Trades (1,000 contracts, Delta):
    rolling-feature ensemble L1 281 design trades, win 24.6%, after tax -$16,561 (p 0.006, q 0.11), final 140 trades -$4,027;
    held-feature ensemble 1 design trade, 0 final (it almost never clears 0.65). Their window Sep-Oct 2026: 23 trades, 43.5%
    win, -$183 before tax (claim 35, 85.7%, +$132/trade). CoinSwitch costs change no sign. 0 of 4 pass.'
  costs: Delta India dated fees + 18% GST (gate), CoinSwitch 0.015% of notional with/without GST; spread model, one-minute-later
    fill, exits less half spread + tick + 1%; tax 31.2% per winning trade
holdout_read: true
verdict: rejected
notes: 'Signal source: BTC spot (the underlying) for the entry; the ensemble filter reads the call''s own chart (an option-chart
