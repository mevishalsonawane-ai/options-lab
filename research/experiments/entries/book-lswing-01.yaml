  high(D-2); SMA3(ForceIndex) <= 0 and SMA13(ForceIndex) >= 0 where ForceIndex = futures volume x (close - previous close);
  ADX(20) > 30. SHORT: close < SMA10 and < SMA20; low(D) > low(D-1) > low(D-2); SMA3(FI) >= 0 and SMA13(FI) <= 0 (Ch. 8.8
  mirror); ADX(20) > 30. Trigger on day D+1 (re-armed daily for up to 5 sessions while not filled): no gap (|open - previous
  close| < 0.6 x ATR14) -> from 09:20 a buy-stop at previous high + 0.07 x ATR14 (short: sell-stop at previous low - 0.07
  x ATR14). Gap in the trade''s direction -> wait until 09:45, trigger = that day''s high so far + 0.07 x ATR14; gap against
  -> wait until 09:20, same re-based trigger. | stop: Initial: the HIGHER (long) of entry - 1.3 x ATR14 and the low of the
  reference day (previous day, or today''s pre-entry low on a gap day) - 0.07 x ATR14; mirror for shorts. Every morning (after
  the same gap waits) raise it to previous day''s low - 0.07 x ATR14 if that is higher; never lower it. | exit: Half the position
  at entry + 2.3 x ATR14 (limit); the rest only on the trailing stop. No time stop in the book; add a 20-session max hold
  as a backstop (assumption). | filters: none beyond the scan; only one open position per index per side'
settings: 'research/books/TESTABLE_RULES.md, rule book-lswing-01; trade: Main: 1 lot of the index future (allows the half
