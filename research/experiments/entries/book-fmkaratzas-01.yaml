id: book-fmkaratzas-01
title: Size an arm's lots on the cushion above the account floor (growth-optimal with a wealth floor) (Karatzas and Shreve,
  book rule, tested in R104)
family: sizing-execution
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Karatzas and Shreve''s rule from Methods of Mathematical Finance (Ch. 3.7, Examples 7.5 and 7.9 (portfolio insurance);
  Ch. 3.10 (growth-optimal portfolio)) makes money after real charges and slippage, walk-forward, with BH across the rules
  tried. Signal source: none (sizing only; entries and exits are the arm''s own, signalled on the underlying). Entry: Take
  every Liquidity 15+5 signal exactly as the app does (1-ITM option of the nearest expiry, limit at entry print +0.5%, cancel
  after 3 minutes, as in HUNT_H15.md). Lots = floor(k x (realised capital - floor) / premium of 1 lot), recomputed at every
  signal, where floor = peak realised capital - Rs 40,000 (Boss''s account drawdown stop). Stop: The arm''s own stop on the
  option premium. Account level: when realised capital reaches the floor the cushion is zero, lots are zero, and trading stops
  (the account stop). Exit: The arm''s own exits; square off by the arm''s time rule.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MM 2024-11-20 - 2026-03-31
  holdout: MM 2026-04-01 - 2026-10-13 (read once)
instruments:
- BANKNIFTY
features:
- none (sizing only; entries and exits are the arm's own, signalled on the underlying)
- per signal of the arm (Liquidity 15+5 runs on 1-minute index bars)
model_or_rule: 'Take every Liquidity 15+5 signal exactly as the app does (1-ITM option of the nearest expiry, limit at entry
  print +0.5%, cancel after 3 minutes, as in HUNT_H15.md). Lots = floor(k x (realised capital - floor) / premium of 1 lot),
  recomputed at every signal, where floor = peak realised capital - Rs 40,000 (Boss''s account drawdown stop). | stop: The
  arm''s own stop on the option premium. Account level: when realised capital reaches the floor the cushion is zero, lots
  are zero, and trading stops (the account stop). | exit: The arm''s own exits; square off by the arm''s time rule. | filters:
  Never pay more premium than the free cash (H15 rule 4). If the formula gives 0 lots, skip the signal (no minimum-1-lot allowance,
  unlike H15).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmkaratzas-01; trade: Buy the option chosen by the arm''s strike rule;
  only the lot count changes.'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 2
results:
  summary: 'MM (the arms'' trades (sizing)), variant k10: design net Rs 716,019 vs Rs 774,750, max drawdown -Rs 459,933 vs
    -Rs 444,695 (cut -3%, net cut 8%) - adds risk; p 1.000, BH q 1.000; final DD cut -2%, net cut -29%. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: HUNT_H15.md: half-Kelly on full capital grew fastest but P(drawdown
  >= 30%) 63% and P(drawdown >= 50%) 14%; quarter-Kelly cut P(drawdown >= 50%) to 1%; the Kelly fraction was unstable (0.48
  / 0.14 / 1.29). Cushion sizing itself not tested by us.. Assumptions: The book gives the principle (keep the floor''s present
  value aside, invest the cushion growth-optimally) for a continuous model with known parameters; the floor = peak - Rs 40,000
  (a trailing floor), the cushion multiplier k and the use of H15''s trade list are ours. Pre-register k = H15''s quarter-Kelly
  value for BN (0.325) applied to the cushion, and compare with H15 fixed 1 lot, quarter-Kelly on full capital (A-K4) and
  half-Kelly (A-K2) on the same trades and holdout.'
