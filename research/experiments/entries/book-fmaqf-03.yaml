id: book-fmaqf-03
title: 'Long-memory spread reversal: fade new M-day extremes of a two-asset log spread (Härdle, Kleinow and Stahl, book rule,
  tested in R104)'
family: outside-strategies
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Härdle, Kleinow and Stahl''s rule from Applied Quantitative Finance (Ch. 14.5) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (log spread of two underlyings).
  Entry: X = log(A) - log(B) at the daily close (pairs: NIFTY vs BANKNIFTY futures; GOLD vs SILVER futures). If X < min(X
  over the previous M days): long A, short B, equal rupee value. If X > max over the previous M days: short A, long B. M in
  {50, 100, 150}, pre-registered. Stop: None (always in the market; the opposite signal reverses). Research variant: stop
  if the spread moves a further 2 sd of its 60-day changes against the position. Exit: Reverse on the opposite signal.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: DLY 2006-01-01 - 2021-12-31; MCXD 2012-01-01 - 2021-12-31
  holdout: DLY 2022-01-01 - 2026-10-19 (read once); MCXD 2022-01-01 - 2026-10-16 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
features:
- underlying price (log spread of two underlyings)
- daily closes
model_or_rule: 'X = log(A) - log(B) at the daily close (pairs: NIFTY vs BANKNIFTY futures; GOLD vs SILVER futures). If X <
  min(X over the previous M days): long A, short B, equal rupee value. If X > max over the previous M days: short A, long
  B. M in {50, 100, 150}, pre-registered. | stop: None (always in the market; the opposite signal reverses). Research variant:
  stop if the spread moves a further 2 sd of its 60-day changes against the position. | exit: Reverse on the opposite signal.
  | filters: Trade a pair only if its Hurst exponent (R/S on the design period) is below the 5th percentile of the same statistic
  on simulated random walks of equal length.'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmaqf-03; trade: Futures pair (both legs), or for index pairs buy the
  ATM call of the index bought and the ATM put of the index sold (monthly expiry, rolled). Costs per leg from baselines.yaml.'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 6
results:
