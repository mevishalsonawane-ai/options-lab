    BH q 1.000; holdout 0 trades, win -, net Rs 0. R104 verdict: fail. | MCXD (MCX future daily), variant M50: design 0 trades,
    win -, net Rs 0, folds Rs 0, Rs 0; p 1.000, BH q 1.000; holdout 0 trades, win -, net Rs 0. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
