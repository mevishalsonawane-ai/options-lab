notes: 'R104 (227 tests, BH across all). NIFTY vs BANKNIFTY and GOLD vs SILVER, spot / back-adjusted futures Our nearest test:
  R72 C2 laggard catch-up (intraday convergence across indices) lost -Rs 1,00,746 final (613 trades). A daily spread-extreme
  fade is not tested by us.. Assumptions: Book used German voting / non-voting share pairs (near-identical claims) where reversion
  is structural; index or metal pairs are looser. Cash-neutral sizing by the book; we use equal notional per lot rounding.'
