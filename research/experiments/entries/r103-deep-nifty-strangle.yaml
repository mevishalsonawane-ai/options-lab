id: r103-deep-nifty-strangle
title: 'R103 deep: NIFTY naked short strangle at 09:20 / 09:45 / 10:15, five stops, two targets, all days and expiry days
  (research only)'
family: option-structure
date: '2026-10-22'
doc: research/HUNT_R103_DEEP_SELLING.md
hypothesis: 'Pre-registered (research/hunt/r103_selling/PREREG.md): selling the naked short strangle intraday on NIFTY, closed
  at 15:10 (15:05 on expiry) or by a stop, makes money after real charges and slippage: net > 0, sign-flip p <= 0.05 and BH
  q <= 0.10 over 480 cells, >= 3 of 4 walk-forward blocks positive, max DD >= -Rs 40k and no month < -Rs 13k, a stop on; then
  holds on the locked holdout read once. Signal source: none (time-of-day entry centred on the index''s ATM strike); stops
  and targets on the premium.'
data_version: 'Drive lake gdrive:IraAlgo-data-lake copied 22 Oct 2026: options_rolling_1m opt_NIFTY_WEEK_2021-2026, opt_BANKNIFTY_WEEK_2021-2024
  and MONTH_2025-2026 (ATM+-10, 1-minute), index_1m NIFTY / BANKNIFTY / INDIAVIX, index_daily'
period:
  design: 20 Nov 2024 - 14 Jul 2026 (Design A; Design B 5 Aug 2021 - 19 Nov 2024 as context)
  holdout: 15 Jul - 19 Oct 2026
instruments:
- NIFTY
features:
- 'signal source: none (non-directional, time-of-day entry)'
- ATM strike and ATM straddle at the entry minute
- option premium for stops and targets
