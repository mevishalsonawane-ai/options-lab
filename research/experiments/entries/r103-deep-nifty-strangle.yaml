results:
  summary: 'Design A (20 Nov 2024 - 14 Jul 2026), 60 cells (3 entries x 5 stops x 2 targets x all / expiry days), 1 lot, after
    costs: 35 of 60 net > 0, 3 with net > 0 and BH q <= 0.10 (family of 480), 3 pass every gate. 09:20 all days no stop: 394
    trades, win 66%, net Rs +54,224, worst day Rs -27,742, max DD Rs -42,381, 3 months < -Rs 13k, p 0.42, q 0.73, twin p 0.02.
    Same with the combined stop at 1x credit: win 64%, net Rs +80,641, worst day Rs -10,101, p 0.12. Best cell (chosen after
    the fact): 0920 X3/T0 ALL, 394 trades, net Rs +80,641, q 0.34. Design B (5 Aug 2021 - 19 Nov 2024, context, no gate) 09:20
    no stop: 786 trades, net Rs -39,521. Holdout (15 Jul - 19 Oct 2026, read once, design passers only): 0945 X3/T1 EXPIRY:
    14 trades, win 64%, net Rs -3,987 (fails); 1015 X1/T0 EXPIRY: 14 trades, win 71%, net Rs +694 (holds by the letter); 1015
    X2/T0 EXPIRY: 14 trades, win 57%, net Rs +1,293 (holds by the letter); p vs zero 0.53 / 0.85 / 0.83, i.e. not confirmed.'
  costs: dated charges per order per leg (Rs 20 brokerage, STT on sells 0.1% then 0.15% from 1 Apr 2026, exchange, SEBI, stamp,
    GST); half-spread 0.16% of the premium at ATM (h24), +50% per strike away, >= 1 tick, doubled on stop fills
holdout_read: true
verdict: inconclusive
notes: 'A separate study from the r103-<index>-<day>-<structure> entries (research/hunt/r103_sell, another session''s defined-risk
