id: r18
title: 'Better exits for every arm: VWAP band, next S/R, time stop, expected range, breakeven (TODO I9)'
family: trade-management
date: '2026-10-13'
doc: research/HUNT_R18_EXITS.md
hypothesis: One of five pre-registered exit overlays (each can only exit earlier or raise the stop) improves an arm's net
  after charges over today's exits, consistently across walk-forward folds, in the locked holdout.
data_version: research-data release parquet (BANKNIFTY 13 Feb 2024 - 23 Feb 2026, NIFTY 1 Apr 2024 - 13 Apr 2026, expiry_days,
  extra_series VIX) via research/brain/adapters/release.py; config switch R18_SOURCE=lake for the Dhan lake later (a new entry, fresh holdout)
period:
  design: BANKNIFTY 2024-02-13 .. 2025-08-22, NIFTY 2024-04-01 .. 2025-10-10 (4 folds)
  holdout: BANKNIFTY 2025-08-25 .. 2026-02-23 (122 sessions), NIFTY 2025-10-13 .. 2026-04-13 (120 sessions)
instruments:
- BANKNIFTY
- NIFTY
features:
- session VWAP bands (ATM option-volume proxy on the release)
- prior-day levels, pivots, opening range, day high/low, round numbers
- R16 expected 30-min range (4-input formula)
- minutes since entry
- option high since entry
model_or_rule: 'V1 VWAP band trail, V2 next support/resistance, V3 45-minute time stop, V4 expected range used up, V5
  breakeven after +15%; overlays on each arm''s own exits (ORB, ORB Fresh, ORB Sweep, Range Fade, VIX div NIFTY/BANKNIFTY,
  Hero, Pine EMA 9/21 and Supertrend on NIFTY/BANKNIFTY, Liquidity BANKNIFTY study only)'
settings: research/hunt/r18/PREREG.md (all settings fixed before any run)
prereg: research/hunt/r18/PREREG.md
variants_tried: 60
results:
  summary: 0 of 60 passed the design gates (best BH q 0.48), so no holdout test; the holdout (R16's, already read by
    R16, so a REUSED holdout) is descriptive only. None of these five early-exit overlays helps any arm; the cause of the
    low capture (today's exits keep about 0% of the best reachable option price on the losing arms, ORB -0.4%, n 320)
    is not established (entries or exits). Liquidity BANKNIFTY (frozen) was hurt by every variant (design -Rs 0.1k to
    -76k on 336 trades). Post hoc, design only, V2 helped 9 of 10 non-frozen arms (+Rs 64.8k on 4,964 trades) - a
    candidate to pre-register on the 6-year lake and judge on its fresh holdout, not a result. Corrected 13 Oct after a
    review (expiry-day square-off 15:05; no fill after the square-off) and re-run with the same 60 rows - only VIX
    divergence BANKNIFTY (3 trades) and Pine EMA NIFTY (1 holdout trade) changed; no verdict changed.
  costs: app paper fills (+-5 bps, stops -10 bps), app charges (SandboxCosts, STT 0.15%), 0.16% real half-spread each side
    (Hero 1 tick); stress 2x spread
holdout_read: true
verdict: rejected
notes: No shadow line or switch was added (only a clear pass would have earned one). ORB and ORB Fresh are identical in
  this data under the 1-a-side paper cap. Order-flow exits not tested (recording began 12 Oct; shadow-only until 60
  recorded days). The release holdout was R16's (reused) and was read twice by R18 - once at first, once after the
  review's bug fixes (same rows, no new variant; asked for explicitly) - against the one-read rule; with 0 design
  candidates neither read was a test. The lake run is a new entry with a fresh holdout from 2026-04-27 (design up to
  2026-04-13, embargo between; PREREG.md amendment 1). Renumbered from r17 (research/hunt/r17 is the pre-trade checks
  study).
