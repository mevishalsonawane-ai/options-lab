id: r120-time-machine-gate
title: R120 the time machine's verdict as a pre-entry gate on every arm (skip 'against' / take only 'edge')
family: daily-filters
date: '2026-10-28'
doc: research/HUNT_R120_TIME_MACHINE_GATE.md
data_version: Drive lake gdrive:IraAlgo-data-lake copied 28 Oct 2026 (index_1m, options_rolling_1m, ...); R51 Amendment A
  clean stores; each arm's own study data via R113's adapters
period:
  design: 2024-11-20..2026-03-31 (walk-forward window Apr 2025 - Mar 2026)
  holdout: 2026-04-01..2026-10-13 read once (already read by R51-R119)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: each arm''s own (the underlying; Hero''s strike by the option''s price, labelled); the filter reads only
  the underlying''s own 60 sessions before the entry day'
hypothesis: 'The app''s time machine verdict (2,000 bootstrap replays of the entry on the underlying''s last 60 sessions,
  the arm''s own stop and target in underlying points, stop before target inside a bar), worked out BEFORE the entry, improves
  an arm as a filter: H1 skip ''against'', H2 take only ''edge''. Gates: net up in design, walk-forward and final; final above
  the random-skip twin''s 95th percentile; BH q <= 0.10 over 9,300,113 tests; >= 40 final trades; drawdown not worse.'
model_or_rule: research/hunt/r120_time_machine_gate/tm.py (TimeMachine.kt ported, Kotlin's RNG included, pinned to the engine's
  own numbers); r120arms.py (each arm's ask as its TimeMachineHost.Entry call passes it); r120study.py
settings: PREREG.md + Amendment A1; the app's draws, slot tolerance, lookback, margin (none chosen by R120)
prereg: research/hunt/r120_time_machine_gate/PREREG.md
variants_tried: 38
holdout_read: true
verdict: rejected
