id: book-aziz-05
title: 'ABCD: new high of day, higher pullback that holds, buy the turn near C (Andrew Aziz, book rule, tested in R104)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Andrew Aziz''s rule from Advanced Techniques in Day Trading (Ch. 6, Strategy 2: ABCD Pattern) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price/volume. Entry:
  A = the day''s low before the run; B = a new high of the day at least 0.5 x daily ATR14 above A; C = the lowest low after
  B, above A and at or above VWAP, confirmed when 3 one-minute bars close without a lower low. Long on the first 1-minute
  bar that makes a new high (above the prior bar''s high) with volume above the prior bar''s volume, while price is within
  25% of the B-C distance above C. Reverse ABCD mirrored for shorts. Stop: a 1-minute close below C Exit: Sell half at B (or
  the first new high of the day) and move the stop to entry; rest on the first 5-minute bar that makes a new low (lower than
  the prior 5-minute bar''s low), or 15:15.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- underlying price/volume
- 1-minute and 5-minute bars
model_or_rule: 'A = the day''s low before the run; B = a new high of the day at least 0.5 x daily ATR14 above A; C = the lowest
  low after B, above A and at or above VWAP, confirmed when 3 one-minute bars close without a lower low. Long on the first
  1-minute bar that makes a new high (above the prior bar''s high) with volume above the prior bar''s volume, while price
  is within 25% of the B-C distance above C. Reverse ABCD mirrored for shorts. | stop: a 1-minute close below C | exit: Sell
  half at B (or the first new high of the day) and move the stop to entry; rest on the first 5-minute bar that makes a new
  low (lower than the prior 5-minute bar''s low), or 15:15. | filters: Before 11:45 only; skip if C is below VWAP.'
settings: 'research/books/TESTABLE_RULES.md, rule book-aziz-05; trade: buy ATM CE on a long signal, ATM PE on a short; stops
