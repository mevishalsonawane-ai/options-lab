id: book-atb-14
title: 'Head and shoulders / inverse: neckline break (The Advanced Trading Book, book rule, tested in R104)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 4, Head and shoulders
  (p36, p39, p53, p54)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal
  source: underlying price. Entry: Three swing highs with the middle highest by >= 0.5 ATR and the outer two within 0.5 ATR
  of each other; neckline = line through the two swing lows between them; sell at the open after the first close below the
  neckline after the right shoulder. Mirror for inverse. Stop: Above the midpoint between the right shoulder top and the neckline
  (as drawn). Exit: Target = head-to-neckline height from the break; else square-off (daily variant: hold up to 5 sessions
  with futures, not options).'
