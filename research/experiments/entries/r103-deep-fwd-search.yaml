id: r103-deep-fwd-search
title: 'R103 deep forward: 90 enhancements of the NIFTY expiry-day strangle with a profit lock (history), 4 rules sent forward'
family: option-structure
date: '2026-10-22'
doc: research/HUNT_R103_DEEP_SELLING.md
hypothesis: 'Pre-registered (research/hunt/r103_selling/PREREG_FWD.md, before the search): width 1.0 / 1.25 / 1.5x the straddle,
  entry 10:15 / 11:00 / 12:00, exit 15:05 / 14:30, skip filters none / GAP / RANGE / VIX / ALL on the index and VIX raise
  the win rate to >= 70% with a profit in both 2024-26 and 2021-24. Signal source: none for the entry; filters on the underlying
  index and India VIX.'
data_version: as r103-deep-nifty-strangle
period:
  design: 20 Nov 2024 - 14 Jul 2026 (A) and 5 Aug 2021 - 19 Nov 2024 (B)
  holdout: forward from 20 Oct 2026 (not yet available; decision after 40 expiries)
instruments:
- NIFTY
features:
- 'signal source: none (time-of-day entry)'
- index open gap, index range so far, India VIX change (skip filters)
- option premium (stop, lock)
model_or_rule: 'r103fwd.py: strangle + combined stop 1x credit + lock 30/20, the 90 knob combinations'
settings: research/hunt/r103_selling/results/fwd_search.csv, fwd_rules.json
prereg: research/hunt/r103_selling/PREREG_FWD.md
variants_tried: 90
results:
  summary: '86 (A) / 165 (B) expiry days. 6 of 90 variants have win >= 70% and net > 0 in both periods. Base (10:15, 1.0x,
    15:05, no filter): A 74% win, +Rs 10,607 (+123 a trade); B 70%, +Rs 12,418 (+75). Finalists by the fixed rule: 11:00 +
    GAP skip A 77% +Rs 1,168 (74 trades) / B 73% +Rs 7,659; 10:15 exit 14:30 A 76% +Rs 4,533 / B 72% +Rs 8,348; 10:15 exit
    14:30 + GAP A 76% +Rs 4,377 / B 72% +Rs 6,650. The enhancements add 1-3 win-rate points and cut the profit a trade by
    half or more; average losses stay 2.5-3.3x the average win. Later entries, wider strikes and the RANGE / ALL filters mostly
    hurt.'
  costs: as r103-deep
holdout_read: false
verdict: inconclusive
notes: All history is in-sample for this family (the 15 Jul - 19 Oct 2026 holdout was read earlier). The 4 rules are scored
  forward by r103fwd.py score; nothing trades.
