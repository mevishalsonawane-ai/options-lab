id: book-fmross-01
title: Crude next-day continuation after a >1% down day (Ross four-state table) (Sheldon Ross, book rule, proposed)
family: mcx-crypto
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Sheldon Ross''s rule from An Introduction to Mathematical Finance: Options and Other Topics (Ch. 10.2) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry:
  If today''s close-to-close log change of the nearest-month future is below -1% (state 1), go short at the next session''s
  open (buy the 1-ITM PE, or sell the future). Stop: Underlying stop 1.0 x the 20-day ATR from the entry price (assumption;
  the book gives none). Exit: Exit at that session''s close (one-day hold, as the book''s table is next-day).'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- CRUDE
- NATURALGAS
- GOLD
- SILVER
features:
- underlying price
- daily bars (close-to-close log change of the nearest-month future)
model_or_rule: 'If today''s close-to-close log change of the nearest-month future is below -1% (state 1), go short at the
  next session''s open (buy the 1-ITM PE, or sell the future). | stop: Underlying stop 1.0 x the 20-day ATR from the entry
  price (assumption; the book gives none). | exit: Exit at that session''s close (one-day hold, as the book''s table is next-day).
  | filters: None in the book. Pre-register: no entry on the expiry day of the option or future; roll to next month 3 sessions
  before expiry.'
