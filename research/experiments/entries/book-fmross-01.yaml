id: book-fmross-01
title: Crude next-day continuation after a >1% down day (Ross four-state table) (Sheldon Ross, book rule, tested in R104)
family: mcx-crypto
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Sheldon Ross''s rule from An Introduction to Mathematical Finance: Options and Other Topics (Ch. 10.2) makes
  money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry:
  If today''s close-to-close log change of the nearest-month future is below -1% (state 1), go short at the next session''s
  open (buy the 1-ITM PE, or sell the future). Stop: Underlying stop 1.0 x the 20-day ATR from the entry price (assumption;
  the book gives none). Exit: Exit at that session''s close (one-day hold, as the book''s table is next-day).'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MCXD 2012-01-01 - 2021-12-31
  holdout: MCXD 2022-01-01 - 2026-10-16 (read once)
instruments:
- CRUDE
- NATURALGAS
- GOLD
- SILVER
features:
- underlying price
- daily bars (close-to-close log change of the nearest-month future)
model_or_rule: 'If today''s close-to-close log change of the nearest-month future is below -1% (state 1), go short at the
  next session''s open (buy the 1-ITM PE, or sell the future). | stop: Underlying stop 1.0 x the 20-day ATR from the entry
  price (assumption; the book gives none). | exit: Exit at that session''s close (one-day hold, as the book''s table is next-day).
  | filters: None in the book. Pre-register: no entry on the expiry day of the option or future; roll to next month 3 sessions
  before expiry.'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmross-01; trade: buy 1-ITM PE on MCX (or short the future); stop and
  exit on the underlying'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'MCXD (MCX future daily), variant base: design 1166 trades, win 44%, net -Rs 161,038, folds -Rs 33,662, -Rs 41,484,
    -Rs 85,892; p 1.000, BH q 1.000; holdout 1129 trades, win 46%, net -Rs 317,905. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: not tested by us on MCX; NIFTY daily lag-1 autocorrelation +0.028
  (DEEP_NIFTY_BANKNIFTY.md 2.5) was not tradeable. Assumptions: The book only reports statistics (big drop followed by big
  drop 31%, next-day mean -.0036 after state 1 on 1995-97 NYMEX crude); it proposes no trade. The most literal trade is a
  one-day continuation short. The mirror (''after state 2 or 3 go long'', next-day mean +.0024/+.0025) is a second variant,
  pre-registered alongside, with BH across both and across instruments. First run the 4x4 chi-square table on our MCX daily
  data as the descriptive gate.'
