id: book-fmmusiela-02
title: Delta-hedge an ATM straddle with smile-adjusted delta vs plain Black-Scholes delta (hedge-error test) (Musiela and
  Rutkowski, book rule, proposed)
family: trade-management
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Musiela and Rutkowski''s rule from Martingale Methods in Financial Modelling (Ch. 7.1.8 (modified delta), Ch.
  7.2.1 (CEV delta), Ch. 7.4.5 (smile dynamics)) makes money after real charges and slippage, walk-forward, with BH across
  the rules tried. Signal source: volatility / options structure (hedge ratios from the option chain''s IV-vs-spot slope;
  no direction). Entry: At 09:20 on non-expiry days, sell 5 lots of the nearest-expiry ATM call and put. Hedge with whole
  NIFTY futures lots in two parallel books: A uses Black-Scholes delta at each leg''s own IV; B uses delta + vega x s, where
  s = the slope of ATM IV against spot estimated by regression over the previous 20 days'' 09:20-15:10 minute data. Stop:
  Close a book if its loss reaches Rs 13,000. Exit: Re-hedge each book when its net delta passes +-1 futures lot or every
  15 minutes; square off at 15:10.'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
features:
- volatility / options structure (hedge ratios from the option chain's IV-vs-spot slope; no direction)
- 1-minute bars, one structure a day
model_or_rule: 'At 09:20 on non-expiry days, sell 5 lots of the nearest-expiry ATM call and put. Hedge with whole NIFTY futures
  lots in two parallel books: A uses Black-Scholes delta at each leg''s own IV; B uses delta + vega x s, where s = the slope
  of ATM IV against spot estimated by regression over the previous 20 days'' 09:20-15:10 minute data. | stop: Close a book
  if its loss reaches Rs 13,000. | exit: Re-hedge each book when its net delta passes +-1 futures lot or every 15 minutes;
  square off at 15:10. | filters: Skip pre-listed event days and expiry days.'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmmusiela-02; trade: Options short 5 lots each side; futures hedge;
  app cost model plus h24 spreads. The outcome is the difference in daily hedge error (variance of book P&L about implied
  minus realised) between A and B, then net P&L.'
