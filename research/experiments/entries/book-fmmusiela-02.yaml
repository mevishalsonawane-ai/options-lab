notes: 'Our nearest test: not tested by us; MCX_OPTIONS.md delta-hedged long options at about zero P&L at best; R102 puts
  dearer on 91% of NIFTY days (skew exists).. Assumptions: The book defines the modified delta but gives no procedure; the
  20-day regression for the IV-spot slope, the bands and lot counts are ours. Book A is the Bjork rule ''delta-hedged-short-straddle'';
  this test only asks whether B hedges better.'
