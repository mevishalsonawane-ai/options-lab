notes: 'Our nearest test: Not tested by us. R71 P1 inside-bar break lost -Rs 1,23,667 on 1,075 trades (its failure is the
  mirror); R89 break-and-reclaim lost like break-and-go; R61b: candidates after failed breaks did worse.. Assumptions: ''Failure''
  read as price trading back beyond the inside bar''s opposite end within 3 bars of C (the common Chesler definition); the
  book does not say which level marks the failure.'
