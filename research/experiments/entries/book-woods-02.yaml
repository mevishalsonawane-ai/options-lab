id: book-woods-02
title: 'Hikkake: failed breakout of an inside bar within three bars (Galen Woods, book rule, tested in R104)'
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Galen Woods''s rule from How to Trade Price Action (Ch. 5.10) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price. Entry: Bar B is an inside bar of bar A (lower high, higher
  low). Bar C has a lower high and a lower low than B (downside false break). Within the next 3 bars after C, if price trades
  above B''s high, buy at B''s high + 1 tick. Mirror for shorts (C higher high and higher low, then trade below B''s low).
  Stop: The lowest low from C to entry (the false break''s extreme), on the underlying. Exit: Not stated; nearest opposing
  swing as target, else session square-off.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: IDX 2021-08-02 - 2026-03-31; MCXI 2025-10-20 - 2026-07-31
  holdout: IDX 2026-04-01 - 2026-10-19 (read once); MCXI 2026-08-01 - 2026-10-19 (read once)
instruments:
- NIFTY
- BANKNIFTY
- CRUDE
features:
- underlying price
- 5-minute and 15-minute bars
model_or_rule: 'Bar B is an inside bar of bar A (lower high, higher low). Bar C has a lower high and a lower low than B (downside
