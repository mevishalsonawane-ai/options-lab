notes: 'R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests,
  BH across all).  Our nearest test: R87 tested engulfing among 43 shapes: no direction edge, 0 of 4,049 context cells; R87B
  exits on an opposite engulfing hurt. Assumptions: Book gives no explicit stop; ''tells us how much to risk'' read as the
  bar''s far end. Trend filter not defined in the chapter; the book''s 89-period MA used. Breakeven trigger at +1R and the
  bar-low trail are our readings of ''runs immediately'' and ''move the stop progressively''.'
