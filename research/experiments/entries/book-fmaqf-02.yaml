id: book-fmaqf-02
title: 'Kurtosis trade K1: sell ATM and far-OTM, buy near-OTM when implied tails are fatter than historical (Härdle, Kleinow
  and Stahl, book rule, proposed)'
family: option-structure
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Härdle, Kleinow and Stahl''s rule from Applied Quantitative Finance (Ch. 9.6) makes money after real charges
  and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options structure (implied vs historical
  density kurtosis); no direction. Entry: Same day and densities as the skew trade. If implied kurtosis > historical: sell
  every put with strike/forward < 0.90 (book used 0.86-0.90), buy puts 0.91-0.95, sell puts 0.96-1.00 and calls 1.00-1.04,
  buy calls 1.05-1.09, sell calls 1.10-1.14. If implied < historical: the mirror (K2). Stop: None in the book (naked far wings).
  Research variant: stop when the basket loss reaches 2x the net credit. Exit: Hold to expiry, cash settled.'
