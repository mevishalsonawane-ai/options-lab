id: r67-donchian-m25
title: 'R67 Donchian M25 Boss: A4 + stop -10% once +25%'
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R67_STOP_TO_10.md
hypothesis: 'Boss (16 Oct): once the option is +25%, moving the stop from -15% to -10% (on top of the A4 30/60/100 ladder)
  improves the paper arms after real costs, because trades that reach +25% and turn back lose less. This variant: M25 Boss:
  A4 + stop -10% once +25%; gates as R51 (BH over 15 tests); recommended only if it also beats B0 and A4 everywhere and random
  early exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 - R66 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: index 5-min bars (Donchian 20) (unchanged); only the option exits differ (stops and locks on the premium)'
model_or_rule: 'R51 Donchian 20 (5-min index Donchian-20 break, 1-ITM, 5 indices); exits: M25 Boss: A4 + stop -10% once +25%'
settings: research/hunt/r67/r67cfg.py exit_spec / TRIGGER; PREREG.md
prereg: research/hunt/r67/PREREG.md
variants_tried: 15
results:
  summary: 'Design: 4498 trades, win 44%, net Rs 9,234 (Rs 2/trade), worst day -Rs 56,647, max DD Rs 226,954, stops 816. Walk-forward:
    3266 trades, win 45%, net Rs 174,876 (Rs 54/trade), worst day -Rs 31,959, max DD Rs 100,724, stops 524. Final: 1781 trades,
    win 44%, net Rs 78,425 (Rs 44/trade), worst day -Rs 23,012, max DD Rs 95,695, stops 239; entry-twin p 0.01, BH q 0.015,
    exit-twin p 0.5589 (q 0.7505). Verdict: PASS. Versus B0: design Rs 954 (bootstrap p 0.4735), final Rs 22,986 (p 0.109).
    Versus A4: design Rs 1,761 (bootstrap p 0.021), final -Rs 352 (p 0.7805). Final: versus A4 the -10% step changed 2 trades;
    it gave up Rs 377 and saved Rs 25 (net -Rs 352).'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates but not recommended (PREREG section 3): it must also beat both B0 and A4 in design, walk-forward
  and final and beat random early exits; exit-twin q 0.7505. Boss may still choose it. Signal on the underlying; research
  only, nothing changes paper or live.'
