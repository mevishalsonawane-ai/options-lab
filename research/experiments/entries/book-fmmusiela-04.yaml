id: book-fmmusiela-04
title: MCX GOLD vs COMEX gold x USDINR fair-value gap, mean reversion (Musiela and Rutkowski, book rule, proposed)
family: mcx-crypto
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Musiela and Rutkowski''s rule from Martingale Methods in Financial Modelling (Ch. 4.3-4.4, Foreign equity forwards
  and foreign market futures (COMEX vs Tokyo gold example)) makes money after real charges and slippage, walk-forward, with
  BH across the rules tried. Signal source: underlying price (MCX GOLD future against COMEX gold future converted at USDINR,
  plus duty and carry). Entry: Fair value F = COMEX GC (USD/oz) x USDINR x (10 / 31.1035) x (1 + import duty + GST as applicable)
  x carry adjustment to MCX expiry. Gap z = (MCX GOLD - F) / F, standardised by its trailing 20-day mean and sd. Short MCX
  GOLD when z > +2, long when z < -2. Stop: Exit if z moves a further 1.5 sd against the trade or after a loss of Rs 13,000.
  Exit: Exit when z returns to 0, or at the MCX session close.'
data_version: 'not run (proposed 25 Oct 2026); needs data we lack: lack: intraday USDINR and a dated history of import duty;
  COMEX 1h is available as a proxy (R82)'
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- GOLD
features:
- underlying price (MCX GOLD future against COMEX gold future converted at USDINR, plus duty and carry)
- 5-minute bars during overlapping hours
model_or_rule: 'Fair value F = COMEX GC (USD/oz) x USDINR x (10 / 31.1035) x (1 + import duty + GST as applicable) x carry
