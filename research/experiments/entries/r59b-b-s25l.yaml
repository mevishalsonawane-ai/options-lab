hypothesis: After a 15-minute close beyond the Bollinger(20, 2) band (the stock's own Bollinger(20, 2) band), the ATM stock
  option bought at the next minute and held 60 minutes on the same contract makes money after real costs and beats random
  entries in the same session, per stock and side.
