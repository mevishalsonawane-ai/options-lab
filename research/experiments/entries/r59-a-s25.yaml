  monthly expiry, 1-minute, rebuilt per held contract), equity_1m 2024-2026, nse_bhavcopy weekly UDiFF files (expiries, lots);
  options to 14 Oct 2026, equity to 12 Oct 2026'
period:
  design: 20 Nov 2024 - 31 Mar 2026
  holdout: 'final test: 1 Apr - 12 Oct 2026, read once (not pristine: other studies saw it)'
instruments:
- F&O stocks
features:
- 'stocks: RELIANCE, HDFCBANK, ICICIBANK, INFY, TCS, SBIN, AXISBANK, KOTAKBANK, ITC, TMPV'
- 'signal source: the OPTION''s own price chart (NON-DEFAULT under CLAUDE.md, labelled)'
- 15-minute closes of the held ATM contract (same strike + expiry at t-1 and t, same session)
model_or_rule: at a 15-minute bar close (bar 2+), the ATM contract whose OWN close fell 20%+ from the previous bar of the
  same session and closes >= 5 (last trade in the bar's last 5 minutes); buy it at the next 1-minute open (within 5 min);
  exit 60 min later or 15:25 on the same contract; 25% premium stop on 1-minute rows (gap fills at the open); no overlap per
  stock and side; no trade on the expiry session or the 2 sessions before it, or within 5 sessions of a corporate action
