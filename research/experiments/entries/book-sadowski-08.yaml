id: book-sadowski-08
title: Daily NR4 / NR7 breakout (Roman Sadowski, book rule, proposed)
family: daily-filters
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 8) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Yesterday''s
  daily range is the smallest of the last 4 (NR4) or 7 (NR7). Today, buy on the first 5-min close above yesterday''s high,
  sell on the first close below its low (first break only). Stop: The other end of the narrow day''s range, on the underlying.
  Exit: Trail the stop to the prior 5-min swing low/high after +1R; square-off 15:15 (NSE) / 23:00 (MCX).'
