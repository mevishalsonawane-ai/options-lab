  holdout: 'final test: expiry days 1 Apr - 13 Oct 2026, read once (not pristine: R43-R45 saw 2025-26)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: none (time only, both sides)'
model_or_rule: O-L1 = R25 L1; O-L3 = R25 L3; O-BASE = R43 base cheap hero hold (12:30); T-LOT (1230-tr25) = R25 L1
