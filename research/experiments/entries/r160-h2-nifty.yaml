results:
  summary: 'POST n 53, slope -0.5255, r -0.2658, rho -0.2745, perm p 0.0545, hit 0.3261 of 46; BH q 0.0908 (R160), 1.0 (m
    = 2164). PRE n 392, slope -0.4744, r -0.0546, rho -0.1153, perm p 0.2699, hit 0.4684 of 237. Futures-implied POST n 53,
    slope -0.5009, r -0.2929, rho -0.3123, perm p 0.0330, hit 0.3617 of 47. Negative: the open gives back about half the late
