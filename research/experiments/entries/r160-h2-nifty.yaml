id: r160-h2-nifty
title: 'R160 H2: is the move from the late level to the next open predictable: NIFTY'
family: market-facts
date: '2026-11-11'
doc: research/hunt/r160_cas_gap/results/report.md
hypothesis: An option bought at 15:2x-15:3x is priced off the late level, so a buyer gains only if R = ln(open / late level)
  has the sign of D (slope != 0).
data_version: 'Drive lake gdrive:IraAlgo-data-lake (built 13-20 Oct 2026, to 19 Oct 2026): index_1m NIFTY/BANKNIFTY/SENSEX
  2025-2026, index_daily, fut_1m_live_index, options_rolling_1m NIFTY_WEEK/BANKNIFTY_MONTH/SENSEX_WEEK 2025-2026 (sha256 in
  PREREG section 2); bars to 15:29 only'
period:
  design: 'none: POST 3 Aug - 16 Oct 2026 entry days (53 nights) is the test sample, read once 11 Nov 2026'
  holdout: none locked; control PRE 1 Jan 2025 - 31 Jul 2026 (389-392 nights); forward log per PREREG 9
instruments:
- NIFTY
features:
- 'signal source: the index read through its derivatives (option put-call parity over ATM-2..+2, futures as a check), late
  level 15:20-15:27 minus the 14:30-14:59 basis, vs the official close; no option chart for direction'
model_or_rule: OLS slope of R on D, two-sided permutation p (100,000); identical to H1's slope minus 1 (NOTES A3)
