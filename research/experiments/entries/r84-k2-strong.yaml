id: r84-k2-strong
title: 'R84 K2-strong: Breadth Donchian, at most 2 per signal, the biggest breaks (in 5-min ATR)'
family: sizing-execution
date: '2026-10-19'
doc: research/HUNT_R84_BREADTH_RISK.md
hypothesis: 'Boss (19 Oct, after -Rs 9,721 on one Breadth Donchian signal): at most 2 per signal, the biggest breaks (in 5-min
  ATR) cuts R72 Breadth Donchian''s design worst day and max drawdown by >= 30% while keeping >= 70% of its net in design
  and walk-forward, beats a random-subset twin (p < 0.10, BH q < 0.10) and is not carried by its top 5 trades.'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK, files of 15 Oct), R51 Amendment A clean
  stores; 19 Oct index side from Yahoo 1-minute bars
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026)
  holdout: '1 Apr - 13 Oct 2026 NOT read: no variant passed design + walk-forward (PREREG section 7); the window was already
    read by R72, R73, R75'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the indices'' own 5-minute bars (R72 C1, 4 of 5); the variant reads break size in the index''s 5-minute
  ATR, NIFTY''s 10-minute move, or (RB) the option''s last price as a size input only; no option chart'
model_or_rule: 'R75''s C (R72 C1 Breadth Donchian, 1-ITM, exits P) + K2-strong: at most 2 per signal, the biggest breaks (in
  5-min ATR)'
settings: research/hunt/r84/r84rules.py, research/hunt/r84/r84study.py; PREREG.md
prereg: research/hunt/r84/PREREG.md
