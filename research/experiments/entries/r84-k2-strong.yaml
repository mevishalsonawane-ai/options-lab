results:
  summary: 'Design: 2332 trades, net -Rs 29,774, win 45%, worst day -Rs 27,914, worst signal -Rs 14,684, max DD Rs 1,96,285,
    green days 41%, months < -13k 5, DD > 40k episodes 2, net without top 5 -Rs 83,403; K0 design: 3071 trades, net Rs 2,16,929,
    win 47%, worst day -Rs 58,613, worst signal -Rs 26,277, max DD Rs 1,99,077, green days 46%, months < -13k 5, DD > 40k
    episodes 5, net without top 5 Rs 1,60,476. Walk-forward pooled net Rs 1,01,121 vs K0 Rs 3,35,883; beat K0 on net and worst
    day in 0 of 4 quarters. Dropped 1470 K0 trades (755 losers, Rs 10,51,512; 715 winners, Rs 12,37,905), took 731 later entries
    K0 did not (-Rs 60,311). Random-subset twin mean Rs 27,294, p 0.9541, BH q 0.998 over 8 (q 0.998 over the 7 pre-registered).
    19 Oct (app''s paper losses of the positions kept): -Rs 4,374 vs K0 -Rs 9,722. Verdict: FAIL (worst day and max DD not
    both cut >= 30% in design; keeps < 70% of K0''s net (design or walk-forward); no better than its random-subset twin (p
    or BH q >= 0.10); carried by its top 5 trades).'
  costs: 'R75''s: dated charges, R17 liquidity fills, next-minute fills, stops on the minute low with gap fills at the worse
