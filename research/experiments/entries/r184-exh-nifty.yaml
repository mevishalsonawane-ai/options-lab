instruments:
- NIFTY
features:
- 'signal source: the NIFTY near index future''s own 1-minute price and 1-second tick-rule delta (buy_vol - sell_vol, the
  app''s recorder), references from the same day''s earlier minutes only; option prices only price the trade; premium stop
  and breakeven lock on the option premium'
- 'exhaustion: a climax minute at a new X-minute low with a selling spike (|D| >= k x the day''s mean |D| so far), then within
  3 minutes selling under half the climax''s, no low beyond beta bp, and delta flips positive -> buy the ATM CALL (mirror
  at a high -> PUT); ''flip+close'' also needs the close beyond the climax close'
model_or_rule: 'EXH X30 k3 b6 flip T30: exhaustion: a climax minute at a new X-minute low with a selling spike (|D| >= k x
