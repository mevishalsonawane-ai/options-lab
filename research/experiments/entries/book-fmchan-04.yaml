notes: 'Our nearest test: R83 E9: NG month-of-year seasonality on MCX NATGASMINI: 14 trades, -37,413; always short +14,687.
  MCX_GUIDE: Feb -5.7%, Dec -10.7% monthly means 2012-2026. R94: bullion seasonals do not beat same-year random windows. Low
  prior.. Assumptions: Chan buys the NYMEX June contract; MCX NG contracts track the nearby Henry Hub month, so the June leg
  is not tradeable on MCX; the nearby contract carries contango roll costs Chan''s June leg avoided. Test on Henry Hub history
  (2000+, as R83) for the window itself and on MCX 2012-2026 for the tradeable version; compare with random 35-session windows
  of the same years (R94''s twin) and with always-short (carry). Vary the dates +-5 sessions as Chan advises.'
