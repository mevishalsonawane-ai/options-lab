notes: 'R104 (227 tests, BH across all). one trade a year: at most 14 trades, min-trades gate binds Our nearest test: R83
  E9: NG month-of-year seasonality on MCX NATGASMINI: 14 trades, -37,413; always short +14,687. MCX_GUIDE: Feb -5.7%, Dec
