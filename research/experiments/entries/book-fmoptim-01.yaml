id: book-fmoptim-01
title: Break of a least-width sloped trend channel fitted to the last 20 closes (Bartholomew-Biggs, book rule, tested in R104)
family: patterns-indicators
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Bartholomew-Biggs''s rule from Nonlinear Optimization with Financial Applications (Ch. 21) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: At each
  close, fit two parallel lines with a common slope to the previous 20 closes so every close lies between them and the vertical
  gap is as small as possible. Project both lines one bar ahead. Close above the projected upper (resistance) line: long signal.
  Close below the projected lower (support) line: short signal. Stop: not stated by the book; assumed: the opposite projected
  line, or a close back inside the channel Exit: not stated by the book; assumed: exit at the first close back inside the
  projected channel or after 5 sessions, whichever comes first'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: DLY 2006-01-01 - 2021-12-31; MCXD 2012-01-01 - 2021-12-31
  holdout: DLY 2022-01-01 - 2026-10-19 (read once); MCXD 2022-01-01 - 2026-10-16 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- underlying price
- daily closes (book); a 5-minute-bar version is our extension
model_or_rule: 'At each close, fit two parallel lines with a common slope to the previous 20 closes so every close lies between
  them and the vertical gap is as small as possible. Project both lines one bar ahead. Close above the projected upper (resistance)
  line: long signal. Close below the projected lower (support) line: short signal. | stop: not stated by the book; assumed:
  the opposite projected line, or a close back inside the channel | exit: not stated by the book; assumed: exit at the first
  close back inside the projected channel or after 5 sessions, whichever comes first | filters: none in the book (it says
  the severity of the break needs judgement); assumed: none, plus a pre-registered variant requiring the close to exceed the
  line by 0.25 x the channel width'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmoptim-01; trade: buy ATM CE on a long signal, ATM PE on a short;
  one lot; stops/targets on the underlying as assumed above; MCX: the future or the ATM option'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 2
results:
  summary: 'DLY (index daily, futures proxy), variant plain: design 996 trades, win 39%, net Rs 9,827, folds -Rs 26,567, -Rs
    41,435, Rs 77,829; p 0.459, BH q 1.000; holdout 404 trades, win 38%, net -Rs 214,333. R104 verdict: fail. | MCXD (MCX
    future daily), variant deep: design 409 trades, win 40%, net -Rs 101,013, folds Rs 3,526, -Rs 104,539; p 1.000, BH q 1.000;
    holdout 305 trades, win 40%, net -Rs 249,461. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  R104 (227 tests,
  BH across all).  Our nearest test: Not tested in this form. Nearest: R51 / R72 flat 20-bar Donchian breaks (R72 Breadth
  Donchian passed, twin p 0.008, BH q 0.032); R71 squeeze-release channel break lost in the final (-Rs 41,281 on 305 trades,
  twin p 0.91); R20b / R20c levels and level breaks no better than random lines.. Assumptions: Window length 20 from the book''s
  20-day channels; the book refits on fixed windows (days 1-20, 20-40, 40-60), we refit every bar to avoid look-ahead. The
  book only says sell on a downward break and buy on an upward break and gives no stop, exit or size. Uses closes only, as
  the book does.'
