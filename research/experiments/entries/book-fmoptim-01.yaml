id: book-fmoptim-01
title: Break of a least-width sloped trend channel fitted to the last 20 closes (Bartholomew-Biggs, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Bartholomew-Biggs''s rule from Nonlinear Optimization with Financial Applications (Ch. 21) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: At each
  close, fit two parallel lines with a common slope to the previous 20 closes so every close lies between them and the vertical
  gap is as small as possible. Project both lines one bar ahead. Close above the projected upper (resistance) line: long signal.
  Close below the projected lower (support) line: short signal. Stop: not stated by the book; assumed: the opposite projected
  line, or a close back inside the channel Exit: not stated by the book; assumed: exit at the first close back inside the
  projected channel or after 5 sessions, whichever comes first'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- underlying price
- daily closes (book); a 5-minute-bar version is our extension
model_or_rule: 'At each close, fit two parallel lines with a common slope to the previous 20 closes so every close lies between
  them and the vertical gap is as small as possible. Project both lines one bar ahead. Close above the projected upper (resistance)
  line: long signal. Close below the projected lower (support) line: short signal. | stop: not stated by the book; assumed:
  the opposite projected line, or a close back inside the channel | exit: not stated by the book; assumed: exit at the first
  close back inside the projected channel or after 5 sessions, whichever comes first | filters: none in the book (it says
  the severity of the break needs judgement); assumed: none, plus a pre-registered variant requiring the close to exceed the
  line by 0.25 x the channel width'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmoptim-01; trade: buy ATM CE on a long signal, ATM PE on a short;
  one lot; stops/targets on the underlying as assumed above; MCX: the future or the ATM option'
prereg: null
variants_tried: null
results:
  summary: Not run. Proposed from the book; Boss chooses which rules go to a research round.
  costs: not run; real charges and slippage apply when tested
holdout_read: null
verdict: proposed
notes: 'Our nearest test: Not tested in this form. Nearest: R51 / R72 flat 20-bar Donchian breaks (R72 Breadth Donchian passed,
  twin p 0.008, BH q 0.032); R71 squeeze-release channel break lost in the final (-Rs 41,281 on 305 trades, twin p 0.91);
  R20b / R20c levels and level breaks no better than random lines.. Assumptions: Window length 20 from the book''s 20-day
  channels; the book refits on fixed windows (days 1-20, 20-40, 40-60), we refit every bar to avoid look-ahead. The book only
  says sell on a downward break and buy on an upward break and gives no stop, exit or size. Uses closes only, as the book
  does.'
