hypothesis: 'Pre-registered (A1, before any data): buying the 1-ITM call when the CCI(25) of hlc3 on the underlying crosses
  UP through +200 (the put when it crosses down through -200), entry at the next minute''s open, 09:30-14:45, stop beyond
  the signal bar +/- 1 tick, exit at the first bar back inside the level, flat 15:15 / 15:05, on 3m / 5m / 15m / 60m bars,
  beats 1000 after-trigger random-entry twins after real costs (p_emp < 0.05, BH q < 0.10 over 328 cells), >= 40 trades, 3
  of 4 folds, without the top 5, worst month >= -Rs 13k.'
