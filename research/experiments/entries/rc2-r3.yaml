id: rc2-r3
title: 'RC2 crypto options R3_us_orb: US open range (13:30-14:00 UTC) breakout, 14:00-17:00, next-day expiry'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: Buying a Delta India BTC/ETH option on 'US open range (13:30-14:00 UTC) breakout, 14:00-17:00, next-day expiry',
  with a stop-loss and a profit lock, makes money after real costs and beats random same-clock entries.
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,912 BTC/ETH daily expiries (956 per coin) (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain
  polls 13 Oct 2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad,
  not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (184 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- CRYPTO
features:
- 13:30-14:00 UTC range
- 5-min close
model_or_rule: 'US open range (13:30-14:00 UTC) breakout, 14:00-17:00, next-day expiry; strike atm; expiry >= 6 h left; max
  hold 4 h; exits: stop -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s40_step (best design mean). Design: 1493 trades, 29% win, -4.6% a trade net (gross +2.2%), Rs -136,299 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.001 (BH q 0.002), direction twin p 0.503; walk-forward Rs -118,514; stress
    Rs -283,433. Holdout: 349 trades, -3.1% a trade, Rs -21,523 (after VDA tax Rs -59,834). Gates passed on design: not all.
    All exits: s40_step: design n 1493 net -4.6%/trade Rs -136,299, holdout n 349 -3.1% Rs -21,523; s40_trail: design n 1493
    net -5.2%/trade Rs -154,225, holdout n 349 -2.2% Rs -14,909; s25_step: design n 1493 net -4.7%/trade Rs -137,516, holdout
    n 349 -2.4% Rs -16,463; s25_trail: design n 1493 net -5.4%/trade Rs -160,320, holdout n 349 -1.9% Rs -12,888.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
    on entry and exit; exits less 1 tick + 1%; stress spread x1.5 and fee 0.03%
holdout_read: true
verdict: rejected
notes: One of 8 RC2 rules (32 variants, one BH family). Every trade had a stop and a profit lock (Boss's crypto rule). Design
  was re-run once after a data fix (listing-glitch marks, PREREG amendment 4).
