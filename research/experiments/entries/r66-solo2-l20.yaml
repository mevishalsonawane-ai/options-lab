id: r66-solo2-l20
title: R66 Solo2 L20 A4 + stop +5% once +20%
family: trade-management
date: '2026-10-16'
doc: research/HUNT_R66_LOCK_AT_25.md
hypothesis: 'Boss (16 Oct): once the option is +25%, moving the stop to +5% (on top of the A4 30/60/100 ladder) improves the
  paper arms after real costs, because trades that reach +25% no longer come back to the -15% stop. This variant: L20 A4 +
  stop +5% once +20%; gates as R51 (BH over 15 tests); recommended only if it also beats B0 and A4 everywhere and random early
  exits (q <= 0.10).'
data_version: Drive lake gdrive:IraAlgo-data-lake (index_1m, options_rolling_1m WEEK), R51 Amendment A clean stores (Donchian,
  OOV) / R57 stores (Solo 2.0), 20 Nov 2024 - 13/14 Oct 2026
period:
  design: 20 Nov 2024 - 31 Mar 2026 (walk-forward quarters Apr 2025 - Mar 2026; Solo 2.0 Jul 2025 - Mar 2026)
  holdout: 1 Apr - 13/14 Oct 2026, read once; already read by R51 / R52 / R57 / R64 / R65 (weak)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
features:
- 'signal source: index (setups S1-S4); model inputs as R57 (unchanged); only the option exits differ (stops and locks on
  the premium)'
model_or_rule: 'Solo 2.0 (R57 A2 logistic meta-labeller picks of setups S1-S4, one a day, 4 indices); exits: L20 A4 + stop
  +5% once +20%'
settings: research/hunt/r66/r66cfg.py exit_spec / TRIGGER; PREREG.md
prereg: research/hunt/r66/PREREG.md
variants_tried: 15
results:
  summary: 'Design: 166 trades, win 58%, net Rs 54,178 (Rs 326/trade), worst day -Rs 10,370, max DD Rs 22,530, stops 9. Walk-forward:
    166 trades, win 58%, net Rs 54,178 (Rs 326/trade), worst day -Rs 10,370, max DD Rs 22,530, stops 9. Final: 128 trades,
    win 62%, net Rs 99,232 (Rs 775/trade), worst day -Rs 6,120, max DD Rs 18,044, stops 5; entry-twin p 0.002, BH q 0.005,
    exit-twin p 0.2794 (q 0.499). Verdict: PASS. Versus B0: design -Rs 1,731 (bootstrap p 0.5235), final Rs 61 (p 0.459).
    Versus A4: design -Rs 4,462 (bootstrap p 0.6345), final Rs 1,680 (p 0.3665). Final: the +5% step closed 10 trades; versus
    A4 it gave up Rs 5,785 and saved Rs 7,465 (net Rs 1,680).'
  costs: dated charges, R17 liq fills, next-minute fills, stops on the minute low with gap fills at the worse open, locks
    from the next minute, one held contract, 1 lot in force
holdout_read: true
verdict: inconclusive
notes: 'Passed R51''s gates but not recommended (PREREG section 3): it must also beat both B0 and A4 in design, walk-forward
  and final and beat random early exits; exit-twin q 0.499. Boss may still choose it. Signal on the underlying; research only,
  nothing changes paper or live.'
