  holdout: BANKNIFTY 2025-08-25..2026-02-23, NIFTY 2025-10-13..2026-04-13
instruments:
- BANKNIFTY
- NIFTY
features:
- three 15-minute candles 09:15-09:59 (high, low, mid, extensions)
- 5- / 15-minute index candles
- ATR14
model_or_rule: as r22-brk15 but no premium stop; out on a 5-min index close back through the range mid; +40/+20 with ladder
settings: research/hunt/r22/PREREG.md part B
prereg: research/hunt/r22/PREREG.md
