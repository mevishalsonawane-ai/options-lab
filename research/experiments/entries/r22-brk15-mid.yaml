id: r22-brk15-mid
title: 15-minute close break of the morning range, stop at the range mid (5-min close) instead of the premium stop
family: orb
date: '2026-10-13'
doc: research/HUNT_R22_ORB_15M_LEVELS.md
hypothesis: Buying the option on this morning-range rule makes money net of the app's paper fills and fees (holdout daily
  net > 0, beats a random-level and a random-time twin after BH over 58 tests with R20 / R20b / R20c) and beats today's ORB
  on the same sessions.
data_version: research-data release (BANKNIFTY 2024-02-13..2026-02-23, NIFTY 2024-04-01..2026-04-13, FINNIFTY index 2024-02-12..2026-02-24)
  via research/hunt/r17/data.py
period:
