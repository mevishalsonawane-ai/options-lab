id: r87b-r1
title: 'R87B-1: SENSEX 15m cluster 13 (green, green, red) -> buy SENSEX 1-ITM call, 75 minutes'
family: patterns-indicators
date: '2026-10-20'
doc: research/HUNT_R87_CANDLE_ANATOMY.md
hypothesis: 'Pre-registered (B-A1, mechanical selection): buying the 1-ITM call on the SENSEX 15m green-green-red cluster
  is profitable after costs in walk-forward, beats 500 random-entry twins (p < 0.10), > 0 without its 5 best trades, >= 30
  trades.'
data_version: 'Dhan v2 direct: index 1-minute (R87, A2-cleaned) and daily (2015-2026); option snapshot of 19 Oct 2026 23:30
