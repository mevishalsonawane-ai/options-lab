id: book-douglas-01
title: Judge each arm in 20-trade blocks; pause an arm whose block falls outside its own expected range (Mark Douglas, book
  rule, tested in R104)
family: trade-management
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Mark Douglas''s rule from Trading in the Zone (Ch. 11 (Trading in Sample Sizes, Testing)) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: none (a rule on an arm''s own closed
  trades; the arm''s signals stay on the underlying). Entry: Unchanged: every signal of the existing arm (Liquidity 15+5,
  R72 Breadth Donchian, R51 Donchian, R52 OOV). Stop: Unchanged (the arm''s own). Exit: Unchanged. After each completed block
  of 20 trades, compare the block''s win count and net with the arm''s expected 20-trade range from its design record; if
  the block is below the 5th percentile of that range, pause new entries for the next 20 signals (shadow-log them), then resume.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MM 2024-11-20 - 2026-03-31
  holdout: MM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
features:
- none (a rule on an arm's own closed trades; the arm's signals stay on the underlying)
- per closed trade, blocks of 20
model_or_rule: 'Unchanged: every signal of the existing arm (Liquidity 15+5, R72 Breadth Donchian, R51 Donchian, R52 OOV).
  | stop: Unchanged (the arm''s own). | exit: Unchanged. After each completed block of 20 trades, compare the block''s win
  count and net with the arm''s expected 20-trade range from its design record; if the block is below the 5th percentile of
  that range, pause new entries for the next 20 signals (shadow-log them), then resume. | filters: None besides the block
  check. Variables are never changed mid-block.'
settings: 'research/books/TESTABLE_RULES.md, rule book-douglas-01; trade: as the arm (1-ITM CE/PE chosen by its strike rule;
  stops/targets as the arm)'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'MM (the arms'' trades (sizing)), variant base: design net Rs 807,484 vs Rs 774,750, max drawdown -Rs 364,101 vs
    -Rs 444,695 (cut 18%, net cut -4%); p 0.190, BH q 1.000; final DD cut -8%, net cut 10%. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all).  Our nearest test: R75 L1-K2 (stop after 2 losses in a row) and L7-DD20 (half size
  in a Rs 20k drawdown) both failed: the trades after a bad stretch paid. A 20-trade block rule is a slower version of the
  same idea and is not tested by us.. Assumptions: The book says to judge in samples of at least 20 and that 20 is small enough
  to catch a fading edge, but gives no stop criterion; the 5th-percentile bootstrap of the arm''s own design trades and the
  20-signal pause are ours. Risk-lowering only; would start in shadow for live per CLAUDE.md.'
