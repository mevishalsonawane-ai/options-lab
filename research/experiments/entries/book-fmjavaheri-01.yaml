settings: 'research/books/TESTABLE_RULES.md, rule book-fmjavaheri-01; trade: Long OTM CE, short OTM PE (1 lot), short/long
  NIFTY future rebalanced daily at the close to the net Black-Scholes delta computed with the entry-day implied vols (as the
  book did); report results at mid (close) prices and with a modelled half-spread on each option fill, as the book''s main
  finding is that the spread decides the sign.'
