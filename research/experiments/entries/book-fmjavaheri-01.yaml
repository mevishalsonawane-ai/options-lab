id: book-fmjavaheri-01
title: 'Skew trade: buy OTM call, sell OTM put, vega-neutral and delta-hedged, on the NIFTY monthly (Alireza Javaheri, book
  rule, proposed)'
family: option-structure
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Alireza Javaheri''s rule from Inside Volatility Arbitrage (Ch. 3, Skewness Trades; An Example of the Skewness
  Trade; Multiple Trades) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal
  source: volatility / options structure (no direction; the delta hedge is on the underlying future). Entry: On the first
  trading day after a monthly expiry, take the next monthly expiry (about 20-25 trading days). Buy the call with strike nearest
  S x (1 + 0.10 x sqrt(T / 0.25)) and sell the put nearest S x (1 - 0.10 x sqrt(T / 0.25)), T in years (the book''s 10% OTM
  at three months scaled by square-root of time). Size calls per put = put vega / call vega at entry (vega-neutral); 1 put
  lot. Stop: None in the book. Research variant B adds a basket stop: close everything if the position (options + hedge) loses
  Rs 13,000 (Boss''s month stop). Exit: Unwind 5 trading days before expiry (the book unwinds about 20 business days before
  a three-month expiry, i.e. at roughly the last quarter of the trade''s life). Variant C holds to expiry.'
data_version: 'not run (proposed 25 Oct 2026); needs data we lack: lack: bid-ask for 5-10% OTM monthly strikes (the 1-minute
  lake keeps only ATM +-10 strikes; the EOD bhavcopy has all strikes but only closes); have: NIFTY futures daily bars, bhavcopy
  closes for the strikes'
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
- NIFTY
- BANKNIFTY
features:
- volatility / options structure (no direction; the delta hedge is on the underlying future)
- daily (EOD bhavcopy prices, daily delta hedge at the close); one trade per monthly expiry
