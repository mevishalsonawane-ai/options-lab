id: r59-b-ns
title: 'R59 B: the stock''s own 1% 15-minute move against the option, no stop (their exit, comparison only)'
family: stocks
date: '2026-10-15'
doc: research/HUNT_R59_STOCK_DIP_AUDIT.md
hypothesis: After a sharp 15-minute fall (the stock's own 1% 15-minute move against the option), the ATM stock option bought
  at the next minute and held 60 minutes on the same contract makes money after real costs, beats random entries in the same
  session, per stock and side.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: stock_options_rolling_1m stkopt_<SYM>_MONTH (rolling ATM-1..ATM+1, nearest
  monthly expiry, 1-minute, rebuilt per held contract), equity_1m 2024-2026, nse_bhavcopy weekly UDiFF files (expiries, lots);
  options to 14 Oct 2026, equity to 12 Oct 2026'
period:
  design: 20 Nov 2024 - 31 Mar 2026
  holdout: 'final test: 1 Apr - 12 Oct 2026, read once (not pristine: other studies saw it)'
instruments:
- F&O stocks
features:
- 'stocks: RELIANCE, HDFCBANK, ICICIBANK, INFY, TCS, SBIN, AXISBANK, KOTAKBANK, ITC, TMPV'
- 'signal source: the STOCK (equity_1m 15-minute closes; default-compatible)'
- ATM option of the side bought; stops on the option premium
model_or_rule: at a 15-minute bar close (bar 2+), the stock fell 1.0%+ in the bar (buy the ATM CE) or rose 1.0%+ (buy the
  ATM PE); buy at the next 1-minute open (within 5 min); exit 60 min later or 15:25 on the same contract; no stop (their exit,
  comparison only); no overlap per stock and side; no trade on the expiry session or the 2 sessions before it, or within 5
  sessions of a corporate action
