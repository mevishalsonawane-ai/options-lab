hypothesis: 'Markus Heitkoetter''s rule from A Complete Guide to Day Trading (Step 3, Simple Moving Averages) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Long
  when a bar closes above SMA(10) of closes after closing below it on the prior bar; short on the reverse cross. Stop: 0.27%
  of the index against the entry (the book''s $200 per E-mini contract at ~1460). Exit: Target 0.41% of the index (book''s
  $300); time stop after 45 minutes (3 bars); opposite cross; 15:10 square-off.'
