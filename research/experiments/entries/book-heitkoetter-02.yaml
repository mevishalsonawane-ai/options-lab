  cross. | stop: 0.27% of the index against the entry (the book''s $200 per E-mini contract at ~1460). | exit: Target 0.41%
  of the index (book''s $300); time stop after 45 minutes (3 bars); opposite cross; 15:10 square-off. | filters: Book: only
