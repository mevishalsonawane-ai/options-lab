hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 4, Double top / double
  bottom (p34, p38, p53, p54)) makes money after real charges and slippage, walk-forward, with BH across the rules tried.
  Signal source: underlying price. Entry: Two swing highs within 0.25 ATR, at least 4 bars apart, a swing low between them
  (neckline) at least 1 ATR below; sell at the open after the first close below the neckline. Mirror for double bottoms. Stop:
