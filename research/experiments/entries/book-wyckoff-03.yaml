id: book-wyckoff-03
title: Buy the light-volume pullback in an up move whose advances carried more volume (Wyckoff, book rule, proposed)
family: flow-oi
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Wyckoff''s rule from The Day Trader''s Bible (Ch. V, IX, X) makes money after real charges and slippage, walk-forward,
  with BH across the rules tried. Signal source: underlying price/volume (index future). Entry: Swings by a ZigZag of 1 ATR(14).
  In an uptrend (last two swing highs and lows rising), when a pullback retraces <= 50% of the last up-leg and the pullback''s
  average bar volume is <= 0.6x the up-leg''s average bar volume, buy on the first 5m close above the prior bar''s high. Mirror
  for downtrends. Stop: below the pullback low Exit: a new swing low (trend broken), or a pullback whose volume exceeds the
  up-leg''s, or 15:15 (15:05 on expiry)'
data_version: 'not run (proposed 25 Oct 2026); needs data we lack: lack: index-futures minute volume only from 29 Jul 2026'
