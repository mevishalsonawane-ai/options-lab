id: book-fmcapinski-01
title: Trade put-call parity violations against the index future (conversion / reversal) (Capinski and Zastawniak, book rule,
  proposed)
family: option-structure
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Capinski and Zastawniak''s rule from Mathematics for Finance (Ch. 7.2, Theorem 7.1 and its arbitrage proof; Ex
  7.4) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: volatility
  / options structure (option prices vs the futures-implied forward); reads option premiums only as a consistency check, no
  direction. Entry: Each minute 09:20-15:00, for each strike K within ATM +-3: gap = (C - P) - (F - K) x exp(-r x T), with
  C, P the minute''s call and put closes, F the same-expiry index future''s close, r a 6.5% continuous rate, T years to expiry.
  If gap > threshold: sell the call, buy the put, buy 1 lot future (conversion). If gap < -threshold: buy the call, sell the
  put, sell 1 lot future (reversal). threshold = all-in round-trip charges of the three legs (about Rs 70 + Rs 70 + futures
  charges, in points per unit) plus 2 points of slippage per leg. Stop: None in the book (riskless at expiry if all three
  legs fill at the signal prices); research variant: exit all legs if the basket''s mark-to-market loss exceeds 3 x the expected
  edge (protects against a bad print being the ''signal''). Exit: Close all three legs when |gap| falls below 1 point, else
  hold to expiry (cash settled; the payoff is locked except for the futures-vs-spot settlement difference and STT on exercise).'
data_version: 'not run (proposed 25 Oct 2026); needs data we lack: lack: executable bid/ask quotes for options and futures
  (the lake has last prices only); have futures and chain minutes'
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
instruments:
