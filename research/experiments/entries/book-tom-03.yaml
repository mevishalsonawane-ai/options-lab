id: book-tom-03
title: Daily / weekly 3-bar swing (3-bar Donchian) as the trend bias (Trader Tom, book rule, tested in R104)
family: daily-filters
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Trader Tom''s rule from The First Trading Manual (Trend Indicators; Daily Work Routine, p. 67-74) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: State
  = UP after any trade above the highest high of the previous 3 completed daily bars; DOWN after any trade below their lowest
  low; state persists until the opposite break. Used as a filter: allow an arm''s long (call) entries only in UP and short
  (put) entries only in DOWN. Stop: the arm''s own stop Exit: the arm''s own exit'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: ARM 2024-11-20 - 2026-03-31
  holdout: ARM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
- GOLD
- SILVER
- CRUDE
- NATURALGAS
features:
- underlying price
- daily bars (weekly variant)
model_or_rule: 'State = UP after any trade above the highest high of the previous 3 completed daily bars; DOWN after any trade
  below their lowest low; state persists until the opposite break. Used as a filter: allow an arm''s long (call) entries only
  in UP and short (put) entries only in DOWN. | stop: the arm''s own stop | exit: the arm''s own exit | filters: apply to
  R51 Donchian 20, R72 Breadth Donchian, Liquidity 15+5; weekly variant uses the previous 3 weekly bars, set Sunday night'
settings: 'research/books/TESTABLE_RULES.md, rule book-tom-03; trade: filter only (skip entries against the bias); for live
  this would start in shadow (logged only), switch off by default'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
  summary: 'ARM (the arm''s index signal (overlay / filter)), variant base: design 4763 trades, win 47% (B0 45%), net Rs 578,879
    vs B0 Rs 484,177 (delta Rs 94,702), quarters -Rs 90,171, Rs 79,097, Rs 1,734, -Rs 47,736; p 0.366, BH q 1.000; final delta
    -Rs 290,139. R104 verdict: fail.'
  costs: 'dated charges and liquidity slippage (PREREG.md section 5): options R51 liq fills and dated charges; futures proxies
    dated futures charges, half-spreads, carry; MCX R94 charges; crypto fees + GST'
holdout_read: true
verdict: rejected
notes: 'R104 (227 tests, BH across all). daily 3-bar swing bias filter Our nearest test: not tested by us at 3 bars; R101
  filters on the Donchian arms 0 of 20 (filters that raised the win rate lowered the net); R89 daily+15m trend filter did
  not cut false breaks. Assumptions: Book says ''trade below the 3-bar low'' turns the trend; we use intraday trade-through
  of the level (not a close). Book text says both ''last 3 bars'' and ''last 4 trading days''; we take the previous 3 completed
  bars.'
