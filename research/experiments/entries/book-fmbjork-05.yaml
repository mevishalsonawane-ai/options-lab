id: book-fmbjork-05
title: Mean-variance (Merton mutual fund) capital split across the arms with a record (Tomas Björk, book rule, proposed)
family: sizing-execution
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Tomas Björk''s rule from Arbitrage Theory in Continuous Time (Ch. 19.7, The mutual fund theorems) makes money
  after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: none (allocation on the arms''
  daily P&L). Entry: Each month, estimate the arms'' daily P&L means mu and covariance S over the trailing 250 sessions (walk-forward),
  shrink S 50% toward its diagonal, set raw weights w = S^-1 mu, zero any negative weight, scale so total margin used <= capital,
  and convert each weight to whole lots (minimum 0, maximum 3) for Liquidity 15+5, R72 Breadth Donchian, R51 Donchian and
  R52 OOV. Stop: Each arm''s own stops; account stop -Rs 40k drawdown or -Rs 13k a month halts all. Exit: Each arm''s own
  exits.'
data_version: Drive lake copied 25 Oct 2026 (index_1m, options_rolling_1m, index_daily, fut_*, crypto)
period:
  design: MM 2024-11-20 - 2026-03-31
  holdout: MM 2026-04-01 - 2026-10-13 (read once)
instruments:
- NIFTY
- BANKNIFTY
features:
- none (allocation on the arms' daily P&L)
- daily P&L; weights re-set monthly
model_or_rule: 'Each month, estimate the arms'' daily P&L means mu and covariance S over the trailing 250 sessions (walk-forward),
  shrink S 50% toward its diagonal, set raw weights w = S^-1 mu, zero any negative weight, scale so total margin used <= capital,
  and convert each weight to whole lots (minimum 0, maximum 3) for Liquidity 15+5, R72 Breadth Donchian, R51 Donchian and
  R52 OOV. | stop: Each arm''s own stops; account stop -Rs 40k drawdown or -Rs 13k a month halts all. | exit: Each arm''s
  own exits. | filters: An arm with fewer than 120 sessions of history gets 1 lot; R72 and R51 share a cap (their daily correlation
  is 0.80, R72).'
settings: 'research/books/TESTABLE_RULES.md, rule book-fmbjork-05; trade: as each arm trades; only lots per arm change'
prereg: research/hunt/r104_books/PREREG.md
variants_tried: 1
results:
