verdict: rejected
notes: 'R104 (227 tests, BH across all).  R104 (227 tests, BH across all).  Our nearest test: not tested by us (HUNT_R74_STRATEGY_MAP.md:
  volatility-targeted sizing not tried for the index arms; R72: Breadth Donchian overlaps Donchian, 77% shared trades).. Assumptions:
  Bjork''s theorem assumes known constant means and covariances; the shrinkage, windows and lot caps are ours. Compare against
  equal 1 lot per arm on the same days (net, worst month, max drawdown).'
