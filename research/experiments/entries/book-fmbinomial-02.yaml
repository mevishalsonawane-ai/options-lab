hypothesis: 'van der Hoek and Elliott''s rule from Binomial Models in Finance (Ch. 12.6 and Exercise 2.44 (butterfly price
  must be positive); App. D (Farkas)) makes money after real charges and slippage, walk-forward, with BH across the rules
  tried. Signal source: option premium (prices of three calls or three puts of one expiry); options-structure arbitrage, not
  our default. Entry: At a minute close, for evenly spaced strikes K-step, K, K+step within ATM +-10 of the nearest expiry,
  if C(K-step) - 2 C(K) + C(K+step) < -(cost of 4 lots of legs), buy the K-step and K+step calls and sell two K calls. Same
  check on puts. Stop: None (payoff is never negative at expiry). Exit: Hold to expiry cash settlement.'
