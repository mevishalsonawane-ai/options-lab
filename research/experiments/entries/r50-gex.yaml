id: r50-gex
title: 'Cancelled hero rules on the Nov 2024+ market: gamma / GEX'
family: flow-oi
date: '2026-10-15'
doc: research/HUNT_R50_HERO_RECENT.md
hypothesis: A cancelled gamma / GEX hero rule (R21-R43), or a small pre-registered re-tune of it, makes money on the market
  since NSE's weekly-expiry change (20 Nov 2024) after real costs, on one held contract, and beats random entry times.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: opt_<UND>_WEEK_2024-2026 (rolling ATM+-10 1-minute, rebuilt per held strike),
  index_1m 2024-2026, equity_1m 2024-2026 (R35 heavyweights); lake to 13 Oct 2026'
period:
  design: expiry days 20 Nov 2024 - 31 Mar 2026 (walk-forward blocks B0-B4)
  holdout: 'final test: expiry days 1 Apr - 13 Oct 2026, read once (not pristine: R43-R45 saw 2025-26)'
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: chain (GEX) day filter, no direction'
model_or_rule: O-X1 = R36 X1; O-X2 = R36 X2; T-GEX (tr25) = R36 X1
settings: research/hunt/r50/r50rules.py (rules), research/hunt/r50/r50cfg.py (dates, lots)
prereg: research/hunt/r50/PREREG.md
variants_tried: 5
results:
  summary: '2 original rules and a re-tune grid of 3 cells (one cell chosen on design by walk-forward), on 193 design and
    73 final-test index-expiry-days (20 Nov 2024 - 13 Oct 2026; NIFTY and SENSEX weekly, BANKNIFTY / FINNIFTY / MIDCPNIFTY
    monthly). 0 pass. O-X1: design 31 trades net Rs -13,564 (walk-forward Rs -10,664); final 30 trades, win 33.3%, peaks 5x/10x
    0/0, net Rs -1,838, without top 5 Rs -9,636 (top-5 share n/a (net <= 0)), p 0.246, q 0.687: fail, too few trades to judge;
    O-X2: design 105 trades net Rs -14,264 (walk-forward Rs -9,073); final 53 trades, win 20.8%, peaks 5x/10x 0/0, net Rs
    -20,802, without top 5 Rs -29,210 (top-5 share n/a (net <= 0)), p 0.465, q 1.000: fail; T-GEX (tr25): design 31 trades
    net Rs -5,273 (walk-forward Rs -3,758); final 30 trades, win 13.3%, peaks 5x/10x 0/0, net Rs -5,471, without top 5 Rs
    -6,662 (top-5 share n/a (net <= 0)), p 0.980, q 1.000: fail, too few trades to judge.'
  costs: charges in force on the trade date (obuy Costs('dated'), BSE rates for SENSEX); next-minute fills + 5 bps + 1/2/4-tick
    half-spread by 5-minute volume; entry limit ref x 1.2 + 0.10 for 3 minutes; gap fills at the worse open; 2x spread stress
    reported
holdout_read: true
verdict: rejected
notes: 'BH over all 28 R50 final-test tests (20 originals + 8 chosen re-tunes). Random-entry twins: 500 per rule, same day,
  side, strike rule, budget and exit at a random minute of the rule''s window. Signal-source labels: ''OPTION''S OWN CHART''
  rules are not the default kind.'
