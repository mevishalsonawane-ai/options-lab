id: rc2-r4
title: 'RC2 crypto options R4_vol_burst: 15-min move >= 2.5x the DVOL-implied 15-min move'
family: mcx-crypto
date: '2026-10-13'
doc: research/HUNT_RC2_CRYPTO_OPTIONS.md
hypothesis: Buying a Delta India BTC/ETH option on '15-min move >= 2.5x the DVOL-implied 15-min move', with a stop-loss and
  a profit lock, makes money after real costs and beats random same-clock entries.
data_version: 'Delta Exchange India public API: .DEXBTUSD/.DEETHUSD 5-min index 2024-03-01..2026-10-13, MARK 5-min candles
  of 1,912 BTC/ETH daily expiries (956 per coin) (2024-03-02..2026-10-13, strikes +-3.5% fine grid + 3.5-8% OTM); live chain
  polls 13 Oct 2026; Deribit DVOL and funding (hourly) and option trades (history API). Raw data in the session scratchpad,
  not in git.'
period:
  design: 2024-03-02..2026-04-12 (772 expiries per coin)
  holdout: 2026-04-13..2026-10-13 12:00 UTC (184 expiries per coin; read once; partly seen by NN_CRYPTO/STRAD_CRYPTO)
instruments:
- CRYPTO
features:
- 15-min index move
- DVOL (last completed hour)
model_or_rule: '15-min move >= 2.5x the DVOL-implied 15-min move; strike atm; expiry >= 1.5 h left; max hold 2 h; exits: stop
  -40%/-25% (hero -50%/-70%) x step lock / trailing lock'
settings: research/hunt/rc2/signals.py, exits.py, config.py
prereg: research/hunt/rc2/PREREG.md
variants_tried: 4
results:
  summary: 'Pick s40_trail (best design mean). Design: 2218 trades, 41% win, +0.9% a trade net (gross +8.9%), Rs +39,599 at
    Rs 1 lakh / 2% a trade; same-clock twin p 0.000 (BH q 0.001), direction twin p 0.004; walk-forward Rs -12,472; stress
    Rs -193,352. Holdout: 512 trades, -5.4% a trade, Rs -54,659 (after VDA tax Rs -105,278). Gates passed on design: not all.
    All exits: s40_step: design n 2218 net +0.7%/trade Rs +31,131, holdout n 512 -5.0% Rs -50,492; s40_trail: design n 2218
    net +0.9%/trade Rs +39,599, holdout n 512 -5.4% Rs -54,659; s25_step: design n 2218 net -1.0%/trade Rs -44,527, holdout
    n 512 -5.8% Rs -58,497; s25_trail: design n 2218 net -0.8%/trade Rs -32,842, holdout n 512 -6.2% Rs -62,355.'
  costs: Delta India fee min(0.01% notional, 3.5% premium) + 18% GST per side; spread model (wider of two live-chain fits)
    on entry and exit; exits less 1 tick + 1%; stress spread x1.5 and fee 0.03%
holdout_read: true
verdict: rejected
notes: One of 8 RC2 rules (32 variants, one BH family). Every trade had a stop and a profit lock (Boss's crypto rule). Design
  was re-run once after a data fix (listing-glitch marks, PREREG amendment 4).
