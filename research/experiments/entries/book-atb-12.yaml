id: book-atb-12
title: 'Bullish flag: wait for the last swing high to break, buy the first bullish candle after one pullback candle (Strategy
  7) (The Advanced Trading Book, book rule, proposed)'
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 3, Strategy 7 (p32))
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Flag as in flag-channel-break. Candle A: first close above the highest high of the flag (the last swing high, not
  the channel line). Candle B: the next bar closes red. Candle C: the next bar closes green: buy at C''s close (next-minute
  fill). If the bar after A is green, wait up to 6 bars for a red one; no red bar = no trade. Mirror for bearish flags. Stop:
  Below B''s low. Exit: Target = pole length from the break, else square-off.'
