id: r206-h6
title: 'R206 H6: are Liquidity 15+5 signals right more often with with the day?'
family: patterns-indicators
date: '2026-11-20'
doc: research/hunt/r206_direction/results/report.md
hypothesis: Liquidity 15+5 signals with 'with the day' see the index go their way after 15 minutes more often than the others,
  on 1 Apr 2022 - 19 Nov 2024 (a lead from the Nov 2024 - Oct 2026 diagnosis for H1 - H4)
data_version: 'the dhan-data branch of options-lab (Dhan v2, fetched 6 Oct 2026): 1-minute index candles, 8 Oct 2021 - 5 Oct
