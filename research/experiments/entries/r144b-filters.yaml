id: r144b-filters
title: 'R144b: pre-registered skip filters for Liquidity 15+5 and Range Fade (none qualified for ORB, ORB Fresh, ORB Sweep,
  Solo 2.0)'
family: trade-management
date: '2026-11-01'
doc: research/HUNT_R144B_LOSS_ORB_LIQ.md
