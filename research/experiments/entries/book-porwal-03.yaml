id: book-porwal-03
title: Engulfing reversal with trend, volume and stochastic filters (Nikhil Porwal, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 3.3) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price and volume (futures volume). Entry:
  Bullish: close below SMA 20 and SMA 20 falling (downtrend); day 1 close < open; day 2 close > open with body covering day
  1''s body (open2 <= close1 and close2 >= open1). Buy when price trades above day 2''s high within the next 3 sessions. Bearish
  mirror, plus open2 > close1, close2 < open1 and day-2 volume > day-1 volume. Stop: Below day 2''s low (bullish) / above
  day 2''s high (bearish). Exit: Target 2R; else trail with EMA 20 close; max hold 10 sessions.'
