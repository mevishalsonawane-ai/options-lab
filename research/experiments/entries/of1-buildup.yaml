id: of1-buildup
title: 'Option-chain build-up (long/short build-up, short covering, long unwinding) and who was paid at expiry'
family: flow-oi
date: '2026-10-14'
doc: research/HUNT_OF1_ORDERFLOW_INDIA.md
hypothesis: Describe which side (new longs or writers) the OI added under each build-up label paid by expiry, by index,
  moneyness, days to expiry and year (held-to-expiry approximation).
data_version: 'NSE public archives (nsearchives.nseindia.com) fetched 13 Oct 2026: participant OI/volume 3,644 days 2 Jan 2012 - 13 Oct 2026 (3,632 usable), F&O bhavcopy index rows 3,644 days, all-index closes (Dhan lake index_daily for gaps), NSDL FPI 3,560 reporting days; copies on gdrive:IraAlgo-data-lake/participants'
period:
  design: 2012-01-02 .. 2025-10-12
  holdout: 2025-10-13 .. 2026-10-13 (descriptive)
instruments:
- NIFTY
- BANKNIFTY
features:
- nearest-expiry chain: close change, NSE change in OI, final intrinsic value
model_or_rule: label by sign of premium change and OI change; P&L of each day's OI additions held to expiry
settings: research/hunt/of1/PREREG.md section 6 (Amendment 3 prices)
prereg: research/hunt/of1/PREREG.md
variants_tried: null
results:
  summary: '2012-2026, 3,644 sessions. OI added on short build-up days: new longs won 13.6% (NIFTY, 138,164 strike-days)
    / 13.8% (BANKNIFTY, 162,579), lost 23.4% / 22.8% of premium (Rs 47,133 / 34,907 crore to writers); OTM > 3% longs won
    0.9% / 2.2%, lost 63% / 50%. Long build-up additions: NIFTY -5.6%, BANKNIFTY +4.7% of premium; ATM +5.5% / +5.8%.'
  costs: gross (held to expiry; no exits, no charges)
holdout_read: null
verdict: not-a-test
