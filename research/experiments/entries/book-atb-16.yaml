hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 4, Pennants (p43, p45,
  p55)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying
  price. Entry: Pole >= 2 ATR within 5 bars; then 4-12 bars forming a converging triangle (falling highs, rising lows) inside
  the pole''s last 50%; buy after the first close above the upper line (bullish pole) or sell below the lower line (bearish
  pole). Stop: Beyond the opposite pennant line. Exit: Target = pole length from the break, else square-off.'
