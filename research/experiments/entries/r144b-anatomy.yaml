id: r144b-anatomy
title: 'R144b: losing-trade anatomy of Liquidity 15+5, ORB, ORB Fresh, ORB Sweep, Range Fade and Solo 2.0'
family: trade-management
date: '2026-11-01'
doc: research/HUNT_R144B_LOSS_ORB_LIQ.md
data_version: Drive lake IraAlgo-data-lake downloaded 1 Nov 2026; R3 sessions, R51 clean stores, R143 old store, R57 stores
