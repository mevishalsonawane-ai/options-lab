id: r59b-a-ns
title: 'R59b A: their Bollinger(20, 2) band on the HELD contract, no stop (their exit, comparison only)'
family: outside-strategies
date: '2026-10-15'
doc: research/HUNT_R59B_STOCK_BOLLINGER_AUDIT.md
hypothesis: After a 15-minute close beyond the Bollinger(20, 2) band (their Bollinger(20, 2) band on the HELD contract), the
  ATM stock option bought at the next minute and held 60 minutes on the same contract makes money after real costs and beats
  random entries in the same session, per stock and side.
data_version: 'Drive lake gdrive:IraAlgo-data-lake: stock_options_rolling_1m stkopt_<SYM>_MONTH (rolling ATM-1..ATM+1, nearest
  monthly expiry, 1-minute, rebuilt per held contract), equity_1m 2024-2026, nse_bhavcopy weekly UDiFF files (expiries, lots);
  options to 14 Oct 2026, equity to 12 Oct 2026'
period:
  design: 20 Nov 2024 - 31 Mar 2026
  holdout: 'final test: 1 Apr - 12 Oct 2026, read once (not pristine: other studies saw it)'
instruments:
- F&O stocks (stock options)
features:
- 'signal source: the OPTION''s own price chart (NON-DEFAULT under CLAUDE.md, labelled)'
- 'Bollinger(20, 2) over the held contract''s own 20 most recent 15-minute closes (no other contract in the window; fewer
  than 20 bars: no signal)'
model_or_rule: at a 15-minute bar close (bars 2-24), the ATM contract closes at or under the lower band of its own last 20
  bars and >= Rs 5 (last trade in the bar's last 5 minutes); buy it at the next 1-minute open (within 5 min); exit 60 min
  later or 15:25 on the same contract; no stop (their exit, comparison only); no overlap per stock and side; no trade on the
  expiry session or the 2 sessions before it, or within 5 sessions of a corporate action
settings: research/hunt/r59b/r59bcfg.py, research/hunt/r59b/r59bsim.py, research/hunt/r59/r59sim.py
prereg: research/hunt/r59b/PREREG.md
