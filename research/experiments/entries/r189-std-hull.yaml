id: r189-std-hull
title: 'R189: the standard Hull MA instead of Boss''s script, exit X16 (1-min only, no 10-sec data; 5 index options, 1-3 lots)'
family: patterns-indicators
date: '2026-11-16'
doc: research/hunt/r189_hull_bbi/results/report.md
hypothesis: 'Boss''s TradingView Hull line (HMA 55 as Boss''s script writes it: WMA(2 x WMA55 - WMA27, 7)): buy a call when
  the last 2 closed candles are above the rising (blue) line, a put when below the falling (red) line; Boss asked for 1-min
  AND 10-sec agreement and ''Find the exit by research''. This group: the standard Hull MA instead of Boss''s script, exit
  X16. Does it make money after costs and beat random entries?'
data_version: 'options-lab dhan-data branch (Dhan v2, fetched 6 Oct 2026): 1-minute index candles and rolling ATM +/- 10 1-minute
  options of the nearest expiry, read with research/obuy/data.py; no 10-second data reachable (the phone''s per-second recordings
  are sealed)'
period:
  design: 2024-11-20..2026-03-31 (4 folds; the exit chosen on them)
  holdout: 2026-04-01..2026-10-06 final = last 6 months, read once (results/FINAL_READ)
instruments:
- NIFTY
- BANKNIFTY
- FINNIFTY
- MIDCPNIFTY
- SENSEX
features:
- 'signal source: the index spot (1-minute candles; Hull line on the continuous 1-minute close series)'
- ATM option of the nearest expiry (1-ITM variant)
- '1-min only: the 10-second half of Boss''s rule was not tested'
model_or_rule: the standard Hull MA instead of Boss's script, exit X16; fresh signal only (condition false -> true), one position
