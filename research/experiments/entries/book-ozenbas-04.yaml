notes: 'Our nearest test: R86: fading failed pokes lost on all 6 level x index tests (295-804 trades, Rs -2.3 to -5.5 lakh);
  fade to VWAP lost Rs 64,786 on 71 trades. h28: event days move more but 8,820 variants found no side.. Assumptions: The
