id: book-ozenbas-04
title: Fade big moves on no-news days, follow them on scheduled-event days (Ozenbas, Pagano, Schwartz and Weber, book rule,
  tested in R104)
family: calendar-events
date: '2026-10-25'
doc: research/HUNT_R104_BOOKS.md
hypothesis: 'Ozenbas, Pagano, Schwartz and Weber''s rule from Liquidity, Markets and Trading in Action (Ch. 2.3 (information
  vs liquidity shocks)) makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal
  source: underlying price (plus an event calendar). Entry: Between 09:30 and 14:30, when a 5-minute index move exceeds 3x
  the trailing 20-day average absolute 5-minute move for that time of day: on a day with no scheduled event, enter AGAINST
  the move at the next bar; on an RBI / Budget / heavyweight-results day, enter WITH the move. Stop: Assumption: 1x the triggering
  5-minute move beyond the entry, on the index. Exit: Assumption: 30 minutes after entry, or the stop; flat by 15:10.'
