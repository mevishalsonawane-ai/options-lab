- 1-minute bars
model_or_rule: 'Between 09:30 and 14:30, when a 5-minute index move exceeds 3x the trailing 20-day average absolute 5-minute
  move for that time of day: on a day with no scheduled event, enter AGAINST the move at the next bar; on an RBI / Budget
  / heavyweight-results day, enter WITH the move. | stop: Assumption: 1x the triggering 5-minute move beyond the entry, on
  the index. | exit: Assumption: 30 minutes after entry, or the stop; flat by 15:10. | filters: No entries 09:15-09:30 (opening
  discovery) or after 14:30.'
