hypothesis: 'The Advanced Trading Book''s rule from Advanced Trading Book / Simple Trading Book (Ch. 3, Strategy 2 (p27))
  makes money after real charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price.
  Entry: Uptrend (close >= 2 ATR above the close 20 bars before the first triangle swing); at least 2 falling swing highs
  and 2 rising swing lows whose lines converge; close above the upper line = break (no entry); within 8 bars a bar trades
  back to within 0.1 ATR of the upper line and the next bar closes green above it; buy at the open of the bar after that green
  bar. Mirror after a fall. Stop: Below the last swing low inside the triangle. Exit: Measured move: triangle height at its
  widest, projected from the break (Chapter 4 drawings); else square-off.'
