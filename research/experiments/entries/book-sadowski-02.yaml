id: book-sadowski-02
title: Daily Heikin-Ashi two-candle reversal with stochastic 14,7,3 (Roman Sadowski, book rule, proposed)
family: patterns-indicators
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 3) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Setup long:
  two consecutive completed green HA candles after at least 3 red HA candles, and the stochastic(14,7,3) %K was below 30 within
  the last 5 bars. Place a buy-stop 0.1 ATR14 above the second green HA candle''s high, valid for the next 3 sessions. Short
  is the mirror (two red after 3+ green, %K above 70 within 5 bars, sell-stop below the second red candle''s low). Stop: 1.0
  x ATR14(daily) from entry (the book''s ''100 pips flat''), or the setup''s swing low/high if nearer. Exit: Move the stop
  to breakeven after +0.5 ATR14 (the book''s +50 pips); then trail to the latest 2-bar swing low/high; exit on an opposite
  HA setup.'
