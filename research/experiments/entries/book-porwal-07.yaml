id: book-porwal-07
title: 52-week high / low as a direction filter for intraday index trades (Nikhil Porwal, book rule, proposed)
family: daily-filters
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Nikhil Porwal''s rule from 10 Most Profitable Trading Strategies (Ch. 4.4) makes money after real charges and
  slippage, walk-forward, with BH across the rules tried. Signal source: underlying price (daily closes). Entry: Filter state
  at 09:15: LONG-ONLY if yesterday''s close is within 2% of the 252-session high and yesterday closed above the prior 20-session
  high at least once in the last 10 sessions; SHORT-ONLY for the mirror at the 252-session low; else NEUTRAL. Apply to an
  existing arm''s signals (R51 Donchian, R72 Breadth Donchian): drop signals against the state. Stop: the arm''s own Exit:
  the arm''s own'
data_version: not run (proposed 25 Oct 2026)
period:
  design: 'not set: fixed in the pre-registration when Boss picks this rule for a round'
