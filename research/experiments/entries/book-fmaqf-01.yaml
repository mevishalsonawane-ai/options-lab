id: book-fmaqf-01
title: 'Skewness trade S1: sell OTM puts, buy OTM calls when implied skew is richer than historical (Härdle, Kleinow and Stahl,
  book rule, proposed)'
family: option-structure
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Härdle, Kleinow and Stahl''s rule from Applied Quantitative Finance (Ch. 9.5 (also Table 7.1)) makes money after
  real charges and slippage, walk-forward, with BH across the rules tried. Signal source: volatility / options structure (implied
  density skew vs skew of a density simulated from the index''s own last 3 months); implicit long-index exposure. Entry: On
  the first trading day after the monthly expiry, compute implied skewness of the next-month (or second-month, closest to
  the book''s 3 months) risk-neutral density from settlement prices (smile smoothed, Breeden-Litzenberger) and the skewness
  of a density simulated from a local-volatility function fitted to the last 63 daily closes (10,000 paths, drift = risk-free
  rate, mean shifted to the futures price, variance matched). If implied skew < historical skew: sell 1 lot of every put with
  strike/forward in [0.86, 0.95] and buy 1 lot of every call in [1.05, 1.14]. If implied > historical: the mirror (S2). Stop:
  None in the book. Research variant: close all legs if the index falls 5% below the entry forward (to stay inside the account
  stop). Exit: Hold to expiry, cash settled.'
data_version: not run (proposed 25 Oct 2026)
