hypothesis: 'Boss''s same-direction cap (at most 2 open a way across all arms) refuses the arms'' winning trades (R107 lead). This rule: cap 2, the arm with the best per-trade net so far decides first (no kept place). Gates: net above the app''s cap in design, walk-forward and final; Boss''s account rule (months <= -Rs 13,000, Rs 40,000 drawdown breaches, days <= -Rs 13,000) at least as often as the cap in each period; final random-refusal twin BH q <= 0.10 over 5,784 tests; >= 30 final trades changed.'
