id: book-sadowski-10
title: Weekly + daily stochastic extreme at a swing level, intraday reversal entry (Roman Sadowski, book rule, proposed)
family: daily-filters
date: '2026-10-25'
doc: research/books/TESTABLE_RULES.md
hypothesis: 'Roman Sadowski''s rule from 9 Advanced and Profitable Trading Strategies (Strategy 1) makes money after real
  charges and slippage, walk-forward, with BH across the rules tried. Signal source: underlying price. Entry: Setup short:
  weekly and daily stochastic(14,3,3) %K both above 70, the index up more than 2 x ATR14(daily) over the last 10 sessions,
  and price within 0.5 ATR of a 60-session swing high. Over the next 5 sessions, sell on a 60-min close below the prior 60-min
  bar''s low. Long is the mirror (below 30, near a 60-session swing low). Stop: Above the setup''s swing high + 0.25 ATR (short),
  below the swing low (long). Exit: Not stated; we use 2R or 10 sessions.'
