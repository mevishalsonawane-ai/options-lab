// Speed, round 3: types the Compose compiler cannot see are immutable, declared stable so a screen handed an equal
// value (a new but equal list, a date) skips instead of redrawing. With strong skipping (on by default in this
// compiler) an unstable value is compared by identity and a stable one by equals(); content-equal values only.
// java.time values are immutable.
java.time.*
// Kotlin's collections, compared by content: a screen skips only when the new one equals the old (the same instance
// was already skipped under strong skipping).
kotlin.collections.*
