name: Probe a data source

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # the research-data release only
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gdown pandas pyarrow
      - name: Which Drive file is the FINNIFTY sample, then fetch and describe it
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sL -A "$UA" "https://cloudtraderpro.in/free-historical-finnifty-expired-options-data/" -o page.html
          python - <<'PY' > probe.txt
          import re, subprocess, os, glob, zipfile
          import pandas as pd
          html = open("page.html", encoding="utf-8", errors="ignore").read()
          text = re.sub(r"<[^>]+>", " ", html)
          ids = sorted(set(re.findall(r"drive\.google\.com/file/d/([\w-]+)", html)))
          print("== drive links and the words just before each")
          for i in ids:
              k = html.find(i)
              ctx = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", html[max(0, k - 900):k]))[-260:]
              print(i, "::", ctx)
          os.makedirs("dl", exist_ok=True)
          for i in ids:
              if i != "1_cYjZwk6bc-3c-NCX4LiWUth66vr2D4f":        # the FINNIFTY page's own sample
                  continue
              print("== downloading", i)
              r = subprocess.run(["gdown", i, "-O", f"dl/{i}"], capture_output=True, text=True)
              print(r.stdout[-400:], r.stderr[-600:])
              if not os.path.exists(f"dl/{i}"):
                  # Drive's direct download address, as a browser would ask for it
                  r = subprocess.run(["curl", "-sL", "-A", "Mozilla/5.0", "-o", f"dl/{i}", "-w", "%{http_code} %{content_type} %{size_download}",
                                      f"https://drive.usercontent.google.com/download?id={i}&export=download&confirm=t"], capture_output=True, text=True)
                  print("direct:", r.stdout)
                  if os.path.exists(f"dl/{i}") and os.path.getsize(f"dl/{i}") < 20000:
                      print(open(f"dl/{i}", errors="ignore").read()[:1500]); os.remove(f"dl/{i}")
          for f in glob.glob("dl/*"):
              print("== file", f, os.path.getsize(f), "bytes")
              try:
                  if zipfile.is_zipfile(f):
                      z = zipfile.ZipFile(f); names = z.namelist(); print(len(names), "members:", names[:30])
                      csvs = [n for n in names if n.lower().endswith(".csv")]
                      print("csv members:", len(csvs), csvs[:60])
                      first = csvs[:1]
                      if first:
                          df = pd.read_csv(z.open(first[0]), nrows=200000); print(first[0], df.shape); print(df.head(5).to_string()); print(df.columns.tolist())
                  else:
                      df = pd.read_csv(f, nrows=200000); print(df.shape); print(df.head(5).to_string()); print(df.columns.tolist())
              except Exception as e:
                  print("could not read:", e)
          PY
          cat probe.txt
      - name: Save it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload research-data probe.txt --clobber -R ${{ github.repository }}
