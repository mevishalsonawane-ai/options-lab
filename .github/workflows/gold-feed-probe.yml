name: Gold feed probe
# One-off check of which free XAUUSD price feeds answer (IraGoldAlgo's price source). Read-only, no secrets.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/gold-feed-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in "XAUUSD%3DX" "GC%3DF" "XAU%3DX"; do
            for q in "interval=60m&range=5d" "interval=1m&range=1d"; do
              u="https://query1.finance.yahoo.com/v8/finance/chart/$s?$q"
              code=$(curl -s -m 20 -A "Mozilla/5.0" -o out.json -w "%{http_code}" "$u")
              echo "== $s $q -> $code"
              python3 - <<'PY' || true
          import json
          d = json.load(open("out.json"))["chart"]
          if d.get("error"): print("error", d["error"]); raise SystemExit
          r = d["result"][0]; m = r["meta"]; ts = r.get("timestamp", [])
          q = r["indicators"]["quote"][0]
          print(m.get("symbol"), m.get("currency"), m.get("exchangeName"), m.get("regularMarketPrice"), "bars", len(ts))
          if ts: print("first", ts[0], "last", ts[-1], "close", q["close"][-3:], "gmtoffset", m.get("gmtoffset"))
          PY
            done
          done
