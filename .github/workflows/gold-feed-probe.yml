name: Gold feed probe
# One-off check (run on push of this file) of free XAUUSD spot feeds for IraGoldAlgo. Read-only, no secrets.
on:
  push:
    paths: [".github/workflows/gold-feed-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          now=$(date -u +%s)
          for back in 0 1 2 3; do
            t=$((now - back*3600))
            y=$(date -u -d @$t +%Y); mo=$(( $(date -u -d @$t +%-m) - 1 )); d=$(date -u -d @$t +%d); h=$(date -u -d @$t +%H)
            u=$(printf "https://datafeed.dukascopy.com/datafeed/XAUUSD/%s/%02d/%s/%sh_ticks.bi5" $y $mo $d $h)
            code=$(curl -s -m 20 -A "Mozilla/5.0" -o t.bi5 -w "%{http_code}" "$u"); echo "$(date -u +%H:%M) hour $h (back $back): $code $(stat -c %s t.bi5 2>/dev/null) bytes"
          done
          for p in "api/lastPrice?instrument=XAU/USD" "api/historicalPrices?instrument=XAU/USD&timeFrame=1min&count=5" ; do
            code=$(curl -s -m 20 -A "Mozilla/5.0" -o f.out -w "%{http_code}" "https://freeserv.dukascopy.com/2.0/?path=$p&key=")
            echo "freeserv $p -> $code"; head -c 300 f.out; echo
          done
