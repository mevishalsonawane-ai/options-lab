name: IraGoldAlgo on an emulator
# The release IraGoldAlgo APK on a real Android 14 emulator, driven like a person (android/tools/gold_emulator_test.py):
# PIN, Home with the live gold price, arming, Trades, Settings, a cancelled reset, Security, the dark theme, no crash.
# Screenshots and each screen's text go to the "gold-emulator" release (a throwaway test phone; the owner's
# screenshot switch is turned on there by the script, with the test PIN). Paper only: nothing here places an order.
on:
  push:
    branches: [claude/android-options-lab-kotlin-xgt1ym]
    paths: ["android/**", ".github/workflows/gold-emulator.yml"]

# 20 Oct, review: read-only by default; write only for the job that publishes the screenshots release.
permissions:
  contents: read

# One run at a time: two runs replacing the same release asset at once lost the upload (HTTP 404). Only the newest
# push's run matters, so an older one still running is cancelled.
concurrency:
  group: gold-emulator
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to replace the "gold-emulator" release's screenshots
    if: "!startsWith(github.event.head_commit.message, '[quick]')"   # a "[quick]" push skips it (see android.yml)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3
      - name: Build the IraGoldAlgo release APK
        working-directory: android
        # Without the arm64-only model runner (Jarvis's on-device model), so it installs on the x86_64 emulator.
        run: ./gradlew --no-daemon -PnoLlm=true :app:assembleGoldRelease
      # The IraAlgo smoke flows (android/app/src/androidTest, S16): the debug APK and its test APK, built before the emulator
      # starts so the run itself stays short (start, Home's cards, the Chart picker, a paper order, Bot settings: under 3 min).
      - name: Build the IraAlgo smoke flows
        working-directory: android
        run: ./gradlew --no-daemon -PnoLlm=true :app:assembleIraDebug :app:assembleIraDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the app on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Then the IraAlgo smoke flows on the same emulator (instrumented; flavour-aware: IraGoldAlgo checks the start only).
          script: |
            python3 android/tools/gold_emulator_test.py "$(ls android/app/build/outputs/apk/gold/release/*.apk | head -1)" gold-emulator
            cd android && timeout 600 ./gradlew --no-daemon -PnoLlm=true :app:connectedIraDebugAndroidTest
      - name: Publish the screenshots and report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          ls gold-emulator || exit 0
          cd gold-emulator && zip -q ../gold-emulator.zip * && cd ..
          notes="IraGoldAlgo on an Android 14 emulator, build ${SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          if gh release view gold-emulator >/dev/null 2>&1; then gh release edit gold-emulator --notes "$notes"
          else gh release create gold-emulator --prerelease --title "IraGoldAlgo emulator run" --notes "$notes" --target "$SHA"; fi
          up=0; for i in 1 2 3; do gh release upload gold-emulator gold-emulator.zip --clobber && { up=1; break; }; sleep $((i * 5)); done
          cat gold-emulator/report.txt
          [ "$up" = 1 ]
