name: Market study multi-timeframe data (1m to 24h)

# Downloads 3 years of 1-minute BTC and XAU/USD bars, builds 5m, 15m, 30m, 1h, 3h, 6h, 12h and 24h bars
# from them, and publishes everything to the market-data-mtf branch.

on:
  push:
    paths:
      - "crypto/fetch_mtf.py"
      - "forex/fetch_mtf.py"
      - "tools/marketlab/mtf.py"
      - ".github/workflows/markets-mtf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markets-mtf
  cancel-in-progress: true

jobs:
  fetch:
    name: ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [crypto, forex]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26" "pandas>=2.2"
      - name: Download 1-minute bars and build every timeframe
        run: python ${{ matrix.market }}/fetch_mtf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-${{ matrix.market }}
          path: ${{ matrix.market }}/data_mtf/
          compression-level: 0

  publish:
    name: Publish to market-data-mtf
    runs-on: ubuntu-latest
    needs: fetch
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mtf-*
          path: out
      - name: Push to market-data-mtf
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir pub
          for m in crypto forex; do
            if [ -d "out/mtf-$m" ]; then mkdir -p "pub/$m/data_mtf" && cp -r "out/mtf-$m/." "pub/$m/data_mtf/"; fi
          done
          if [ -z "$(ls -A pub)" ]; then echo "nothing to publish"; exit 1; fi
          cd pub
          find . -type f -printf '%P %s\n' | sort > index.txt
          git init -q -b market-data-mtf
          git config user.name "ci-markets"; git config user.email "ci-markets@users.noreply.github.com"
          git add -A && git commit -qm "Multi-timeframe market data for $SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}" HEAD:market-data-mtf
          cat index.txt
