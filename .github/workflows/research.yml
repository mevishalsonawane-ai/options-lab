name: Research (long backtests)

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  year:
    name: Year of BANKNIFTY - save the data, arms, learned model
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write          # the research-data release only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow requests scikit-learn
      - name: Save the year (index + near-ATM options, 1-minute)
        run: python research/dump_year.py 250 banknifty_year.parquet
      - name: Publish it to the research-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view research-data >/dev/null 2>&1 || \
            gh release create research-data --prerelease --title "Research data" \
              --notes "BANKNIFTY 1-minute index and near-ATM option bars for the research scripts (research/dump_year.py)."
          gh release upload research-data banknifty_year.parquet --clobber
      - name: The 12 bank stocks, 1-minute (for advance-decline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python research/fetch_stocks.py banknifty_year.parquet bank_stocks_year.parquet
          gh release upload research-data bank_stocks_year.parquet --clobber
      - name: Every arm on the year
        run: python research/arms_long.py file:banknifty_year.parquet
      - name: Learned model (trees + neural net), walk-forward by month
        run: python research/ml_long.py file:banknifty_year.parquet
