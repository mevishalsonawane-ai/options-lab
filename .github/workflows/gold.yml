name: XAUUSD minute data

on:
  push:
    paths:
      - ".github/workflows/gold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write          # the research-data release only
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dukascopy XAUUSD 1-minute bid and ask candles, Oct 2023 - Sep 2026
        run: |
          npx --yes dukascopy-node@1.50.0 -i xauusd -from 2023-10-01 -to 2026-09-30 -t m1 -p bid -f csv \
            -v false -dir out -fn xauusd_m1_bid -bs 10 -bp 1000 -r 10 -rp 5000 -s
          sleep 90
          # Dukascopy rate-limits (429): the ask side goes slower and is optional (the bid alone plus a typical spread still works)
          npx --yes dukascopy-node@1.50.0 -i xauusd -from 2023-10-01 -to 2026-09-30 -t m1 -p ask -f csv \
            -v false -dir out -fn xauusd_m1_ask -bs 3 -bp 3000 -r 10 -rp 10000 -s || echo "ask side failed"
          ls -la out
          head -3 out/xauusd_m1_bid.csv; tail -2 out/xauusd_m1_bid.csv; wc -l out/*.csv
          gzip -9 out/*.csv
      - name: Save the data to the research-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload research-data out/*.csv.gz --clobber -R ${{ github.repository }}
