name: Android app

on:
  push:
    paths:
      - "android/**"
      - "options_lab/**"
      - "tools/export_android_assets.py"
      - "research/data/**"
      - "tools/iraalgo-data-repo/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "options_lab/**"
      - "research/data/**"
      - "tools/iraalgo-data-repo/**"
  workflow_dispatch:

permissions:
  contents: read

# A push whose commit message starts with "[quick]" gets its APK sooner: the engine tests still gate the build and the APK
# is still published, but the app test shards, the PC harness tests and the screenshots are skipped, and only the
# release APKs are built. The next ordinary push runs everything again.
jobs:
  python:
    name: PC harness tests
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[quick]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow requests pytest cryptography
      - run: PYTHONPATH=. python -m pytest options_lab/tests -q
      # GitHub sync (13 Oct): the PC opens exactly what the phone seals (research/data/decrypt_live.py), and the data
      # repository's nightly check (tools/iraalgo-data-repo, staged here for IraAlgo) accepts it.
      - run: python -m pytest research/data/tests tools/iraalgo-data-repo/tests -q

  engine:
    name: Engine parity with the PC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3 (20 Oct: pinned to its commit)
      # No Android SDK on purpose: the engine must build on a bare JDK.
      - run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew --no-daemon :engine:test :engine:jacocoTestCoverageVerification :ira-core:test

  # TDLib, Telegram's official client library, for the Signal tester's read-only Telegram login (15 Oct 2026): built here from
  # tdlib/td's own source at a pinned commit, with OpenSSL from its official release checked against its SHA-256
  # (android/tools/tdlib/build-tdlib.sh) - never a prebuilt binary. arm64-v8a only. The first build takes about half an hour;
  # it is cached by the script's hash (a new pin builds again), and the library is checked against its recorded checksum and
  # the script's pinned commit before the APK takes it.
  tdlib:
    name: TDLib from source (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: tdlib-out
          key: tdlib-${{ hashFiles('android/tools/tdlib/build-tdlib.sh') }}-ndk-27.0.12077973
      - name: Build TDLib (only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gperf ninja-build > /dev/null
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$SDKM" --install "ndk;27.0.12077973" > /dev/null && test -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" && break
            echo "NDK install failed (try $i); clearing and retrying"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$HOME/.android/cache" ; sleep $((i * 15))
          done
          start=$(date +%s)
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973" JOBS=$(nproc) android/tools/tdlib/build-tdlib.sh tdlib-out "$RUNNER_TEMP/tdlib-work"
          echo "TDLib built in $(( ($(date +%s) - start) / 60 )) minutes on $(nproc) cores" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the library (checksum and pinned commit)
        run: |
          (cd tdlib-out && sha256sum -c SHA256SUMS)
          pin=$(sed -n 's/^TD_COMMIT=\([0-9a-f]*\).*/\1/p' android/tools/tdlib/build-tdlib.sh)
          grep -qx "tdlib/td $pin" tdlib-out/VERSION || { echo "::error::The cached TDLib is not the pinned commit $pin"; exit 1; }
          { echo "TDLib: $(head -1 tdlib-out/VERSION)"; echo "$(cat tdlib-out/SHA256SUMS)"; echo "size $(du -h tdlib-out/arm64-v8a/libtdjsonjava.so | cut -f1)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tdlib
          retention-days: 3
          path: tdlib-out/
          if-no-files-found: error

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [engine, tdlib]
    permissions:
      contents: write   # only to publish the signed APK on the latest-apk release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The hosted runner ships the Android SDK with ANDROID_HOME set; the
      # Android Gradle plugin installs any missing platform once licences are
      # accepted. (setup-android@v3 now fails asking for the retired "tools".)
      - name: Accept Android SDK licences
        run: |
          test -n "$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          # The default NDK (AGP's 27.0.12077973, for the Jarvis voice library) is fetched here with retries: a corrupt
          # download from Google ("Archive is not a ZIP archive") failed whole builds before any code compiled.
          for i in 1 2 3; do
            "$SDKM" --install "ndk;27.0.12077973" > /dev/null && test -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" && break
            echo "NDK install failed (try $i); clearing and retrying"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$HOME/.android/cache" ; sleep $((i * 15))
          done
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3 (20 Oct: pinned to its commit)
      # The TDLib library built above (IraAlgo only: its own flavour's folder, so IraGoldAlgo carries none), checked again.
      - uses: actions/download-artifact@v4
        with:
          name: tdlib
          path: ${{ runner.temp }}/tdlib
      - name: TDLib into the IraAlgo build
        run: |
          (cd "$RUNNER_TEMP/tdlib" && sha256sum -c SHA256SUMS)
          mkdir -p app/src/ira/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/tdlib/arm64-v8a/libtdjsonjava.so" app/src/ira/jniLibs/arm64-v8a/
      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.OL_KEYSTORE_B64 }}
          KS_PASS_RAW: ${{ secrets.OL_KEYSTORE_PASSWORD }}
          KEY_PASS_RAW: ${{ secrets.OL_KEY_PASSWORD }}
          KS_ALIAS_RAW: ${{ secrets.OL_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Secrets pasted from a phone can carry line breaks or spaces: keep only the characters each can hold.
            # A copy that took the file's label along ("---- OL_KEYSTORE_B64 ----") is still read: the label goes first.
            b64=$(printf '%s' "$KEYSTORE_B64" | sed 's/OL_KEYSTORE_B64//g' | tr -cd 'A-Za-z0-9+/=')
            ks_pass=$(printf '%s' "$KS_PASS_RAW" | tr -d '[:space:]')
            key_pass=$(printf '%s' "$KEY_PASS_RAW" | tr -d '[:space:]')
            alias=$(printf '%s' "$KS_ALIAS_RAW" | tr -d '[:space:]')
            for v in "$ks_pass" "$key_pass"; do [ -n "$v" ] && echo "::add-mask::$v"; done
            # make-release-key.sh gives the key the keystore's password, so that one password signs.
            # Sizes only (never the values), so a bad paste can be told apart from a wrong password.
            echo "keystore text: ${#b64} characters (expected 5732); passwords: ${#ks_pass} and ${#key_pass} characters (32 each); alias: ${#alias} characters (7)" > "$RUNNER_TEMP/signing.txt"
            echo "keystore text: ${#b64} characters (make-release-key.sh prints 5732 for a 4298-byte key); passwords: ${#ks_pass} and ${#key_pass} characters (32 each); alias: ${#alias} characters (7)"
            if ! printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "Result: OL_KEYSTORE_B64 is not valid base64 - re-paste the long line." >> "$RUNNER_TEMP/signing.txt"
              echo "::warning title=Release key not usable::OL_KEYSTORE_B64 is not valid base64 (cut short or changed while pasting). Re-paste the long line from github-secrets.txt. This APK is signed with a throwaway key."
              rm -f "$RUNNER_TEMP/release.jks"
            elif ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ks_pass" >/dev/null 2>&1; then
              echo "Result: keystore decoded to $(wc -c < "$RUNNER_TEMP/release.jks") bytes (expected 4298) and does not open with OL_KEYSTORE_PASSWORD." >> "$RUNNER_TEMP/signing.txt"
              echo "::warning title=Release key not usable::The keystore ($(wc -c < "$RUNNER_TEMP/release.jks") bytes) does not open with OL_KEYSTORE_PASSWORD. Re-paste the password from github-secrets.txt (or the keystore text if its size above is not 5732). This APK is signed with a throwaway key."
              rm -f "$RUNNER_TEMP/release.jks"
            elif ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ks_pass" -alias "$alias" >/dev/null 2>&1; then
              echo "Result: keystore opens; OL_KEY_ALIAS does not name its key (should be iraalgo)." >> "$RUNNER_TEMP/signing.txt"
              echo "::warning title=Release key not usable::The keystore opens, but has no key named by OL_KEY_ALIAS (it should be iraalgo). This APK is signed with a throwaway key."
              rm -f "$RUNNER_TEMP/release.jks"
            else
              echo "OL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
              { echo "OL_KEYSTORE_PASSWORD=$ks_pass"; echo "OL_KEY_PASSWORD=$ks_pass"; echo "OL_KEY_ALIAS=$alias"; } >> "$GITHUB_ENV"
              echo "Result: release keystore loaded and checked." >> "$RUNNER_TEMP/signing.txt"
              echo "Release keystore loaded and checked."
            fi
          else
            echo "Result: no OL_KEYSTORE_B64 secret." > "$RUNNER_TEMP/signing.txt"
            echo "::warning title=Release APK signed with a throwaway key::No OL_KEYSTORE_B64 secret: this APK will not install over a previous build. Run android/tools/make-release-key.sh once and add the four secrets it prints."
          fi
      - name: Assemble
        # The keystore step puts the cleaned passwords and alias in the environment (masked in the log).
        # The app's unit and UI tests run in the app-tests job, alongside this one.
        # A push starting "[quick]" builds only the release APKs (the ones published).
        env:
          QUICK: ${{ startsWith(github.event.head_commit.message, '[quick]') }}
        run: |
          if [ "$QUICK" = "true" ]; then ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          else ./gradlew --no-daemon --max-workers=2 :app:assembleIraDebug :app:assembleRelease; fi
      - name: Sandbox report (every permission the APK holds)
        run: cat app/build/reports/sandbox/*.txt
      - name: APK sizes (TDLib in IraAlgo only)
        run: |
          for a in app/build/outputs/apk/*/release/*.apk; do echo "$a: $(du -h "$a" | cut -f1)"; unzip -l "$a" | grep -E "lib/.*\.so" || true; done | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l app/build/outputs/apk/ira/release/*.apk | grep -q "lib/arm64-v8a/libtdjsonjava.so" || { echo "::error::TDLib is missing from IraAlgo"; exit 1; }
          if unzip -l app/build/outputs/apk/gold/release/*.apk | grep -q libtdjsonjava; then echo "::error::TDLib must not be in IraGoldAlgo"; exit 1; fi
      # The microphone is for "Jarvis": both apps hold it (on-device recognition only).
      - name: Microphone for Jarvis
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          bad=0
          for a in app/build/outputs/apk/*/*/*.apk; do
            if "$aapt" dump permissions "$a" | grep -q "android.permission.RECORD_AUDIO"; then mic=yes; else mic=no; fi
            want=yes
            echo "$a: microphone $mic (expected $want)"
            [ "$mic" = "$want" ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::The microphone permission is where it must not be (or missing)."; exit 1; }
      - name: Release signing certificate (public fingerprint only)
        run: |
          cat "$RUNNER_TEMP/signing.txt" 2>/dev/null || true
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs app/build/outputs/apk/ira/release/*.apk | grep -E "SHA-256|DN" || true
          if [ -n "$OL_KEYSTORE_PATH" ]; then echo "Signed with the owner's release key."; else echo "Signed with a throwaway key (no usable release keystore)."; fi
      # The signed APK on one fixed link (a release asset, not an Actions artifact, so a full artifact quota never
      # blocks an update): https://github.com/<repo>/releases/download/latest-apk/IraAlgo.apk
      - name: Publish the APK to the latest-apk release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/android-options-lab-kotlin-xgt1ym'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Never backwards: a run whose commit is older than the build already published leaves it (4 Oct: 8b0cbf4's
          # build finished after a2651c9's and replaced it). A newer published build is one that has commits beyond ours.
          prev=$(gh release view latest-apk --json body -q .body 2>/dev/null | grep -o 'Build of [0-9a-f]*' | head -1 | cut -d' ' -f3 || true)
          if [ -n "$prev" ]; then
            st=$(gh api "repos/${{ github.repository }}/compare/$SHA...$prev" --jq .status 2>/dev/null || true)
            if [ "$st" = "ahead" ]; then echo "The published build ($prev) is newer than ${SHA::7}: left as it is."; exit 0; fi
          fi
          apk=$(ls app/build/outputs/apk/ira/release/*.apk | head -1)
          cp "$apk" "$RUNNER_TEMP/IraAlgo.apk"
          gold=$(ls app/build/outputs/apk/gold/release/*.apk | head -1)
          cp "$gold" "$RUNNER_TEMP/IraGoldAlgo.apk"
          notes="Build of ${SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Installs over the previous one (same signing key)."
          if ! gh release view latest-apk >/dev/null 2>&1; then
            gh release create latest-apk --prerelease --title "IraAlgo - latest build" --notes "$notes" --target "$SHA"
          fi
          # The upload first, with retries (GitHub answered HTTP 500 on the asset twice on 6 Oct); the notes name this
          # build only once its APKs are up, so "Build of <sha>" never sits over an older APK.
          up=0
          for i in 1 2 3 4; do
            if gh release upload latest-apk "$RUNNER_TEMP/IraAlgo.apk" "$RUNNER_TEMP/IraGoldAlgo.apk" --clobber; then up=1; break; fi
            echo "Upload failed (try $i); retrying"; sleep $((i * 20))
          done
          [ "$up" = 1 ] || { echo "The APK upload failed 4 times"; exit 1; }
          gh release edit latest-apk --notes "$notes"
          echo "APK: https://github.com/${{ github.repository }}/releases/download/latest-apk/IraAlgo.apk"
          echo "APK: https://github.com/${{ github.repository }}/releases/download/latest-apk/IraGoldAlgo.apk"
      # A push notification to Boss's phone when the new APK is up (ntfy.sh, free; the app subscribes to the topic). The
      # topic is a repository secret (NTFY_TOPIC, an unguessable name); no topic, no notification. Only the build's short
      # hash and the release link are sent: never money, account or key details.
      - name: Tell the phone the APK is ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/android-options-lab-kotlin-xgt1ym'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret: no notification sent."; exit 0; fi
          curl -sS --max-time 20 \
            -H "Title: IraAlgo APK ready" \
            -H "Tags: package" \
            -H "Click: https://github.com/${{ github.repository }}/releases/tag/latest-apk" \
            -d "Build ${SHA::7} is ready to install. The app tests may still be running: check before trading on it." \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null && echo "Notification sent." || echo "Notification could not be sent (the build is fine)."
      # The Ira branch's build on its own link, so the owner's latest-apk links above only change from the main line:
      # https://github.com/<repo>/releases/download/jarvis-apk/IraAlgo.apk (and IraGoldAlgo.apk; the release's tag
      # keeps its old name: the workflow token may update a release but not create one)
      - name: Publish the branch preview to the jarvis-apk release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/ira-assistant'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          cp "$(ls app/build/outputs/apk/ira/release/*.apk | head -1)" "$RUNNER_TEMP/IraAlgo.apk"
          cp "$(ls app/build/outputs/apk/gold/release/*.apk | head -1)" "$RUNNER_TEMP/IraGoldAlgo.apk"
          notes="Preview build of ${SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Installs over IraAlgo / IraGoldAlgo (same signing key)."
          gh release edit jarvis-apk --title "IraAlgo - branch preview" --notes "$notes"
          gh release upload jarvis-apk "$RUNNER_TEMP/IraAlgo.apk" "$RUNNER_TEMP/IraGoldAlgo.apk" --clobber
          gh release delete-asset jarvis-apk JarvisAlgo.apk -y 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota must not turn a good build red; the release above has the APK
        with:
          name: options-lab-apk
          retention-days: 7
          path: |
            android/app/build/outputs/apk/*/release/*.apk
            android/app/build/outputs/apk/ira/debug/*.apk
          if-no-files-found: error

  app-tests:
    name: App tests (JVM, Robolectric, Compose UI) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[quick]')"
    timeout-minutes: 45
    needs: engine
    # Four jobs at once, each a quarter of the test classes (by class-name hash): the whole suite
    # fits the time limit, and one area's stall cannot hold up the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licences
        run: |
          test -n "$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          # The default NDK (AGP's 27.0.12077973, for the Jarvis voice library) is fetched here with retries: a corrupt
          # download from Google ("Archive is not a ZIP archive") failed whole builds before any code compiled.
          for i in 1 2 3; do
            "$SDKM" --install "ndk;27.0.12077973" > /dev/null && test -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" && break
            echo "NDK install failed (try $i); clearing and retrying"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$HOME/.android/cache" ; sleep $((i * 15))
          done
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3 (20 Oct: pinned to its commit)
      # Robolectric fetches its Android runtime jar from Maven Central on first use, into ~/.m2; kept between runs
      # so four shards do not each download it (Maven Central rate-limits them: HTTP 429 failed every test once).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: robolectric-android-all-
      # No secrets here: the tests use made-up values and an in-memory stand-in for the Keystore.
      - name: Unit and UI tests, with coverage
        run: |
          # A stuck test JVM says nothing (not even the in-process samplers print when its heap thrashes):
          # every 5 minutes each test JVM's heap and main threads go to this log from outside.
          (sleep 240; while true; do
             for pid in $(pgrep -f 'Gradle Test Executor'); do
               echo "==== JVM $pid at $(date -u +%H:%M:%S)"
               jcmd "$pid" GC.heap_info 2>&1 | head -12
               jcmd "$pid" Thread.print 2>&1 | awk '/^"/{keep = ($0 ~ /Test worker|Main Thread|idle-sampler/)} keep' | grep -v 'java.lang.invoke\|LambdaForm\|\$\$robo\$\$' | head -160
             done
             sleep 300
           done) &
          dumper=$!
          # Each step may fail (the dumper already gone, or between children): under bash -e a failing command in
          # the trap ended a passing step with exit 1 ("BUILD SUCCESSFUL ... Terminated").
          trap 'pkill -P $dumper 2>/dev/null || true; kill $dumper 2>/dev/null || true' EXIT
          ./gradlew --no-daemon -PtestShard=${{ matrix.shard }}/4 -PtestsWithoutJarvis=true :app:testIraDebugUnitTest :app:createIraDebugUnitTestCoverageReport
      - name: Coverage summary
        if: always()
        run: python3 tools/coverage_summary.py "$(find app/build/reports/coverage -name report.xml 2>/dev/null | head -1)" app/build/test-results/testIraDebugUnitTest | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Screenshots captured
        if: always()
        run: |
          n=$(find app/build/outputs/roborazzi -name '*.png' 2>/dev/null | wc -l)
          echo "$n screenshots in app/build/outputs/roborazzi (artifact app-screenshots-${{ matrix.shard }})"
          find app/build/outputs/roborazzi -name '*.png' -printf '%f\n' 2>/dev/null | sort | head -400
          grep -rhoE 'LAYOUT BUG \([^)]*\): [^<]*' app/build/test-results/testIraDebugUnitTest/*.xml 2>/dev/null | sort -u | head -100 || true
          grep -rhoE 'LATENCY [^<]*' app/build/test-results/testIraDebugUnitTest/*.xml 2>/dev/null | sort -u || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: app-screenshots-${{ matrix.shard }}
          retention-days: 2
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: app-test-reports-${{ matrix.shard }}
          retention-days: 5
          path: |
            android/app/build/reports/tests/testIraDebugUnitTest/
            android/app/build/test-results/testIraDebugUnitTest/
            android/app/build/reports/coverage/
          if-no-files-found: warn

  # The latest screenshots on branch ui-screenshots (force-replaced, one commit, images only),
  # so they can be fetched with git. Only this job may write, and it runs no build or test code.
  screenshots:
    name: Publish screenshots
    runs-on: ubuntu-latest
    needs: app-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/claude/android-options-lab-kotlin-xgt1ym' && !startsWith(github.event.head_commit.message, '[quick]')
    # Two pushes close together both force-push the branch; one at a time (the newer waits) avoids "cannot lock ref".
    concurrency:
      group: publish-ui-screenshots
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: app-screenshots-*
          merge-multiple: true
          path: shots
      - name: Push to ui-screenshots
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p shots && cd shots   # no artifacts when the app tests were skipped
          n=$(find . -name '*.png' | wc -l)
          if [ "$n" -eq 0 ]; then echo "no screenshots"; exit 0; fi
          find . -name '*.png' -printf '%P\n' | sort > index.txt
          git init -q -b ui-screenshots
          git config user.name "ci-screenshots"; git config user.email "ci-screenshots@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for $SHA ($n images)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}" HEAD:ui-screenshots
          echo "published $n screenshots to ui-screenshots"
